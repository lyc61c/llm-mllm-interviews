<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM / MLLM 面试题库</title>
<style>
:root{--ink:#162839;--muted:#647587;--paper:#f2f5f7;--accent:#176c70;--line:#d6e0e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{background:#122d3b;color:white;padding:40px max(24px,calc((100vw - 1180px)/2))}h1{font-size:clamp(26px,4vw,42px);line-height:1.3;margin:8px 0 14px}.eyebrow{letter-spacing:.16em;font-size:12px;color:#9bd5d0}header p{max-width:880px;color:#c8d9e4}main{max-width:1180px;padding:24px;margin:auto}.toolbar{position:sticky;top:0;background:var(--paper);padding:12px 0;z-index:2;border-bottom:1px solid var(--line)}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:white;color:var(--ink)}input[type=search]{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #67bdb9;outline-offset:2px}.status{font-size:14px;color:var(--muted);margin:10px 0}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:16px 0}.card h2{font-size:19px;line-height:1.5;margin:10px 0}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.pill{background:#e7f2f1;color:#176c70;border-radius:4px;padding:2px 7px}.star{margin-left:auto;padding:1px 9px;font-size:18px}.quick{border-left:3px solid #65a6a2;padding-left:14px}summary{cursor:pointer;color:var(--accent);font-weight:600}.answer h3{font-size:15px;margin:20px 0 5px}.answer li{margin:6px 0}.refs{font-size:13px;overflow-wrap:anywhere}a{color:var(--accent)}pre{white-space:pre-wrap;background:#f2f5f7;padding:12px;border-radius:6px;overflow-wrap:anywhere}.pagination{display:flex;gap:12px;justify-content:center;margin:28px}footer{color:var(--muted);font-size:13px;margin:35px 0}.tag{font-size:12px;color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:640px){main{padding:12px}.card{padding:16px}select{max-width:100%}.toolbar{position:static}}
</style>
<header><div class="eyebrow">INTERVIEW REPOSITORY · 2026.10.02</div><h1>LLM / MLLM 面试题库</h1><p>按主题学习，按问题检索。每题包含短答、展开要点、易错点、追问与技术依据。社区题目线索保留访问范围；编辑补充题单独标记。</p></header>
<main><div class="toolbar"><div class="filters"><input id="search" type="search" aria-label="搜索题目与答案" placeholder="搜索：LoRA、视觉 token、GRPO、项目……"><select id="category" aria-label="类别"><option value="">全部类别</option></select><select id="level" aria-label="难度"><option value="">全部难度</option><option>L1</option><option>L2</option><option>L3</option></select><select id="evidence" aria-label="题目来源"><option value="">全部来源</option><option value="community">社区线索</option><option value="editorial">编辑补充</option></select><select id="platform" aria-label="社区平台"><option value="">全部平台</option></select><select id="company" aria-label="面经声称的公司"><option value="">全部公司线索</option></select><button id="favorites" aria-pressed="false">仅收藏</button><button id="random">随机抽 10 题</button><button id="reset">重置</button></div><div id="status" class="status" role="status"></div><label><input id="quiz" type="checkbox"> 自测模式：先隐藏短答</label></div><div id="cards"></div><div class="pagination"><button id="prev">上一页</button><span id="pageinfo"></span><button id="next">下一页</button></div><footer>离线单文件，搜索与收藏在本机运行。浏览器允许时收藏保存在 localStorage；清除浏览器数据会清除收藏。公式采用可复制文本形式。<a href="README.md">仓库首页</a> · <a href="SOURCES.md">来源目录</a> · <a href="guides/methodology.md">采集与核验方法</a></footer></main>
<script id="bank" type="application/json">__BANK_JSON__</script>
<script>
const bank=JSON.parse(document.getElementById('bank').textContent), sources=Object.fromEntries(bank.sources.map(s=>[s.id,s])), $=id=>document.getElementById(id), pageSize=20;
let page=0, onlyFavorites=false, sample=null, saved=new Set();try{const value=JSON.parse(localStorage.getItem('llm-interview-stars')||'[]');if(Array.isArray(value))saved=new Set(value.filter(x=>typeof x==='string'))}catch{}
for(const [id,[slug,title]] of Object.entries(bank.categories)){$('category').add(new Option(title,id))}
for(const platform of [...new Set(bank.sources.filter(s=>s.type==='community').map(s=>s.platform))].sort())$('platform').add(new Option(platform,platform));
for(const company of [...new Set(bank.sources.map(s=>s.claimed_company).filter(Boolean))].sort())$('company').add(new Option(company,company));
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(s){const u=s.url;return /^https?:\/\//.test(u)?`<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(u)}">${escapeHtml(s.id+' · '+s.title)}</a>`:escapeHtml(s.title)}
function filtered(){const terms=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);return bank.questions.filter(q=>{const ev=q.community_evidence.map(e=>sources[e.source_id]);return (!$('category').value||q.category===$('category').value)&&(!$('level').value||q.level===$('level').value)&&(!$('evidence').value||(q.editorial? 'editorial':'community')===$('evidence').value)&&(!$('platform').value||ev.some(s=>s.platform===$('platform').value))&&(!$('company').value||ev.some(s=>s.claimed_company===$('company').value))&&(!onlyFavorites||saved.has(q.id))&&terms.every(t=>JSON.stringify(q).toLowerCase().includes(t))})}
function render(){const all=filtered(), rows=sample?all.filter(q=>sample.includes(q.id)):all, pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);$('status').textContent=`全库 ${bank.questions.length} 题 · 匹配 ${all.length} 题${sample?' · 当前抽题 '+rows.length+' 题':''}`;$('pageinfo').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
$('cards').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(q=>{const a=q.answer, quick=`<p class="quick">${escapeHtml(a.quick)}</p>`, lists=(k,title)=>`<h3>${title}</h3><ul>${a[k].map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>`;return `<article class="card" id="${q.id}"><div class="meta"><span class="pill">${q.id}</span><span>${q.level}</span><span>${escapeHtml(bank.categories[q.category][1])}</span><span>${q.editorial?'编辑补充':'社区题目线索'}</span><button class="star" data-star="${q.id}" aria-label="收藏 ${q.id}" aria-pressed="${saved.has(q.id)}">${saved.has(q.id)?'★':'☆'}</button></div><h2>${escapeHtml(q.title)}</h2><div class="tag">${q.tags.map(escapeHtml).join(' / ')}</div>${$('quiz').checked?'':quick}<details class="answer"><summary>查看答案与追问</summary>${$('quiz').checked?quick:''}${lists('detail','展开要点')}${a.formula?`<h3>公式</h3><pre>${escapeHtml(a.formula)}</pre>`:''}${lists('pitfalls','易错点')}${lists('followups','面试官可能追问')}<h3>技术依据</h3><ul class="refs">${q.reference_ids.map(id=>`<li>${link(sources[id])}</li>`).join('')}</ul><h3>题目出处线索</h3><ul class="refs">${q.community_evidence.length?q.community_evidence.map(e=>`<li>${link(sources[e.source_id])} · ${escapeHtml(e.support)}：${escapeHtml(e.note)}</li>`).join(''):'<li>为补全知识体系设计；未认定为公司真题。</li>'}</ul></details></article>`}).join('')||'<div class="empty">没有匹配题目，请调整筛选条件。</div>'}
for(const id of ['search','category','level','evidence','platform','company'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;sample=null;render()});$('quiz').onchange=render;$('favorites').onclick=()=>{onlyFavorites=!onlyFavorites;$('favorites').setAttribute('aria-pressed',String(onlyFavorites));page=0;sample=null;render()};$('random').onclick=()=>{const pool=filtered().map(q=>q.id);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}sample=pool.slice(0,10);page=0;render()};$('reset').onclick=()=>{for(const id of ['search','category','level','evidence','platform','company'])$(id).value='';onlyFavorites=false;$('favorites').setAttribute('aria-pressed','false');sample=null;page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('cards').onclick=e=>{const b=e.target.closest('[data-star]');if(!b)return;const id=b.dataset.star;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('llm-interview-stars',JSON.stringify([...saved]))}catch{}render()};render();
</script></html>
