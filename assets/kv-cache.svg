<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title"><title id="title">KV Cache：历史 K/V 复用，新 Query 只在本步计算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738b"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fafcfe"/><text x="32" y="40" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#20344a">KV Cache：历史 K/V 复用，新 Query 只在本步计算</text><rect x="35" y="99" width="185" height="90" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="127.5" y="137.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Prefill：t₁、t₂、t₃</text><text x="127.5" y="163.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">各层生成 K / V</text><rect x="365" y="82" width="213" height="123" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="471.5" y="123.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">缓存 K₁…K₃</text><text x="471.5" y="149.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">缓存 V₁…V₃</text><text x="471.5" y="175.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">每层各保留一份</text><polyline points="220,145 365,145" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="35" y="280" width="185" height="82" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="127.5" y="314.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">处理新 token t₄</text><text x="127.5" y="340.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">计算 Q₄、K₄、V₄</text><rect x="365" y="265" width="213" height="102" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="471.5" y="309.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">追加 K₄ / V₄</text><text x="471.5" y="335.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">本步使用 Q₄</text><polyline points="220,321 365,321" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="470,205 470,265" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="710" y="191" width="210" height="93" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="815.0" y="230.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Q₄ 访问 K₁…K₄</text><text x="815.0" y="256.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">输出 t₅ 的分布</text><polyline points="578,315 637,315 637,238 710,238" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="405" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">避免重复计算历史 K/V；缓存随序列增长，并带来显存、读带宽和分页管理成本。</text></svg>
