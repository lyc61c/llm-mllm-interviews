<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title"><title id="title">MoE：单 Token 的 Top-k 路由示意</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738b"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fafcfe"/><text x="32" y="40" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#20344a">MoE：单 Token 的 Top-k 路由示意</text><rect x="28" y="200" width="118" height="78" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="87.0" y="232.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Token x</text><text x="87.0" y="258.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">隐藏表示</text><rect x="205" y="190" width="174" height="98" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="292.0" y="232.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Router</text><text x="292.0" y="258.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">E = 4，k = 2</text><polyline points="146,239 205,239" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="470" y="93" width="160" height="62" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="550.0" y="117.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Expert 1</text><text x="550.0" y="143.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">FFN</text><polyline points="379,239 430,239 430,124 470,124" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="470" y="181" width="160" height="62" rx="9" fill="#edf0f4" stroke="#b7cad7"/><text x="550.0" y="205.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Expert 2</text><text x="550.0" y="231.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">FFN</text><polyline points="379,239 430,239 430,212 470,212" fill="none" stroke="#56738b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="470" y="269" width="160" height="62" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="550.0" y="293.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Expert 3</text><text x="550.0" y="319.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">FFN</text><polyline points="379,239 430,239 430,300 470,300" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="470" y="357" width="160" height="62" rx="9" fill="#edf0f4" stroke="#b7cad7"/><text x="550.0" y="381.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Expert 4</text><text x="550.0" y="407.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">FFN</text><polyline points="379,239 430,239 430,388 470,388" fill="none" stroke="#56738b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="745" y="195" width="178" height="100" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="834.0" y="238.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">选择 E₁、E₃</text><text x="834.0" y="264.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">加权合并输出</text><polyline points="630,124 688,124 688,222 745,222" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="630,300 688,300 688,268 745,268" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="463" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#20344a">总参数、每 token 激活参数、通信量与负载平衡分别衡量；k=2 不是所有模型的固定设置。</text></svg>
