<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title"><title id="title">LoRA：冻结主路径，训练低秩增量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738b"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fafcfe"/><text x="32" y="40" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#20344a">LoRA：冻结主路径，训练低秩增量</text><rect x="35" y="175" width="115" height="70" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="92.5" y="203.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">输入 x</text><text x="92.5" y="229.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">in 维</text><rect x="320" y="145" width="205" height="110" rx="9" fill="#edf0f4" stroke="#b7cad7"/><text x="422.5" y="193.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">冻结 W₀</text><text x="422.5" y="219.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">[out, in]</text><polyline points="150,210 320,210" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="745" cy="210" r="26" fill="#d9efeb" stroke="#b7cad7"/><text x="745" y="217" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="400" fill="#20344a">+</text><polyline points="525,210 718,210" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="825" y="175" width="105" height="70" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="877.5" y="203.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">输出 y</text><text x="877.5" y="229.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">out 维</text><polyline points="771,210 825,210" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="215" y="320" width="150" height="74" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="290.0" y="350.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">A：[r, in]</text><text x="290.0" y="376.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">随机初始化</text><rect x="425" y="320" width="150" height="74" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="500.0" y="350.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">B：[out, r]</text><text x="500.0" y="376.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">零初始化</text><rect x="625" y="320" width="100" height="74" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="675.0" y="363.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">α / r</text><polyline points="95,245 95,357 215,357" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="365,357 425,357" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="575,357 625,357" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="725,357 745,357 745,236" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="433" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">y = W₀x + (α/r)BAx；新增参数量 r(in + out)，基座权重和激活仍需存储。</text></svg>
