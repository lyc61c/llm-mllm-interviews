<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title"><title id="title">视觉连接器：逐 Token MLP 与 Query 压缩</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738b"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fafcfe"/><text x="32" y="40" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="600" fill="#20344a">视觉连接器：逐 Token MLP 与 Query 压缩</text><text x="35" y="89" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="600" fill="#20344a">逐 Token MLP</text><rect x="35" y="111" width="160" height="78" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="115.0" y="143.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">视觉特征</text><text x="115.0" y="169.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">N × dᵥ</text><rect x="315" y="111" width="225" height="78" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="427.5" y="143.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">线性 → 激活 → 线性</text><text x="427.5" y="169.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">对每个 token 独立投影</text><rect x="625" y="111" width="130" height="78" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="690.0" y="143.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">N 个视觉 token</text><text x="690.0" y="169.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">N × dₗ</text><rect x="815" y="111" width="112" height="78" rx="9" fill="#edf0f4" stroke="#b7cad7"/><text x="871.0" y="156.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">LLM</text><polyline points="195,150 315,150" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="540,150 625,150" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="755,150 815,150" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="222" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">MLP 本身保留 N；pooling、切图或 patch merge 是额外步骤。</text><text x="35" y="273" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="600" fill="#20344a">Q-Former / Query Resampler</text><rect x="35" y="351" width="160" height="84" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="115.0" y="386.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">视觉特征</text><text x="115.0" y="412.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">作为 K / V</text><rect x="315" y="345" width="225" height="98" rx="9" fill="#d9efeb" stroke="#b7cad7"/><text x="427.5" y="387.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Cross-attention</text><text x="427.5" y="413.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">Query 与视觉信息交互</text><rect x="335" y="279" width="183" height="42" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="426.5" y="306.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">M 个可学习 Query</text><polyline points="427,321 427,345" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="625" y="351" width="130" height="84" rx="9" fill="#e2edff" stroke="#b7cad7"/><text x="690.0" y="386.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">M 个视觉 token</text><text x="690.0" y="412.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">再投影到 dₗ</text><rect x="815" y="351" width="112" height="84" rx="9" fill="#edf0f4" stroke="#b7cad7"/><text x="871.0" y="399.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">LLM</text><polyline points="195,393 315,393" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="540,393 625,393" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="755,393 815,393" fill="none" stroke="#56738b" stroke-width="2"  marker-end="url(#arrow)"/><text x="480" y="492" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="17" font-weight="400" fill="#20344a">M 控制输出 token 数；压缩效率、局部细节保真与训练难度需要按任务比较。</text></svg>
