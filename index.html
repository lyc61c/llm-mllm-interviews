<script id="bank" type="application/json">{"questions": [{"id": "BAS-001", "category": "BAS", "topic": "分词与文本表示", "level": "L1", "title": "中文分词有哪些难点？jieba 的 DAG、动态规划和 HMM 如何配合？", "tags": ["中文分词", "DAG", "HMM"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>中文文本缺少天然空格边界，难点是切分标准、歧义与未登录词，例如“研究生命起源”不能仅靠最长匹配决定词界。jieba 精确模式先用前缀词典枚举各位置可能结束的词，构成有向无环图，再以词频估计的对数概率做动态规划，选全句得分最大的路径。它优化整体路径，局部最长词不一定最好。\u003c/p>\u003cp>对词典无法可靠覆盖的片段，默认可用字符级 HMM，以 B/M/E/S 表示词首、词中、词尾和单字词，Viterbi 找最高概率标签路径。搜索模式会进一步切开长词以提高召回，全模式则枚举候选，通常不适合作唯一精确切分。业务中加入领域词典、检查频率与歧义例句，并分别测词界 F1 和下游检索效果；词级分词与 LLM 子词 tokenizer 的目标不同。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmo>DAG\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>:\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>D\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 jieba 的最大概率路径等同于最长词优先。\u003c/li>\u003cli>把中文分词的词界直接当作模型 tokenizer 的 token 边界。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么新增领域词频会影响相邻词的切分？\u003c/li>\u003cli>词典法与序列标注法怎样处理未登录词？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "中文文本缺少天然空格边界，难点是切分标准、歧义与未登录词，例如“研究生命起源”不能仅靠最长匹配决定词界。jieba 精确模式先用前缀词典枚举各位置可能结束的词，构成有向无环图，再以词频估计的对数概率做动态规划，选全句得分最大的路径。它优化整体路径，局部最长词不一定最好。\n\n对词典无法可靠覆盖的片段，默认可用字符级 HMM，以 B/M/E/S 表示词首、词中、词尾和单字词，Viterbi 找最高概率标签路径。搜索模式会进一步切开长词以提高召回，全模式则枚举候选，通常不适合作唯一精确切分。业务中加入领域词典、检查频率与歧义例句，并分别测词界 F1 和下游检索效果；词级分词与 LLM 子词 tokenizer 的目标不同。\n把 jieba 的最大概率路径等同于最长词优先。\n把中文分词的词界直接当作模型 tokenizer 的 token 边界。\n为什么新增领域词频会影响相邻词的切分？\n词典法与序列标注法怎样处理未登录词？"}, {"id": "BAS-002", "category": "BAS", "topic": "序列任务与经典 NLP", "level": "L2", "title": "POS、NER 如何做序列标注？HMM、独立分类与 CRF 有什么区别？", "tags": ["NER", "POS", "CRF"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>词性标注为每个词分配语法类别，NER 通常用 BIO/BIOES 描述实体类别和边界。HMM 建模标签转移与观测发射的联合概率，利用生成式条件独立假设；神经编码器加逐位置 softmax 直接学习标签概率，但独立 argmax 可能得到非法 BIO 转移。线性链 CRF 在整条标签序列上归一化，把发射分数与相邻标签转移分数共同训练，能显式表达转移偏好。\u003c/p>\u003cp>训练用真实序列分数减 log-partition，分母通过前向动态规划的 logsumexp 计算；预测用 Viterbi，把求和换成 max 并保存回溯指针，复杂度通常为 O(TK²)。CRF 不会自动理解实体语义，质量仍依赖编码器和标注。需要正确 mask padding、约束非法转移、区分 token accuracy 与实体级 precision/recall/F1；嵌套实体未必能用单条 BIO 标签表达。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi mathvariant=\"script\">L\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/munder>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 CRF 的训练归一化当作逐 token softmax。\u003c/li>\u003cli>只报 token 准确率而忽略实体边界错误。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>CRF 前向算法与 Viterbi 的递推有什么不同？\u003c/li>\u003cli>子词 tokenizer 后如何对齐词级标签？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "词性标注为每个词分配语法类别，NER 通常用 BIO/BIOES 描述实体类别和边界。HMM 建模标签转移与观测发射的联合概率，利用生成式条件独立假设；神经编码器加逐位置 softmax 直接学习标签概率，但独立 argmax 可能得到非法 BIO 转移。线性链 CRF 在整条标签序列上归一化，把发射分数与相邻标签转移分数共同训练，能显式表达转移偏好。\n\n训练用真实序列分数减 log-partition，分母通过前向动态规划的 logsumexp 计算；预测用 Viterbi，把求和换成 max 并保存回溯指针，复杂度通常为 O(TK²)。CRF 不会自动理解实体语义，质量仍依赖编码器和标注。需要正确 mask padding、约束非法转移、区分 token accuracy 与实体级 precision/recall/F1；嵌套实体未必能用单条 BIO 标签表达。\n把 CRF 的训练归一化当作逐 token softmax。\n只报 token 准确率而忽略实体边界错误。\nCRF 前向算法与 Viterbi 的递推有什么不同？\n子词 tokenizer 后如何对齐词级标签？"}, {"id": "BAS-003", "category": "BAS", "topic": "序列任务与经典 NLP", "level": "L2", "title": "成分句法与依存句法分别预测什么，怎样评价解析结果？", "tags": ["句法分析", "CFG", "依存句法"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>成分句法把连续片段组织为短语树，例如名词短语、动词短语，常以 CFG 或概率 CFG 表示；依存句法在词之间建立有向中心词关系，例如主语、宾语。两者描述同一句子的不同结构，不能把依存边直接视为短语标签。\u003c/p>\u003cp>成分解析可通过 chart/CKY 动态规划组合跨度，标准二元 CFG 的 CKY 复杂度约 O(n³|G|)，神经 span parser 为跨度打分后施加树约束。依存解析常见转移式解析或图式解析，后者为 head-dependent 边打分，再求满足单一中心词、连通与无环约束的树。成分结果常测标注跨度 F1；依存结果测 UAS（中心词正确）与 LAS（中心词和关系都正确），须说明标点与分词口径。解析能提供结构信号，但通用 LLM 不必先跑显式句法分析才能理解语言。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>UAS\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x00023;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmi>:\u003c/mi>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmo>LAS\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x00023;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmi>:\u003c/mi>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>h\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>r\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>混淆 constituency 的跨度标签与 dependency 的中心词边。\u003c/li>\u003cli>把不同分词口径的 UAS/LAS 直接比较。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>图式解析为何不能对每个词独立选最优 head 后结束？\u003c/li>\u003cli>非投射依存树和投射树有什么差别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "成分句法把连续片段组织为短语树，例如名词短语、动词短语，常以 CFG 或概率 CFG 表示；依存句法在词之间建立有向中心词关系，例如主语、宾语。两者描述同一句子的不同结构，不能把依存边直接视为短语标签。\n\n成分解析可通过 chart/CKY 动态规划组合跨度，标准二元 CFG 的 CKY 复杂度约 O(n³|G|)，神经 span parser 为跨度打分后施加树约束。依存解析常见转移式解析或图式解析，后者为 head-dependent 边打分，再求满足单一中心词、连通与无环约束的树。成分结果常测标注跨度 F1；依存结果测 UAS（中心词正确）与 LAS（中心词和关系都正确），须说明标点与分词口径。解析能提供结构信号，但通用 LLM 不必先跑显式句法分析才能理解语言。\n混淆 constituency 的跨度标签与 dependency 的中心词边。\n把不同分词口径的 UAS/LAS 直接比较。\n图式解析为何不能对每个词独立选最优 head 后结束？\n非投射依存树和投射树有什么差别？"}, {"id": "BAS-004", "category": "BAS", "topic": "分词与文本表示", "level": "L1", "title": "one-hot、静态词向量与上下文 embedding 的区别是什么？", "tags": ["词表示", "embedding", "ELMo"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>one-hot 为每个词分配独立坐标，没有编码语义相似性。静态词向量用一个查表矩阵把词映射到低维密集向量，共现或上下文预测目标使相似使用环境的词接近；同一个词形通常只有一个向量，难直接区分一词多义。上下文 embedding 则由序列编码器计算，词在“苹果发布新品”和“吃苹果”中能得到不同表示。\u003c/p>\u003cp>计数式向量可由共现矩阵、PPMI 和低秩分解得到，预测式向量可用 Word2Vec 学习；它们都依赖语料和上下文定义。ELMo 拼接分别训练的双向语言模型特征，BERT 在每层联合融合双向上下文，GPT 隐状态只依赖可见前缀。词向量平均或原始 BERT 的 CLS 并不自动成为高质量句向量，检索通常还需句级训练、pooling 与归一化。余弦相似度描述所选表示空间中的角度相似，不能单独证明事实一致。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>e\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>E\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>onehot\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>cos\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>u\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>u\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02016;\u003c/mo>\u003cmi>u\u003c/mi>\u003cmo>&#x02016;\u003c/mo>\u003cmo>&#x02016;\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo>&#x02016;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把词 embedding、上下文 token 隐状态和检索用句向量混为一谈。\u003c/li>\u003cli>认为向量加减类比对任何语料与词汇都成立。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么静态词向量很难表达多义词？\u003c/li>\u003cli>均值 pooling 为什么需要正确排除 padding？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "one-hot 为每个词分配独立坐标，没有编码语义相似性。静态词向量用一个查表矩阵把词映射到低维密集向量，共现或上下文预测目标使相似使用环境的词接近；同一个词形通常只有一个向量，难直接区分一词多义。上下文 embedding 则由序列编码器计算，词在“苹果发布新品”和“吃苹果”中能得到不同表示。\n\n计数式向量可由共现矩阵、PPMI 和低秩分解得到，预测式向量可用 Word2Vec 学习；它们都依赖语料和上下文定义。ELMo 拼接分别训练的双向语言模型特征，BERT 在每层联合融合双向上下文，GPT 隐状态只依赖可见前缀。词向量平均或原始 BERT 的 CLS 并不自动成为高质量句向量，检索通常还需句级训练、pooling 与归一化。余弦相似度描述所选表示空间中的角度相似，不能单独证明事实一致。\n把词 embedding、上下文 token 隐状态和检索用句向量混为一谈。\n认为向量加减类比对任何语料与词汇都成立。\n为什么静态词向量很难表达多义词？\n均值 pooling 为什么需要正确排除 padding？"}, {"id": "BAS-005", "category": "BAS", "topic": "分词与文本表示", "level": "L1", "title": "Word2Vec 的 CBOW 和 Skip-gram 如何训练，有哪些关键细节？", "tags": ["Word2Vec", "CBOW", "Skip-gram"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CBOW 用窗口内上下文词向量的平均或求和预测中心词，Skip-gram 用中心词分别预测窗口中的上下文词。两者都有输入向量表和输出向量表，并非仅有一个 embedding 矩阵。完整 softmax 下，Skip-gram 对每个中心—上下文词对最大化条件概率；实际可换成负采样或层次 softmax 以减少输出端计算。\u003c/p>\u003cp>CBOW 聚合上下文，计算较便宜；Skip-gram 从一个中心词生成多个训练对，常用于学习较少见词的表示，但优劣取决于数据与训练配方。常见技巧包括高频词 subsampling、随机窗口宽度和词频阈值，减少功能词支配训练；均值聚合通常丢失词序。训练后可取输入向量或组合两表，需明确口径。增量训练要正确更新词表和频率，并保留旧领域数据，否则新语料会改变已有向量空间；这不等同于冻结老向量只添新词。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>o\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmi>o\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmi>w\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>o\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/munder>\u003cmi>log\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>o\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmover>\u003cmi>v\u003c/mi>\u003cmo stretchy=\"true\">&#x000AF;\u003c/mo>\u003c/mover>\u003cmi>C\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmspace width=\"1em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003cmi mathvariant=\"normal\">W\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 Skip-gram 说成“多个上下文预测中心词”。\u003c/li>\u003cli>把窗口共现关系等同于全局语义真值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么需要输入、输出两张向量表？\u003c/li>\u003cli>随机缩小窗口如何改变近邻词的训练权重？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CBOW 用窗口内上下文词向量的平均或求和预测中心词，Skip-gram 用中心词分别预测窗口中的上下文词。两者都有输入向量表和输出向量表，并非仅有一个 embedding 矩阵。完整 softmax 下，Skip-gram 对每个中心—上下文词对最大化条件概率；实际可换成负采样或层次 softmax 以减少输出端计算。\n\nCBOW 聚合上下文，计算较便宜；Skip-gram 从一个中心词生成多个训练对，常用于学习较少见词的表示，但优劣取决于数据与训练配方。常见技巧包括高频词 subsampling、随机窗口宽度和词频阈值，减少功能词支配训练；均值聚合通常丢失词序。训练后可取输入向量或组合两表，需明确口径。增量训练要正确更新词表和频率，并保留旧领域数据，否则新语料会改变已有向量空间；这不等同于冻结老向量只添新词。\n把 Skip-gram 说成“多个上下文预测中心词”。\n把窗口共现关系等同于全局语义真值。\n为什么需要输入、输出两张向量表？\n随机缩小窗口如何改变近邻词的训练权重？"}, {"id": "BAS-006", "category": "BAS", "topic": "分词与文本表示", "level": "L2", "title": "负采样与层次 Softmax 怎样加速 Word2Vec，是否等价于原始 Softmax？", "tags": ["负采样", "Hierarchical Softmax", "Word2Vec"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>完整 softmax 需要遍历整个输出词表。层次 softmax 用二叉树的路径概率表示词概率，只更新目标词路径上的节点；Huffman 树让高频词路径较短，典型路径长度约 log|V|，并保持一个归一化的分布。负采样把观察到的词对作为正例，从噪声分布抽 K 个负例，对每个词对做 sigmoid 二分类，只更新这些输出向量。\u003c/p>\u003cp>负采样不是完整 softmax 的精确无偏梯度，也不直接产生所有词的归一化条件概率；它换了训练目标，以高效学习词表示。原始 Word2Vec 常用词频的 3/4 次方构造噪声分布，K 和噪声质量影响效果。负例不等于“语义上完全无关的词”，误负例应通过统计而非绝对断言理解。层次 softmax 的树结构、负采样的随机种子和输入/输出向量选择都会影响复现。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmi>o\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmi>&#x0007E;\u003c/mi>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0221D;\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmn>3\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x0220F;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmo>path\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/munder>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmi>u\u003c/mi>\u003cmi>j\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>b\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x02208;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>宣称负采样是原始多分类 softmax 的完全等价实现。\u003c/li>\u003cli>把所有抽出的负例都视为确定无关。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>层次 softmax 为什么能够定义归一化词概率？\u003c/li>\u003cli>SGNS 与 PMI 矩阵分解有什么联系？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "完整 softmax 需要遍历整个输出词表。层次 softmax 用二叉树的路径概率表示词概率，只更新目标词路径上的节点；Huffman 树让高频词路径较短，典型路径长度约 log|V|，并保持一个归一化的分布。负采样把观察到的词对作为正例，从噪声分布抽 K 个负例，对每个词对做 sigmoid 二分类，只更新这些输出向量。\n\n负采样不是完整 softmax 的精确无偏梯度，也不直接产生所有词的归一化条件概率；它换了训练目标，以高效学习词表示。原始 Word2Vec 常用词频的 3/4 次方构造噪声分布，K 和噪声质量影响效果。负例不等于“语义上完全无关的词”，误负例应通过统计而非绝对断言理解。层次 softmax 的树结构、负采样的随机种子和输入/输出向量选择都会影响复现。\n宣称负采样是原始多分类 softmax 的完全等价实现。\n把所有抽出的负例都视为确定无关。\n层次 softmax 为什么能够定义归一化词概率？\nSGNS 与 PMI 矩阵分解有什么联系？"}, {"id": "BAS-007", "category": "BAS", "topic": "分词与文本表示", "level": "L1", "title": "N-gram 与神经语言模型怎样估计序列概率，平滑解决什么问题？", "tags": ["语言模型", "N-gram", "平滑"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>语言模型为 token 序列赋予概率，概率链式法则本身是精确的；N-gram 额外作有限阶 Markov 近似，只看前 N−1 个词，通过计数估计条件概率。未经平滑的最大似然估计会给未见组合零概率，使测试文本整体概率为零、perplexity 无穷。加法平滑、插值/回退和 Kneser-Ney 等方法为未见事件分配质量，同时调整已见事件。\u003c/p>\u003cp>神经语言模型用共享向量和网络预测分布，能在不同上下文间泛化；RNN 顺序更新状态，Transformer 按 mask 聚合上下文，仍须受训练数据和上下文窗口限制。N-gram 通常便宜、可解释且适合作基线，但稀疏性和长依赖弱；神经模型规模大不保证特定分布上更可靠。比较 perplexity 要固定 tokenizer、测试集、上下文和计分 token，否则其数值不具可比性。\u003c/p>\u003cp>NLP是处理人类语言的研究领域，LLM是其中一类语言建模技术，不能把二者视为互斥类别。传统方案常为分类、抽取等任务训练专门模型；LLM通过通用预训练、指令微调和上下文示例支持多任务，但小型专用模型也可能在固定任务的成本与精度上更合适。LLM没有统一的百亿参数起点，参数规模本身也不证明具备推理或指令能力。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x0220F;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/munderover>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmtext>-gram\u003c/mtext>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmtext>-\u003c/mtext>\u003cmi mathvariant=\"normal\">&#x003B1;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把概率链式法则和 N-gram 截断近似当作同一假设。\u003c/li>\u003cli>为平滑分配额外质量却不重归一化。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 Kneser-Ney 更关注不同上下文中的出现次数？\u003c/li>\u003cli>N-gram 和神经模型的 OOV 策略如何影响 PPL？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "语言模型为 token 序列赋予概率，概率链式法则本身是精确的；N-gram 额外作有限阶 Markov 近似，只看前 N−1 个词，通过计数估计条件概率。未经平滑的最大似然估计会给未见组合零概率，使测试文本整体概率为零、perplexity 无穷。加法平滑、插值/回退和 Kneser-Ney 等方法为未见事件分配质量，同时调整已见事件。\n\n神经语言模型用共享向量和网络预测分布，能在不同上下文间泛化；RNN 顺序更新状态，Transformer 按 mask 聚合上下文，仍须受训练数据和上下文窗口限制。N-gram 通常便宜、可解释且适合作基线，但稀疏性和长依赖弱；神经模型规模大不保证特定分布上更可靠。比较 perplexity 要固定 tokenizer、测试集、上下文和计分 token，否则其数值不具可比性。\n\nNLP是处理人类语言的研究领域，LLM是其中一类语言建模技术，不能把二者视为互斥类别。传统方案常为分类、抽取等任务训练专门模型；LLM通过通用预训练、指令微调和上下文示例支持多任务，但小型专用模型也可能在固定任务的成本与精度上更合适。LLM没有统一的百亿参数起点，参数规模本身也不证明具备推理或指令能力。\n把概率链式法则和 N-gram 截断近似当作同一假设。\n为平滑分配额外质量却不重归一化。\n为什么 Kneser-Ney 更关注不同上下文中的出现次数？\nN-gram 和神经模型的 OOV 策略如何影响 PPL？"}, {"id": "BAS-008", "category": "BAS", "topic": "序列任务与经典 NLP", "level": "L1", "title": "CNN、RNN 与 Transformer 在序列建模、长依赖和并行性上怎样比较？", "tags": ["CNN", "RNN", "Transformer"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CNN 用共享局部卷积核提取邻近片段模式，堆叠、空洞卷积或较大卷积核可扩大感受野；RNN 把上一时刻状态传给下一时刻，天然支持在线顺序处理；Transformer 的注意力直接连接可见位置，再以 FFN 做逐位置变换。三者都能共享参数，差别在跨位置的信息传递规则。\u003c/p>\u003cp>RNN 的训练在时间轴有顺序依赖，长路径容易遇到梯度问题；CNN 的独立位置可并行，但远距离需要更多层或设计；全注意力的远距离路径较短，训练可在位置轴并行，代价是标准注意力的二次交互计算。Decoder Transformer 的 teacher forcing 训练可并行，普通自回归生成仍依赖前一个输出；这与层间串行是不同维度。不存在脱离数据、长度、硬件的固定效果排名，流式和边缘任务中 RNN/CNN 仍有合理应用。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsup>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 Transformer 的训练并行推广为所有生成步骤并行。\u003c/li>\u003cli>以某次机器翻译结果宣称 CNN/RNN/Transformer 的效果排名永远固定。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>空洞卷积怎样扩大感受野？\u003c/li>\u003cli>causal RNN 与 bidirectional RNN 的在线使用条件有何区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CNN 用共享局部卷积核提取邻近片段模式，堆叠、空洞卷积或较大卷积核可扩大感受野；RNN 把上一时刻状态传给下一时刻，天然支持在线顺序处理；Transformer 的注意力直接连接可见位置，再以 FFN 做逐位置变换。三者都能共享参数，差别在跨位置的信息传递规则。\n\nRNN 的训练在时间轴有顺序依赖，长路径容易遇到梯度问题；CNN 的独立位置可并行，但远距离需要更多层或设计；全注意力的远距离路径较短，训练可在位置轴并行，代价是标准注意力的二次交互计算。Decoder Transformer 的 teacher forcing 训练可并行，普通自回归生成仍依赖前一个输出；这与层间串行是不同维度。不存在脱离数据、长度、硬件的固定效果排名，流式和边缘任务中 RNN/CNN 仍有合理应用。\n把 Transformer 的训练并行推广为所有生成步骤并行。\n以某次机器翻译结果宣称 CNN/RNN/Transformer 的效果排名永远固定。\n空洞卷积怎样扩大感受野？\ncausal RNN 与 bidirectional RNN 的在线使用条件有何区别？"}, {"id": "BAS-009", "category": "BAS", "topic": "序列任务与经典 NLP", "level": "L2", "title": "LSTM 与 GRU 怎样缓解普通 RNN 的梯度问题，有何结构区别？", "tags": ["LSTM", "GRU", "BPTT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通 RNN 的反向梯度跨时间连续乘 Jacobian，谱尺度持续小于或大于 1 时容易消失或爆炸。LSTM 维护 cell state，用遗忘门保留旧状态、输入门写入候选、输出门控制暴露的 hidden state；沿 cell 的直接路径是加法更新，能减轻长依赖的优化困难。GRU 通常只有一个状态，更新门在旧状态与候选之间插值，重置门调节生成候选时使用多少旧状态，参数通常较少。\u003c/p>\u003cp>门控并不保证任意长度无损记忆，门接近关闭时仍会阻断梯度，梯度裁剪也只控制爆炸。GRU 的更新门定义和重置门应用位置在不同文献/框架里可能不同，手写前先固定约定。LSTM/GRU 都在时间轴递归，双向版本能利用左右上下文但不能直接用于未知未来的在线预测。选择应根据序列长度、流式要求、吞吐和任务验证。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02299;\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02299;\u003c/mo>\u003cmsub>\u003cmover>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x0007E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02299;\u003c/mo>\u003cmi>tanh\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmover>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x0007E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">U\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>tanh\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02299;\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">U\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02299;\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02299;\u003c/mo>\u003cmsub>\u003cmover>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x0007E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说门控能彻底消除所有梯度消失。\u003c/li>\u003cli>忘记不同 GRU 实现可能把 z 与 1−z 的角色互换。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>LSTM 的 cell state 和 hidden state 为什么分开？\u003c/li>\u003cli>截断 BPTT 会牺牲什么梯度信息？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通 RNN 的反向梯度跨时间连续乘 Jacobian，谱尺度持续小于或大于 1 时容易消失或爆炸。LSTM 维护 cell state，用遗忘门保留旧状态、输入门写入候选、输出门控制暴露的 hidden state；沿 cell 的直接路径是加法更新，能减轻长依赖的优化困难。GRU 通常只有一个状态，更新门在旧状态与候选之间插值，重置门调节生成候选时使用多少旧状态，参数通常较少。\n\n门控并不保证任意长度无损记忆，门接近关闭时仍会阻断梯度，梯度裁剪也只控制爆炸。GRU 的更新门定义和重置门应用位置在不同文献/框架里可能不同，手写前先固定约定。LSTM/GRU 都在时间轴递归，双向版本能利用左右上下文但不能直接用于未知未来的在线预测。选择应根据序列长度、流式要求、吞吐和任务验证。\n说门控能彻底消除所有梯度消失。\n忘记不同 GRU 实现可能把 z 与 1−z 的角色互换。\nLSTM 的 cell state 和 hidden state 为什么分开？\n截断 BPTT 会牺牲什么梯度信息？"}, {"id": "BAS-010", "category": "BAS", "topic": "深度学习与优化基础", "level": "L1", "title": "Sigmoid、Tanh、ReLU、GELU 与 SiLU 的公式和梯度特点是什么？", "tags": ["激活函数", "GELU", "SiLU"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>没有非线性时，多层线性映射仍可合成一个线性映射。Sigmoid 将值压到 (0,1)，适合二元概率或门；Tanh 输出在 (−1,1)，但两者在绝对值大时都易饱和。ReLU 对正值梯度为 1、负值为 0，计算简单，但神经元可能长期落在负区间；Leaky ReLU/PReLU 用固定或可学习的小负侧斜率减轻这一问题。\u003c/p>\u003cp>GELU 为 xΦ(x)，平滑地按标准正态 CDF 调节输入；SiLU 为 xσ(x)，Swish 常写 xσ(βx)，β=1 时就是 SiLU。它们保留部分负输入，常用于 Transformer FFN；GLU/SwiGLU 是两个投影分支相乘的门控结构，不是仅替换一个标量激活。激活选择要和初始化、归一化、精度与 FFN 中间维度一起比较，不能因负值可通过就推断一定收敛更快。\u003c/p>\u003cp>ELU 在正侧为 x、负侧为 α(exp(x)−1)，负侧会饱和，α=1 时零点处一阶导数连续。RReLU 则在训练时随机取负侧斜率、推理时常用其期望值；PReLU 的斜率是学习得到的参数。三者的参数和随机性不同，早期 CNN 实验的优劣不能直接推广为所有 LLM 的结论。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsup>\u003cmi>&#x003C3;\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsup>\u003cmi>tanh\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsup>\u003cmi>tanh\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>ReLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>GELU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>&#x003A6;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>SiLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsup>\u003cmo>SiLU\u003c/mo>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 SwiGLU 当作只含一个投影的 SiLU 激活。\u003c/li>\u003cli>把 ReLU 在 0 点的实现导数约定说成唯一数学导数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>GELU 的近似式为什么与精确式略有差异？\u003c/li>\u003cli>ReLU 的死亡问题与梯度爆炸分别如何识别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "没有非线性时，多层线性映射仍可合成一个线性映射。Sigmoid 将值压到 (0,1)，适合二元概率或门；Tanh 输出在 (−1,1)，但两者在绝对值大时都易饱和。ReLU 对正值梯度为 1、负值为 0，计算简单，但神经元可能长期落在负区间；Leaky ReLU/PReLU 用固定或可学习的小负侧斜率减轻这一问题。\n\nGELU 为 xΦ(x)，平滑地按标准正态 CDF 调节输入；SiLU 为 xσ(x)，Swish 常写 xσ(βx)，β=1 时就是 SiLU。它们保留部分负输入，常用于 Transformer FFN；GLU/SwiGLU 是两个投影分支相乘的门控结构，不是仅替换一个标量激活。激活选择要和初始化、归一化、精度与 FFN 中间维度一起比较，不能因负值可通过就推断一定收敛更快。\n\nELU 在正侧为 x、负侧为 α(exp(x)−1)，负侧会饱和，α=1 时零点处一阶导数连续。RReLU 则在训练时随机取负侧斜率、推理时常用其期望值；PReLU 的斜率是学习得到的参数。三者的参数和随机性不同，早期 CNN 实验的优劣不能直接推广为所有 LLM 的结论。\n把 SwiGLU 当作只含一个投影的 SiLU 激活。\n把 ReLU 在 0 点的实现导数约定说成唯一数学导数。\nGELU 的近似式为什么与精确式略有差异？\nReLU 的死亡问题与梯度爆炸分别如何识别？"}, {"id": "BAS-011", "category": "BAS", "topic": "深度学习与优化基础", "level": "L2", "title": "SGD、Momentum、AdaGrad、RMSProp 与 Adam 的更新规则怎样理解？", "tags": ["优化器", "SGD", "Momentum", "Adam"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Mini-batch SGD 用当前批次的梯度更新参数，动量用过去梯度的指数滑动累积减少振荡、维持方向。AdaGrad 累积平方梯度，为频繁更新坐标降低有效学习率，适合某些稀疏问题但学习率可能持续衰减；RMSProp 用平方梯度的指数平均缓解无界累积。Adam 同时维护一阶与二阶矩估计，并在零初始化时做偏差校正。\u003c/p>\u003cp>Adam 中二阶矩是未中心化平方梯度的平均，不等同于梯度方差；除以其平方根也不意味着把所有坐标真实曲率准确求出。实现要区分 optimizer step 与 microbatch、明确 epsilon 放置和权重衰减；AdamW 的解耦衰减另见预训练题。Nesterov 动量在前瞻位置估计方向，AdaDelta 利用更新量与梯度量的滑动统计调节尺度，这些方法没有统一适用所有任务的排名。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsubsup>\u003cmi>g\u003c/mi>\u003cmi>t\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsubsup>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>1\u003c/mn>\u003cmi>t\u003c/mi>\u003c/msubsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmover accent=\"true\">\u003cmi>v\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsubsup>\u003cmi>&#x003B2;\u003c/mi>\u003cmn>2\u003c/mn>\u003cmi>t\u003c/mi>\u003c/msubsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003B7;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>m\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>v\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把二阶矩 v 当作已减均值的方差。\u003c/li>\u003cli>每个 microbatch 都更新 Adam 状态却称它等价梯度累积。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么初始化的动量需要偏差校正？\u003c/li>\u003cli>AdaGrad 的有效学习率为什么通常随训练下降？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Mini-batch SGD 用当前批次的梯度更新参数，动量用过去梯度的指数滑动累积减少振荡、维持方向。AdaGrad 累积平方梯度，为频繁更新坐标降低有效学习率，适合某些稀疏问题但学习率可能持续衰减；RMSProp 用平方梯度的指数平均缓解无界累积。Adam 同时维护一阶与二阶矩估计，并在零初始化时做偏差校正。\n\nAdam 中二阶矩是未中心化平方梯度的平均，不等同于梯度方差；除以其平方根也不意味着把所有坐标真实曲率准确求出。实现要区分 optimizer step 与 microbatch、明确 epsilon 放置和权重衰减；AdamW 的解耦衰减另见预训练题。Nesterov 动量在前瞻位置估计方向，AdaDelta 利用更新量与梯度量的滑动统计调节尺度，这些方法没有统一适用所有任务的排名。\n把二阶矩 v 当作已减均值的方差。\n每个 microbatch 都更新 Adam 状态却称它等价梯度累积。\n为什么初始化的动量需要偏差校正？\nAdaGrad 的有效学习率为什么通常随训练下降？"}, {"id": "BAS-012", "category": "BAS", "topic": "深度学习与优化基础", "level": "L1", "title": "反向传播怎样使用链式法则？线性层、MSE 与 Softmax 交叉熵如何求梯度？", "tags": ["反向传播", "链式法则", "梯度"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>反向传播按计算图的逆拓扑顺序把上游梯度乘局部 Jacobian，并累加所有分支对同一变量的贡献。它不是数值差分，也不是每次显式构造整个 Jacobian；自动微分通常计算 vector-Jacobian product。线性层 Y=XW+b 的梯度为 XᵀG、GWᵀ，bias 梯度沿样本维求和；共享参数必须累加每次使用的贡献。\u003c/p>\u003cp>MSE 用预测误差驱动回归，softmax 加交叉熵的 logits 梯度则是 p−y（在规范标签和相同归一化条件下）。mean reduction 会引入对应样本或 token 数的除数，loss mask 使未监督项梯度为零，但这些输入仍可能通过注意力影响被监督输出。定位梯度错误可用小尺寸有限差分核对、检查 detach/in-place 修改和梯度清零；有限差分只作验证，步长过小会受浮点消减影响。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>Y\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>Y\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>W\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>X\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>G\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>X\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>G\u003c/mi>\u003cmsup>\u003cmi>W\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>y\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmspace width=\"1em\" />\u003cmtext>(single&#x000A0;example)\u003c/mtext>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>共享参数仅保留最后一次调用的梯度。\u003c/li>\u003cli>混淆 sum、按样本 mean 和按有效 token mean 的尺度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 logsoftmax 与 NLL 合并后的梯度比单看 softmax Jacobian 更直接？\u003c/li>\u003cli>梯度检查应该如何选择有限差分步长？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "反向传播按计算图的逆拓扑顺序把上游梯度乘局部 Jacobian，并累加所有分支对同一变量的贡献。它不是数值差分，也不是每次显式构造整个 Jacobian；自动微分通常计算 vector-Jacobian product。线性层 Y=XW+b 的梯度为 XᵀG、GWᵀ，bias 梯度沿样本维求和；共享参数必须累加每次使用的贡献。\n\nMSE 用预测误差驱动回归，softmax 加交叉熵的 logits 梯度则是 p−y（在规范标签和相同归一化条件下）。mean reduction 会引入对应样本或 token 数的除数，loss mask 使未监督项梯度为零，但这些输入仍可能通过注意力影响被监督输出。定位梯度错误可用小尺寸有限差分核对、检查 detach/in-place 修改和梯度清零；有限差分只作验证，步长过小会受浮点消减影响。\n共享参数仅保留最后一次调用的梯度。\n混淆 sum、按样本 mean 和按有效 token mean 的尺度。\n为什么 logsoftmax 与 NLL 合并后的梯度比单看 softmax Jacobian 更直接？\n梯度检查应该如何选择有限差分步长？"}, {"id": "BAS-013", "category": "BAS", "topic": "深度学习与优化基础", "level": "L2", "title": "过拟合、欠拟合与数据泄露怎样区分，L1/L2、早停和 Dropout 分别做什么？", "tags": ["泛化", "过拟合", "正则化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>训练与验证都差可能是欠拟合、目标不合适或优化失败；训练好而独立验证差常提示过拟合或分布差异，不能只由两条 loss 曲线确定原因。数据泄露会让验证异常乐观，例如相同文档的相邻块落到训练和验证、预处理在全数据拟合，或反复根据测试集调参。应按文档、用户、时间或实体分组切分，保留真正未参与选择的测试集。\u003c/p>\u003cp>L2 惩罚连续压小参数，L1 鼓励部分坐标变零；在自适应优化器里显式 L2 与解耦 weight decay 不等价。早停依据验证趋势选择 checkpoint，dropout 在训练中随机屏蔽与缩放激活以正则化；它们都无法替代高质量数据或消除分布漂移。实际排查先核对数据切分和评测实现，再比较训练曲线、数据量消融、容量与正则强度，不通过单纯增加训练 epoch“解决”泄露。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmo>&#x02016;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003cmsub>\u003cmo>&#x02016;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmfrac>\u003cmi>&#x003BB;\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmo>&#x02016;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003cmsubsup>\u003cmo>&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把验证集反复用于决策后仍视为最终无偏测试。\u003c/li>\u003cli>只凭 train/val gap 断言问题必然是参数太多。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么同文档的 chunk 应避免跨训练/验证集合？\u003c/li>\u003cli>L1 的零点处应该使用什么梯度概念？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "训练与验证都差可能是欠拟合、目标不合适或优化失败；训练好而独立验证差常提示过拟合或分布差异，不能只由两条 loss 曲线确定原因。数据泄露会让验证异常乐观，例如相同文档的相邻块落到训练和验证、预处理在全数据拟合，或反复根据测试集调参。应按文档、用户、时间或实体分组切分，保留真正未参与选择的测试集。\n\nL2 惩罚连续压小参数，L1 鼓励部分坐标变零；在自适应优化器里显式 L2 与解耦 weight decay 不等价。早停依据验证趋势选择 checkpoint，dropout 在训练中随机屏蔽与缩放激活以正则化；它们都无法替代高质量数据或消除分布漂移。实际排查先核对数据切分和评测实现，再比较训练曲线、数据量消融、容量与正则强度，不通过单纯增加训练 epoch“解决”泄露。\n把验证集反复用于决策后仍视为最终无偏测试。\n只凭 train/val gap 断言问题必然是参数太多。\n为什么同文档的 chunk 应避免跨训练/验证集合？\nL1 的零点处应该使用什么梯度概念？"}, {"id": "BAS-014", "category": "BAS", "topic": "深度学习与优化基础", "level": "L2", "title": "Xavier、He 初始化与 embedding 乘 √d_model 的目的是什么？", "tags": ["初始化", "Xavier", "He", "embedding"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>初始化要控制深层网络前向激活和反向梯度的尺度。对近似独立零均值输入，线性层的输出方差与 fan-in、权重方差相乘；Xavier 综合 fan-in/fan-out，适用于近似线性或对称激活的分析；He 对 ReLU 丢弃约一半输入的情形使用约 2/fan-in 的权重方差。假设会受相关性、残差、归一化和门控影响，所以这是设计起点而非任意网络的稳定性证明。\u003c/p>\u003cp>原始 Transformer 将输入 embedding 乘 √d_model 后加位置编码，用来调节词表示相对于位置表示的尺度，并配合其共享 embedding 的参数化。现代模型可能直接使用未缩放 embedding，具体要看初始化和前向代码。输出 logits 是否缩放、Norm 放置和 residual 缩放是不同机制；不能见到“√d”就一概归因于注意力的缩放点积。初始化后可测各层激活 RMS、logits 和梯度范数，验证是否稳定。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>W\u003c/mi>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmo />\u003cmrow>\u003cmi>f\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x0005F;\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>W\u003c/mi>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">X\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo />\u003cmrow>\u003cmi>f\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x0005F;\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmo />\u003cmrow>\u003cmi>f\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x0005F;\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>u\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>W\u003c/mi>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">H\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo />\u003cmrow>\u003cmi>f\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x0005F;\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 embedding 的 √d_model 缩放说成所有 Transformer 的必需组件。\u003c/li>\u003cli>把初始化方差的独立性分析当作训练全过程成立。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>残差分支叠加为什么可能需要额外的深度缩放？\u003c/li>\u003cli>均匀分布和正态分布怎样匹配同一目标方差？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "初始化要控制深层网络前向激活和反向梯度的尺度。对近似独立零均值输入，线性层的输出方差与 fan-in、权重方差相乘；Xavier 综合 fan-in/fan-out，适用于近似线性或对称激活的分析；He 对 ReLU 丢弃约一半输入的情形使用约 2/fan-in 的权重方差。假设会受相关性、残差、归一化和门控影响，所以这是设计起点而非任意网络的稳定性证明。\n\n原始 Transformer 将输入 embedding 乘 √d_model 后加位置编码，用来调节词表示相对于位置表示的尺度，并配合其共享 embedding 的参数化。现代模型可能直接使用未缩放 embedding，具体要看初始化和前向代码。输出 logits 是否缩放、Norm 放置和 residual 缩放是不同机制；不能见到“√d”就一概归因于注意力的缩放点积。初始化后可测各层激活 RMS、logits 和梯度范数，验证是否稳定。\n把 embedding 的 √d_model 缩放说成所有 Transformer 的必需组件。\n把初始化方差的独立性分析当作训练全过程成立。\n残差分支叠加为什么可能需要额外的深度缩放？\n均匀分布和正态分布怎样匹配同一目标方差？"}, {"id": "BAS-015", "category": "BAS", "topic": "分词与文本表示", "level": "L2", "title": "TF-IDF 与 TextRank 如何提取关键词，各有哪些局限？", "tags": ["TF-IDF", "TextRank", "关键词"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>TF-IDF给词赋予文档内频率与逆文档频率的乘积：当前文档频繁、在全语料较少见的词更显著。tf可以原始计数、归一化或log变换，idf常加平滑；实现需固定分词、停用词和语料范围，不能把高分直接理解为事实重要性。TextRank把词的局部共现构成图，通过PageRank式迭代累积邻接节点的重要性，不要求已标注关键词；也可用句子相似图提取摘要。\u003c/p>\u003cp>TF-IDF依赖背景语料统计，对同义词和词序不敏感；TextRank依赖窗口和图边，可能偏向连接度高的常见词，也不保证覆盖语义关键但罕见的实体。jieba提供这两类工具，添加领域词典可影响候选，但不能单靠工具名保证质量。评估可用人工关键词覆盖、冗余率及检索/分类的下游收益，对单篇短文本尤其要检查分词和停用词规则。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>TFIDF\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>tf\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo>df\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>u\u003c/mi>\u003cmo>&#x02192;\u003c/mo>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmrow>\u003cmi>u\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmrow>\u003cmi>u\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>u\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把tf-idf或中心性分数当作语义正确性的概率。\u003c/li>\u003cli>用测试集拟合idf却称没有数据泄露。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>共现窗口变大如何改变TextRank的边与得分？\u003c/li>\u003cli>为什么关键词提取与LLM tokenizer分词目标不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "TF-IDF给词赋予文档内频率与逆文档频率的乘积：当前文档频繁、在全语料较少见的词更显著。tf可以原始计数、归一化或log变换，idf常加平滑；实现需固定分词、停用词和语料范围，不能把高分直接理解为事实重要性。TextRank把词的局部共现构成图，通过PageRank式迭代累积邻接节点的重要性，不要求已标注关键词；也可用句子相似图提取摘要。\n\nTF-IDF依赖背景语料统计，对同义词和词序不敏感；TextRank依赖窗口和图边，可能偏向连接度高的常见词，也不保证覆盖语义关键但罕见的实体。jieba提供这两类工具，添加领域词典可影响候选，但不能单靠工具名保证质量。评估可用人工关键词覆盖、冗余率及检索/分类的下游收益，对单篇短文本尤其要检查分词和停用词规则。\n把tf-idf或中心性分数当作语义正确性的概率。\n用测试集拟合idf却称没有数据泄露。\n共现窗口变大如何改变TextRank的边与得分？\n为什么关键词提取与LLM tokenizer分词目标不同？"}, {"id": "PRE-002", "category": "BAS", "topic": "分词与文本表示", "level": "L1", "title": "BPE、WordPiece、Unigram 与 SentencePiece 分别是什么？", "tags": ["Tokenizer", "BPE", "Unigram"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BPE 从较小单元出发，逐步合并高频相邻对，学习 merge 规则并按规则编码；子词表示能减少未知词问题。Unigram 为候选切分建立概率模型，逐步删减候选词表，用动态规划找高概率切分，也可采样切分。\u003c/p>\u003cp>SentencePiece 是支持 BPE、Unigram 等模型的训练工具，不是与它们并列的单一算法。它可直接从原始文本训练，处理空白与归一化，减少对语言特定预分词的依赖。字符、byte 和 Unicode 归一化设定都会影响可逆性、序列长度及代码字符串表现。\u003c/p>\u003cp>WordPiece 常按词表做最长前缀匹配，再对后续子词使用 continuation 标记；它通常保存最终词表，不按BPE的merge rank回放合并。训练目标/打分与实现并不唯一，Hugging Face课程的词对频率比是教学近似，不能当作Google未公开训练器的唯一公式。Byte-level BPE以字节为基本覆盖单元，可减轻未知字符问题，但normalization、预分词和special tokens仍影响精确可逆性。选择tokenizer要比较语言覆盖、序列长度、代码/空白保持与成本，不能先跑jieba替换原tokenizer而期待checkpoint仍兼容。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 SentencePiece 当作独立于 BPE、Unigram 的分词算法。\u003c/li>\u003cli>认为 token 总是一个汉字或一个英文单词。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>byte-level tokenizer 为什么通常能覆盖未知字符？\u003c/li>\u003cli>分词可逆性与文本归一化有什么冲突？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BPE 从较小单元出发，逐步合并高频相邻对，学习 merge 规则并按规则编码；子词表示能减少未知词问题。Unigram 为候选切分建立概率模型，逐步删减候选词表，用动态规划找高概率切分，也可采样切分。\n\nSentencePiece 是支持 BPE、Unigram 等模型的训练工具，不是与它们并列的单一算法。它可直接从原始文本训练，处理空白与归一化，减少对语言特定预分词的依赖。字符、byte 和 Unicode 归一化设定都会影响可逆性、序列长度及代码字符串表现。\n\nWordPiece 常按词表做最长前缀匹配，再对后续子词使用 continuation 标记；它通常保存最终词表，不按BPE的merge rank回放合并。训练目标/打分与实现并不唯一，Hugging Face课程的词对频率比是教学近似，不能当作Google未公开训练器的唯一公式。Byte-level BPE以字节为基本覆盖单元，可减轻未知字符问题，但normalization、预分词和special tokens仍影响精确可逆性。选择tokenizer要比较语言覆盖、序列长度、代码/空白保持与成本，不能先跑jieba替换原tokenizer而期待checkpoint仍兼容。\n把 SentencePiece 当作独立于 BPE、Unigram 的分词算法。\n认为 token 总是一个汉字或一个英文单词。\nbyte-level tokenizer 为什么通常能覆盖未知字符？\n分词可逆性与文本归一化有什么冲突？"}, {"id": "PRE-003", "category": "BAS", "topic": "分词与文本表示", "level": "L2", "title": "词表越大越好吗，扩词表有哪些代价？", "tags": ["词表", "参数量", "多语言"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>更大的词表可能降低同一文本的 token 数，改善部分语言的压缩率，但也增大 embedding、LM head 和 logits 计算。若输入/输出不共享权重，两套矩阵约有 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>V\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math> 参数，共享后约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math>，bias 另算；稀有或新增 token 出现太少时也难以学到稳定表示。\u003c/p>\u003cp>选词表应同时评估覆盖、压缩率、训练充分度和显存，在多语言、代码、数字与罕见字符上统计 tokens/byte 或 tokens/字符。继续训练时改变 tokenizer 还会改变序列分布，必须检查旧 token ID、初始化与新增行的训练，不能只看总 token 数减少。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 tokenizer 扩词表当作无需训练的免费优化。\u003c/li>\u003cli>直接把更少 token 等同于更好的语义理解。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>什么时候值得为中文新增 token？\u003c/li>\u003cli>如何避免新增 token 的 embedding 未被 PEFT 更新？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "更大的词表可能降低同一文本的 token 数，改善部分语言的压缩率，但也增大 embedding、LM head 和 logits 计算。若输入/输出不共享权重，两套矩阵约有 $2Vd$ 参数，共享后约为 $Vd$，bias 另算；稀有或新增 token 出现太少时也难以学到稳定表示。\n\n选词表应同时评估覆盖、压缩率、训练充分度和显存，在多语言、代码、数字与罕见字符上统计 tokens/byte 或 tokens/字符。继续训练时改变 tokenizer 还会改变序列分布，必须检查旧 token ID、初始化与新增行的训练，不能只看总 token 数减少。\n把 tokenizer 扩词表当作无需训练的免费优化。\n直接把更少 token 等同于更好的语义理解。\n什么时候值得为中文新增 token？\n如何避免新增 token 的 embedding 未被 PEFT 更新？"}, {"id": "TFM-013", "category": "BAS", "topic": "数学、概率与统计", "level": "L1", "title": "交叉熵、KL 散度与 perplexity 的关系和实现注意点是什么？", "tags": ["CrossEntropy", "KL", "PPL", "Entropy", "FixedTarget", "Distillation"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>离散分布满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。展开对数即可证明。两者须定义在同一支持空间并归一化；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>0\u003c/mn>\u003cmi>log\u003c/mi>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 按极限为 0，若 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>，交叉熵与 KL 为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>&#x0221E;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>KL 非负，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/math> 时取零，通常不对称，也不是距离度量。固定目标 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math> 时，最小化 CE 与最小化该方向的 KL 等价；若目标也含待训练参数且未 detach，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math> 的梯度不能忽略。蒸馏还须明确 teacher/student 的方向以及是否停止 teacher 梯度。\u003c/p>\u003cp>One-hot 监督样本的目标熵为零，单样本 CE 与 KL 都为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，但真实数据的条件熵不一定为零。软标签与标签平滑的目标熵通常大于零；固定归一化 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 时，对 logits 的梯度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>，对概率 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 本身为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>\u003ccode>CrossEntropyLoss\u003c/code> 通常接收原始 logits，内部做稳定的 log-softmax/NLL；\u003ccode>KLDivLoss\u003c/code> 通常接收 \u003ccode>input=log q,target=p\u003c/code>，接口顺序与数学记号不同，reduction 也须按分布单位解释。自然对数下，PPL 是有效 token 平均 NLL 的指数；不同长度 batch 要按有效 token 加权，比较时统一 tokenizer、数据与窗口。低 PPL 不保证指令遵循、事实性或偏好更好。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmtext>fixed\u003c/mtext>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>PPL\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>无条件声称 CE 与 KL 完全相同，遗漏目标熵及 fixed-p 前提。\u003c/li>\u003cli>把 \u003ccode>KLDivLoss\u003c/code> 的输入顺序/mean 归一化当成数学 KL 的默认定义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何从 softmax 推导对 logits 的梯度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math>？\u003c/li>\u003cli>可训练的软目标或双向 KL 会怎样改变优化目标？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "离散分布满足 $H(p,q)=H(p)+D_{\\rm KL}(p\\|q)$，其中 $H(p)=-\\sum_i p_i\\log p_i$、$H(p,q)=-\\sum_i p_i\\log q_i$、$D_{\\rm KL}(p\\|q)=\\sum_i p_i\\log(p_i/q_i)$。展开对数即可证明。两者须定义在同一支持空间并归一化；$0\\log0$ 按极限为 0，若 $p_i>0,q_i=0$，交叉熵与 KL 为 $+\\infty$。\n\nKL 非负，$p=q$ 时取零，通常不对称，也不是距离度量。固定目标 $p$ 时，最小化 CE 与最小化该方向的 KL 等价；若目标也含待训练参数且未 detach，$H(p)$ 与 $p$ 的梯度不能忽略。蒸馏还须明确 teacher/student 的方向以及是否停止 teacher 梯度。\n\nOne-hot 监督样本的目标熵为零，单样本 CE 与 KL 都为 $-\\log q(y)$，但真实数据的条件熵不一定为零。软标签与标签平滑的目标熵通常大于零；固定归一化 $p$、$q=\\operatorname{softmax}(z)$ 时，对 logits 的梯度为 $q-p$，对概率 $q_i$ 本身为 $-p_i/q_i$。\n\n`CrossEntropyLoss` 通常接收原始 logits，内部做稳定的 log-softmax/NLL；`KLDivLoss` 通常接收 `input=log q,target=p`，接口顺序与数学记号不同，reduction 也须按分布单位解释。自然对数下，PPL 是有效 token 平均 NLL 的指数；不同长度 batch 要按有效 token 加权，比较时统一 tokenizer、数据与窗口。低 PPL 不保证指令遵循、事实性或偏好更好。\n无条件声称 CE 与 KL 完全相同，遗漏目标熵及 fixed-p 前提。\n把 `KLDivLoss` 的输入顺序/mean 归一化当成数学 KL 的默认定义。\n如何从 softmax 推导对 logits 的梯度 $q-p$？\n可训练的软目标或双向 KL 会怎样改变优化目标？"}, {"id": "TFM-017", "category": "BAS", "topic": "数学、概率与统计", "level": "L1", "title": "熵衡量什么？离散熵、条件熵与模型输出熵怎样区分？", "tags": ["Entropy", "ConditionalEntropy", "不确定性", "信息论"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>离散熵是自信息的期望：事件自信息为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，熵为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u0
