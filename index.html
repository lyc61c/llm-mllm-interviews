 个 token；隔离 attention 时，还要处理 shift 后的跨样本标签。\u003c/figcaption>\u003c/figure>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>EOS、loss mask 或重置 \u003ccode>position_ids\u003c/code> 任一项就能阻断跨样本 attention。\u003c/li>\u003cli>隔离 attention 后仍保留跨边界 shifted label，或在不同实现中重复 shift。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何处理长对话拆分时需要继承的历史 prompt？\u003c/li>\u003cli>为何 packing 开启后吞吐提高却可能改变梯度加权？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Packing 把多个短样本装入一条训练行，减少 padding。先应用 chat template、分词并标记回答监督区间，再连同 `input_ids`、`labels`、样本编号和边界一起装箱。BFD 等策略可减少空位；截断或拆分会改变保留内容，应统计丢弃的回答 token，而不只报告吞吐。\n\n独立 SFT 样本的可见性必须同时满足同一样本与因果条件 $j\\le i$，并排除 padding。可以用块对角 causal mask，或给支持变长 attention 的后端显式段边界。EOS 和把 `position_ids` 归零都不会自动隔离通用 attention。\n\n普通全行 label shift 会让前一段末 logits 预测下一段首 token。独立样本目标应把后一段首 label 设为 `ignore_index`，或逐段 shift 并在段尾补 ignore；BOS/EOS 是否监督要按段定义，不能粗暴删除全部 EOS loss。Prompt labels 忽略而首 answer label 保留，末 prompt logits 才能预测首回答；合法 prompt 仍需作为上下文。\n\n连续语料 concatenate-then-split 可有意允许跨文档上下文，这与独立 SFT 目标不同。可对比未 packing 的逐段有效 NLL 与梯度，并扰动另一段检查当前段 logits 是否改变；比较时要控制内核、dropout 和浮点次序，再评估显存与吞吐收益。\n\n式中 $s_t$ 是样本编号，$v_j$ 标记有效 key，$m_t$ 选择监督目标，$\\mathcal H_t$ 是同一样本的有效历史。\nEOS、loss mask 或重置 `position_ids` 任一项就能阻断跨样本 attention。\n隔离 attention 后仍保留跨边界 shifted label，或在不同实现中重复 shift。\n如何处理长对话拆分时需要继承的历史 prompt？\n为何 packing 开启后吞吐提高却可能改变梯度加权？"}, {"id": "ALN-001", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L1", "title": "SFT、RLHF 与 DPO 分别解决什么问题？", "tags": ["SFT", "RLHF", "DPO", "RLHF流程"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>SFT 用优质示范教模型按指令完成任务，通常最小化目标回答的负对数似然；它主要提供行为和任务示范。典型 RLHF 在 SFT 后用偏好数据训练奖励模型，再通过强化学习优化策略，也可以迭代或混合不同阶段。\u003c/p>\u003cp>DPO 直接用同一问题的偏好回答对更新策略，省去独立奖励模型拟合和在线 RL 更新，但仍通过目标函数表达偏好对应的奖励关系。三者都依赖数据质量；选型应结合任务、数据和评测，不能凭单个失败案例判断算法优劣。\u003c/p>\u003cp>经典流程先用示范做SFT，再以同prompt回答的成对偏好训练RM，最后用PPO等采样并优化策略。Actor/Critic训练，Reference/RM在RL阶段通常冻结；新一轮rollout刷新old policy，Reference保持行为锚点。SFT解决示范拟合，偏好优化表达相对质量，两者互补，SFT也不是天然无法学习安全与诚实。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要说 SFT 只学知识、RL 只学推理；数据与任务同样重要。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一 bad case 何时补 SFT 示范，何时补偏好对？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "SFT 用优质示范教模型按指令完成任务，通常最小化目标回答的负对数似然；它主要提供行为和任务示范。典型 RLHF 在 SFT 后用偏好数据训练奖励模型，再通过强化学习优化策略，也可以迭代或混合不同阶段。\n\nDPO 直接用同一问题的偏好回答对更新策略，省去独立奖励模型拟合和在线 RL 更新，但仍通过目标函数表达偏好对应的奖励关系。三者都依赖数据质量；选型应结合任务、数据和评测，不能凭单个失败案例判断算法优劣。\n\n经典流程先用示范做SFT，再以同prompt回答的成对偏好训练RM，最后用PPO等采样并优化策略。Actor/Critic训练，Reference/RM在RL阶段通常冻结；新一轮rollout刷新old policy，Reference保持行为锚点。SFT解决示范拟合，偏好优化表达相对质量，两者互补，SFT也不是天然无法学习安全与诚实。\n不要说 SFT 只学知识、RL 只学推理；数据与任务同样重要。\n同一 bad case 何时补 SFT 示范，何时补偏好对？"}, {"id": "ALN-002", "category": "ALN", "topic": "奖励与对齐策略", "level": "L2", "title": "奖励模型如何用成对偏好训练？", "tags": ["Reward Model", "Bradley-Terry", "Pairwise vs absolute"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>奖励模型对完整回答输出一个标量。对同一问题 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math> 的优选回答 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 和非优选回答 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，用分数差的 sigmoid 拟合偏好概率，再最小化二元负对数似然。这里采用 Bradley–Terry 建模假设，不能把它当作所有真实偏好都必然遵循的规律。\u003c/p>\u003cp>成对比较只能约束相对分数：对同一问题的全部回答加上相同常数，偏好概率不变，因此绝对奖励零点无法由这些比较唯一确定，实际使用还需校准。数据与评测应按领域、回答长度和标注者分层，防止模型主要学到“越长越好”或套话风格。\u003c/p>\u003cp>成对比较常比绝对打分更易校准，但仍有平局、不传递、领域差异与标注噪声；它不直接说明质量差距大小。完整排序并非必须做全部O(K²)比较，可用排序/主动选择减少次数。RM常在语言骨干上加标量head，架构和参数规模不必与Actor完全一致；对奖励排序准确率之外，还应测当前策略生成分布上的泛化。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>&#x02112;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x1D53C;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>RM 高准确率不代表策略优化后分布外仍可靠。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何处理平局与偏好不传递？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "奖励模型对完整回答输出一个标量。对同一问题 $x$ 的优选回答 $y_w$ 和非优选回答 $y_l$，用分数差的 sigmoid 拟合偏好概率，再最小化二元负对数似然。这里采用 Bradley–Terry 建模假设，不能把它当作所有真实偏好都必然遵循的规律。\n\n成对比较只能约束相对分数：对同一问题的全部回答加上相同常数，偏好概率不变，因此绝对奖励零点无法由这些比较唯一确定，实际使用还需校准。数据与评测应按领域、回答长度和标注者分层，防止模型主要学到“越长越好”或套话风格。\n\n成对比较常比绝对打分更易校准，但仍有平局、不传递、领域差异与标注噪声；它不直接说明质量差距大小。完整排序并非必须做全部O(K²)比较，可用排序/主动选择减少次数。RM常在语言骨干上加标量head，架构和参数规模不必与Actor完全一致；对奖励排序准确率之外，还应测当前策略生成分布上的泛化。\nRM 高准确率不代表策略优化后分布外仍可靠。\n如何处理平局与偏好不传递？"}, {"id": "ALN-003", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "PPO 的概率比、clip 和 min 分别起什么作用？", "tags": ["PPO", "importance ratio"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>PPO 使用新旧策略的概率比 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>&#x003C1;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，对本轮旧策略采集的样本进行更新；优势为正时鼓励提高动作概率，为负时鼓励降低概率。\u003c/p>\u003cp>clip 与 min 共同截断有利方向上过度更新带来的目标收益：\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 时限制过度增大概率的收益，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003C;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 时限制过度减小概率的收益。它削弱大幅更新的动机，并非裁剪模型参数，也不保证所有概率比都留在区间内。多轮 minibatch 更新应同时监测 KL、clip fraction、熵和 value loss。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x1D53C;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmo>min\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C1;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C1;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>clip 不是严格信赖域约束，异常 KL 可触发早停。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>去掉外面的 min 后，负 advantage 会有什么错误？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "PPO 使用新旧策略的概率比 $\\rho_t=\\pi_\\theta(a_t\\mid s_t)/\\pi_{\\mathrm{old}}(a_t\\mid s_t)$，对本轮旧策略采集的样本进行更新；优势为正时鼓励提高动作概率，为负时鼓励降低概率。\n\nclip 与 min 共同截断有利方向上过度更新带来的目标收益：$A_t>0$ 时限制过度增大概率的收益，$A_t\u003c0$ 时限制过度减小概率的收益。它削弱大幅更新的动机，并非裁剪模型参数，也不保证所有概率比都留在区间内。多轮 minibatch 更新应同时监测 KL、clip fraction、熵和 value loss。\nclip 不是严格信赖域约束，异常 KL 可触发早停。\n去掉外面的 min 后，负 advantage 会有什么错误？"}, {"id": "ALN-004", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "GAE 如何计算，λ 与 γ 如何影响优势估计？", "tags": ["GAE", "Critic"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GAE 把多个 TD 残差按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>&#x003BB;\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>l\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math> 衰减求和，可在序列末尾向前递推计算。每步残差为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>&#x003B4;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B3;\u003c/mi>\u003c/mrow>\u003c/math> 决定折扣目标，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003BB;\u003c/mi>\u003c/mrow>\u003c/math> 决定优势估计对多步信息与 bootstrap 的依赖，两者作用不同。\u003c/p>\u003cp>较小的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003BB;\u003c/mi>\u003c/mrow>\u003c/math> 更依赖局部价值估计，价值模型不准时可能引入偏差；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003BB;\u003c/mi>\u003c/mrow>\u003c/math> 接近 1 时更接近回报减基线，通常也有更高方差。终止、超时、截断和 padding 对应的 bootstrap 与 mask 必须和任务定义一致，否则即使递推公式正确，优势也可能算错。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>l\u003c/mi>\u003cmo>&#x02265;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/munder>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>&#x003BB;\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>l\u003c/mi>\u003c/msup>\u003cmsub>\u003cmi>&#x003B4;\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003B4;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>标准 outcome GRPO 用组内相对奖励，通常没有 GAE/value critic。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>生成被 \u003ccode>max_tokens\u003c/code> 截断时怎样处理末状态价值？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GAE 把多个 TD 残差按 $(\\gamma\\lambda)^l$ 衰减求和，可在序列末尾向前递推计算。每步残差为 $\\delta_t=r_t+\\gamma V(s_{t+1})-V(s_t)$，其中 $\\gamma$ 决定折扣目标，$\\lambda$ 决定优势估计对多步信息与 bootstrap 的依赖，两者作用不同。\n\n较小的 $\\lambda$ 更依赖局部价值估计，价值模型不准时可能引入偏差；$\\lambda$ 接近 1 时更接近回报减基线，通常也有更高方差。终止、超时、截断和 padding 对应的 bootstrap 与 mask 必须和任务定义一致，否则即使递推公式正确，优势也可能算错。\n标准 outcome GRPO 用组内相对奖励，通常没有 GAE/value critic。\n生成被 `max_tokens` 截断时怎样处理末状态价值？"}, {"id": "ALN-005", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "RLHF 的 KL 惩罚与 PPO 新旧策略约束有什么区别？", "tags": ["KL", "reference model"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RLHF 的参考策略 KL 惩罚用于约束模型相对行为锚点的漂移，目标可写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x1D53C;\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmi>&#x02016;\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；参考策略通常是冻结的 SFT 模型。PPO 的 clip 或新旧策略 KL 则约束相对本轮采样策略的局部更新，旧策略随 rollout 轮次刷新。\u003c/p>\u003cp>两种约束的参照对象和作用范围不同，不能互相替代。实现中可用采样 token 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 估计参考 KL，但单个采样项未必非负，不能把逐 token 出现负值直接视为实现错误。\u003c/p>\u003cp>β过大可能让策略难以利用任务奖励，过小可能放大奖励过优化与行为漂移。联合监控参考KL、独立胜率/正确率、熵与输出长度，必要时按目标KL自适应调节；不是只让训练RM分数最高。PPO的参考KL系数、clip范围和DPO β作用路径不同，数值不能直接互相移植。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>KL 惩罚不能保证事实正确或彻底阻止 reward hacking。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为何增大 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math> 可能伤害偏好奖励提升？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RLHF 的参考策略 KL 惩罚用于约束模型相对行为锚点的漂移，目标可写为 $\\mathbb{E}[r]-\\beta D_{\\mathrm{KL}}(\\pi_\\theta\\Vert\\pi_{\\mathrm{ref}})$；参考策略通常是冻结的 SFT 模型。PPO 的 clip 或新旧策略 KL 则约束相对本轮采样策略的局部更新，旧策略随 rollout 轮次刷新。\n\n两种约束的参照对象和作用范围不同，不能互相替代。实现中可用采样 token 的 $\\log\\pi_\\theta-\\log\\pi_{\\mathrm{ref}}$ 估计参考 KL，但单个采样项未必非负，不能把逐 token 出现负值直接视为实现错误。\n\nβ过大可能让策略难以利用任务奖励，过小可能放大奖励过优化与行为漂移。联合监控参考KL、独立胜率/正确率、熵与输出长度，必要时按目标KL自适应调节；不是只让训练RM分数最高。PPO的参考KL系数、clip范围和DPO β作用路径不同，数值不能直接互相移植。\nKL 惩罚不能保证事实正确或彻底阻止 reward hacking。\n为何增大 $\\beta$ 可能伤害偏好奖励提升？"}, {"id": "ALN-006", "category": "ALN", "topic": "DPO 与偏好数据", "level": "L3", "title": "DPO 的损失如何从 KL 正则化 RLHF 目标推出？", "tags": ["DPO", "推导"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>从奖励最大化并惩罚参考策略 KL 的目标出发，最优策略满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>&#x003C0;\u003c/mi>\u003cmo>&#x0002A;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0221D;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。将奖励改写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmi>log\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsup>\u003cmi>&#x003C0;\u003c/mi>\u003cmo>&#x0002A;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmi>log\u003c/mi>\u003cmi>Z\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，再代入 Bradley–Terry 偏好概率；同一问题的奖励差中，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 项抵消，得到 DPO 损失。\u003c/p>\u003cp>该推导要求 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>，参考策略的支持覆盖候选回答，并采用相应的偏好建模假设。训练时用参数化策略替代最优策略，有限数据、模型容量和优化误差仍然存在，因此推导不能保证实际模型一定达到原目标的最优解。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>&#x02112;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x1D53C;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>w\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>l\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>目标推导对应不等于 DPO 和任意 PPO 实训过程完全等价。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>当偏好出现循环时，BT 标量奖励假设有什么局限？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "从奖励最大化并惩罚参考策略 KL 的目标出发，最优策略满足 $\\pi^*(y\\mid x)\\propto\\pi_{\\mathrm{ref}}(y\\mid x)\\exp(r(x,y)/\\beta)$。将奖励改写为 $r(x,y)=\\beta\\log[\\pi^*(y\\mid x)/\\pi_{\\mathrm{ref}}(y\\mid x)]+\\beta\\log Z(x)$，再代入 Bradley–Terry 偏好概率；同一问题的奖励差中，$Z(x)$ 项抵消，得到 DPO 损失。\n\n该推导要求 $\\beta>0$，参考策略的支持覆盖候选回答，并采用相应的偏好建模假设。训练时用参数化策略替代最优策略，有限数据、模型容量和优化误差仍然存在，因此推导不能保证实际模型一定达到原目标的最优解。\n目标推导对应不等于 DPO 和任意 PPO 实训过程完全等价。\n当偏好出现循环时，BT 标量奖励假设有什么局限？"}, {"id": "ALN-007", "category": "ALN", "topic": "DPO 与偏好数据", "level": "L2", "title": "DPO 的 β 和参考模型如何理解与调参？", "tags": ["DPO", "beta"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>参考模型提供偏好优化的行为锚点，通常选用适合任务的 SFT 模型。理论 KL 正则目标中，较大的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math> 意味着更强的参考策略约束，最优策略对奖励变化的响应较弱；在实际 DPO 损失中，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math> 同时改变偏好 logit 与梯度尺度，其效果还受学习率、数据和训练时长影响，不能简单断言最终 KL 会单调变化。\u003c/p>\u003cp>调参应比较多组 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math>，联合观察 chosen/rejected 的隐式奖励差、KL、胜率和通用能力。如果参考模型与偏好数据的生成模型不一致，先检查模板、长度及候选支持是否匹配，再判断超参数的影响。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把 β 大简单解释成每步梯度必然更小。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同样 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math>，换参考模型为什么结果会变？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "参考模型提供偏好优化的行为锚点，通常选用适合任务的 SFT 模型。理论 KL 正则目标中，较大的 $\\beta$ 意味着更强的参考策略约束，最优策略对奖励变化的响应较弱；在实际 DPO 损失中，$\\beta$ 同时改变偏好 logit 与梯度尺度，其效果还受学习率、数据和训练时长影响，不能简单断言最终 KL 会单调变化。\n\n调参应比较多组 $\\beta$，联合观察 chosen/rejected 的隐式奖励差、KL、胜率和通用能力。如果参考模型与偏好数据的生成模型不一致，先检查模板、长度及候选支持是否匹配，再判断超参数的影响。\n不要把 β 大简单解释成每步梯度必然更小。\n同样 $\\beta$，换参考模型为什么结果会变？"}, {"id": "ALN-008", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "PPO 与 DPO 在工程上如何选型？", "tags": ["PPO", "DPO", "选型"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>有可靠离线偏好对时，DPO 适合作为成本较低、易复现的基线；需要在线探索并能提供明确奖励时，PPO 更有发挥空间，但引入 rollout、价值模型、参考模型及更多调参成本。没有普遍更优的选择，应在一致的数据、预算、奖励和评测条件下比较。\u003c/p>\u003cp>具体需评估奖励模型质量、rollout 成本以及模型与激活的显存占用。DPO 的瓶颈可能是离线候选覆盖不足，PPO 则可能遭遇奖励投机和分布偏移。通常先建立 SFT/DPO 基线，再验证在线学习带来的收益是否值得增加系统复杂度。\u003c/p>\u003cp>若直接用REINFORCE回报，估计方差可能较大；PPO结合Critic/GAE和有限更新约束提高可控性，但也增加价值模型成本。PPO与DPO应在同一初始模型、数据/奖励质量、推理预算和业务评测上比较，并计入在线采样及打分成本，不能拿一个更强SFT起点的DPO与弱起点PPO证明算法优劣。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“PPO 一定更强”或“DPO 一定更稳定”都缺少条件。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>奖励可执行验证且偏好很少时，你会优先试哪条路线？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "有可靠离线偏好对时，DPO 适合作为成本较低、易复现的基线；需要在线探索并能提供明确奖励时，PPO 更有发挥空间，但引入 rollout、价值模型、参考模型及更多调参成本。没有普遍更优的选择，应在一致的数据、预算、奖励和评测条件下比较。\n\n具体需评估奖励模型质量、rollout 成本以及模型与激活的显存占用。DPO 的瓶颈可能是离线候选覆盖不足，PPO 则可能遭遇奖励投机和分布偏移。通常先建立 SFT/DPO 基线，再验证在线学习带来的收益是否值得增加系统复杂度。\n\n若直接用REINFORCE回报，估计方差可能较大；PPO结合Critic/GAE和有限更新约束提高可控性，但也增加价值模型成本。PPO与DPO应在同一初始模型、数据/奖励质量、推理预算和业务评测上比较，并计入在线采样及打分成本，不能拿一个更强SFT起点的DPO与弱起点PPO证明算法优劣。\n“PPO 一定更强”或“DPO 一定更稳定”都缺少条件。\n奖励可执行验证且偏好很少时，你会优先试哪条路线？"}, {"id": "ALN-009", "category": "ALN", "topic": "DPO 与偏好数据", "level": "L2", "title": "如何把点赞、点踩和日志变成高质量偏好数据？", "tags": ["偏好数据", "反馈偏差"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>点赞、点踩和交互日志不能自动形成可靠偏好对。应先统一任务上下文与评价规则，再生成或匹配可比较候选；标注中排除展示位置、回答长度和曝光差异的影响，核验优选回答的正确性，并保留不确定、平局或不可比较样本。\u003c/p>\u003cp>点踩可能来自事实错误、延迟或立场差异，这些信号应分开处理。涉及工具、证据或用户需求时，候选必须拥有可比较条件，不能把缺少证据直接当作负例。训练和测试还应按用户、模板、文档或时间划分，并处理近重复，防止日志泄漏抬高结果。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把不同用户不同问题的点赞答案与点踩答案直接配对。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>AI 评分生成偏好时怎样估计标注噪声？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "点赞、点踩和交互日志不能自动形成可靠偏好对。应先统一任务上下文与评价规则，再生成或匹配可比较候选；标注中排除展示位置、回答长度和曝光差异的影响，核验优选回答的正确性，并保留不确定、平局或不可比较样本。\n\n点踩可能来自事实错误、延迟或立场差异，这些信号应分开处理。涉及工具、证据或用户需求时，候选必须拥有可比较条件，不能把缺少证据直接当作负例。训练和测试还应按用户、模板、文档或时间划分，并处理近重复，防止日志泄漏抬高结果。\n不能把不同用户不同问题的点赞答案与点踩答案直接配对。\nAI 评分生成偏好时怎样估计标注噪声？"}, {"id": "ALN-010", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L2", "title": "GRPO 为什么不需要独立价值模型？", "tags": ["GRPO", "PPO"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GRPO 对同一问题采样一组回答，以组内平均奖励作为基线并标准化相对优势，从而替代 PPO 中独立价值模型的优势估计，节省 critic 参数和训练成本。它仍需要生成 rollout、计算奖励，具体实现还可能保留参考模型。\u003c/p>\u003cp>采用结果奖励时，一条回答的最终优势通常分配给该回答的各个 token，再用新旧策略的 token 概率比构造裁剪目标。整体显存并非只由 critic 决定，还取决于组大小、回答长度、优化器状态、激活和生成 KV cache。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>去掉 critic 不等于没有 baseline，也不等于没有奖励模型。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何分离 rollout 显存和训练显存预算？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GRPO 对同一问题采样一组回答，以组内平均奖励作为基线并标准化相对优势，从而替代 PPO 中独立价值模型的优势估计，节省 critic 参数和训练成本。它仍需要生成 rollout、计算奖励，具体实现还可能保留参考模型。\n\n采用结果奖励时，一条回答的最终优势通常分配给该回答的各个 token，再用新旧策略的 token 概率比构造裁剪目标。整体显存并非只由 critic 决定，还取决于组大小、回答长度、优化器状态、激活和生成 KV cache。\n去掉 critic 不等于没有 baseline，也不等于没有奖励模型。\n如何分离 rollout 显存和训练显存预算？"}, {"id": "ALN-011", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "GRPO 组内标准差归一化带来哪些问题？", "tags": ["GRPO", "归一化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 GRPO 的组内优势通常写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmover>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"true\">&#x000AF;\u003c/mo>\u003c/mover>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>std\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；标准差的具体定义需与实现一致。减均值提供相对基线，除以标准差则进一步按每个问题的奖励方差重加权：较小但非零的方差可能放大少数回答的信号。\u003c/p>\u003cp>二元奖励下，全对或全错的组没有相对学习信号；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/math> 只能改善数值稳定性，不能创造奖励差异。组大小影响方差估计及出现混合结果的概率。比较取消标准差归一化、跨 batch 归一化或难度采样时，应控制总采样量，避免把数据分布变化误认为目标函数改进。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要声称组内标准化天然无偏或对所有任务更优。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>奖励为连续多维分数时，量纲怎样影响组优势？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 GRPO 的组内优势通常写为 $\\hat A_i=(r_i-\\bar r)/(\\operatorname{std}(r)+\\epsilon)$；标准差的具体定义需与实现一致。减均值提供相对基线，除以标准差则进一步按每个问题的奖励方差重加权：较小但非零的方差可能放大少数回答的信号。\n\n二元奖励下，全对或全错的组没有相对学习信号；$\\epsilon$ 只能改善数值稳定性，不能创造奖励差异。组大小影响方差估计及出现混合结果的概率。比较取消标准差归一化、跨 batch 归一化或难度采样时，应控制总采样量，避免把数据分布变化误认为目标函数改进。\n不要声称组内标准化天然无偏或对所有任务更优。\n奖励为连续多维分数时，量纲怎样影响组优势？"}, {"id": "ALN-012", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "GRPO 的长度偏差与 Dr. GRPO 有什么关系？", "tags": ["GRPO", "长度偏差"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GRPO 的长度偏差与损失归约方式有关。若每条回答先按自身 token 数取均值，短回答的单 token 权重更大；负优势下，较长错误回答的单 token 惩罚相对更小。因此不能把问题概括为“总是偏爱短回答”，它也可能相对偏好较长的错误回答。\u003c/p>\u003cp>Dr. GRPO 讨论移除回答长度和组内标准差归一化，并采用常数尺度。实现中必须区分回答均值、batch token 均值与常数分母，它们给样本的权重不同。评估还需同时固定 mask、EOS、截断与采样长度设置，联合观察长度和正确率。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>某项修正有益不等于对所有训练目标无偏；需说明比较的目标函数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>全 batch token mean 会怎样改变样本之间的相对权重？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GRPO 的长度偏差与损失归约方式有关。若每条回答先按自身 token 数取均值，短回答的单 token 权重更大；负优势下，较长错误回答的单 token 惩罚相对更小。因此不能把问题概括为“总是偏爱短回答”，它也可能相对偏好较长的错误回答。\n\nDr. GRPO 讨论移除回答长度和组内标准差归一化，并采用常数尺度。实现中必须区分回答均值、batch token 均值与常数分母，它们给样本的权重不同。评估还需同时固定 mask、EOS、截断与采样长度设置，联合观察长度和正确率。\n某项修正有益不等于对所有训练目标无偏；需说明比较的目标函数。\n全 batch token mean 会怎样改变样本之间的相对权重？"}, {"id": "ALN-013", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L2", "title": "RLVR 的可验证奖励如何设计？", "tags": ["RLVR", "verifier"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RLVR 用可执行规则提供奖励，例如数学答案校验或代码单元测试，以减少主观偏好标注。奖励设计仍要明确正确性与执行环境的边界，并将格式奖励和内容奖励分开；可验证结果并不等于所有推理过程都可靠。\u003c/p>\u003cp>数学任务需处理等价表达与解析失败，代码任务需隔离执行环境、超时及隐藏测试。格式权重过高可能使模型只优化格式，弱测试器也可能被利用。应通过对抗样本、人工复核和独立测试集检查验证器漏洞，防止把测试器投机当作能力提升。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>一个正则或少量公开测试不是完备的 correctness oracle。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>工具调用成功但业务目标未完成，应怎样给奖励？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RLVR 用可执行规则提供奖励，例如数学答案校验或代码单元测试，以减少主观偏好标注。奖励设计仍要明确正确性与执行环境的边界，并将格式奖励和内容奖励分开；可验证结果并不等于所有推理过程都可靠。\n\n数学任务需处理等价表达与解析失败，代码任务需隔离执行环境、超时及隐藏测试。格式权重过高可能使模型只优化格式，弱测试器也可能被利用。应通过对抗样本、人工复核和独立测试集检查验证器漏洞，防止把测试器投机当作能力提升。\n一个正则或少量公开测试不是完备的 correctness oracle。\n工具调用成功但业务目标未完成，应怎样给奖励？"}, {"id": "ALN-014", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L2", "title": "ORM 与 PRM 的区别和信用分配难点是什么？", "tags": ["ORM", "PRM", "信用分配"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>ORM 对最终结果评分，PRM 对中间步骤评分，后者有机会更早发现错误，但需要一致的步骤标注与额外成本。信用分配的难点是确定哪些步骤真正贡献了结果；把同一结果奖励广播到所有 token，并不意味着每个 token 的因果贡献相同。\u003c/p>\u003cp>PRM 的步骤边界、可验证性及分数聚合方式会影响结果，模型也可能利用评分粒度。用于训练的过程奖励与用于推理候选排序的过程奖励需要分别验证。数学任务中的实验收益不能直接外推到全部开放领域任务。\u003c/p>\u003cp>结果奖励可以只在序列结束给出，经return/GAE产生逐token优势；这不等于逐token直接获得真实过程奖励。步骤PRM、token-level奖励、sequence-level评分与loss聚合是不同粒度，增加过程监督能提供更细信号，但价值估计与评分器都可能出错，不能声称彻底解决因果信用分配。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>步骤看似合理不代表整个推理或最终结果正确。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>Agent 的检索、工具、答复步骤如何构造过程评分？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "ORM 对最终结果评分，PRM 对中间步骤评分，后者有机会更早发现错误，但需要一致的步骤标注与额外成本。信用分配的难点是确定哪些步骤真正贡献了结果；把同一结果奖励广播到所有 token，并不意味着每个 token 的因果贡献相同。\n\nPRM 的步骤边界、可验证性及分数聚合方式会影响结果，模型也可能利用评分粒度。用于训练的过程奖励与用于推理候选排序的过程奖励需要分别验证。数学任务中的实验收益不能直接外推到全部开放领域任务。\n\n结果奖励可以只在序列结束给出，经return/GAE产生逐token优势；这不等于逐token直接获得真实过程奖励。步骤PRM、token-level奖励、sequence-level评分与loss聚合是不同粒度，增加过程监督能提供更细信号，但价值估计与评分器都可能出错，不能声称彻底解决因果信用分配。\n步骤看似合理不代表整个推理或最终结果正确。\nAgent 的检索、工具、答复步骤如何构造过程评分？"}, {"id": "ALN-015", "category": "ALN", "topic": "奖励与对齐策略", "level": "L2", "title": "如何识别和缓解 reward hacking？", "tags": ["奖励投机", "Goodhart"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Reward hacking 指模型过度优化奖励代理，却降低了真实任务质量。识别时应联合观察独立指标、回答长度、套话和异常工具行为，并对高分样本做人类或对抗复核；只看奖励上涨无法判断能力是否改善。\u003c/p>\u003cp>常见表现包括重复关键词、迎合裁判、空泛安全回答或绕过弱验证器。参考 KL、提前停止和多样反馈可降低风险，但不能证明问题已经消除。工程上应保留 rollout 与分项奖励，聚类分析高分失败案例，再改进评分器和验证流程。\u003c/p>\u003cp>回答模式化、奉承或内容空洞时，构造事实正确但朴素、华丽却无信息等控制样本，检查RM是否主要奖励风格或长度。比较训练RM与独立人工/judge，排查偏好数据窄、优化过量及KL不足；在新偏好数据中加入反例并保留通用能力回归。模式崩溃、谄媚与对齐税相关但不是同义词。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>GRPO 的相对优势或换成 LLM judge 本身不是 reward hacking 的解药。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果训练奖励上升、独立胜率下降，你先停哪一环？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Reward hacking 指模型过度优化奖励代理，却降低了真实任务质量。识别时应联合观察独立指标、回答长度、套话和异常工具行为，并对高分样本做人类或对抗复核；只看奖励上涨无法判断能力是否改善。\n\n常见表现包括重复关键词、迎合裁判、空泛安全回答或绕过弱验证器。参考 KL、提前停止和多样反馈可降低风险，但不能证明问题已经消除。工程上应保留 rollout 与分项奖励，聚类分析高分失败案例，再改进评分器和验证流程。\n\n回答模式化、奉承或内容空洞时，构造事实正确但朴素、华丽却无信息等控制样本，检查RM是否主要奖励风格或长度。比较训练RM与独立人工/judge，排查偏好数据窄、优化过量及KL不足；在新偏好数据中加入反例并保留通用能力回归。模式崩溃、谄媚与对齐税相关但不是同义词。\nGRPO 的相对优势或换成 LLM judge 本身不是 reward hacking 的解药。\n如果训练奖励上升、独立胜率下降，你先停哪一环？"}, {"id": "ALN-016", "category": "ALN", "topic": "奖励与对齐策略", "level": "L2", "title": "后训练为什么会出现对齐税或遗忘？", "tags": ["alignment tax", "遗忘"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>后训练改变目标与数据分布，可能使部分原有能力下降，表现为对齐税或遗忘。评估应在相同设置下比较基础模型、SFT 和偏好优化模型，并分别报告数学、代码、多语言和安全表现，不能只用一个总分判断。\u003c/p>\u003cp>格式、拒答行为或解码变化也可能造成表面退化，应先排除这些评测因素。混合数据、正则化和预训练数据回放可调节能力保留与新目标之间的权衡；InstructGPT 的 PPO-ptx 展示过混合预训练目标的部分收益，但不保证对所有能力都有效。\u003c/p>\u003cp>Agent场景的对齐税可表现为通用任务成功率下降、过度拒绝合法工具、规划变保守或流程成本增加；应分别评价业务效用与安全约束，保持相同工具权限和预算，分析是否来自能力遗忘、奖励偏差或执行策略。安全验收改善而某类能力下降是具体权衡，不能把所有上线质量下降都统称对齐税。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>LoRA 或小学习率可降低变化幅度，但不能保证没有遗忘。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何区分知识丢失和评测 parser 失配？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "后训练改变目标与数据分布，可能使部分原有能力下降，表现为对齐税或遗忘。评估应在相同设置下比较基础模型、SFT 和偏好优化模型，并分别报告数学、代码、多语言和安全表现，不能只用一个总分判断。\n\n格式、拒答行为或解码变化也可能造成表面退化，应先排除这些评测因素。混合数据、正则化和预训练数据回放可调节能力保留与新目标之间的权衡；InstructGPT 的 PPO-ptx 展示过混合预训练目标的部分收益，但不保证对所有能力都有效。\n\nAgent场景的对齐税可表现为通用任务成功率下降、过度拒绝合法工具、规划变保守或流程成本增加；应分别评价业务效用与安全约束，保持相同工具权限和预算，分析是否来自能力遗忘、奖励偏差或执行策略。安全验收改善而某类能力下降是具体权衡，不能把所有上线质量下降都统称对齐税。\nLoRA 或小学习率可降低变化幅度，但不能保证没有遗忘。\n如何区分知识丢失和评测 parser 失配？"}, {"id": "ALN-017", "category": "ALN", "topic": "奖励与对齐策略", "level": "L2", "title": "RLAIF 和 Constitutional AI 如何工作？", "tags": ["RLAIF", "Constitutional AI"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RLAIF 用 AI 提供偏好或反馈，减少人工逐样本标注成本。Constitutional AI 由人定义原则，引导模型自我批评与修订，再利用 AI 偏好构造奖励模型和策略训练；其中自我修订可用于 SFT，AI 成对标签可用于偏好强化学习。\u003c/p>\u003cp>这仍需要人类制定原则和审计结果，并非无需人工，也不自动消除偏差。原则、提示词、裁判与训练数据应可追踪并版本化；用专家和独立留出样本检查少数群体、事实质量及过度拒答，避免反馈模型的偏差被反复放大。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>模型反馈可能传播同类错误，数据量增加不能替代质量核验。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一个模型生成和打分会产生哪些相关误差？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RLAIF 用 AI 提供偏好或反馈，减少人工逐样本标注成本。Constitutional AI 由人定义原则，引导模型自我批评与修订，再利用 AI 偏好构造奖励模型和策略训练；其中自我修订可用于 SFT，AI 成对标签可用于偏好强化学习。\n\n这仍需要人类制定原则和审计结果，并非无需人工，也不自动消除偏差。原则、提示词、裁判与训练数据应可追踪并版本化；用专家和独立留出样本检查少数群体、事实质量及过度拒答，避免反馈模型的偏差被反复放大。\n模型反馈可能传播同类错误，数据量增加不能替代质量核验。\n同一个模型生成和打分会产生哪些相关误差？"}, {"id": "ALN-018", "category": "ALN", "topic": "DPO 与偏好数据", "level": "L3", "title": "IPO 等 DPO 变种主要试图解决什么问题？", "tags": ["IPO", "偏好建模"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DPO 变种主要调整偏好概率映射、正则化或数据使用方式。IPO 从更一般的成对偏好目标出发，讨论将偏好映射为标量奖励等假设；人类偏好可能非传递，未必能由单一标量奖励精确表达，因此应先说明建模假设和待解决的过拟合问题，再解释损失。\u003c/p>\u003cp>算法名称不能证明效果更好。比较时应控制偏好噪声、候选覆盖、参考模型和训练预算，在相同评测中联合观察胜率、KL、回答长度与正确率，并核对改动是否适用于当前数据条件。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把所有 DPO 变种说成只是“加一项 SFT loss”。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若所有标注都绝对偏好同一答案，怎样监测过拟合？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DPO 变种主要调整偏好概率映射、正则化或数据使用方式。IPO 从更一般的成对偏好目标出发，讨论将偏好映射为标量奖励等假设；人类偏好可能非传递，未必能由单一标量奖励精确表达，因此应先说明建模假设和待解决的过拟合问题，再解释损失。\n\n算法名称不能证明效果更好。比较时应控制偏好噪声、候选覆盖、参考模型和训练预算，在相同评测中联合观察胜率、KL、回答长度与正确率，并核对改动是否适用于当前数据条件。\n不要把所有 DPO 变种说成只是“加一项 SFT loss”。\n若所有标注都绝对偏好同一答案，怎样监测过拟合？"}, {"id": "ALN-019", "category": "ALN", "topic": "DPO 与偏好数据", "level": "L2", "title": "离线偏好优化和在线 RL 的分布差异是什么？", "tags": ["offline", "online", "distribution shift"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>离线偏好优化使用固定候选，便于复现，但数据可能缺少当前策略的困难负例，尤其当生成模型与学习模型差距较大时，长尾问题或罕见回答的覆盖会不足。在线 RL 随策略更新采样，能够探索新行为，也更容易进入奖励模型未见过的分布。\u003c/p>\u003cp>选择时需综合反馈任务、奖励可靠性与 rollout 预算。迭代更新偏好数据应保留独立留出集与数据版本；在线训练还要关注采样策略与多轮更新策略之间的滞后，监测概率比，防止样本过旧影响优化。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>在线 DPO 等变体存在，不能把 DPO 永久等同于固定离线流程。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样发现离线数据覆盖不足，而非优化器没收敛？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "离线偏好优化使用固定候选，便于复现，但数据可能缺少当前策略的困难负例，尤其当生成模型与学习模型差距较大时，长尾问题或罕见回答的覆盖会不足。在线 RL 随策略更新采样，能够探索新行为，也更容易进入奖励模型未见过的分布。\n\n选择时需综合反馈任务、奖励可靠性与 rollout 预算。迭代更新偏好数据应保留独立留出集与数据版本；在线训练还要关注采样策略与多轮更新策略之间的滞后，监测概率比，防止样本过旧影响优化。\n在线 DPO 等变体存在，不能把 DPO 永久等同于固定离线流程。\n怎样发现离线数据覆盖不足，而非优化器没收敛？"}, {"id": "ALN-020", "category": "ALN", "topic": "奖励与对齐策略", "level": "L3", "title": "多目标奖励发生冲突时如何处理？", "tags": ["多目标", "安全对齐"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>正确性、简洁性、有用性和安全性可能冲突，应先区分必须满足的约束与可以交换的质量目标，再采用约束优化、门控或加权奖励，并公开各维度的取舍。一般质量可以分析 Pareto 权衡，严重违规则可作为硬约束处理。\u003c/p>\u003cp>加权前需校准奖励的单位、方差和样本分布，避免数值较大的分项无意占主导。保留分项奖励及失败案例，单独检查过度拒答、正确但冗长等冲突情形；一个综合分数无法完整说明多目标表现。\u003c/p>\u003cp>PPO奖励设计会直接改变策略偏好：准确、证据支持、合规、长度与格式代理应分别验证。调权重前用简单正确/错误/套话/超长样本检查每个奖励分量的方向与尺度，再监控分层实际目标。奖励项更多不必然更可靠，冲突目标可能需约束优化或明确优先级。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>奖励简单相加不保证满足硬约束，也不保证各项单调改善。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何确定安全阈值并防止模型输出空答案拿高分？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "正确性、简洁性、有用性和安全性可能冲突，应先区分必须满足的约束与可以交换的质量目标，再采用约束优化、门控或加权奖励，并公开各维度的取舍。一般质量可以分析 Pareto 权衡，严重违规则可作为硬约束处理。\n\n加权前需校准奖励的单位、方差和样本分布，避免数值较大的分项无意占主导。保留分项奖励及失败案例，单独检查过度拒答、正确但冗长等冲突情形；一个综合分数无法完整说明多目标表现。\n\nPPO奖励设计会直接改变策略偏好：准确、证据支持、合规、长度与格式代理应分别验证。调权重前用简单正确/错误/套话/超长样本检查每个奖励分量的方向与尺度，再监控分层实际目标。奖励项更多不必然更可靠，冲突目标可能需约束优化或明确优先级。\n奖励简单相加不保证满足硬约束，也不保证各项单调改善。\n如何确定安全阈值并防止模型输出空答案拿高分？"}, {"id": "ALN-021", "category": "ALN", "topic": "强化学习基础", "level": "L1", "title": "强化学习怎样建模为 MDP？V、Q、Bellman 与 LLM 生成怎样对应？", "tags": ["MDP", "Bellman", "V/Q", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>强化学习优化交互轨迹的期望累计奖励。MDP 用状态、动作、转移、奖励和折扣描述序贯决策；马尔可夫性质要求当前状态包含预测下一步所需的信息。仅有状态转移的是马尔可夫过程，增加奖励得到奖励过程，再增加动作与策略得到决策过程；在 MDP 上固定策略，可诱导一个奖励过程。\u003c/p>\u003cp>LLM 的状态可取 prompt 加已生成前缀，动作是下一个 token，终止由 EOS 或任务规则决定。V 是按策略继续行动的期望回报，Q 是先选某动作再继续的回报；Bellman 方程把当前价值分成即时奖励与后续价值。求最优 Q 后可选择使 Q 最大的动作，但最优策略可能不唯一，不能说 V 与策略存在一一对应。\u003c/p>\u003cp>若观察不完整，使用历史、记忆或 belief state 建模部分可观测性。深度学习是函数表示/优化手段，RL 是学习范式，两者不是对立关系；RL 也可能依赖答案标签、人工反馈或模拟器。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>G\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/munderover>\u003cmsup>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msup>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsup>\u003cmi>V\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi>&#x0007E;\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"0.167em\" />\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmi>&#x0007E;\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把“RL不需要标签”“所有状态必须能重复到达”当作定义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>LLM Agent 的外部网页状态不可见时，怎样构造状态？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "强化学习优化交互轨迹的期望累计奖励。MDP 用状态、动作、转移、奖励和折扣描述序贯决策；马尔可夫性质要求当前状态包含预测下一步所需的信息。仅有状态转移的是马尔可夫过程，增加奖励得到奖励过程，再增加动作与策略得到决策过程；在 MDP 上固定策略，可诱导一个奖励过程。\n\nLLM 的状态可取 prompt 加已生成前缀，动作是下一个 token，终止由 EOS 或任务规则决定。V 是按策略继续行动的期望回报，Q 是先选某动作再继续的回报；Bellman 方程把当前价值分成即时奖励与后续价值。求最优 Q 后可选择使 Q 最大的动作，但最优策略可能不唯一，不能说 V 与策略存在一一对应。\n\n若观察不完整，使用历史、记忆或 belief state 建模部分可观测性。深度学习是函数表示/优化手段，RL 是学习范式，两者不是对立关系；RL 也可能依赖答案标签、人工反馈或模拟器。\n不能把“RL不需要标签”“所有状态必须能重复到达”当作定义。\nLLM Agent 的外部网页状态不可见时，怎样构造状态？"}, {"id": "ALN-022", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "动态规划、Monte Carlo、TD 与 n-step return 有什么区别？", "tags": ["MC", "TD", "n-step", "动态规划", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>动态规划使用已知环境模型计算期望并迭代评价/改进策略；MC 用采样轨迹的实际回报估计价值，通常需要等到终止；TD 用一步奖励加下一状态的估计值更新，可以在线学习但会 bootstrap。Model-based 方法使用已知或学到的转移/奖励模型规划，model-free 方法直接从交互学习价值或策略；前者有模型误差，后者也不天然保证泛化更好。\u003c/p>\u003cp>n-step 把前 n 步实际奖励与末状态价值组合。n 增大通常减少对 bootstrap 的依赖，但累计更多随机奖励可能增加方差；这只是常见权衡，不是期望、偏差与方差都必然单调变化的定理。MC 回报在合适采样条件下可作为 V 的无偏样本，TD 目标则受当前价值误差影响，不能简单说两种最终学习算法“永远无偏”。\u003c/p>\u003cp>真实终止令后续价值为零；时间限制截断未必表示环境终止，需要按任务语义处理 bootstrap。GAE 可看作不同步长优势信息的加权组合。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02190;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">[\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>G\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/munderover>\u003cmsup>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msup>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsup>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“n越大，价值期望越大”不成立；须区分目标的偏差、估计方差与真实价值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么截断成 max_tokens 的回答不应无条件当作真实终止？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "动态规划使用已知环境模型计算期望并迭代评价/改进策略；MC 用采样轨迹的实际回报估计价值，通常需要等到终止；TD 用一步奖励加下一状态的估计值更新，可以在线学习但会 bootstrap。Model-based 方法使用已知或学到的转移/奖励模型规划，model-free 方法直接从交互学习价值或策略；前者有模型误差，后者也不天然保证泛化更好。\n\nn-step 把前 n 步实际奖励与末状态价值组合。n 增大通常减少对 bootstrap 的依赖，但累计更多随机奖励可能增加方差；这只是常见权衡，不是期望、偏差与方差都必然单调变化的定理。MC 回报在合适采样条件下可作为 V 的无偏样本，TD 目标则受当前价值误差影响，不能简单说两种最终学习算法“永远无偏”。\n\n真实终止令后续价值为零；时间限制截断未必表示环境终止，需要按任务语义处理 bootstrap。GAE 可看作不同步长优势信息的加权组合。\n“n越大，价值期望越大”不成立；须区分目标的偏差、估计方差与真实价值。\n为什么截断成 max_tokens 的回答不应无条件当作真实终止？"}, {"id": "ALN-023", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "怎样推导策略梯度与 REINFORCE，baseline 为什么能降方差？", "tags": ["Policy Gradient", "REINFORCE", "baseline", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把轨迹概率写成初始状态、环境转移与各步策略概率的乘积；对期望回报求导，使用 likelihood-ratio 恒等式把梯度转成回报乘轨迹 log-prob 梯度。环境不依赖策略参数时，只有动作概率贡献梯度；再利用因果性，把整条轨迹奖励换成该动作之后的 reward-to-go。\u003c/p>\u003cp>REINFORCE 按当前策略采样轨迹，计算回报，最小化负的 log-prob 与回报乘积。这里回报 G_t 从时刻t开始折扣，若目标是从时刻0起的折扣回报，求和还需乘γ的t次方；LLM有限响应常取γ=1。采样分布每轮变化，代理loss的数值跨轮不能直接作固定监督目标比较，关键是梯度与独立任务奖励。\u003c/p>\u003cp>baseline b(s) 不依赖当前采样动作时，其期望梯度贡献为零，可以降低方差。用 V(s) 得到回报减价值的优势估计。实现中回报/优势应 detach，避免策略梯度通过权重误反传；状态访问权重及折扣须与定义的目标一致。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmi>J\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmi>&#x003C4;\u003c/mi>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msup>\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmi>&#x0007E;\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmo>&#x02207;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>a\u003c/mi>\u003c/munder>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>任意与动作相关的 baseline 都不会产生偏差，这一说法是错的。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么提高好回答的概率不等于只训练这些回答的 SFT？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把轨迹概率写成初始状态、环境转移与各步策略概率的乘积；对期望回报求导，使用 likelihood-ratio 恒等式把梯度转成回报乘轨迹 log-prob 梯度。环境不依赖策略参数时，只有动作概率贡献梯度；再利用因果性，把整条轨迹奖励换成该动作之后的 reward-to-go。\n\nREINFORCE 按当前策略采样轨迹，计算回报，最小化负的 log-prob 与回报乘积。这里回报 G_t 从时刻t开始折扣，若目标是从时刻0起的折扣回报，求和还需乘γ的t次方；LLM有限响应常取γ=1。采样分布每轮变化，代理loss的数值跨轮不能直接作固定监督目标比较，关键是梯度与独立任务奖励。\n\nbaseline b(s) 不依赖当前采样动作时，其期望梯度贡献为零，可以降低方差。用 V(s) 得到回报减价值的优势估计。实现中回报/优势应 detach，避免策略梯度通过权重误反传；状态访问权重及折扣须与定义的目标一致。\n任意与动作相关的 baseline 都不会产生偏差，这一说法是错的。\n为什么提高好回答的概率不等于只训练这些回答的 SFT？"}, {"id": "ALN-024", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "Actor-Critic、A2C 与 A3C 怎样工作，Critic 是奖励模型吗？", "tags": ["Actor-Critic", "A2C", "A3C", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Actor 输出策略，Critic 估计当前策略下的未来回报，帮助构造优势并降低策略梯度方差。Actor 可用负 log-prob 乘优势训练，Critic 回归 n-step 或其他 return target；优势、回归目标通常停止梯度。共享骨干时仍需区分两类损失的作用及相互影响。\u003c/p>\u003cp>A3C 让多个 worker 与独立环境交互，从共享参数同步局部副本，再异步提交更新；多环境有助于分散样本相关性，但异步带来参数滞后。A2C 将多个环境的 rollout 同步聚合后更新，便于批量计算。两者通常归入 on-policy 方法，但 A3C 的异步滞后不能被忽略；是否 off-policy 要看数据与学习目标，不由“多线程”决定。\u003c/p>\u003cp>RLHF 的 RM 评价回答质量，Critic 预测包含 RM/KL 等定义后未来能获得的回报，二者不同。优势 A=Q−V 是期望函数；单步 TD residual 是它的一种估计，不能处处当成完全相等的真值。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>sg\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmo>sg\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>G\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>Critic 不是给回答标好坏的判别器，也不一定需要独立估计 Q 网络。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>Actor 与 Critic 共用 Transformer 时，应怎样检查梯度冲突？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Actor 输出策略，Critic 估计当前策略下的未来回报，帮助构造优势并降低策略梯度方差。Actor 可用负 log-prob 乘优势训练，Critic 回归 n-step 或其他 return target；优势、回归目标通常停止梯度。共享骨干时仍需区分两类损失的作用及相互影响。\n\nA3C 让多个 worker 与独立环境交互，从共享参数同步局部副本，再异步提交更新；多环境有助于分散样本相关性，但异步带来参数滞后。A2C 将多个环境的 rollout 同步聚合后更新，便于批量计算。两者通常归入 on-policy 方法，但 A3C 的异步滞后不能被忽略；是否 off-policy 要看数据与学习目标，不由“多线程”决定。\n\nRLHF 的 RM 评价回答质量，Critic 预测包含 RM/KL 等定义后未来能获得的回报，二者不同。优势 A=Q−V 是期望函数；单步 TD residual 是它的一种估计，不能处处当成完全相等的真值。\nCritic 不是给回答标好坏的判别器，也不一定需要独立估计 Q 网络。\nActor 与 Critic 共用 Transformer 时，应怎样检查梯度冲突？"}, {"id": "ALN-025", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "RLHF-PPO 的四模型完整流程是什么？Critic 的 V_target 从哪里来？", "tags": ["RLHF", "PPO", "四模型", "Critic", "value_target"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>经典 RLHF-PPO 中 Actor 和 Critic 训练，Reference 和 RM 通常冻结。RM 先用偏好数据训练，RL 阶段并非四个模型同时各算一份训练 loss。Actor 从 SFT 初始化，Reference 是固定行为锚点，Critic 预测每个生成前缀的后续回报；四个逻辑角色也不意味着必须部署四套同尺寸独立参数。\u003c/p>\u003cp>先用采样旧策略 rollout，缓存响应 token、mask、旧 log-prob 与旧 value；RM 评价整段回答，按约定加入逐 token 参考 KL 惩罚。根据奖励、旧 value 和终止语义计算 GAE，再形成冻结回归目标 V_target=旧 value+优势。Actor 优化 PPO clipped surrogate，Critic 回归目标，可使用 value clipping；更新若干 mini-batch 后刷新采样策略。\u003c/p>\u003cp>V_target 是当前采样批次的估计回报，不是 RM 分数直接广播，也不是新 Critic 自己给自己作标签。只有回答有效位置参与相应 loss，截断是否 bootstrap、KL 正则是否另作损失、价值归一化须保持一致。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmover>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x0007E;\u003c/mo>\u003c/mover>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u00
