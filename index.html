zOGIiIHN0cm9rZS13aWR0aD0iMiIgIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHRleHQgeD0iMzYiIHk9IjU2MCIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LWZhbWlseT0iTWljcm9zb2Z0IFlhSGVpLE5vdG8gU2FucyBDSksgU0MsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9IjQwMCIgZmlsbD0iIzIwMzQ0YSI+6KeS6Imy5LiN562J5LqO5b+F6aG75L+d55WZ5Zub5aWX5a6M5YWo54us56uL5p2D6YeN77ybUmV3YXJkIE1vZGVsIOWcqOatpOWJjeeahOWBj+Wlveiuree7g+mYtuauteWtpuS5oOOAgjwvdGV4dD48L3N2Zz4K\" alt=\"RLHF-PPO 的 Actor、Reference、Reward Model 和 Critic\">\u003cfigcaption>四个角色不要求四份独立物理模型；图示经典 Actor 与 Critic 分开训练的流程。\u003c/figcaption>\u003c/figure>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要让 GAE/return target 通过计算图回传到旧 value，也不要把 reference 与本轮 old policy 混同。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>PPO actor loss 下降而独立胜率降低，先检查哪些日志？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "经典 RLHF-PPO 中 Actor 和 Critic 训练，Reference 和 RM 通常冻结。RM 先用偏好数据训练，RL 阶段并非四个模型同时各算一份训练 loss。Actor 从 SFT 初始化，Reference 是固定行为锚点，Critic 预测每个生成前缀的后续回报；四个逻辑角色也不意味着必须部署四套同尺寸独立参数。\n\n先用采样旧策略 rollout，缓存响应 token、mask、旧 log-prob 与旧 value；RM 评价整段回答，按约定加入逐 token 参考 KL 惩罚。根据奖励、旧 value 和终止语义计算 GAE，再形成冻结回归目标 V_target=旧 value+优势。Actor 优化 PPO clipped surrogate，Critic 回归目标，可使用 value clipping；更新若干 mini-batch 后刷新采样策略。\n\nV_target 是当前采样批次的估计回报，不是 RM 分数直接广播，也不是新 Critic 自己给自己作标签。只有回答有效位置参与相应 loss，截断是否 bootstrap、KL 正则是否另作损失、价值归一化须保持一致。\n不要让 GAE/return target 通过计算图回传到旧 value，也不要把 reference 与本轮 old policy 混同。\nPPO actor loss 下降而独立胜率降低，先检查哪些日志？"}, {"id": "ALN-026", "category": "ALN", "topic": "RLHF 与 PPO", "level": "L2", "title": "PPO 需要多少张 GPU，怎样估算四模型、rollout 与训练显存？", "tags": ["PPO", "显存", "GPU卡数", "rollout"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>卡数由参数规模、精度、并行切分、回答长度、rollout 数量与每卡显存共同决定，不能仅凭“PPO四模型”给固定数字。先区分可训练 Actor/Critic 的参数、梯度与优化器状态，冻结 Reference/RM 的参数与前向工作区，以及生成引擎的 KV cache、权重副本和缓存轨迹。\u003c/p>\u003cp>常见 BF16 参数/梯度加 FP32 master weights 与 Adam 两个状态，训练状态粗估约16字节/参数；实现未保存 master、状态压缩或LoRA时需改算。冻结 BF16 权重约2字节/参数。ZeRO/FSDP 分片后减少常驻状态，激活、all-gather 临时峰值和通信buffer仍需另计。生成引擎若与训练引擎保留独立副本，也必须计入。\u003c/p>\u003cp>按 rollout、RM/reference 打分、Actor/Critic 更新分别测峰值；角色共卡/分卡与 offload 改变峰值和吞吐。7B Actor+7B Critic+两个7B冻结模型，在上述未分片假设下仅状态就约252 GB十进制，尚未包含激活/KV，不能据此简单平均后断言4张80GB足够。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">z\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>共享角色显存和串行切换需要明确调度，不能把所有阶段峰值机械相加或全部理想分片。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>长响应先在 rollout OOM、短响应在 update OOM，优化策略为何不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "卡数由参数规模、精度、并行切分、回答长度、rollout 数量与每卡显存共同决定，不能仅凭“PPO四模型”给固定数字。先区分可训练 Actor/Critic 的参数、梯度与优化器状态，冻结 Reference/RM 的参数与前向工作区，以及生成引擎的 KV cache、权重副本和缓存轨迹。\n\n常见 BF16 参数/梯度加 FP32 master weights 与 Adam 两个状态，训练状态粗估约16字节/参数；实现未保存 master、状态压缩或LoRA时需改算。冻结 BF16 权重约2字节/参数。ZeRO/FSDP 分片后减少常驻状态，激活、all-gather 临时峰值和通信buffer仍需另计。生成引擎若与训练引擎保留独立副本，也必须计入。\n\n按 rollout、RM/reference 打分、Actor/Critic 更新分别测峰值；角色共卡/分卡与 offload 改变峰值和吞吐。7B Actor+7B Critic+两个7B冻结模型，在上述未分片假设下仅状态就约252 GB十进制，尚未包含激活/KV，不能据此简单平均后断言4张80GB足够。\n共享角色显存和串行切换需要明确调度，不能把所有阶段峰值机械相加或全部理想分片。\n长响应先在 rollout OOM、短响应在 update OOM，优化策略为何不同？"}, {"id": "ALN-027", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "GSPO 与 GRPO 的 importance ratio、clip 和梯度单位有什么区别？", "tags": ["GSPO", "GRPO", "sequence-level", "importance ratio"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GRPO 使用组内相对奖励作优势，常见实现逐 token 计算新旧策略概率比。GSPO 保留组内优势，但用整段回答似然比的长度归一化几何平均作比例，对整段回答进行 clip，使优化单位与序列奖励对齐。\u003c/p>\u003cp>计算时先在有效回答 token 上求新旧 log-prob 差的均值，再指数化；不能先把序列概率直接相乘，否则长回答容易下溢。这个长度归一化比例也不是未经改变的整条轨迹 importance weight，须按论文目标理解。一个响应的 token 梯度共享序列权重，其 clipping 行为与 token 级 GRPO 不同，因此不能直接照搬同样的 epsilon。\u003c/p>\u003cp>论文在特定 Qwen3/MoE 实验中报告稳定性与效率收益；这不保证所有数据、模型与奖励下都优于 GRPO。比较时应固定 rollout 预算、奖励、响应长度和训练算力，并记录 clip fraction、策略漂移和独立能力。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B8;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>J\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>G\u003c/mi>\u003c/mfrac>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“GSPO只是把token loss先平均”不足以描述序列比例和clip条件的变化。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两个响应某个 token 的 ratio 极端，但序列均值接近1，GSPO与GRPO会怎样不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GRPO 使用组内相对奖励作优势，常见实现逐 token 计算新旧策略概率比。GSPO 保留组内优势，但用整段回答似然比的长度归一化几何平均作比例，对整段回答进行 clip，使优化单位与序列奖励对齐。\n\n计算时先在有效回答 token 上求新旧 log-prob 差的均值，再指数化；不能先把序列概率直接相乘，否则长回答容易下溢。这个长度归一化比例也不是未经改变的整条轨迹 importance weight，须按论文目标理解。一个响应的 token 梯度共享序列权重，其 clipping 行为与 token 级 GRPO 不同，因此不能直接照搬同样的 epsilon。\n\n论文在特定 Qwen3/MoE 实验中报告稳定性与效率收益；这不保证所有数据、模型与奖励下都优于 GRPO。比较时应固定 rollout 预算、奖励、响应长度和训练算力，并记录 clip fraction、策略漂移和独立能力。\n“GSPO只是把token loss先平均”不足以描述序列比例和clip条件的变化。\n两个响应某个 token 的 ratio 极端，但序列均值接近1，GSPO与GRPO会怎样不同？"}, {"id": "ALN-028", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "DAPO 相比原始 GRPO 改了什么，四个核心设计分别解决什么问题？", "tags": ["DAPO", "Clip-Higher", "Dynamic Sampling", "token-mean"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DAPO 是一套大规模推理RL方法与系统方案，不能只理解为换一个优势公式。其主要设计包括上下界分开的 Clip-Higher、动态采样、token级损失聚合，以及超长响应奖励处理。\u003c/p>\u003cp>Clip-Higher 放宽正优势概率增加的上边界，以缓解探索受限，同时保留独立下边界。动态采样剔除同一prompt组内全部相同结果的组，并继续采样补够训练批次，使训练看到有区分度的信号，但也改变了训练问题分布并增加生成成本。token-mean 聚合让所有有效响应 token 共同归一化，与“先每序列平均再对序列平均”权重不同，长短回答的梯度贡献会变化。\u003c/p>\u003cp>超长处理通过长度缓冲区等减轻硬截断对奖励的错误归因；论文recipe去掉显式KL也不能外推为所有任务都应去KL。应同时检查熵、非零优势组比例、长度/截断率与独立正确率；只提高训练奖励不能证明能力改善。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>J\u003c/mi>\u003cmo>&#x0221D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C1;\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C1;\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003F5;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>&#x003F5;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmover accent=\"true\">\u003cmi>A\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不对称clip上下界不等于给正负样本直接乘不同数据权重。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>过滤全对/全错组会对样本难度和每步采样成本产生什么影响？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DAPO 是一套大规模推理RL方法与系统方案，不能只理解为换一个优势公式。其主要设计包括上下界分开的 Clip-Higher、动态采样、token级损失聚合，以及超长响应奖励处理。\n\nClip-Higher 放宽正优势概率增加的上边界，以缓解探索受限，同时保留独立下边界。动态采样剔除同一prompt组内全部相同结果的组，并继续采样补够训练批次，使训练看到有区分度的信号，但也改变了训练问题分布并增加生成成本。token-mean 聚合让所有有效响应 token 共同归一化，与“先每序列平均再对序列平均”权重不同，长短回答的梯度贡献会变化。\n\n超长处理通过长度缓冲区等减轻硬截断对奖励的错误归因；论文recipe去掉显式KL也不能外推为所有任务都应去KL。应同时检查熵、非零优势组比例、长度/截断率与独立正确率；只提高训练奖励不能证明能力改善。\n不对称clip上下界不等于给正负样本直接乘不同数据权重。\n过滤全对/全错组会对样本难度和每步采样成本产生什么影响？"}, {"id": "ALN-029", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "在 verl 中支持 DAPO，需要改哪些配置或训练模块？", "tags": ["verl", "DAPO", "配置", "训练模块"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先固定 verl commit 和 DAPO recipe，配置名随版本变动，不能只在普通 PPO脚本里改一个 estimator 就声称完整复现。官方recipe暴露 actor 的 clip_ratio_low/high、loss_agg_mode，algorithm.filter_groups 的开关/指标/生成批次上限，以及 reward_model.overlong_buffer 的长度和penalty。\u003c/p>\u003cp>例如把损失聚合设为 token-mean；组过滤按 acc、score 等指定指标判断同组是否没有差异，反复生成到训练prompt批次满足要求或达到上限。gen_batch_size控制生成候选数，train_batch_size控制实际训练批次，须区分prompt数与乘 rollout.n 后的轨迹数。长度惩罚应基于有效响应长度，排除padding。\u003c/p>\u003cp>若当前trainer不支持过滤后的补采样，需要改rollout收集/组筛选循环；奖励shaping在奖励路径实现，分离clip和归一化在actor loss实现。用小批次检查mask、组ID、长度边界和优势有效性，再按官方消融逐项开启。这里依据官方文档2025-06-19的recipe接口示例；文档说明它没有实现论文中的额外Overlong Filtering，复现时应锁定commit并交代这一边界，不能当作所有新版本永久不支持。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“DAPO=GRPO+调高epsilon”漏掉数据选择、loss归一化和奖励路径。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>启用filter_groups后一直采不够批次，应检查数据难度、奖励还是采样策略？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先固定 verl commit 和 DAPO recipe，配置名随版本变动，不能只在普通 PPO脚本里改一个 estimator 就声称完整复现。官方recipe暴露 actor 的 clip_ratio_low/high、loss_agg_mode，algorithm.filter_groups 的开关/指标/生成批次上限，以及 reward_model.overlong_buffer 的长度和penalty。\n\n例如把损失聚合设为 token-mean；组过滤按 acc、score 等指定指标判断同组是否没有差异，反复生成到训练prompt批次满足要求或达到上限。gen_batch_size控制生成候选数，train_batch_size控制实际训练批次，须区分prompt数与乘 rollout.n 后的轨迹数。长度惩罚应基于有效响应长度，排除padding。\n\n若当前trainer不支持过滤后的补采样，需要改rollout收集/组筛选循环；奖励shaping在奖励路径实现，分离clip和归一化在actor loss实现。用小批次检查mask、组ID、长度边界和优势有效性，再按官方消融逐项开启。这里依据官方文档2025-06-19的recipe接口示例；文档说明它没有实现论文中的额外Overlong Filtering，复现时应锁定commit并交代这一边界，不能当作所有新版本永久不支持。\n“DAPO=GRPO+调高epsilon”漏掉数据选择、loss归一化和奖励路径。\n启用filter_groups后一直采不够批次，应检查数据难度、奖励还是采样策略？"}, {"id": "ALN-030", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L2", "title": "GRPO 数据必须标注 Thought 吗，完整训练数据与 rollout 怎样组织？", "tags": ["GRPO", "数据格式", "rollout", "Thought"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GRPO 的训练基本输入是prompt及奖励计算所需的任务元数据，不要求每条样本都提供人工标注的推理过程。数学任务可保存题目与可核验答案，代码任务可保存测试环境，Agent任务可保存初始状态和成功判定。模型对同一prompt采样G条响应，奖励器评分，再以组内相对结果构造优势并更新策略。\u003c/p>\u003cp>若采用cold-start SFT，需要带高质量目标响应的数据，这是另一个阶段；把SFT的带Thought示例直接当成GRPO必备字段，会混淆监督标签与在线rollout。过程奖励可使用步骤标签或验证器，但不是GRPO定义的强制要求。\u003c/p>\u003cp>实现要保留prompt组ID、有效回答mask、终止/截断状态、采样旧log-prob和奖励；同组不能混入其他prompt。优势与reward通常停止梯度，训练需按具体框架区分组标准差、loss聚合和KL位置。G=1通常无法从组内相对结果提供有效学习信号。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“GRPO不需要数据标签”过于绝对：可验证奖励常需要答案/测试/环境信息，只是不必人工Thought。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>模型全部回答错误时，为什么改成更多人工推理文本未必解决GRPO零优势？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GRPO 的训练基本输入是prompt及奖励计算所需的任务元数据，不要求每条样本都提供人工标注的推理过程。数学任务可保存题目与可核验答案，代码任务可保存测试环境，Agent任务可保存初始状态和成功判定。模型对同一prompt采样G条响应，奖励器评分，再以组内相对结果构造优势并更新策略。\n\n若采用cold-start SFT，需要带高质量目标响应的数据，这是另一个阶段；把SFT的带Thought示例直接当成GRPO必备字段，会混淆监督标签与在线rollout。过程奖励可使用步骤标签或验证器，但不是GRPO定义的强制要求。\n\n实现要保留prompt组ID、有效回答mask、终止/截断状态、采样旧log-prob和奖励；同组不能混入其他prompt。优势与reward通常停止梯度，训练需按具体框架区分组标准差、loss聚合和KL位置。G=1通常无法从组内相对结果提供有效学习信号。\n“GRPO不需要数据标签”过于绝对：可验证奖励常需要答案/测试/环境信息，只是不必人工Thought。\n模型全部回答错误时，为什么改成更多人工推理文本未必解决GRPO零优势？"}, {"id": "ALN-031", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "GRPO 不收敛或训练奖励升高但能力退化，怎样排查和调参？", "tags": ["GRPO", "不收敛", "调参", "reward hacking"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认奖励可信：离线重放正确、错误、格式异常和截断样本，检查答案解析器、测试超时和格式奖励是否被钻空子。再看每组奖励方差与非零优势比例；全对/全错过多时，可能是题目难度、采样熵或group size不合适，而非单纯学习率过低。\u003c/p>\u003cp>检查组ID、response mask、log-prob对齐、detach与loss归一化；在更新前，新旧策略同权重时ratio应接近1，训练/推理引擎精度和模板不一致会破坏这一条件。监控熵、KL、clip fraction、梯度范数、响应长度、截断率与独立验证正确率。长答上升可能只是奖励偏好冗长，训练平均loss也不应期望像SFT一样单调下降。\u003c/p>\u003cp>用能产生正负结果的少量任务先跑通，再单变量调整学习率、每批更新次数、clip、KL、G、采样温度和回答预算；设稳定SFT基线与冻结评测集。若验证持续退化应回滚checkpoint并定位机制，盲目延长训练通常放大奖励偏差。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>策略梯度loss接近0可能是零优势、clip饱和或梯度错误，不等于已经收敛。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>组内奖励有方差但ratio始终1且权重不变，如何定位未更新问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认奖励可信：离线重放正确、错误、格式异常和截断样本，检查答案解析器、测试超时和格式奖励是否被钻空子。再看每组奖励方差与非零优势比例；全对/全错过多时，可能是题目难度、采样熵或group size不合适，而非单纯学习率过低。\n\n检查组ID、response mask、log-prob对齐、detach与loss归一化；在更新前，新旧策略同权重时ratio应接近1，训练/推理引擎精度和模板不一致会破坏这一条件。监控熵、KL、clip fraction、梯度范数、响应长度、截断率与独立验证正确率。长答上升可能只是奖励偏好冗长，训练平均loss也不应期望像SFT一样单调下降。\n\n用能产生正负结果的少量任务先跑通，再单变量调整学习率、每批更新次数、clip、KL、G、采样温度和回答预算；设稳定SFT基线与冻结评测集。若验证持续退化应回滚checkpoint并定位机制，盲目延长训练通常放大奖励偏差。\n策略梯度loss接近0可能是零优势、clip饱和或梯度错误，不等于已经收敛。\n组内奖励有方差但ratio始终1且权重不变，如何定位未更新问题？"}, {"id": "ALN-032", "category": "ALN", "topic": "GRPO 与在线优化", "level": "L3", "title": "正负样本不对称设计有哪些方式，和 PPO/DAPO 的不对称 clip 有何区别？", "tags": ["不对称权重", "偏好数据", "clip"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认“正负”的定义：偏好数据是同prompt的chosen/rejected对，二分类数据是正负标签，策略优化通常按优势正负区分。三者不能使用一个未说明的“正样本权重”概念。\u003c/p>\u003cp>样本加权可改变各偏好对或类别对目标的贡献，用于类别不平衡、错误成本不同或标签可信度不同；DPO本身已在同一logistic loss里提高chosen相对rejected的log-ratio间隔。若分别额外拉高/压低两者绝对概率，便改变了目标，可能带来长度偏差、遗忘或过度拒答，不是标准DPO的等价写法。\u003c/p>\u003cp>PPO/DAPO的clip取决于优势符号：正优势只限制过度增加概率，负优势只限制过度减少概率。不对称上下界改变允许更新区间，而非直接给正负样本乘不同常数。选型应说明业务成本、归一化和最终阈值，并报告正负分层的收益与误伤。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003c/msub>\u003cmi>y\u003c/mi>\u003cmi>log\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>w\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x02113;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C1;\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C1;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003F5;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>&#x003F5;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把类别权重、chosen/rejected概率项、正负优势clip三种机制当作同一算法。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>高风险拒答任务怎样验证提高负类权重没有导致过度拒答？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认“正负”的定义：偏好数据是同prompt的chosen/rejected对，二分类数据是正负标签，策略优化通常按优势正负区分。三者不能使用一个未说明的“正样本权重”概念。\n\n样本加权可改变各偏好对或类别对目标的贡献，用于类别不平衡、错误成本不同或标签可信度不同；DPO本身已在同一logistic loss里提高chosen相对rejected的log-ratio间隔。若分别额外拉高/压低两者绝对概率，便改变了目标，可能带来长度偏差、遗忘或过度拒答，不是标准DPO的等价写法。\n\nPPO/DAPO的clip取决于优势符号：正优势只限制过度增加概率，负优势只限制过度减少概率。不对称上下界改变允许更新区间，而非直接给正负样本乘不同常数。选型应说明业务成本、归一化和最终阈值，并报告正负分层的收益与误伤。\n不能把类别权重、chosen/rejected概率项、正负优势clip三种机制当作同一算法。\n高风险拒答任务怎样验证提高负类权重没有导致过度拒答？"}, {"id": "ALN-033", "category": "ALN", "topic": "奖励与对齐策略", "level": "L3", "title": "提升 RAG 回答质量时怎样选 DPO 或 GRPO，奖励怎样设计？", "tags": ["RAG", "DPO", "GRPO", "reward design"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DPO适合已有同一问题、同一证据上下文下的可靠chosen/rejected数据，直接优化回答偏好且不需要在线采样循环。GRPO适合能重复采样并得到相对可信任务奖励的场景，例如基于可核验引用/事实/数据库结果的问答；其优势是可探索当前策略，但奖励设计和rollout成本更高。\u003c/p>\u003cp>构造DPO数据时控制检索证据，避免chosen拿到正确文档而rejected没拿到，使优化主要学习输入差异。在线GRPO可把答案正确、证据支持、引用有效、指令约束等分层验证，防止只奖励引用数量或与参考的词面重合。开放域judge本身有偏差，组内归一化不会将坏奖励变成可靠监督。\u003c/p>\u003cp>若失败源于召回漏证据，单独微调回答模型无法替代改检索。实验先冻结索引、检索器、prompt与预算，比较SFT/DPO/GRPO，并在相同检索条件和端到端系统上分别测效果、拒答、成本与分布外泛化。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>RAG不是天然必须用DPO；GRPO也不因组内比较就免于奖励作弊。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样区分策略更会回答与它只是更会迎合引用评分器？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DPO适合已有同一问题、同一证据上下文下的可靠chosen/rejected数据，直接优化回答偏好且不需要在线采样循环。GRPO适合能重复采样并得到相对可信任务奖励的场景，例如基于可核验引用/事实/数据库结果的问答；其优势是可探索当前策略，但奖励设计和rollout成本更高。\n\n构造DPO数据时控制检索证据，避免chosen拿到正确文档而rejected没拿到，使优化主要学习输入差异。在线GRPO可把答案正确、证据支持、引用有效、指令约束等分层验证，防止只奖励引用数量或与参考的词面重合。开放域judge本身有偏差，组内归一化不会将坏奖励变成可靠监督。\n\n若失败源于召回漏证据，单独微调回答模型无法替代改检索。实验先冻结索引、检索器、prompt与预算，比较SFT/DPO/GRPO，并在相同检索条件和端到端系统上分别测效果、拒答、成本与分布外泛化。\nRAG不是天然必须用DPO；GRPO也不因组内比较就免于奖励作弊。\n怎样区分策略更会回答与它只是更会迎合引用评分器？"}, {"id": "ALN-034", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "on-policy、off-policy、importance sampling、TRPO 与 PPO 怎样联系？", "tags": ["on/off-policy", "importance sampling", "TRPO", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>On-policy学习当前交互策略，off-policy允许数据由不同的行为策略产生，学习另一个目标策略。是否经验回放、异步或多轮更新不是唯一判据，须明确行为策略与优化目标及所用校正。\u003c/p>\u003cp>重要性采样用目标/行为密度比重加权行为样本；目标有概率的区域必须被行为分布覆盖。轨迹比例是逐步比例的乘积，长轨迹容易造成高方差。截断、自归一化或使用局部surrogate常降低方差，但通常引入偏差或改变目标，不能声称“PPO clip使任意旧样本都完全无偏”。\u003c/p>\u003cp>TRPO用KL约束限制更新，通常涉及二阶近似和线搜索；PPO-clip采用一阶优化的截断代理目标，PPO-penalty则采用KL惩罚。clip并不是严格KL信任域保证，仍应监控KL/采用早停。RLHF参考模型KL又是行为锚点约束，与本轮新旧策略限制分开。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmi>z\u003c/mi>\u003cmi>&#x0007E;\u003c/mi>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmi>z\u003c/mi>\u003cmi>&#x0007E;\u003c/mi>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x021D2;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>PPO通常以on-policy方式收集数据，再有限复用旧策略rollout；不能因存在ratio就称任意off-policy回放算法。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么重要性比例在长回答上常比短回答更不稳定？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "On-policy学习当前交互策略，off-policy允许数据由不同的行为策略产生，学习另一个目标策略。是否经验回放、异步或多轮更新不是唯一判据，须明确行为策略与优化目标及所用校正。\n\n重要性采样用目标/行为密度比重加权行为样本；目标有概率的区域必须被行为分布覆盖。轨迹比例是逐步比例的乘积，长轨迹容易造成高方差。截断、自归一化或使用局部surrogate常降低方差，但通常引入偏差或改变目标，不能声称“PPO clip使任意旧样本都完全无偏”。\n\nTRPO用KL约束限制更新，通常涉及二阶近似和线搜索；PPO-clip采用一阶优化的截断代理目标，PPO-penalty则采用KL惩罚。clip并不是严格KL信任域保证，仍应监控KL/采用早停。RLHF参考模型KL又是行为锚点约束，与本轮新旧策略限制分开。\nPPO通常以on-policy方式收集数据，再有限复用旧策略rollout；不能因存在ratio就称任意off-policy回放算法。\n为什么重要性比例在长回答上常比短回答更不稳定？"}, {"id": "ALN-035", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "Q-learning 与 SARSA 的更新、探索策略和适用边界有什么区别？", "tags": ["Q-learning", "SARSA", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>两者都是基于采样转移的TD控制方法，区别在下一状态target。Q-learning用下一状态所有动作Q的最大值，学习趋向贪心最优策略；行为仍可用epsilon-greedy探索，因此是off-policy。SARSA使用下一步按当前行为策略实际选择的动作价值，学习包含当前探索行为的策略，因此是on-policy。\u003c/p>\u003cp>Q值是期望回报，不是动作概率；由价值导出的策略也可随机探索。两种方法都使用环境交互数据，不能说Q-learning“不使用行为策略数据”。在悬崖行走等任务，SARSA可能考虑探索风险，而Q-learning的贪心target看起来更激进，但这不表示SARSA始终是更优改进版。\u003c/p>\u003cp>表格型收敛结论需要充分访问、步长条件与有限状态动作等假设，换成神经网络后不能直接套用。连续动作上的max较难，常借助Actor-Critic；LLM词表可作为离散动作，但长程状态、信用分配与计算成本仍令直接Q学习具有挑战。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">Q\u003c/mi>\u003cmtext>-\u003c/mtext>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02190;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02190;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>SARSA下一动作要按行为策略选择，但不必实际执行完下一动作后才更新当前transition。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若行为策略和target都贪心，两种一步更新还会有什么差别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "两者都是基于采样转移的TD控制方法，区别在下一状态target。Q-learning用下一状态所有动作Q的最大值，学习趋向贪心最优策略；行为仍可用epsilon-greedy探索，因此是off-policy。SARSA使用下一步按当前行为策略实际选择的动作价值，学习包含当前探索行为的策略，因此是on-policy。\n\nQ值是期望回报，不是动作概率；由价值导出的策略也可随机探索。两种方法都使用环境交互数据，不能说Q-learning“不使用行为策略数据”。在悬崖行走等任务，SARSA可能考虑探索风险，而Q-learning的贪心target看起来更激进，但这不表示SARSA始终是更优改进版。\n\n表格型收敛结论需要充分访问、步长条件与有限状态动作等假设，换成神经网络后不能直接套用。连续动作上的max较难，常借助Actor-Critic；LLM词表可作为离散动作，但长程状态、信用分配与计算成本仍令直接Q学习具有挑战。\nSARSA下一动作要按行为策略选择，但不必实际执行完下一动作后才更新当前transition。\n若行为策略和target都贪心，两种一步更新还会有什么差别？"}, {"id": "ALN-036", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "DQN 的经验回放和目标网络做什么，Double DQN 与 Dueling DQN 分别改了什么？", "tags": ["DQN", "Double DQN", "Dueling", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DQN用神经网络近似动作价值，回归Bellman target。经验回放打散连续样本相关性并复用数据，目标网络暂时固定bootstrap目标以降低追逐同一网络的振荡；二者都不保证训练样本完全独立，也不提供深度函数逼近下的一般收敛保证。\u003c/p>\u003cp>普通DQN用target network同时选最大动作并评价，其max可能放大估计噪声。Double DQN用online network选动作、target network估值，缓解过估计。Dueling将网络分成状态价值V与动作优势A，再聚合成Q；减去动作优势均值等约束处理分解不可辨识，便于在多个动作价值相近时学习状态质量。\u003c/p>\u003cp>Double是target构造的变化，Dueling是网络结构的变化，可以组合。目标网络与actor-critic中的价值模型也不是同一个概念，DQN本身没有独立输出动作的Actor。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">Q\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmo>argmax\u003c/mo>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi mathvariant=\"script\">A\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/munder>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把Double DQN的两个网络称为两个独立Actor，也不能把Dueling称为对抗训练。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>目标网络更新太频繁或太慢分别可能产生什么问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DQN用神经网络近似动作价值，回归Bellman target。经验回放打散连续样本相关性并复用数据，目标网络暂时固定bootstrap目标以降低追逐同一网络的振荡；二者都不保证训练样本完全独立，也不提供深度函数逼近下的一般收敛保证。\n\n普通DQN用target network同时选最大动作并评价，其max可能放大估计噪声。Double DQN用online network选动作、target network估值，缓解过估计。Dueling将网络分成状态价值V与动作优势A，再聚合成Q；减去动作优势均值等约束处理分解不可辨识，便于在多个动作价值相近时学习状态质量。\n\nDouble是target构造的变化，Dueling是网络结构的变化，可以组合。目标网络与actor-critic中的价值模型也不是同一个概念，DQN本身没有独立输出动作的Actor。\n不能把Double DQN的两个网络称为两个独立Actor，也不能把Dueling称为对抗训练。\n目标网络更新太频繁或太慢分别可能产生什么问题？"}, {"id": "ALN-037", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "DDPG、D4PG、TD3 与 SAC 怎样比较，能直接套到 LLM token 生成吗？", "tags": ["DDPG", "D4PG", "TD3", "SAC", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>这些方法主要讨论连续动作控制。DDPG用确定性Actor给出动作，Critic学习Q，通过Q对动作的梯度更新Actor；经验回放、目标网络和行为探索噪声使其属于off-policy Actor-Critic。\u003c/p>\u003cp>D4PG在确定性策略梯度框架加入分布式采样、回报分布表示、n-step与优先回放等设计；其中distributional指回报分布，distributed指多个采样者，二者不能混同。TD3用双Critic取较小target、延迟策略更新和target动作平滑缓解估计误差。SAC学习随机策略，优化回报与策略熵的组合，提高探索和鲁棒性。\u003c/p>\u003cp>LLM token是离散词表动作，普通确定性连续动作梯度不能直接穿过采样token；应使用适配离散动作的目标与实现，而非把DDPG的网络名换成Transformer就当作等价算法。SAC存在离散变体，但需要具体说明动作分布、Q计算成本与采样方式。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msup>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmi mathvariant=\"script\">H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>&#x000B7;\u003c/mo>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“策略梯度只适用于连续动作、价值方法只适用于确定策略”都不是正确边界。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>离散大词表上计算所有动作Q值与连续动作Actor求导有何成本差异？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "这些方法主要讨论连续动作控制。DDPG用确定性Actor给出动作，Critic学习Q，通过Q对动作的梯度更新Actor；经验回放、目标网络和行为探索噪声使其属于off-policy Actor-Critic。\n\nD4PG在确定性策略梯度框架加入分布式采样、回报分布表示、n-step与优先回放等设计；其中distributional指回报分布，distributed指多个采样者，二者不能混同。TD3用双Critic取较小target、延迟策略更新和target动作平滑缓解估计误差。SAC学习随机策略，优化回报与策略熵的组合，提高探索和鲁棒性。\n\nLLM token是离散词表动作，普通确定性连续动作梯度不能直接穿过采样token；应使用适配离散动作的目标与实现，而非把DDPG的网络名换成Transformer就当作等价算法。SAC存在离散变体，但需要具体说明动作分布、Q计算成本与采样方式。\n“策略梯度只适用于连续动作、价值方法只适用于确定策略”都不是正确边界。\n离散大词表上计算所有动作Q值与连续动作Actor求导有何成本差异？"}, {"id": "ALN-038", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "稀疏奖励怎样改善，reward shaping、课程学习与 ICM 有什么风险？", "tags": ["稀疏奖励", "ICM", "reward shaping", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>稀疏奖励只在少数完成事件提供反馈，探索可能长时间收不到有效信号。可以缩短任务、用课程控制难度、加入示范、设计可验证过程奖励或改善探索。密集奖励若鼓励与最终目标无关的代理行为，会造成reward hacking，因此必须单独验证最终成功率。\u003c/p>\u003cp>势函数型shaping用下一状态势能减当前势能的折扣值，在匹配的折扣及终止条件下可以保留最优策略；任意加上“每步多思考一点就给分”没有这样的保证。ICM在特征空间学习逆动力学表征与前向预测，并用预测误差作内在奖励，引导探索难以预测的状态。\u003c/p>\u003cp>预测误差不等于业务价值，随机噪声也可持续提供奖励，产生“noisy TV”问题。对LLM Agent不应直接把新奇token、更多工具调用或更长轨迹当成功；应设内在奖励权重、资源约束与外部目标验收。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>&#x003A6;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003A6;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>r\u003c/mi>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0221D;\u003c/mo>\u003cmsubsup>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x02016;\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x02016;\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>更密集的奖励不保证原任务最优策略不变；好奇心也不保证探索有用信息。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果Agent不断调用返回随机数的工具，怎样发现和修复奖励作弊？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "稀疏奖励只在少数完成事件提供反馈，探索可能长时间收不到有效信号。可以缩短任务、用课程控制难度、加入示范、设计可验证过程奖励或改善探索。密集奖励若鼓励与最终目标无关的代理行为，会造成reward hacking，因此必须单独验证最终成功率。\n\n势函数型shaping用下一状态势能减当前势能的折扣值，在匹配的折扣及终止条件下可以保留最优策略；任意加上“每步多思考一点就给分”没有这样的保证。ICM在特征空间学习逆动力学表征与前向预测，并用预测误差作内在奖励，引导探索难以预测的状态。\n\n预测误差不等于业务价值，随机噪声也可持续提供奖励，产生“noisy TV”问题。对LLM Agent不应直接把新奇token、更多工具调用或更长轨迹当成功；应设内在奖励权重、资源约束与外部目标验收。\n更密集的奖励不保证原任务最优策略不变；好奇心也不保证探索有用信息。\n如果Agent不断调用返回随机数的工具，怎样发现和修复奖励作弊？"}, {"id": "ALN-039", "category": "ALN", "topic": "强化学习基础", "level": "L2", "title": "行为克隆、DAgger、IRL 与 GAIL 有何区别，怎样对应 Agent 训练？", "tags": ["BC", "DAgger", "IRL", "GAIL", "强化学习基础"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>行为克隆把专家状态/动作当监督数据，直接学习动作分布；训练只看专家访问的状态，部署时自己的小错误会带到未见状态，造成分布偏移和误差累积。DAgger让当前策略运行，在它实际访问的状态上询问专家动作并聚合数据，代价是需要专家反馈与可控交互环境。\u003c/p>\u003cp>IRL从示范推断能解释专家行为的奖励，再求策略，但奖励通常不唯一，专家也未必最优。GAIL用判别器区分专家与当前策略的状态动作占用分布，策略优化对应代理信号；它是模仿学习目标，不意味着必然恢复唯一真实奖励。判别器与策略的对抗结构类似GAN，但样本来自有环境反馈的轨迹。\u003c/p>\u003cp>Agent SFT相当于示范轨迹上的行为学习；数据应包含工具选择、参数、观察与恢复。修复deployment失误时，可以收集当前Agent错误状态上的示范，而非仅增加更多理想轨迹；危险状态不能为采样而无约束执行。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>&#x0007E;\u003c/mi>\u003cmsub>\u003cmi mathvariant=\"script\">D\u003c/mi>\u003cmi>E\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>模仿学习不能保证把专家全部行为精确复制，也不能据示范唯一识别人类真实意图。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>让专家只重写Agent最终答案，为什么不等于在错误状态上做DAgger？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "行为克隆把专家状态/动作当监督数据，直接学习动作分布；训练只看专家访问的状态，部署时自己的小错误会带到未见状态，造成分布偏移和误差累积。DAgger让当前策略运行，在它实际访问的状态上询问专家动作并聚合数据，代价是需要专家反馈与可控交互环境。\n\nIRL从示范推断能解释专家行为的奖励，再求策略，但奖励通常不唯一，专家也未必最优。GAIL用判别器区分专家与当前策略的状态动作占用分布，策略优化对应代理信号；它是模仿学习目标，不意味着必然恢复唯一真实奖励。判别器与策略的对抗结构类似GAN，但样本来自有环境反馈的轨迹。\n\nAgent SFT相当于示范轨迹上的行为学习；数据应包含工具选择、参数、观察与恢复。修复deployment失误时，可以收集当前Agent错误状态上的示范，而非仅增加更多理想轨迹；危险状态不能为采样而无约束执行。\n模仿学习不能保证把专家全部行为精确复制，也不能据示范唯一识别人类真实意图。\n让专家只重写Agent最终答案，为什么不等于在错误状态上做DAgger？"}, {"id": "INF-001", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L1", "title": "KV cache 缓存什么，为什么通常不缓存历史 Q？", "tags": ["KVCache", "自回归", "加速"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>KV cache 保存已处理 token 在各层的 K/V，prefill 建立前缀缓存，decode 只计算新 token 并追加。历史 Q 的注意力结果已用于原位置，未来通常不再用它查询，因此无需保存。复用依赖因果性：新 token 不改变历史位置表示；双向 attention 一般不能原样套用。\u003c/p>\u003cp>新 query 仍要读取历史 K/V，单步 attention 成本随上下文增长。缓存以显存换取重复计算减少，改变底座权重、LoRA、前缀或位置约定时须检查缓存是否仍有效。\u003c/p>\u003cfigure>\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgOTYwIDQzMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIj48dGl0bGUgaWQ9InRpdGxlIj5LViBDYWNoZe+8muWOhuWPsiBLL1Yg5aSN55So77yM5pawIFF1ZXJ5IOWPquWcqOacrOatpeiuoeeulzwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDAgTDEwIDUgTDAgMTAgWiIgZmlsbD0iIzU2NzM4YiIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiByeD0iMTIiIGZpbGw9IiNmYWZjZmUiLz48dGV4dCB4PSIzMiIgeT0iNDAiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC1mYW1pbHk9Ik1pY3Jvc29mdCBZYUhlaSxOb3RvIFNhbnMgQ0pLIFNDLEFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZvbnQtd2VpZ2h0PSI2MDAiIGZpbGw9IiMyMDM0NGEiPktWIENhY2hl77ya5Y6G5Y+yIEsvViDlpI3nlKjvvIzmlrAgUXVlcnkg5Y+q5Zyo5pys5q2l6K6h566XPC90ZXh0PjxyZWN0IHg9IjM1IiB5PSI5OSIgd2lkdGg9IjE4NSIgaGVpZ2h0PSI5MCIgcng9IjkiIGZpbGw9IiNlMmVkZmYiIHN0cm9rZT0iI2I3Y2FkNyIvPjx0ZXh0IHg9IjEyNy41IiB5PSIxMzcuMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Ik1pY3Jvc29mdCBZYUhlaSxOb3RvIFNhbnMgQ0pLIFNDLEFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI0MDAiIGZpbGw9IiMyMDM0NGEiPlByZWZpbGzvvJp04oKB44CBdOKCguOAgXTigoM8L3RleHQ+PHRleHQgeD0iMTI3LjUiIHk9IjE2My4wIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iTWljcm9zb2Z0IFlhSGVpLE5vdG8gU2FucyBDSksgU0MsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjQwMCIgZmlsbD0iIzIwMzQ0YSI+5ZC 常不以同样方式使用 KV cache？\u003c/li>\u003cli>滑动窗口注意力能怎样限制缓存大小？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "KV cache 保存已处理 token 在各层的 K/V，prefill 建立前缀缓存，decode 只计算新 token 并追加。历史 Q 的注意力结果已用于原位置，未来通常不再用它查询，因此无需保存。复用依赖因果性：新 token 不改变历史位置表示；双向 attention 一般不能原样套用。\n\n新 query 仍要读取历史 K/V，单步 attention 成本随上下文增长。缓存以显存换取重复计算减少，改变底座权重、LoRA、前缀或位置约定时须检查缓存是否仍有效。\nKV cache 能把每个生成 token 的 attention 复杂度变成常数。\n把节省重算等同于减少模型总显存。\n为什么训练时通常不以同样方式使用 KV cache？\n滑动窗口注意力能怎样限制缓存大小？"}, {"id": "INF-002", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "怎样估算推理权重、KV cache 与总显存？", "tags": ["显存估算", "KVCache", "GQA"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>推理显存应拆为权重、KV cache、激活/工作区和框架预留。全注意力 KV 约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>T\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>：\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math> 是并发序列数，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math> 是层数，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math> 是缓存长度，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 是 KV 头数，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 是头维，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math> 是每元素字节；应使用 KV 头数而非 query 头数。\u003c/p>\u003cp>32 层、32 KV 头、头维 128、长度 4096、单序列 FP16 的 KV 为 2 GiB，改为 8 KV 头则为 0.5 GiB。70 亿参数 FP16 权重约 14 GB，即 13.0 GiB，仅指权重。请求长度不同时按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 累加，并检查并行布局是否均分或复制 KV；分页、量化 scale、对齐与碎片都可能增加实际占用，应与实测峰值比较。\u003c/p>\u003cp>以十进制 14B 即 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>14\u003c/mn>\u003cmo>&#x000D7;\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>9\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 个参数为例，纯 FP16/BF16 权重约 28 GB，即 26.1 GiB；纯 INT8 码约 14 GB，即 13.0 GiB，还未计 scale、未量化模块与运行时开销。这不能直接推出“14 GB 卡可完整运行 14B INT8”。长回答会逐步增加每个请求的 KV；分页复用、准入限制、较低 KV dtype 或有效窗口可控制容量，裁掉上下文则会改变可见信息，需要质量评测。prefill 和 decode 峰值还可能不同，应记录生成到接近最大长度时的显存，而非只测模型刚加载完。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>T\u003c/mi>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 GB 和 GiB 混为一谈。\u003c/li>\u003cli>用 MHA 的 query 头数计算 GQA 的 KV 大小。\u003c/li>\u003cli>纯 INT8 权重算例不是完整服务所需显存，也不是 INT8 训练的状态大小。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>多模态视觉 token 怎样计入 KV 长度？\u003c/li>\u003cli>为什么 4-bit 权重文件大小不等于线上显存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "推理显存应拆为权重、KV cache、激活/工作区和框架预留。全注意力 KV 约为 $2BLTH_{\\rm kv}d_hs$：$B$ 是并发序列数，$L$ 是层数，$T$ 是缓存长度，$H_{\\rm kv}$ 是 KV 头数，$d_h$ 是头维，$s$ 是每元素字节；应使用 KV 头数而非 query 头数。\n\n32 层、32 KV 头、头维 128、长度 4096、单序列 FP16 的 KV 为 2 GiB，改为 8 KV 头则为 0.5 GiB。70 亿参数 FP16 权重约 14 GB，即 13.0 GiB，仅指权重。请求长度不同时按 $\\sum_iT_i$ 累加，并检查并行布局是否均分或复制 KV；分页、量化 scale、对齐与碎片都可能增加实际占用，应与实测峰值比较。\n\n以十进制 14B 即 $14\\times10^9$ 个参数为例，纯 FP16/BF16 权重约 28 GB，即 26.1 GiB；纯 INT8 码约 14 GB，即 13.0 GiB，还未计 scale、未量化模块与运行时开销。这不能直接推出“14 GB 卡可完整运行 14B INT8”。长回答会逐步增加每个请求的 KV；分页复用、准入限制、较低 KV dtype 或有效窗口可控制容量，裁掉上下文则会改变可见信息，需要质量评测。prefill 和 decode 峰值还可能不同，应记录生成到接近最大长度时的显存，而非只测模型刚加载完。\n把 GB 和 GiB 混为一谈。\n用 MHA 的 query 头数计算 GQA 的 KV 大小。\n纯 INT8 权重算例不是完整服务所需显存，也不是 INT8 训练的状态大小。\n多模态视觉 token 怎样计入 KV 长度？\n为什么 4-bit 权重文件大小不等于线上显存？"}, {"id": "INF-003", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L1", "title": "MHA、MQA 与 GQA 的结构、KV 显存及速度有何差异？", "tags": ["MHA", "MQA", "GQA", "Shapes", "KVBytes", "TensorParallel"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>MHA 的各 query 头有独立 K/V，MQA 的全部 query 头共用一组 K/V，GQA 按组共享，保留 query 头数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。对应 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math> 和 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0003C;\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003C;\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，均匀分组通常要求 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 能被 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 整除；query 头 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 使用组 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，并非先平均 query。\u003c/p>\u003cp>典型形状为 \u003ccode>Q:[B,H_q,L_q,d_h]\u003c/code>、\u003ccode>K/V:[B,H_kv,L_k,d_h]\u003c/code>，每个 query 头单独匹配其组内 K/V，再拼接输出。逻辑上的重复映射可由内核直接实现，显式物理 repeat 可能抵消显存和带宽收益。\u003c/p>\u003cp>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math> 层、总缓存 token 数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>、每元素 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>b\u003c/mi>\u003c/mrow>\u003c/math> 字节时，KV 约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>N\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>b\u003c/mi>\u003c/mrow>\u003c/math>。32 头改 8 头使理论 KV 降为 1/4，但 Q、输出投影与大部分 FFN 不随之下降。Decode 在小 Q、长 K 时常受 KV 读带宽限制；prefill 仍要处理各 query 头，速度还依赖 batch、内核、上下文与硬件。TP 超过 KV 头数时可能复制 KV，不能理想地继续均分。\u003c/p>\u003cp>已有 MHA 转换 GQA 可按组聚合 K/V 权重后再 uptraining，直接平均上线不能保证质量恢复。GQA 是容量与效率的折中，MQA 也可能有任务精度代价，应同时用任务评测、长上下文测试和服务压测验证。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>N\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>b\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>O\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmrow>\u003cmi>g\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>mod\u003c/mo>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>将 GQA 写成减少全部 attention heads，或认为逻辑共享等于张量实现完全不复制。\u003c/li>\u003cli>用 KV 头比例直接预测端到端 latency、训练 FLOPs 或质量变化。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>GQA 的 query-to-KV 分组在多 GPU 分片时如何保持一致？\u003c/li>\u003cli>同样的 KV 缓存预算下，增加并发和增加上下文长度怎样权衡？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "MHA 的各 query 头有独立 K/V，MQA 的全部 query 头共用一组 K/V，GQA 按组共享，保留 query 头数 $H_q$。对应 $H_{\\rm kv}=H_q$、$H_{\\rm kv}=1$ 和 $1\u003cH_{\\rm kv}\u003cH_q$，均匀分组通常要求 $H_q$ 能被 $H_{\\rm kv}$ 整除；query 头 $i$ 使用组 $g(i)$，并非先平均 query。\n\n典型形状为 `Q:[B,H_q,L_q,d_h]`、`K/V:[B,H_kv,L_k,d_h]`，每个 query 头单独匹配其组内 K/V，再拼接输出。逻辑上的重复映射可由内核直接实现，显式物理 repeat 可能抵消显存和带宽收益。\n\n$N$ 层、总缓存 token 数 $T_{\\rm total}$、每元素 $b$ 字节时，KV 约为 $2NT_{\\rm total}H_{\\rm kv}d_hb$。32 头改 8 头使理论 KV 降为 1/4，但 Q、输出投影与大部分 FFN 不随之下降。Decode 在小 Q、长 K 时常受 KV 读带宽限制；prefill 仍要处理各 query 头，速度还依赖 batch、内核、上下文与硬件。TP 超过 KV 头数时可能复制 KV，不能理想地继续均分。\n\n已有 MHA 转换 GQA 可按组聚合 K/V 权重后再 uptraining，直接平均上线不能保证质量恢复。GQA 是容量与效率的折中，MQA 也可能有任务精度代价，应同时用任务评测、长上下文测试和服务压测验证。\n将 GQA 写成减少全部 attention heads，或认为逻辑共享等于张量实现完全不复制。\n用 KV 头比例直接预测端到端 latency、训练 FLOPs 或质量变化。\nGQA 的 query-to-KV 分组在多 GPU 分片时如何保持一致？\n同样的 KV 缓存预算下，增加并发和增加上下文长度怎样权衡？"}, {"id": "INF-004", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "prefill 与 decode 各在做什么，瓶颈为何不同？", "tags": ["Prefill", "Decode", "Roofline"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prefill 一次处理输入前缀并建立 KV cache，token 并行度较高，线性层能形成较大的 GEMM，稠密 attention 有长度二次项。Decode 通常每请求每步只处理一个新 token，反复读取权重和历史 KV，新 query 的 attention 计算约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>前者常更偏计算，后者在小 batch 下常更偏带宽，但长上下文、batch 与硬件会改变瓶颈。扩大 batch 能摊薄权重读取、提高利用率，也增加排队、显存和请求间竞争。先用 profiler 区分权重/KV 带宽、算子启动和计算瓶颈，再选择量化、batching 或融合。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>prefill 永远算力瓶颈、decode 永远带宽瓶颈。\u003c/li>\u003cli>只看总 tokens/s 而不看输入输出长度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>chunked prefill 为什么有助于控制 decode 干扰？\u003c/li>\u003cli>如何用 roofline 判断量化是否可能加速？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prefill 一次处理输入前缀并建立 KV cache，token 并行度较高，线性层能形成较大的 GEMM，稠密 attention 有长度二次项。Decode 通常每请求每步只处理一个新 token，反复读取权重和历史 KV，新 query 的 attention 计算约为 $O(Td)$。\n\n前者常更偏计算，后者在小 batch 下常更偏带宽，但长上下文、batch 与硬件会改变瓶颈。扩大 batch 能摊薄权重读取、提高利用率，也增加排队、显存和请求间竞争。先用 profiler 区分权重/KV 带宽、算子启动和计算瓶颈，再选择量化、batching 或融合。\nprefill 永远算力瓶颈、decode 永远带宽瓶颈。\n只看总 tokens/s 而不看输入输出长度。\nchunked prefill 为什么有助于控制 decode 干扰？\n如何用 roofline 判断量化是否可能加速？"}, {"id": "INF-005", "category": "INF", "topic": "注意力与算子加速", "level": "L2", "title": "FlashAttention 的核心思想是什么，会改变注意力结果吗？", "tags": ["FlashAttention", "IOAware", "OnlineSoftmax"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FlashAttention 分块加载 Q/K/V，在片上 SRAM 计算局部分数，维护每行最大值与归一化累计量，以在线 softmax 累积输出，避免将完整 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math> 分数矩阵写回 HBM。它优化 IO 与中间存储，仍计算精确稠密注意力，算术复杂度为二次。\u003c/p>\u003cp>分块改变浮点求和次序，可产生小误差，并不保证逐 bit 相同，也不同于近似稀疏 attention。训练反向可重算部分分数和统计，以局部计算换更少保存与 IO。收益受长度、dtype、硬件、mask 和内核支持影响，短序列或不兼容场景不保证加速。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说它把稠密注意力 FLOPs 从 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 降到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/li>\u003cli>把 FlashAttention 与 KV cache 视为同一技术。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>在线 softmax 合并两个块时为什么需要重缩放？\u003c/li>\u003cli>FlashAttention-2 进一步优化了什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FlashAttention 分块加载 Q/K/V，在片上 SRAM 计算局部分数，维护每行最大值与归一化累计量，以在线 softmax 累积输出，避免将完整 $T\\times T$ 分数矩阵写回 HBM。它优化 IO 与中间存储，仍计算精确稠密注意力，算术复杂度为二次。\n\n分块改变浮点求和次序，可产生小误差，并不保证逐 bit 相同，也不同于近似稀疏 attention。训练反向可重算部分分数和统计，以局部计算换更少保存与 IO。收益受长度、dtype、硬件、mask 和内核支持影响，短序列或不兼容场景不保证加速。\n说它把稠密注意力 FLOPs 从 $O(T^2)$ 降到 $O(T)$。\n把 FlashAttention 与 KV cache 视为同一技术。\n在线 softmax 合并两个块时为什么需要重缩放？\nFlashAttention-2 进一步优化了什么？"}, {"id": "INF-006", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "PagedAttention 与 FlashAttention 解决的问题有何不同？", "tags": ["PagedAttention", "vLLM", "碎片"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>PagedAttention 将 KV 分成块，通过逻辑块到不连续物理块的映射按需分配，减少最大窗口预留浪费和碎片。块表指导内核访问，块尺寸影响尾部浪费、映射开销与效率；共享前缀或分支可以用引用计数管理，并在修改时避免覆盖其他请求。\u003c/p>\u003cp>FlashAttention 优化注意力计算的 IO 和中间矩阵，PagedAttention 优化 KV 管理，两者可配合。分页不减少同样 K/V 的理论元素数，高并发仍可能耗尽容量，需要准入、抢占等调度策略。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>分页可以让单序列无限增长且不占显存。\u003c/li>\u003cli>以论文倍数直接承诺任意服务吞吐提升。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>块尺寸如何影响尾部浪费？\u003c/li>\u003cli>共享块在分支生成时为什么可能需要 copy-on-write？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "PagedAttention 将 KV 分成块，通过逻辑块到不连续物理块的映射按需分配，减少最大窗口预留浪费和碎片。块表指导内核访问，块尺寸影响尾部浪费、映射开销与效率；共享前缀或分支可以用引用计数管理，并在修改时避免覆盖其他请求。\n\nFlashAttention 优化注意力计算的 IO 和中间矩阵，PagedAttention 优化 KV 管理，两者可配合。分页不减少同样 K/V 的理论元素数，高并发仍可能耗尽容量，需要准入、抢占等调度策略。\n分页可以让单序列无限增长且不占显存。\n以论文倍数直接承诺任意服务吞吐提升。\n块尺寸如何影响尾部浪费？\n共享块在分支生成时为什么可能需要 copy-on-write？"}, {"id": "INF-007", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "continuous batching 与普通 dynamic batching 有何区别？", "tags": ["ContinuousBatching", "调度", "吞吐"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通 dynamic batching 常在开始处理请求前拼批，continuous batching 则在生成迭代间移除已完成请求、加入新请求，使空出的 batch 位置能立即利用，适合到达时间与生成长度不同的负载。\u003c/p>\u003cp>调度还要处理长 prefill 对 decode 的干扰、KV 容量和长请求公平性，可用单轮预算或分块 prefill 控制计算量。评估时固定请求率、输入/输出长度分布和 SLO，扫描负载比较吞吐与尾延迟，不能只看最大 batch 的吞吐。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 continuous batching 简单解释为所有请求永远组成最大 batch。\u003c/li>\u003cli>只报告峰值 throughput，不报告排队时间。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>短请求如何避免被长请求拖累？\u003c/li>\u003cli>batch size 上限和每轮 token budget 含义有何不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通 dynamic batching 常在开始处理请求前拼批，continuous batching 则在生成迭代间移除已完成请求、加入新请求，使空出的 batch 位置能立即利用，适合到达时间与生成长度不同的负载。\n\n调度还要处理长 prefill 对 decode 的干扰、KV 容量和长请求公平性，可用单轮预算或分块 prefill 控制计算量。评估时固定请求率、输入/输出长度分布和 SLO，扫描负载比较吞吐与尾延迟，不能只看最大 batch 的吞吐。\n把 continuous batching 简单解释为所有请求永远组成最大 batch。\n只报告峰值 throughput，不报告排队时间。\n短请求如何避免被长请求拖累？\nbatch size 上限和每轮 token budget 含义有何不同？"}, {"id": "INF-008", "category": "INF", "topic": "解码与采样策略", "level": "L1", "title": "temperature、top-k 与 top-p 如何影响生成？", "tags": ["Sampling", "Temperature", "TopP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Temperature 用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0221D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 调整分布尖锐程度，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003C4;\u003c/mi>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 时较小值通常更集中，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003C4;\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 应按框架的贪心等特殊规则处理。Top-k 保留固定数量候选，top-p 保留累计概率达到阈值的最小候选集合，其大小随分布变化。\u003c/p>\u003cp>过滤后须重新归一化，多参数联用的执行顺序依实现而定。这些设置控制多样性，不保证事实正确；创作和可验证问答可用不同配置。固定种子有助于复现，但并行数值与运行环境仍可能使贪心或采样结果不能跨环境逐 token 一致。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>\u003ccode>temperature=0\u003c/code> 就绝对不会出现幻觉。\u003c/li>\u003cli>把 top-p 当作独立地保留概率大于 p 的 token。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 beam search 在开放生成中可能重复？\u003c/li>\u003cli>top-p 与 temperature 的顺序为什么重要？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Temperature 用 $p_i\\propto\\exp(z_i/\\tau)$ 调整分布尖锐程度，$\\tau>0$ 时较小值通常更集中，$\\tau=0$ 应按框架的贪心等特殊规则处理。Top-k 保留固定数量候选，top-p 保留累计概率达到阈值的最小候选集合，其大小随分布变化。\n\n过滤后须重新归一化，多参数联用的执行顺序依实现而定。这些设置控制多样性，不保证事实正确；创作和可验证问答可用不同配置。固定种子有助于复现，但并行数值与运行环境仍可能使贪心或采样结果不能跨环境逐 token 一致。\n`temperature=0` 就绝对不会出现幻觉。\n把 top-p 当作独立地保留概率大于 p 的 token。\n为什么 beam search 在开放生成中可能重复？\ntop-p 与 temperature 的顺序为什么重要？"}, {"id": "INF-009", "category": "INF", "topic": "量化与稀疏推理", "level": "L1", "title": "PTQ、QAT、W4A16 与 per-group quantization 是什么？", "tags": ["Quantization", "PTQ", "QAT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>PTQ 在训练后量化，QAT 在训练中模拟或考虑量化误差。W4A16 表示权重约 4 bit、激活约 16 bit，不表示全部算子都使用 INT4。仿射量化常取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>round\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，反量化为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math> 为 scale，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/math> 为 zero-point。\u003c/p>\u003cp>Per-tensor、per-channel、per-group 分别是量化参数的共享粒度；组越小通常误差更低，也增加元数据和实现成本。总存储还含 scale、zero-point、未量化层与对齐，不能只按参数量乘位宽估算。校准要覆盖部署输入、长度和领域，速度也要结合硬件及内核实测。\u003c/p>\u003cp>INT8/INT4不必比FP16/BF16快：小batch decode若权重带宽是瓶颈，低bit可减少读取；较大batch或prefill若更受GEMM计算约束，反量化、scale和布局转换可能抵消收益。CPU与GPU的kernel支持、SIMD/Tensor Core、shape及线程配置不同，不能给一个脱离硬件的固定速度倍数。基于相同输入/输出长度、batch和质量约束测端到端延迟与吞吐，才能比较量化收益。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>q\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>clip\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>round\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmover accent=\"true\">\u003cmi>x\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>低 bit 一定比 FP16 更快。\u003c/li>\u003cli>把权重量化与 KV cache 量化混成同一项。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>outlier 为什么会增大量化误差？\u003c/li>\u003cli>怎样选择校准集并评估任务精度损失？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "PTQ 在训练后量化，QAT 在训练中模拟或考虑量化误差。W4A16 表示权重约 4 bit、激活约 16 bit，不表示全部算子都使用 INT4。仿射量化常取 $q=\\operatorname{clip}(\\operatorname{round}(x/s)+z)$，反量化为 $\\hat x=s(q-z)$，其中 $s$ 为 scale，$z$ 为 zero-point。\n\nPer-tensor、per-channel、per-group 分别是量化参数的共享粒度；组越小通常误差更低，也增加元数据和实现成本。总存储还含 scale、zero-point、未量化层与对齐，不能只按参数量乘位宽估算。校准要覆盖部署输入、长度和领域，速度也要结合硬件及内核实测。\n\nINT8/INT4不必比FP16/BF16快：小batch decode若权重带宽是瓶颈，低bit可减少读取；较大batch或prefill若更受GEMM计算约束，反量化、scale和布局转换可能抵消收益。CPU与GPU的kernel支持、SIMD/Tensor Core、shape及线程配置不同，不能给一个脱离硬件的固定速度倍数。基于相同输入/输出长度、batch和质量约束测端到端延迟与吞吐，才能比较量化收益。\n低 bit 一定比 FP16 更快。\n把权重量化与 KV cache 量化混成同一项。\noutlier 为什么会增大量化误差？\n怎样选择校准集并评估任务精度损失？"}, {"id": "INF-010", "category": "INF", "topic": "量化与稀疏推理", "level": "L2", "title": "GPTQ 为什么利用二阶信息进行逐层量化？", "tags": ["GPTQ", "PTQ", "Calibration"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GPTQ 用校准输入 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>X\u003c/mi>\u003c/mrow>\u003c/math> 形成近似二阶信息，逐步量化权重，并补偿尚未量化权重的误差，目标是减少原层 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>W\u003c/mi>\u003cmi>X\u003c/mi>\u003c/mrow>\u003c/math> 与量化层 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>W\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmi>X\u003c/mi>\u003c/mrow>\u003c/math> 的输出差异。输入二阶统计反映权重误差对输出的敏感性，比独立 round-to-nearest 更有信息。\u003c/p>\u003cp>工程上按列或块处理和更新以控制成本，通常属于低 bit 权重 PTQ。它仍是有损压缩，效果依赖校准覆盖、分组和阻尼；领域、长上下文或多模态校准错配须通过端到端回归检查。\u003c/p>\u003cp>和 AWQ 比较，GPTQ 用输入二阶统计近似层输出误差，逐步量化并补偿剩余权重；AWQ 用激活统计选择通道缩放，再搜索有利于低 bit 表示的尺度。两者都属于依赖校准数据的权重 PTQ，不能仅凭缩写判断谁更准或更快；公平比较要固定位宽、group size、校准数据、部署内核和真实任务，量化误差与推理速度分别测量。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>GPTQ 会更新底座进行完整反向训练。\u003c/li>\u003cli>把论文中某模型的近乎无损结果推广到所有位宽和场景。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>校准 Hessian 病态时为什么可能需要 damping？\u003c/li>\u003cli>GPTQ 与普通舍入怎样公平比较？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GPTQ 用校准输入 $X$ 形成近似二阶信息，逐步量化权重，并补偿尚未量化权重的误差，目标是减少原层 $WX$ 与量化层 $\\hat WX$ 的输出差异。输入二阶统计反映权重误差对输出的敏感性，比独立 round-to-nearest 更有信息。\n\n工程上按列或块处理和更新以控制成本，通常属于低 bit 权重 PTQ。它仍是有损压缩，效果依赖校准覆盖、分组和阻尼；领域、长上下文或多模态校准错配须通过端到端回归检查。\n\n和 AWQ 比较，GPTQ 用输入二阶统计近似层输出误差，逐步量化并补偿剩余权重；AWQ 用激活统计选择通道缩放，再搜索有利于低 bit 表示的尺度。两者都属于依赖校准数据的权重 PTQ，不能仅凭缩写判断谁更准或更快；公平比较要固定位宽、group size、校准数据、部署内核和真实任务，量化误差与推理速度分别测量。\nGPTQ 会更新底座进行完整反向训练。\n把论文中某模型的近乎无损结果推广到所有位宽和场景。\n校准 Hessian 病态时为什么可能需要 damping？\nGPTQ 与普通舍入怎样公平比较？"}, {"id": "INF-011", "category": "INF", "topic": "量化与稀疏推理", "level": "L2", "title": "AWQ 怎样保护重要权重，是否把 1% 权重保留为 FP16？", "tags": ["AWQ", "ActivationAware", "WeightOnly"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>AWQ 利用激活统计识别重要权重通道，通过放大对应权重、对激活逆缩放，在未量化时保持线性结果等价，降低低 bit 量化误差。敏感性要结合激活幅度，单看权重绝对值不足以判断。\u003c/p>\u003cp>Scale 由离线校准搜索，正式方案不需完整梯度训练。论文讨论少量显著权重的重要性，但正式 AWQ 避免硬件不友好的混合精度，因此不能简化为把 1% 权重保留 FP16。部署仍需有效的 weight-only 内核，并实测任务精度、长度与硬件速度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 AWQ 的启发性实验混成最终采用的混合精度方案。\u003c/li>\u003cli>AWQ 只看权重统计，不看激活。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么通道缩放能改变量化误差却不改变未量化输出？\u003c/li>\u003cli>AWQ 与 GPTQ 的校准目标有何差别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "AWQ 利用激活统计识别重要权重通道，通过放大对应权重、对激活逆缩放，在未量化时保持线性结果等价，降低低 bit 量化误差。敏感性要结合激活幅度，单看权重绝对值不足以判断。\n\nScale 由离线校准搜索，正式方案不需完整梯度训练。论文讨论少量显著权重的重要性，但正式 AWQ 避免硬件不友好的混合精度，因此不能简化为把 1% 权重保留 FP16。部署仍需有效的 weight-only 内核，并实测任务精度、长度与硬件速度。\n把 AWQ 的启发性实验混成最终采用的混合精度方案。\nAWQ 只看权重统计，不看激活。\n为什么通道缩放能改变量化误差却不改变未量化输出？\nAWQ 与 GPTQ 的校准目标有何差别？"}, {"id": "INF-012", "category": "INF", "topic": "量化与稀疏推理", "level": "L2", "title": "SmoothQuant 为什么把激活的量化困难迁移到权重？", "tags": ["SmoothQuant", "W8A8", "Outlier"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>SmoothQuant 针对激活少数大值通道造成的量化困难，用离线等价通道缩放压低激活、相应放大权重，让两者更适合 W8A8。线性层可写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsup>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/math> 是按输入通道定义的可逆正对角矩阵。\u003c/p>\u003cp>缩放前浮点函数等价，量化后仍有误差；平滑系数需平衡两边动态范围，压低一方也可能增大另一方的误差。缩放可吸收到相关参数，减少额外运行操作，实际效果取决于激活量化粒度、代表性校准长度和 INT8 硬件支持。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsup>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>浮点等价变换就意味着量化后零误差。\u003c/li>\u003cli>把 SmoothQuant 一概称为 W4A16 权重量化。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么逐输入通道激活 scale 不一定适合常规 INT8 GEMM？\u003c/li>\u003cli>部署输入出现新 outlier 时怎么办？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "SmoothQuant 针对激活少数大值通道造成的量化困难，用离线等价通道缩放压低激活、相应放大权重，让两者更适合 W8A8。线性层可写为 $XW=(XS^{-1})(SW)$，$S$ 是按输入通道定义的可逆正对角矩阵。\n\n缩放前浮点函数等价，量化后仍有误差；平滑系数需平衡两边动态范围，压低一方也可能增大另一方的误差。缩放可吸收到相关参数，减少额外运行操作，实际效果取决于激活量化粒度、代表性校准长度和 INT8 硬件支持。\n浮点等价变换就意味着量化后零误差。\n把 SmoothQuant 一概称为 W4A16 权重量化。\n为什么逐输入通道激活 scale 不一定适合常规 INT8 GEMM？\n部署输入出现新 outlier 时怎么办？"}, {"id": "INF-013", "category": "INF", "topic": "解码与采样策略", "level": "L3", "title": "投机解码怎样保证目标模型的采样分布？", "tags": ["SpeculativeDecoding", "拒绝采样", "加速"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>投机解码用便宜的 draft 模型提出多个 token，由 target 并行验证并执行接受/修正采样。对草稿分布 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>q\u00
