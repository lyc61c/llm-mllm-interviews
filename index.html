mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">U\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>D\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>漏写第二次线性变换或 bias，并将原论文激活写成所有现代 LLM 都使用的配置。\u003c/li>\u003cli>说 position-wise 参数不共享，或把 FFN 的同位置变换误认为能直接读取别的位置。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若无 bias 和非线性，两层 FFN 的等效矩阵秩受什么限制？\u003c/li>\u003cli>为什么同参数预算下 SwiGLU 的中间宽度常小于 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FFN 对每个 token 独立做通道变换：原始 Transformer 用升维线性层、ReLU 和降维线性层。按行向量约定，$\\operatorname{FFN}(x)=\\operatorname{ReLU}(xW_1+b_1)W_2+b_2$，`x:[D]`、`W_1:[D,m]`、`W_2:[m,D]`；对 `X:[B,T,D]` 沿最后一轴执行，输出形状不变。原始 base 模型取 $D=512,m=2048$。\n\nPosition-wise 表示同一层各 token 使用相同参数，不直接混合不同 token；不同层通常各有参数。跨 token 信息由 attention 等模块汇聚，FFN 增加各位置的非线性组合与容量。若去掉非线性，两层仿射可合并为 $x(W_1W_2)+(b_1W_2+b_2)$，单纯增加中间宽度没有同样的表达收益。\n\n现代 SwiGLU 常写为 $(\\operatorname{SiLU}(xW_g)\\odot xW_u)W_d$，包含 gate/up/down 三个矩阵，bias 由模型决定；它增加逐元素门控，并非只替换激活名称。忽略 bias，原 FFN 参数约为 $2Dm$，SwiGLU 约为 $3Dm$；若匹配原来 $m=4D$ 的 $8D^2$ 预算，SwiGLU 中间宽度约取 $8D/3$，再按硬件对齐。宽度、激活与融合内核都影响容量、激活显存和吞吐。\n漏写第二次线性变换或 bias，并将原论文激活写成所有现代 LLM 都使用的配置。\n说 position-wise 参数不共享，或把 FFN 的同位置变换误认为能直接读取别的位置。\n若无 bias 和非线性，两层 FFN 的等效矩阵秩受什么限制？\n为什么同参数预算下 SwiGLU 的中间宽度常小于 $4D$？"}, {"id": "TFM-011", "category": "TFM", "topic": "复杂度与实现机制", "level": "L2", "title": "Transformer 一层的时间、空间复杂度如何估算？", "tags": ["复杂度", "FLOPs", "Attention"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>设序列长度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>、隐藏维度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math>，一层 Transformer 的主要计算是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0002B;\u003c/mo>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，同时包含线性投影/FFN 与注意力的两两交互。QKV/O 投影约需 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>T\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 次乘加，FFN 按中间维度另算；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 合计约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math> 次乘加。按 FLOPs 统计时，一次乘加通常算 2 FLOPs。\u003c/p>\u003cp>朴素多头注意力分数约保存 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 个元素，实际峰值还包括其他激活和工作区。FlashAttention 可避免完整中间矩阵的显存存储，但精确稠密注意力的算术量仍为二次。短序列、大隐藏维度时线性层可能占主导，长序列时二次项更明显。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0002B;\u003c/mo>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只报 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 而不说明 d、投影与 FFN。\u003c/li>\u003cli>把 FlashAttention 说成改变了精确注意力的二次算术复杂度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>使用 KV cache 后单步注意力复杂度如何变化？\u003c/li>\u003cli>为什么 FLOPs 更少的实现可能实际更慢？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "设序列长度为 $T$、隐藏维度为 $d$，一层 Transformer 的主要计算是 $O(Td^2+T^2d)$，同时包含线性投影/FFN 与注意力的两两交互。QKV/O 投影约需 $4Td^2$ 次乘加，FFN 按中间维度另算；$QK^\\top$ 与 $AV$ 合计约 $2T^2d$ 次乘加。按 FLOPs 统计时，一次乘加通常算 2 FLOPs。\n\n朴素多头注意力分数约保存 $BhT^2$ 个元素，实际峰值还包括其他激活和工作区。FlashAttention 可避免完整中间矩阵的显存存储，但精确稠密注意力的算术量仍为二次。短序列、大隐藏维度时线性层可能占主导，长序列时二次项更明显。\n只报 $O(T^2)$ 而不说明 d、投影与 FFN。\n把 FlashAttention 说成改变了精确注意力的二次算术复杂度。\n使用 KV cache 后单步注意力复杂度如何变化？\n为什么 FLOPs 更少的实现可能实际更慢？"}, {"id": "TFM-012", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L1", "title": "残差连接为什么能帮助深层模型训练？", "tags": ["Residual", "梯度", "稳定训练"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>残差连接 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 让子层学习输入表示的修正，并为信号和梯度提供直接路径。两支形状须一致；若改用投影支路 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，直接支路的 Jacobian 为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>P\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。残差相加不会像 concat 一样扩大特征维，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02248;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 时可接近恒等传递。\u003c/p>\u003cp>简单块的 Jacobian 为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>F\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，反传为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>F\u003c/mi>\u003c/msub>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/math>。多层仍需连乘各块导数，若 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>F\u003c/mi>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math> 还会相互抵消，所以恒等项并不保证梯度永远稳定。\u003c/p>\u003cp>原始 Transformer 的 PostNorm 是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，完整导数还含 LN 和 dropout；attention、FFN 各有残差与归一化。常见 PreNorm 为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，直接支路不经过该块 LN，通常有助于深层优化。随深度增加仍应检查残差尺度、激活方差、溢出和梯度范数，并结合初始化、学习率与最终 norm 判断稳定性。\u003c/p>\u003cp>原始 encoder 每层有 2 条围绕子层的残差，分别对应 self-attention 与 FFN；原始 encoder-decoder 中的 decoder 每层有 3 条，分别对应 masked self-attention、cross-attention 与 FFN。GPT 类 decoder-only 通常不含 cross-attention，所以常见块为 2 条。说“Transformer 有几个残差”要先指定每层还是全网以及具体架构，不能把 decoder-only 和原始 decoder 混算。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>y\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>F\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>声称残差能让任何深度和初始化的网络梯度恒为 1。\u003c/li>\u003cli>混淆 PostNorm/PreNorm，或把投影 shortcut 当成严格恒等支路。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>PostNorm 为什么不能直接套用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>J\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>J\u003c/mi>\u003cmi>F\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 作为完整块导数？\u003c/li>\u003cli>将残差支路乘以 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003c/math> 后，Jacobian 与激活尺度如何变化？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "残差连接 $y=x+F(x)$ 让子层学习输入表示的修正，并为信号和梯度提供直接路径。两支形状须一致；若改用投影支路 $y=P(x)+F(x)$，直接支路的 Jacobian 为 $J_P$。残差相加不会像 concat 一样扩大特征维，$F(x)\\approx0$ 时可接近恒等传递。\n\n简单块的 Jacobian 为 $I+J_F$，反传为 $\\partial L/\\partial x=(I+J_F)^\\top\\partial L/\\partial y$。多层仍需连乘各块导数，若 $J_F\\approx-I$ 还会相互抵消，所以恒等项并不保证梯度永远稳定。\n\n原始 Transformer 的 PostNorm 是 $\\operatorname{LN}(x+\\operatorname{Dropout}(F(x)))$，完整导数还含 LN 和 dropout；attention、FFN 各有残差与归一化。常见 PreNorm 为 $x+\\operatorname{Dropout}(F(\\operatorname{LN}(x)))$，直接支路不经过该块 LN，通常有助于深层优化。随深度增加仍应检查残差尺度、激活方差、溢出和梯度范数，并结合初始化、学习率与最终 norm 判断稳定性。\n\n原始 encoder 每层有 2 条围绕子层的残差，分别对应 self-attention 与 FFN；原始 encoder-decoder 中的 decoder 每层有 3 条，分别对应 masked self-attention、cross-attention 与 FFN。GPT 类 decoder-only 通常不含 cross-attention，所以常见块为 2 条。说“Transformer 有几个残差”要先指定每层还是全网以及具体架构，不能把 decoder-only 和原始 decoder 混算。\n声称残差能让任何深度和初始化的网络梯度恒为 1。\n混淆 PostNorm/PreNorm，或把投影 shortcut 当成严格恒等支路。\nPostNorm 为什么不能直接套用 $J=I+J_F$ 作为完整块导数？\n将残差支路乘以 $\\alpha$ 后，Jacobian 与激活尺度如何变化？"}, {"id": "TFM-016", "category": "TFM", "topic": "注意力机制与掩码", "level": "L1", "title": "Cross-attention 与 self-attention 有何区别，Q/K/V 从哪里来？", "tags": ["CrossAttention", "QKV", "EncoderDecoder", "多模态"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Self-attention 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 来自同一序列；cross-attention 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/math> 来自需要更新的目标表示，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 来自另一组条件或 memory。设 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>X\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。两边原始维度与长度可不同，只需投影后的 Q/K 维度都为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>；单头输出为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，多头经 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 回到目标 hidden 维。\u003c/p>\u003cp>Encoder-Decoder 用 decoder 状态查询完整已知源 memory，同时 decoder 自身保持因果 self-attention，因此 cross-attention 无需三角 mask 也能保持自回归性。视觉/音频条件生成可让语言状态查询模态特征，也可让学习的 latent query 汇聚图像；查询方向决定更新哪一组表示。K/V 对应同一 memory 集合，来源不同本身不保证语义对齐。\u003c/p>\u003cp>注意力乘法约需 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，投影另计，分数矩阵是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。Query 数决定输出 token 数，K/V 数决定条件粒度；压缩条件能省成本，也可能丢细节。固定 memory 的各层 K/V 投影可缓存，变化的 Q 仍需计算。应屏蔽条件 padding 与不可用内容，流式任务不能读取尚未到达的信息；权重大小也不保证事实正确或因果解释。\u003c/p>\u003cp>加性attention可写s(q,k)=vᵀtanh(W_qq+W_kk+b)，点积attention则用qᵀk或带双线性投影的qᵀWk。前者在匹配网络里引入非线性，后者更容易批量组织成高效GEMM；两者都需归一化并聚合value，没有脱离维度、kernel和任务的恒定性能排名。传统RNN seq2seq的attention也是cross-attention，用decoder状态查询encoder各时刻状态，避免只依赖单一固定向量。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>CrossAttn\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>C\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>要求 cross-attention 两边输入长度或原始 embedding 维度完全相同。\u003c/li>\u003cli>认为所有 cross-attention 都必须采用 decoder self-attention 的三角 mask。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>固定 encoder memory 的 K/V cache 与 decoder 历史 KV cache 有何区别？\u003c/li>\u003cli>可学习 query 压缩视觉 token 时，信息瓶颈主要出现在哪里？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Self-attention 的 $Q/K/V$ 来自同一序列；cross-attention 的 $Q$ 来自需要更新的目标表示，$K/V$ 来自另一组条件或 memory。设 $X\\in\\mathbb R^{L_q\\times d_x}$、$C\\in\\mathbb R^{L_k\\times d_c}$，取 $Q=XW_Q$、$K=CW_K$、$V=CW_V$。两边原始维度与长度可不同，只需投影后的 Q/K 维度都为 $d_k$；单头输出为 $L_q\\times d_v$，多头经 $W_O$ 回到目标 hidden 维。\n\nEncoder-Decoder 用 decoder 状态查询完整已知源 memory，同时 decoder 自身保持因果 self-attention，因此 cross-attention 无需三角 mask 也能保持自回归性。视觉/音频条件生成可让语言状态查询模态特征，也可让学习的 latent query 汇聚图像；查询方向决定更新哪一组表示。K/V 对应同一 memory 集合，来源不同本身不保证语义对齐。\n\n注意力乘法约需 $O(L_qL_kd)$，投影另计，分数矩阵是 $L_q\\times L_k$。Query 数决定输出 token 数，K/V 数决定条件粒度；压缩条件能省成本，也可能丢细节。固定 memory 的各层 K/V 投影可缓存，变化的 Q 仍需计算。应屏蔽条件 padding 与不可用内容，流式任务不能读取尚未到达的信息；权重大小也不保证事实正确或因果解释。\n\n加性attention可写s(q,k)=vᵀtanh(W_qq+W_kk+b)，点积attention则用qᵀk或带双线性投影的qᵀWk。前者在匹配网络里引入非线性，后者更容易批量组织成高效GEMM；两者都需归一化并聚合value，没有脱离维度、kernel和任务的恒定性能排名。传统RNN seq2seq的attention也是cross-attention，用decoder状态查询encoder各时刻状态，避免只依赖单一固定向量。\n要求 cross-attention 两边输入长度或原始 embedding 维度完全相同。\n认为所有 cross-attention 都必须采用 decoder self-attention 的三角 mask。\n固定 encoder memory 的 K/V cache 与 decoder 历史 KV cache 有何区别？\n可学习 query 压缩视觉 token 时，信息瓶颈主要出现在哪里？"}, {"id": "TFM-019", "category": "TFM", "topic": "位置编码与长上下文", "level": "L1", "title": "Transformer 为什么需要位置编码？绝对、相对、RoPE 与 ALiBi 怎样比较？", "tags": ["PositionalEncoding", "Sinusoidal", "RelativeBias", "RoPE", "ALiBi"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>没有位置线索且可见性同步置换的全连接 self-attention 满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>Attn\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>Attn\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>：输入置换会同步置换 Q/K/V 和 score 行列，模型难以充分辨别顺序。因果 mask 能提供部分顺序信息，但实际位置方案与训练分布仍要考虑。\u003c/p>\u003cp>绝对位置可用可学习查表，也可用正弦/余弦编码并加到 embedding。原始公式对位置 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math>、频率对 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/math> 使用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>sin\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsup>\u003cmn>10000\u003c/mn>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 和 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>cos\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsup>\u003cmn>10000\u003c/mn>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，不同频率提供不同尺度，固定位置差可通过同频率的二维旋转联系。能计算新位置不等于可靠长度外推。\u003c/p>\u003cp>相对位置可直接改变注意力分数，例如 T5 的可学习距离桶偏置；多个距离共享一个桶参数，范围仍会限制表达。RoPE 对 Q/K 做位置旋转，让点积依赖位置差，通常不旋转 V；ALiBi 在因果分数中加 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，原方案各头斜率固定。这些方案作用部位不同，不能未经训练转换就替换底座。\u003c/p>\u003cp>比较时明确插入位置、训练长度、位置编号、旋转维度和频率、距离桶、mask 及缓存。扩展上下文还须评估长样本训练、插值/缩放、内核显存与长文任务表现，单纯提高配置上限不保证检索或推理效果。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Attn\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>Attn\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>PE\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>sin\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsup>\u003cmn>10000\u003c/mn>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>PE\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsup>\u003cmn>10000\u003c/mn>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>bias\u003c/mo>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>绝对编码一定不能表达相对关系，或相对编码天然无限长度无退化。\u003c/li>\u003cli>将 ALiBi 写成加到 token embedding 的可训练位置向量，或把 RoPE 写成同样的加法。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>置换等变性与置换不变性分别是什么意思？\u003c/li>\u003cli>为什么无参数的正弦编码仍可能在超出训练长度时失败？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "没有位置线索且可见性同步置换的全连接 self-attention 满足 $\\operatorname{Attn}(PX)=P\\operatorname{Attn}(X)$：输入置换会同步置换 Q/K/V 和 score 行列，模型难以充分辨别顺序。因果 mask 能提供部分顺序信息，但实际位置方案与训练分布仍要考虑。\n\n绝对位置可用可学习查表，也可用正弦/余弦编码并加到 embedding。原始公式对位置 $m$、频率对 $j$ 使用 $\\sin(m/10000^{2j/D})$ 和 $\\cos(m/10000^{2j/D})$，不同频率提供不同尺度，固定位置差可通过同频率的二维旋转联系。能计算新位置不等于可靠长度外推。\n\n相对位置可直接改变注意力分数，例如 T5 的可学习距离桶偏置；多个距离共享一个桶参数，范围仍会限制表达。RoPE 对 Q/K 做位置旋转，让点积依赖位置差，通常不旋转 V；ALiBi 在因果分数中加 $-m_h(i-j)$，原方案各头斜率固定。这些方案作用部位不同，不能未经训练转换就替换底座。\n\n比较时明确插入位置、训练长度、位置编号、旋转维度和频率、距离桶、mask 及缓存。扩展上下文还须评估长样本训练、插值/缩放、内核显存与长文任务表现，单纯提高配置上限不保证检索或推理效果。\n绝对编码一定不能表达相对关系，或相对编码天然无限长度无退化。\n将 ALiBi 写成加到 token embedding 的可训练位置向量，或把 RoPE 写成同样的加法。\n置换等变性与置换不变性分别是什么意思？\n为什么无参数的正弦编码仍可能在超出训练长度时失败？"}, {"id": "TFM-020", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L1", "title": "Dropout 如何正则化？原始 Transformer 把它放在哪里？", "tags": ["Dropout", "正则化", "原始Transformer", "Post-LN"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Dropout 在训练时随机置零激活，inverted dropout 把保留值除以保留概率：\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>&#x0007E;\u003c/mi>\u003cmo>Bernoulli\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>0\u003c/mn>\u003cmo>&#x02264;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0003C;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>，故 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。它引入随机扰动，减少对共同激活模式的依赖，不会永久删除参数；单个层的期望保持也不意味着经过非线性和归一化的整个网络期望完全不变。\u003c/p>\u003cp>原始 Transformer 在各子层输出上使用 dropout，再与输入相加并做 PostNorm，即 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>Sublayer\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；编码器和解码器的 embedding 与位置编码之和也使用 dropout，base 模型概率为 0.1。现代模型的概率与插入位置要按配置确认。\u003c/p>\u003cp>\u003ccode>nn.Dropout\u003c/code> 在 eval 模式是恒等映射，但 SDPA 的 \u003ccode>dropout_p\u003c/code> 由调用者显式控制，评估时须传 0。原论文 residual dropout 的描述也不能直接推定所有现代实现的 attention probability dropout 或 FFN 内部 dropout。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmi>&#x0007E;\u003c/mi>\u003cmo>Bernoulli\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmn>0\u003c/mn>\u003cmo>&#x02264;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0003C;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi mathvariant=\"double-struck\">E\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmsubsup>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>z\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>Sublayer\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>h\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmspace width=\"0.167em\" />\u003cmo>Embedding\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>PE\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 p 当作保留概率，或在训练和推理阶段重复做 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 缩放。\u003c/li>\u003cli>把现代实现的所有 Dropout 位置都归因于原始论文，或把 \u003ccode>nn.Dropout\u003c/code> 默认 0.5 说成 Transformer 标准值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>推导 inverted dropout 的条件方差，并解释为何 p 越大扰动越强。\u003c/li>\u003cli>如果只调用 \u003ccode>model.eval()\u003c/code>，为什么直接调用 SDPA 时仍可能出现随机输出？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Dropout 在训练时随机置零激活，inverted dropout 把保留值除以保留概率：$m_i\\sim\\operatorname{Bernoulli}(1-p)$、$y_i=m_ix_i/(1-p)$，其中 $0\\le p\u003c1$，故 $\\mathbb E[y_i\\mid x_i]=x_i$。它引入随机扰动，减少对共同激活模式的依赖，不会永久删除参数；单个层的期望保持也不意味着经过非线性和归一化的整个网络期望完全不变。\n\n原始 Transformer 在各子层输出上使用 dropout，再与输入相加并做 PostNorm，即 $\\operatorname{LN}(x+\\operatorname{Dropout}(\\operatorname{Sublayer}(x)))$；编码器和解码器的 embedding 与位置编码之和也使用 dropout，base 模型概率为 0.1。现代模型的概率与插入位置要按配置确认。\n\n`nn.Dropout` 在 eval 模式是恒等映射，但 SDPA 的 `dropout_p` 由调用者显式控制，评估时须传 0。原论文 residual dropout 的描述也不能直接推定所有现代实现的 attention probability dropout 或 FFN 内部 dropout。\n把 p 当作保留概率，或在训练和推理阶段重复做 $1/(1-p)$ 缩放。\n把现代实现的所有 Dropout 位置都归因于原始论文，或把 `nn.Dropout` 默认 0.5 说成 Transformer 标准值。\n推导 inverted dropout 的条件方差，并解释为何 p 越大扰动越强。\n如果只调用 `model.eval()`，为什么直接调用 SDPA 时仍可能出现随机输出？"}, {"id": "TFM-021", "category": "TFM", "topic": "注意力机制与掩码", "level": "L2", "title": "Attention 权重如何学到？权重较大就能解释模型决策吗？", "tags": ["Attention", "QK", "反向传播", "可解释性", "张量形状"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>标准点积注意力权重是输入经 Q/K 投影、点积和 softmax 动态计算的激活，不是独立可训练的注意力表。对 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>X\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>softmax\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>；同一组参数在不同输入上产生不同 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>任务损失经汇聚、softmax 与点积反传。令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>，则 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，随后 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmi>K\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>，更新投影和上游表征。模型还可能学习位置偏置等参数，但训练目标未必直接监督注意力图；固定 mask 下，被屏蔽位置的分数梯度为零。\u003c/p>\u003cp>高权重只说明该层该头的相对加权关系，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 的方向与幅值、其他头、输出投影、残差和后续层都会改变最终影响。热力图可以描述局部计算，因果解释仍需消融、扰动和基线诊断，并注意扰动造成的分布变化。关于注意力解释性的研究存在不同诊断结论，其实验局限于具体模型与任务，不能概括为所有模型的注意力永远不能解释。\u003c/p>\u003cp>Attention的token混合矩阵随当前输入Q/K动态变化；全连接层的W在一次前向中固定，通常不随样本即时生成。Transformer的FFN虽非线性，却在每个位置独立使用共享参数，不能独自完成跨token汇聚。若Q=K，打分矩阵为Gram矩阵，在不对称mask之前具有对称性，但softmax归一化和mask可使权重不对称，也不必退化成单位阵；不同Q/K投影允许更灵活的有向匹配。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>A\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>softmax\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>O\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>G\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>K\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>X\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>D\u003c/mi>\u003cmi>K\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说 softmax 中每个注意力权重都是独立学习参数，忽略 Q/K 与输入。\u003c/li>\u003cli>把注意力热力图当作最终预测的充分因果解释，或把特定 RNN 实验结论泛化到所有 LLM。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>softmax 的行内归一化为什么会让一个位置的梯度依赖其他位置？\u003c/li>\u003cli>两个注意力图差异很大但输出相近，能推出哪些结论，不能推出哪些结论？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "标准点积注意力权重是输入经 Q/K 投影、点积和 softmax 动态计算的激活，不是独立可训练的注意力表。对 $X\\in\\mathbb R^{n\\times d_{\\rm model}}$，$Q=XW_Q$、$K=XW_K$、$V=XW_V$，$A=\\operatorname{softmax}_{\\rm row}(QK^\\top/\\sqrt{d_k}+M)$，$O=AV$；同一组参数在不同输入上产生不同 $A$。\n\n任务损失经汇聚、softmax 与点积反传。令 $G=\\partial L/\\partial A$，则 $D_{ij}=\\partial L/\\partial S_{ij}=A_{ij}(G_{ij}-\\sum_kA_{ik}G_{ik})$，随后 $\\partial L/\\partial Q=DK/\\sqrt{d_k}$、$\\partial L/\\partial K=D^\\top Q/\\sqrt{d_k}$，更新投影和上游表征。模型还可能学习位置偏置等参数，但训练目标未必直接监督注意力图；固定 mask 下，被屏蔽位置的分数梯度为零。\n\n高权重只说明该层该头的相对加权关系，$V$ 的方向与幅值、其他头、输出投影、残差和后续层都会改变最终影响。热力图可以描述局部计算，因果解释仍需消融、扰动和基线诊断，并注意扰动造成的分布变化。关于注意力解释性的研究存在不同诊断结论，其实验局限于具体模型与任务，不能概括为所有模型的注意力永远不能解释。\n\nAttention的token混合矩阵随当前输入Q/K动态变化；全连接层的W在一次前向中固定，通常不随样本即时生成。Transformer的FFN虽非线性，却在每个位置独立使用共享参数，不能独自完成跨token汇聚。若Q=K，打分矩阵为Gram矩阵，在不对称mask之前具有对称性，但softmax归一化和mask可使权重不对称，也不必退化成单位阵；不同Q/K投影允许更灵活的有向匹配。\n说 softmax 中每个注意力权重都是独立学习参数，忽略 Q/K 与输入。\n把注意力热力图当作最终预测的充分因果解释，或把特定 RNN 实验结论泛化到所有 LLM。\nsoftmax 的行内归一化为什么会让一个位置的梯度依赖其他位置？\n两个注意力图差异很大但输出相近，能推出哪些结论，不能推出哪些结论？"}, {"id": "TFM-022", "category": "TFM", "topic": "复杂度与实现机制", "level": "L1", "title": "Transformer 为什么适合建模长距离依赖？O(1) 路径意味着什么？", "tags": ["长距离依赖", "复杂度", "Self-Attention", "计算图", "因果Mask"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>全局 self-attention 让允许交互的远距离位置在一层内直接交换信息，最长位置通信路径为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；RNN 对相隔 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00398;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 步的位置通常需经过 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00398;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 次递归传递。短路径有利于信息和梯度传播，但是否学好依赖仍取决于数据、参数、位置编码、优化与任务。\u003c/p>\u003cp>这里的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 指计算图路径，不是运行时间。序列长 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>、宽度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math> 时，稠密 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math> 和 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 计算为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，显式多头权重存储为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；若 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x00398;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，投影与 FFN 使单层总计算为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。训练时同层 query 可并行计算，但自回归生成下一 token 仍依赖已生成历史。\u003c/p>\u003cp>直接路径也受 mask 限制：因果注意力只能读取历史，局部窗口需跨层传播，固定窗口尺度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 时远距路径通常随 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 增长。有效上下文还受模型窗口与位置方案限制，短路径不保证长上下文准确率。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x02113;\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>&#x02113;\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>d\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x00398;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x02113;\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把常数通信路径说成常数时间或线性计算复杂度。\u003c/li>\u003cli>以全局注意力的结论描述局部窗口模型，或声称短路径自动解决所有长依赖问题。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>局部窗口半径 r 固定时，距离 n 的位置需要多少层才能建立通信？\u003c/li>\u003cli>训练时的同层并行与自回归解码的逐 token 依赖有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "全局 self-attention 让允许交互的远距离位置在一层内直接交换信息，最长位置通信路径为 $O(1)$；RNN 对相隔 $\\Theta(n)$ 步的位置通常需经过 $\\Theta(n)$ 次递归传递。短路径有利于信息和梯度传播，但是否学好依赖仍取决于数据、参数、位置编码、优化与任务。\n\n这里的 $O(1)$ 指计算图路径，不是运行时间。序列长 $n$、宽度 $d$ 时，稠密 $QK^\\top$ 和 $AV$ 计算为 $O(n^2d)$，显式多头权重存储为 $O(hn^2)$；若 $d_{\\rm ff}=\\Theta(d)$，投影与 FFN 使单层总计算为 $O(n^2d+nd^2)$。训练时同层 query 可并行计算，但自回归生成下一 token 仍依赖已生成历史。\n\n直接路径也受 mask 限制：因果注意力只能读取历史，局部窗口需跨层传播，固定窗口尺度 $r$ 时远距路径通常随 $n/r$ 增长。有效上下文还受模型窗口与位置方案限制，短路径不保证长上下文准确率。\n把常数通信路径说成常数时间或线性计算复杂度。\n以全局注意力的结论描述局部窗口模型，或声称短路径自动解决所有长依赖问题。\n局部窗口半径 r 固定时，距离 n 的位置需要多少层才能建立通信？\n训练时的同层并行与自回归解码的逐 token 依赖有什么区别？"}, {"id": "TFM-023", "category": "TFM", "topic": "注意力机制与掩码", "level": "L2", "title": "所谓 Negative Attention 是什么？低权重、负 logit 与负输出有何区别？", "tags": ["Negative Attention", "Softmax", "Logit", "术语辨析", "Mask"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 Transformer 没有名为 Negative Attention 的标准组件。标准 softmax 在每行至少有一个允许位置时，有限未屏蔽 logits 的权重为正，被 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmo>&#x0221E;\u003c/mo>\u003c/mrow>\u003c/math> mask 的位置为零，行和为 1。因此低权重、负 logit 与负输出是不同概念。\u003c/p>\u003cp>Logit 是归一化前的分数，可以为负，如 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02248;\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmn>0.269\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>0.731\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>；整行加同一常数不改变分布，绝对正负不决定关注程度。即使权重全非负，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>O\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 的分量仍可为负，如 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>0.5\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>0.5\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>，投影和残差也会产生负分量。\u003c/p>\u003cp>减小权重仅减少相对于其他 value 的份额，是否抑制最终答案还取决于 value、投影与目标；加负 bias 也不会直接生成负 softmax 权重。若指某篇论文的 signed attention、差分构造或同名方法，应先核对公式、系数范围与归一化定义，不能因原始 Transformer 未定义该组件就否认其他研究的命名。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmstyle displaystyle=\"true\" scriptlevel=\"0\" />\u003cmfrac>\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">J\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi>j\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">J\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi>j\u003c/mi>\u003cmo>&#x02209;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">J\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>O\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmn>0.5\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>0.5\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把负 logit、接近零的非负权重与负 value/输出混为一谈。\u003c/li>\u003cli>为了纠正术语而断言全世界没有任何使用 Negative Attention 名称的论文或方法。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么把所有 logit 同时减去最大值不会改变注意力分布？\u003c/li>\u003cli>如果一种方法允许聚合系数为负，它还满足 softmax 概率权重的哪些性质？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 Transformer 没有名为 Negative Attention 的标准组件。标准 softmax 在每行至少有一个允许位置时，有限未屏蔽 logits 的权重为正，被 $-\\infty$ mask 的位置为零，行和为 1。因此低权重、负 logit 与负输出是不同概念。\n\nLogit 是归一化前的分数，可以为负，如 $\\operatorname{softmax}([-2,-1])\\approx[0.269,0.731]$；整行加同一常数不改变分布，绝对正负不决定关注程度。即使权重全非负，$O_i=\\sum_jA_{ij}V_j$ 的分量仍可为负，如 $0.5(-3)+0.5(1)=-1$，投影和残差也会产生负分量。\n\n减小权重仅减少相对于其他 value 的份额，是否抑制最终答案还取决于 value、投影与目标；加负 bias 也不会直接生成负 softmax 权重。若指某篇论文的 signed attention、差分构造或同名方法，应先核对公式、系数范围与归一化定义，不能因原始 Transformer 未定义该组件就否认其他研究的命名。\n把负 logit、接近零的非负权重与负 value/输出混为一谈。\n为了纠正术语而断言全世界没有任何使用 Negative Attention 名称的论文或方法。\n为什么把所有 logit 同时减去最大值不会改变注意力分布？\n如果一种方法允许聚合系数为负，它还满足 softmax 概率权重的哪些性质？"}, {"id": "TFM-024", "category": "TFM", "topic": "位置编码与长上下文", "level": "L2", "title": "递归、乘性、卷积与复数位置表示怎样提供顺序信息？", "tags": ["位置编码", "FLOATER", "Complex Order"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>位置表示可以通过不同结构注入顺序。递归方案由初始状态逐步生成位置向量，FLOATER 进一步用神经 ODE 描述位置上的连续演化；参数可学习，但数值求解或递推有计算成本，能生成更远位置不保证可靠外推。乘性方案用位置相关向量调制 token 表示，例如逐元素相乘，改变的是特征幅度或相位；这只是一类构造，不能据此断言一定优于加法。\u003c/p>\u003cp>卷积核的偏移提供局部相对顺序，零填充边界还可能让 CNN 学到绝对位置线索；它与显式位置表不同，平移等变性也受边界条件影响。Complex Order 用复数的模与相位同时表示词和顺序，可写为 r·exp(i(ωm+θ))，原方法研究复数网络。RoPE 则在实数 Q/K 的二维子空间旋转，也可用复数乘法解释，但不要求整个 Transformer 改成复数模型。比较时检查位置作用于输入、分数还是 Q/K，是否影响并行、缓存和长度泛化。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>z\u003c/mi>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>&#x00069;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C9;\u003c/mi>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>m\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把所有复数位置表示都等同于 RoPE。\u003c/li>\u003cli>把卷积零填充带来的绝对位置线索理解为无边界条件下也严格成立。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>位置相乘为什么不必然得到只依赖位置差的点积？\u003c/li>\u003cli>ODE 位置表示如何影响预计算与推理缓存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "位置表示可以通过不同结构注入顺序。递归方案由初始状态逐步生成位置向量，FLOATER 进一步用神经 ODE 描述位置上的连续演化；参数可学习，但数值求解或递推有计算成本，能生成更远位置不保证可靠外推。乘性方案用位置相关向量调制 token 表示，例如逐元素相乘，改变的是特征幅度或相位；这只是一类构造，不能据此断言一定优于加法。\n\n卷积核的偏移提供局部相对顺序，零填充边界还可能让 CNN 学到绝对位置线索；它与显式位置表不同，平移等变性也受边界条件影响。Complex Order 用复数的模与相位同时表示词和顺序，可写为 r·exp(i(ωm+θ))，原方法研究复数网络。RoPE 则在实数 Q/K 的二维子空间旋转，也可用复数乘法解释，但不要求整个 Transformer 改成复数模型。比较时检查位置作用于输入、分数还是 Q/K，是否影响并行、缓存和长度泛化。\n把所有复数位置表示都等同于 RoPE。\n把卷积零填充带来的绝对位置线索理解为无边界条件下也严格成立。\n位置相乘为什么不必然得到只依赖位置差的点积？\nODE 位置表示如何影响预计算与推理缓存？"}, {"id": "TFM-025", "category": "TFM", "topic": "位置编码与长上下文", "level": "L2", "title": "Shaw、Transformer-XL、T5、DeBERTa 与 TUPE 如何建模位置信息？", "tags": ["相对位置", "Transformer-XL", "DeBERTa"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Shaw 的相对位置表示把截断的距离向量加入 key，并可加入 value，所以不仅改变权重，也改变被聚合的内容。Transformer-XL 使用内容与相对位置的多个打分项和全局可学习偏置，配合跨片段缓存，避免把缓存 token 的绝对位置编号机械重复；XLNet 使用这一结构，relative shift 是高效对齐相对分数的实现技巧。\u003c/p>\u003cp>T5 在注意力 logit 上加可学习距离桶偏置，近距离区分细，远距离合并，value 通常保持内容表示。T5 的常见实现不在 logits 上再次除以根号维度，尺度由投影初始化等约定处理；不能把标准 attention 的缩放机械套进每个模型实现。DeBERTa 将内容与位置解耦，核心打分包含内容—内容、内容—位置、位置—内容三项；预训练的 enhanced mask decoder 再利用绝对位置，它的“decoder”不表示常规自回归生成解码器。TUPE 则分别计算内容相关性与位置相关性，减少两者的混合交互，并特殊处理 CLS；TUPE-A 使用解耦的绝对位置相关性，TUPE-R 在此基础上再加相对位置偏置，不应把 TUPE 的所有版本都称为相对位置编码。分桶、截断和相对旋转是不同设计，能计算任意距离不意味着对任意长文本都保留分辨率或任务精度。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">T\u003c/mi>\u003cmn>5\u003c/mn>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003cmrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmrow>\u003cmo>bucket\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsubsup>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">T\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x0221D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmrow>\u003cmi>&#x003B4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>r\u003c/mi>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmi>&#x003B4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>r\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>认为相对位置只能修改 logit，不能修改 value。\u003c/li>\u003cli>把 DeBERTa enhanced mask decoder 当成 Encoder-Decoder 生成架构。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>距离桶合并会损失哪些长距离信息？\u003c/li>\u003cli>Transformer-XL 缓存与普通 decoder KV cache 的训练语义有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Shaw 的相对位置表示把截断的距离向量加入 key，并可加入 value，所以不仅改变权重，也改变被聚合的内容。Transformer-XL 使用内容与相对位置的多个打分项和全局可学习偏置，配合跨片段缓存，避免把缓存 token 的绝对位置编号机械重复；XLNet 使用这一结构，relative shift 是高效对齐相对分数的实现技巧。\n\nT5 在注意力 logit 上加可学习距离桶偏置，近距离区分细，远距离合并，value 通常保持内容表示。T5 的常见实现不在 logits 上再次除以根号维度，尺度由投影初始化等约定处理；不能把标准 attention 的缩放机械套进每个模型实现。DeBERTa 将内容与位置解耦，核心打分包含内容—内容、内容—位置、位置—内容三项；预训练的 enhanced mask decoder 再利用绝对位置，它的“decoder”不表示常规自回归生成解码器。TUPE 则分别计算内容相关性与位置相关性，减少两者的混合交互，并特殊处理 CLS；TUPE-A 使用解耦的绝对位置相关性，TUPE-R 在此基础上再加相对位置偏置，不应把 TUPE 的所有版本都称为相对位置编码。分桶、截断和相对旋转是不同设计，能计算任意距离不意味着对任意长文本都保留分辨率或任务精度。\n认为相对位置只能修改 logit，不能修改 value。\n把 DeBERTa enhanced mask decoder 当成 Encoder-Decoder 生成架构。\n距离桶合并会损失哪些长距离信息？\nTransformer-XL 缓存与普通 decoder KV cache 的训练语义有什么区别？"}, {"id": "ARC-001", "category": "ARC", "topic": "预训练模型与家族对比", "level": "L1", "title": "BERT 的 MLM 与 NSP 怎么训练，15% 和 80/10/10 代表什么？", "tags": ["BERT", "MLM", "NSP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 BERT 是双向 Transformer encoder。MLM 先选择约 15% 的 WordPiece 位置作为监督集合，在被选位置中约 80% 换为 MASK、10% 换为随机词、10% 保留原词，并对这些位置预测原始 token；未选位置不直接计 MLM loss。80/10/10 缓解预训练与下游没有 MASK 的输入差异，同时保持主要去噪信号，并不是理论最优比例。\u003c/p>\u003cp>NSP 为句对判别任务，原配方约一半用相邻片段、一半用随机片段；利用 CLS 表示预测 IsNext/NotNext，与 MLM loss 组合。MLM 的“遮蔽”是输入 token 扰动，双向 attention 仍可访问被扰动位置及两侧上下文，和 causal attention mask 完全不同。CLS 表示通过预训练任务与下游监督学会聚合信息，不天然是最佳通用句向量。BERT 可接分类、序列标注或起止位置预测头，不能直接把其双向 MLM 当作普通左到右生成器。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi mathvariant=\"script\">M\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmover>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x0007E;\u003c/mo>\u003c/mover>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">T\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把“15%被选用于预测”说成全部15%都换成 MASK。\u003c/li>\u003cli>用 causal attention mask 代替 MLM 的输入扰动。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>保留原词的10%是否等同于取消所有去噪训练？\u003c/li>\u003cli>为什么后来的方法可以去掉 NSP？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 BERT 是双向 Transformer encoder。MLM 先选择约 15% 的 WordPiece 位置作为监督集合，在被选位置中约 80% 换为 MASK、10% 换为随机词、10% 保留原词，并对这些位置预测原始 token；未选位置不直接计 MLM loss。80/10/10 缓解预训练与下游没有 MASK 的输入差异，同时保持主要去噪信号，并不是理论最优比例。\n\nNSP 为句对判别任务，原配方约一半用相邻片段、一半用随机片段；利用 CLS 表示预测 IsNext/NotNext，与 MLM loss 组合。MLM 的“遮蔽”是输入 token 扰动，双向 attention 仍可访问被扰动位置及两侧上下文，和 causal attention mask 完全不同。CLS 表示通过预训练任务与下游监督学会聚合信息，不天然是最佳通用句向量。BERT 可接分类、序列标注或起止位置预测头，不能直接把其双向 MLM 当作普通左到右生成器。\n把“15%被选用于预测”说成全部15%都换成 MASK。\n用 causal attention mask 代替 MLM 的输入扰动。\n保留原词的10%是否等同于取消所有去噪训练？\n为什么后来的方法可以去掉 NSP？"}, {"id": "ARC-002", "category": "ARC", "topic": "预训练模型与家族对比", "level": "L2", "title": "BERT 的 token、segment、position embedding 为何相加？512 是数学上限吗？", "tags": ["BERT", "embedding", "长文本"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 BERT 输入为 WordPiece embedding、token-type/segment embedding 和可学习绝对位置 embedding 的和，再做 LayerNorm 与 dropout。它们共享 hidden 维度，相加能保持后续层输入大小；参数会共同学习各信息如何使用，并不存在“相加必然毁掉语义”的结论。CLS 常用于句级任务，SEP 标识分隔；segment 的 A/B 标签用来区分句对，许多单句任务都用同一个 segment。\u003c/p>\u003cp>512 是原始模型的最大位置表与训练长度配置，不是 Transformer 的普遍数学上限，也不是512个中文词。超长输入可截断、滑窗分块加聚合，或扩位置表并继续训练；直接补随机位置或插值不能保证效果，成本仍受注意力和激活规模限制。若是抽取问答，要保留块到原文的offset与跨块答案处理；若是句向量，验证池化和训练目标。BERT 输入加法与 RoPE 旋转 Q/K 属于不同位置参数化。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmi>i\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>E\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把最大位置表大小当作算法不能改变的理论上限。\u003c/li>\u003cli>把 token 数等同于空格词数或汉字数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>没有句对任务时 token-type embedding 能否省略？\u003c/li>\u003cli>滑窗问答的答案横跨两个块时该怎样处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 BERT 输入为 WordPiece embedding、token-type/segment embedding 和可学习绝对位置 embedding 的和，再做 LayerNorm 与 dropout。它们共享 hidden 维度，相加能保持后续层输入大小；参数会共同学习各信息如何使用，并不存在“相加必然毁掉语义”的结论。CLS 常用于句级任务，SEP 标识分隔；segment 的 A/B 标签用来区分句对，许多单句任务都用同一个 segment。\n\n512 是原始模型的最大位置表与训练长度配置，不是 Transformer 的普遍数学上限，也不是512个中文词。超长输入可截断、滑窗分块加聚合，或扩位置表并继续训练；直接补随机位置或插值不能保证效果，成本仍受注意力和激活规模限制。若是抽取问答，要保留块到原文的offset与跨块答案处理；若是句向量，验证池化和训练目标。BERT 输入加法与 RoPE 旋转 Q/K 属于不同位置参数化。\n把最大位置表大小当作算法不能改变的理论上限。\n把 token 数等同于空格词数或汉字数。\n没有句对任务时 token-type embedding 能否省略？\n滑窗问答的答案横跨两个块时该怎样处理？"}, {"id": "ARC-003", "category": "ARC", "topic": "预训练模型与家族对比", "level": "L2", "title": "RoBERTa、ALBERT 与 SpanBERT 分别改进了 BERT 的什么？", "tags": ["RoBERTa", "ALBERT", "SpanBERT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RoBERTa 重点改训练配方：更多数据和训练、较大 batch、动态 MLM mask、去掉 NSP，并采用 byte-level BPE。它说明训练条件会影响架构对比，不能把其提升全归因于一个新模块。ALBERT 分解词 embedding 的参数：先映射到较小 embedding 维度再投影到 hidden 维度，并可跨层共享 Transformer 参数；它用 SOP 判别连续片段的顺序，尽量减少 NSP 通过主题差异取巧。\u003c/p>\u003cp>SpanBERT 对连续 span 进行遮蔽，并用两端表示及相对位置预测 span 内 token，使表示更适合抽取式问答、指代等 span 任务。三者都以双向表示为核心，但压参数、改训练和改监督目标解决的问题不同。ALBERT 的层共享减少独立参数和模型状态，不等于执行层数减少；SpanBERT 的连续遮蔽也不同于 T5 直接生成被删 span。评价需固定数据、算力、模型规模与任务。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">B\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">T\u003c/mi>\u003c/mrow>\
