3c/mi>\u003c/mrow>\u003c/math> 提出的候选 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>，以 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 接受；首次拒绝后从归一化的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 修正分布采样，不能直接从 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math> 重采仍套用相同分布证明。全部接受时通常还能从 target 下一位置分布采额外 token。\u003c/p>\u003cp>标准算法保持目标模型分布，不要求每次随机运行文本完全相同。Tokenizer、采样变换与约束需协调；速度由接受率、draft 成本及验证开销决定，草稿越长不一定越快，低接受率或大 batch 可能收益不足。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>投机解码靠牺牲目标模型精度换速度。\u003c/li>\u003cli>分布一致就宣称固定种子下文本逐 token 必然一致。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样根据接受率选择草稿长度？\u003c/li>\u003cli>贪心验证与随机采样验证的规则有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "投机解码用便宜的 draft 模型提出多个 token，由 target 并行验证并执行接受/修正采样。对草稿分布 $q$ 提出的候选 $x$，以 $\\min(1,p(x)/q(x))$ 接受；首次拒绝后从归一化的 $\\max(p-q,0)$ 修正分布采样，不能直接从 $p$ 重采仍套用相同分布证明。全部接受时通常还能从 target 下一位置分布采额外 token。\n\n标准算法保持目标模型分布，不要求每次随机运行文本完全相同。Tokenizer、采样变换与约束需协调；速度由接受率、draft 成本及验证开销决定，草稿越长不一定越快，低接受率或大 batch 可能收益不足。\n投机解码靠牺牲目标模型精度换速度。\n分布一致就宣称固定种子下文本逐 token 必然一致。\n怎样根据接受率选择草稿长度？\n贪心验证与随机采样验证的规则有什么区别？"}, {"id": "INF-014", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "prefix caching 与普通 KV cache 有何区别？", "tags": ["PrefixCaching", "缓存失效", "多模态"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通 KV cache 复用同一请求的历史，prefix caching 则在请求间复用完全相同前缀的 KV，主要节省重复 prefill。缓存键需包含父块上下文和当前 token，以及模型、LoRA、相关预处理等信息，防止同样局部文本在不同历史下误共享；语义相似不等于精确 KV 相同。\u003c/p>\u003cp>权重或适配器变化须失效或隔离缓存，多模态占位 token 相同但图像不同，还需模态内容哈希。缓存占用会与活跃请求竞争，需要淘汰；多租户共享应考虑隔离和时间侧信道。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只用当前文本片段哈希，不考虑前缀上下文。\u003c/li>\u003cli>prefix cache 会加速输出 token 的全部 decode 计算。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>相同 system prompt 放在最前面为什么更利于命中？\u003c/li>\u003cli>多适配器和多租户怎样隔离缓存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通 KV cache 复用同一请求的历史，prefix caching 则在请求间复用完全相同前缀的 KV，主要节省重复 prefill。缓存键需包含父块上下文和当前 token，以及模型、LoRA、相关预处理等信息，防止同样局部文本在不同历史下误共享；语义相似不等于精确 KV 相同。\n\n权重或适配器变化须失效或隔离缓存，多模态占位 token 相同但图像不同，还需模态内容哈希。缓存占用会与活跃请求竞争，需要淘汰；多租户共享应考虑隔离和时间侧信道。\n只用当前文本片段哈希，不考虑前缀上下文。\nprefix cache 会加速输出 token 的全部 decode 计算。\n相同 system prompt 放在最前面为什么更利于命中？\n多适配器和多租户怎样隔离缓存？"}, {"id": "INF-015", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "如何同时优化 TTFT、每 token 延迟与吞吐？", "tags": ["TTFT", "ITL", "SLO"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>TTFT 是从请求发出到首 token 的时间，包含排队与 prefill；ITL 是相邻输出 token 的间隔，吞吐是单位时间产出。体验还受客户端流式传输影响，不能只测 prefill 内核时间。\u003c/p>\u003cp>评估时固定负载与输入/输出长度分布，记录 P50/P95/P99、失败率、请求率、并发和 token 数，区分服务端与客户端口径。扩大 batch 可提升利用率，也可能增加排队和 ITL，需联合权衡 chunked prefill、缓存与调度。逐步增加到达率找饱和点，并比较延迟 SLO 内的有效吞吐 goodput，而不只报告离线最大 tokens/s。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>首 token 很快就断言整体响应快。\u003c/li>\u003cli>把输入吞吐与输出吞吐混用或省略长度分布。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>低并发与高并发应采用同一调度参数吗？\u003c/li>\u003cli>缓存命中率变化怎样影响 benchmark 公平性？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "TTFT 是从请求发出到首 token 的时间，包含排队与 prefill；ITL 是相邻输出 token 的间隔，吞吐是单位时间产出。体验还受客户端流式传输影响，不能只测 prefill 内核时间。\n\n评估时固定负载与输入/输出长度分布，记录 P50/P95/P99、失败率、请求率、并发和 token 数，区分服务端与客户端口径。扩大 batch 可提升利用率，也可能增加排队和 ITL，需联合权衡 chunked prefill、缓存与调度。逐步增加到达率找饱和点，并比较延迟 SLO 内的有效吞吐 goodput，而不只报告离线最大 tokens/s。\n首 token 很快就断言整体响应快。\n把输入吞吐与输出吞吐混用或省略长度分布。\n低并发与高并发应采用同一调度参数吗？\n缓存命中率变化怎样影响 benchmark 公平性？"}, {"id": "INF-016", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "Decoder-only 批量生成为什么通常左 padding？右 padding 一定不可以吗？", "tags": ["padding", "generate", "position_ids"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>常见 Transformers 生成循环取每条序列张量末位 logits 来选下一个 token。长度不同时若右 padding，短样本的末位是 PAD，即使 attention_mask 屏蔽了它作为 key，末位 query 的输出也不等于原文本最后有效位置的输出；mask 不能自动改变“从哪一位取 logits”。左 padding 让所有样本的有效前缀都在张量右端结束，因此更适合这种批量生成实现。\u003c/p>\u003cp>还要正确传 attention_mask、位置编号和 cache_position；不能只改 tokenizer.padding_side 却忽略模型如何编号。把 EOS 用作左侧 padding 时，应显式给 mask，并检查停止条件是否只依据新生成 token。\u003c/p>\u003cp>这不是自回归数学要求必须左补齐。能按每条长度收集最后有效 logits、正确管理位置与 cache 的实现也可支持右 padding；无 padding 的 ragged/paged serving 又是另一种布局。SFT 的 padding 方向取决于训练实现，真正关键是注意力、labels 和有效位置一致。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>attention_mask 屏蔽 PAD key 不会自动修复从末尾 PAD query 取生成 logits 的问题。\u003c/li>\u003cli>将推理左 padding 的经验当作所有训练与 serving 引擎的硬规则。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>手写右 padding 生成循环时，第一步 logits 应按什么索引 gather？\u003c/li>\u003cli>pad_token_id 与 eos_token_id 相同时，为什么仍需显式 attention_mask？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "常见 Transformers 生成循环取每条序列张量末位 logits 来选下一个 token。长度不同时若右 padding，短样本的末位是 PAD，即使 attention_mask 屏蔽了它作为 key，末位 query 的输出也不等于原文本最后有效位置的输出；mask 不能自动改变“从哪一位取 logits”。左 padding 让所有样本的有效前缀都在张量右端结束，因此更适合这种批量生成实现。\n\n还要正确传 attention_mask、位置编号和 cache_position；不能只改 tokenizer.padding_side 却忽略模型如何编号。把 EOS 用作左侧 padding 时，应显式给 mask，并检查停止条件是否只依据新生成 token。\n\n这不是自回归数学要求必须左补齐。能按每条长度收集最后有效 logits、正确管理位置与 cache 的实现也可支持右 padding；无 padding 的 ragged/paged serving 又是另一种布局。SFT 的 padding 方向取决于训练实现，真正关键是注意力、labels 和有效位置一致。\nattention_mask 屏蔽 PAD key 不会自动修复从末尾 PAD query 取生成 logits 的问题。\n将推理左 padding 的经验当作所有训练与 serving 引擎的硬规则。\n手写右 padding 生成循环时，第一步 logits 应按什么索引 gather？\npad_token_id 与 eos_token_id 相同时，为什么仍需显式 attention_mask？"}, {"id": "INF-017", "category": "INF", "topic": "KV Cache 与服务调度", "level": "L2", "title": "SGLang、vLLM 与其他推理部署方案怎样选型，能直接断言哪一个延迟更低吗？", "tags": ["SGLang", "vLLM", "RadixAttention", "Serving"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>两者都是模型 serving 框架，比较应落到具体版本、模型、硬件和负载。SGLang 的 RadixAttention 用 radix tree 组织共享前缀 KV 的匹配、复用和驱逐，适合存在模板、多轮历史或分支共享的工作负载；vLLM 以分页 KV 管理和请求调度见长，同时也有自动前缀缓存。因此“一个能复用前缀，另一个完全不能”已不是有效比较。\u003c/p>\u003cp>先固定 checkpoint、dtype/量化、张量并行、上下文长度与输出分布，再明确冷缓存或热缓存，测 P50/P95 TTFT、ITL、端到端耗时、失败率和 SLO 内 goodput。共享前缀多时减少的是重复 prefill；长输出场景仍可能受 decode 带宽限制。模型支持、注意力内核、调度参数与结构化输出实现都会影响结果。\u003c/p>\u003cp>原始 SGLang 论文与旧版 vLLM 的倍数是那组实验的结果，不能直接作为当前版本承诺。选择时还要评估上线接口、运维、稳定性和迁移成本，最终用真实请求回放验证。\u003c/p>\u003cp>扩展到其他部署方案时，先分清推理运行时、模型服务与集群编排：CTranslate2 是需转换模型格式的 C++/Python CPU/GPU 推理库，MLC LLM 侧重编译与跨平台部署，DeepSpeed-MII 封装 DeepSpeed-Inference/FastGen；TGI 提供模型服务，官方截至 2026 年 10 月已将其标记为维护模式。OpenLLM 使用 BentoML 做服务部署并以 vLLM 为后端，Ray Serve LLM 则在 vLLM/SGLang 等引擎上组织多节点、多模型、自动扩缩容与请求路由。这些层次可以组合，不能仅按项目名称视为互斥替代；也不能把旧榜单、旧模型支持范围或旧接口当作当前能力。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把历史论文的旧版 baseline 倍数当作当前框架固定性能差距。\u003c/li>\u003cli>一边使用热前缀缓存、一边冷缓存，或者只看最大 tokens/s。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>前缀复用率变化时，TTFT 与 TPOT 分别会怎样变化？\u003c/li>\u003cli>高缓存命中是否可能掩盖高并发下的排队与长尾？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "两者都是模型 serving 框架，比较应落到具体版本、模型、硬件和负载。SGLang 的 RadixAttention 用 radix tree 组织共享前缀 KV 的匹配、复用和驱逐，适合存在模板、多轮历史或分支共享的工作负载；vLLM 以分页 KV 管理和请求调度见长，同时也有自动前缀缓存。因此“一个能复用前缀，另一个完全不能”已不是有效比较。\n\n先固定 checkpoint、dtype/量化、张量并行、上下文长度与输出分布，再明确冷缓存或热缓存，测 P50/P95 TTFT、ITL、端到端耗时、失败率和 SLO 内 goodput。共享前缀多时减少的是重复 prefill；长输出场景仍可能受 decode 带宽限制。模型支持、注意力内核、调度参数与结构化输出实现都会影响结果。\n\n原始 SGLang 论文与旧版 vLLM 的倍数是那组实验的结果，不能直接作为当前版本承诺。选择时还要评估上线接口、运维、稳定性和迁移成本，最终用真实请求回放验证。\n\n扩展到其他部署方案时，先分清推理运行时、模型服务与集群编排：CTranslate2 是需转换模型格式的 C++/Python CPU/GPU 推理库，MLC LLM 侧重编译与跨平台部署，DeepSpeed-MII 封装 DeepSpeed-Inference/FastGen；TGI 提供模型服务，官方截至 2026 年 10 月已将其标记为维护模式。OpenLLM 使用 BentoML 做服务部署并以 vLLM 为后端，Ray Serve LLM 则在 vLLM/SGLang 等引擎上组织多节点、多模型、自动扩缩容与请求路由。这些层次可以组合，不能仅按项目名称视为互斥替代；也不能把旧榜单、旧模型支持范围或旧接口当作当前能力。\n把历史论文的旧版 baseline 倍数当作当前框架固定性能差距。\n一边使用热前缀缓存、一边冷缓存，或者只看最大 tokens/s。\n前缀复用率变化时，TTFT 与 TPOT 分别会怎样变化？\n高缓存命中是否可能掩盖高并发下的排队与长尾？"}, {"id": "INF-018", "category": "INF", "topic": "注意力与算子加速", "level": "L2", "title": "torch.contiguous、stride、view 与 reshape 有什么关系？为什么影响推理？", "tags": ["PyTorch", "stride", "contiguous", "view"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>张量不仅有 shape，还通过 storage offset 与 stride 描述逻辑索引怎样映射到存储。transpose/permute 常只改变这组元数据并共享原 storage，因而输出可能不满足默认连续布局。shape 为 2×3、stride 为 (3,1) 的连续张量转置后是 3×2、stride 为 (1,3)，数据并未立即搬动。\u003c/p>\u003cp>contiguous 在输入已经满足指定 memory format 时返回自身，否则复制成连续布局。view 要求当前 shape/stride 兼容所需重解释，不能任意展开一个转置张量；reshape 可以在兼容时返回 view，也可能隐式复制，不能依赖它总是零拷贝。连续性还应指定默认行优先或 channels_last 等格式。\u003c/p>\u003cp>推理中的频繁转置、拼头、KV 布局转换若触发大张量拷贝，会增加带宽消耗、临时显存和内核启动。但不少算子支持 strided 输入，不必在每个操作前无条件 contiguous；应依据后续内核要求，用 profiler 找出真正的复制与耗时。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>offset\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x02026;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo />\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>r\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>g\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>&#x0005F;\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi>s\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmsub>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmspace width=\"0.167em\" />\u003cmsub>\u003cmo>stride\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>contiguous 可能复制数据，不是无需成本的 shape 操作。\u003c/li>\u003cli>reshape 不保证总是 view；非默认 memory format 也可能连续。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 transpose 后 view(-1) 可能失败，而 reshape(-1) 可成功？\u003c/li>\u003cli>如何确认一个推理瓶颈是隐式复制而不是 GEMM？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "张量不仅有 shape，还通过 storage offset 与 stride 描述逻辑索引怎样映射到存储。transpose/permute 常只改变这组元数据并共享原 storage，因而输出可能不满足默认连续布局。shape 为 2×3、stride 为 (3,1) 的连续张量转置后是 3×2、stride 为 (1,3)，数据并未立即搬动。\n\ncontiguous 在输入已经满足指定 memory format 时返回自身，否则复制成连续布局。view 要求当前 shape/stride 兼容所需重解释，不能任意展开一个转置张量；reshape 可以在兼容时返回 view，也可能隐式复制，不能依赖它总是零拷贝。连续性还应指定默认行优先或 channels_last 等格式。\n\n推理中的频繁转置、拼头、KV 布局转换若触发大张量拷贝，会增加带宽消耗、临时显存和内核启动。但不少算子支持 strided 输入，不必在每个操作前无条件 contiguous；应依据后续内核要求，用 profiler 找出真正的复制与耗时。\ncontiguous 可能复制数据，不是无需成本的 shape 操作。\nreshape 不保证总是 view；非默认 memory format 也可能连续。\n为什么 transpose 后 view(-1) 可能失败，而 reshape(-1) 可成功？\n如何确认一个推理瓶颈是隐式复制而不是 GEMM？"}, {"id": "INF-019", "category": "INF", "topic": "量化与稀疏推理", "level": "L2", "title": "模型剪枝与量化有何区别，结构化、非结构化和 2:4 稀疏为何不一定加速？", "tags": ["剪枝", "结构化", "稀疏", "量化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>量化降低权重或激活的表示精度；剪枝删除或屏蔽连接、通道、注意力头或层。非结构化剪枝将任意权重置零，通常保留原矩阵形状；结构化剪枝直接缩小通道、head或层；N:M 半结构化要求每 M 个权重保留 N 个，例如 2:4，便于支持相应模式的稀疏硬件执行。普通 dense GEMM 仍可能处理完整矩阵，所以零权重比例不能直接换算为速度收益。\u003c/p>\u003cp>幅值剪枝按权重绝对值估计重要性，Wanda 结合权重幅值与输入激活尺度，也有方法使用近似二阶信息；这些都是近似，应固定校准数据并测试恢复训练的收益。LLM-Pruner 等方法考虑模块依赖；删通道或头时必须同步相关投影、残差维度和配置，不能孤立删除一个张量维度。校准与恢复训练不得污染最终评测集。\u003c/p>\u003cp>结构化剪枝较容易复用密集内核，但不适配硬件对齐的小矩阵也可能变慢。稀疏加速依赖硬件、dtype、布局、尺寸与内核，索引和不规则访存也有开销。比较实际权重内存、端到端延迟、吞吐、尾延迟和质量，并计入恢复训练预算；剪枝与量化可以组合，误差和内核兼容性需要联合验证。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmo>score\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">W\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmspace width=\"0.167em\" />\u003cmo>&#x02016;\u003c/mo>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmrow>\u003cmi>:\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmo>&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>&#x003C1;\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x00023;\u003c/mi>\u003cmtext>nonzero&#x000A0;weights\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmi>&#x00023;\u003c/mi>\u003cmtext>weights\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>非结构化权重置零不自动缩小稠密权重文件或 GEMM 计算。\u003c/li>\u003cli>独立删除通道却忽略残差和耦合模块维度。\u003c/li>\u003cli>声称50%权重为零就必然把dense推理速度翻倍。\u003c/li>\u003cli>进行结构化剪枝时不同投影维度未同步修改。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>相同参数减少比例下，删层与删 FFN 通道的质量和延迟影响怎样比较？\u003c/li>\u003cli>怎样把剪枝后的恢复训练预算纳入公平比较？\u003c/li>\u003cli>2:4稀疏为何与任意50%零权重不同？\u003c/li>\u003cli>剪枝后哪些评测能发现少数关键能力被破坏？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "量化降低权重或激活的表示精度；剪枝删除或屏蔽连接、通道、注意力头或层。非结构化剪枝将任意权重置零，通常保留原矩阵形状；结构化剪枝直接缩小通道、head或层；N:M 半结构化要求每 M 个权重保留 N 个，例如 2:4，便于支持相应模式的稀疏硬件执行。普通 dense GEMM 仍可能处理完整矩阵，所以零权重比例不能直接换算为速度收益。\n\n幅值剪枝按权重绝对值估计重要性，Wanda 结合权重幅值与输入激活尺度，也有方法使用近似二阶信息；这些都是近似，应固定校准数据并测试恢复训练的收益。LLM-Pruner 等方法考虑模块依赖；删通道或头时必须同步相关投影、残差维度和配置，不能孤立删除一个张量维度。校准与恢复训练不得污染最终评测集。\n\n结构化剪枝较容易复用密集内核，但不适配硬件对齐的小矩阵也可能变慢。稀疏加速依赖硬件、dtype、布局、尺寸与内核，索引和不规则访存也有开销。比较实际权重内存、端到端延迟、吞吐、尾延迟和质量，并计入恢复训练预算；剪枝与量化可以组合，误差和内核兼容性需要联合验证。\n非结构化权重置零不自动缩小稠密权重文件或 GEMM 计算。\n独立删除通道却忽略残差和耦合模块维度。\n声称50%权重为零就必然把dense推理速度翻倍。\n进行结构化剪枝时不同投影维度未同步修改。\n相同参数减少比例下，删层与删 FFN 通道的质量和延迟影响怎样比较？\n怎样把剪枝后的恢复训练预算纳入公平比较？\n2:4稀疏为何与任意50%零权重不同？\n剪枝后哪些评测能发现少数关键能力被破坏？"}, {"id": "INF-031", "category": "INF", "topic": "解码与采样策略", "level": "L2", "title": "Greedy、Beam Search 与采样分别优化什么，beam 越大越好吗？", "tags": ["Beam Search", "Greedy", "解码"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Greedy每步选最大条件概率token；beam保留B条得分最高的候选前缀，扩展后再筛选，是联合序列最大概率搜索的近似；温度/top-k/top-p采样按经过变换的分布抽样，更注重输出多样性。Greedy的局部最优不保证全局最优，有限beam也不保证找到真正最优序列。\u003c/p>\u003cp>序列得分通常为log概率和，长度越长更容易累计负值，因此beam常配length penalty、EOS规则或任务约束；这些会改变搜索目标。beam增大提高搜索覆盖却增加KV/cache、重排和计算，可能更偏向高概率但重复/空泛的文本，也未必提升任务质量。翻译等输入强约束任务常可用beam，自由生成常更适合合理采样；选择要看事实性、可复现性、多样性和成本。流式beam还须处理候选共享前缀、终止和cache重排。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/munderover>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说Greedy总能最大化整个序列概率。\u003c/li>\u003cli>把beam越宽等同于任何生成任务质量越高。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>beam候选被重新排序时KV cache怎样同步？\u003c/li>\u003cli>长度惩罚为什么会改变最优输出而非仅加快搜索？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Greedy每步选最大条件概率token；beam保留B条得分最高的候选前缀，扩展后再筛选，是联合序列最大概率搜索的近似；温度/top-k/top-p采样按经过变换的分布抽样，更注重输出多样性。Greedy的局部最优不保证全局最优，有限beam也不保证找到真正最优序列。\n\n序列得分通常为log概率和，长度越长更容易累计负值，因此beam常配length penalty、EOS规则或任务约束；这些会改变搜索目标。beam增大提高搜索覆盖却增加KV/cache、重排和计算，可能更偏向高概率但重复/空泛的文本，也未必提升任务质量。翻译等输入强约束任务常可用beam，自由生成常更适合合理采样；选择要看事实性、可复现性、多样性和成本。流式beam还须处理候选共享前缀、终止和cache重排。\n说Greedy总能最大化整个序列概率。\n把beam越宽等同于任何生成任务质量越高。\nbeam候选被重新排序时KV cache怎样同步？\n长度惩罚为什么会改变最优输出而非仅加快搜索？"}, {"id": "INF-032", "category": "INF", "topic": "解码与采样策略", "level": "L2", "title": "LLM 为什么会复读或不停生成，重复惩罚应怎样正确使用？", "tags": ["复读", "repetition penalty", "EOS"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>复读可能来自数据中的重复模式、模型在某些前缀上的高概率循环、EOS/模板错配、KV或position实现bug，以及过强的确定性搜索；先区分输入回显、短语循环和未正常终止。检查训练EOS、stop tokens、max_new_tokens、chat template及缓存正确性，再在同一prompt下比较greedy和采样，避免把所有问题归因于temperature低。\u003c/p>\u003cp>常见repetition penalty对已出现token的logit按符号处理：正值除以r、负值乘r，r&gt;1时两者都降低相对概率；frequency/presence penalty分别按次数或是否出现减去分数，no_repeat_ngram则硬禁重复片段。这些方法改变模型分布，可能误伤代码、引文、必要术语和正常重复，不能保障事实正确。应按任务调节、保留必要EOS并回归质量，数据或模板根因优先在训练和协议层修复。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmtext>&#x000A0;and&#x000A0;\u003c/mtext>\u003cmi>i\u003c/mi>\u003cmtext>&#x000A0;repeated\u003c/mtext>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmi>r\u003c/mi>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003C;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmtext>&#x000A0;and&#x000A0;\u003c/mtext>\u003cmi>i\u003c/mi>\u003cmtext>&#x000A0;repeated\u003c/mtext>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmtext>otherwise\u003c/mtext>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>r\u003c/mi>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只对正logit除r，导致负logit除r后反而增加该token概率。\u003c/li>\u003cli>为消除复读过度惩罚所有重复术语。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>presence与frequency penalty对反复出现一个词的区别是什么？\u003c/li>\u003cli>如果EOS没被训练，增大temperature为何未必能修复？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "复读可能来自数据中的重复模式、模型在某些前缀上的高概率循环、EOS/模板错配、KV或position实现bug，以及过强的确定性搜索；先区分输入回显、短语循环和未正常终止。检查训练EOS、stop tokens、max_new_tokens、chat template及缓存正确性，再在同一prompt下比较greedy和采样，避免把所有问题归因于temperature低。\n\n常见repetition penalty对已出现token的logit按符号处理：正值除以r、负值乘r，r>1时两者都降低相对概率；frequency/presence penalty分别按次数或是否出现减去分数，no_repeat_ngram则硬禁重复片段。这些方法改变模型分布，可能误伤代码、引文、必要术语和正常重复，不能保障事实正确。应按任务调节、保留必要EOS并回归质量，数据或模板根因优先在训练和协议层修复。\n只对正logit除r，导致负logit除r后反而增加该token概率。\n为消除复读过度惩罚所有重复术语。\npresence与frequency penalty对反复出现一个词的区别是什么？\n如果EOS没被训练，增大temperature为何未必能修复？"}, {"id": "INF-033", "category": "INF", "topic": "注意力与算子加速", "level": "L2", "title": "算子融合、torch.compile 与 CUDA Graphs 分别降低什么开销？", "tags": ["算子融合", "torch.compile", "CUDA Graphs"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>算子融合把连续的点操作或归约组合进较少kernel，减少launch次数和中间张量读写，但过度融合可能增加寄存器压力、降低occupancy。编译系统追踪计算图、特化shape并生成或选择kernel，还能做图级优化；它不会自动消除所有数据依赖或改成完全不同的模型。CUDA Graphs记录一组GPU操作并重放，主要减少CPU调度与kernel launch开销，尤其适合decode的小算子路径。\u003c/p>\u003cp>Graph replay通常要求captured地址和执行结构稳定；动态batch/长度可用shape bucket、固定buffer或partial capture，相关框架有不同支持。数据相关控制流、CPU同步、内存分配和graph break会削弱收益，compile和CUDA Graphs也可能叠加。先profile确定launch/访存/计算瓶颈，区分首次编译/捕获时间与warm稳态，核对输出误差、显存增长及真实输入分布；不能只跑一个固定shape就宣称端到端总能加速。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把CUDA Graphs说成压缩KV cache的算法。\u003c/li>\u003cli>把首次编译成本混入稳态结果或隐去生产中频繁recompile成本。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>shape bucketing怎样在浪费padding和graph重用之间权衡？\u003c/li>\u003cli>融合为什么有时反而变慢？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "算子融合把连续的点操作或归约组合进较少kernel，减少launch次数和中间张量读写，但过度融合可能增加寄存器压力、降低occupancy。编译系统追踪计算图、特化shape并生成或选择kernel，还能做图级优化；它不会自动消除所有数据依赖或改成完全不同的模型。CUDA Graphs记录一组GPU操作并重放，主要减少CPU调度与kernel launch开销，尤其适合decode的小算子路径。\n\nGraph replay通常要求captured地址和执行结构稳定；动态batch/长度可用shape bucket、固定buffer或partial capture，相关框架有不同支持。数据相关控制流、CPU同步、内存分配和graph break会削弱收益，compile和CUDA Graphs也可能叠加。先profile确定launch/访存/计算瓶颈，区分首次编译/捕获时间与warm稳态，核对输出误差、显存增长及真实输入分布；不能只跑一个固定shape就宣称端到端总能加速。\n把CUDA Graphs说成压缩KV cache的算法。\n把首次编译成本混入稳态结果或隐去生产中频繁recompile成本。\nshape bucketing怎样在浪费padding和graph重用之间权衡？\n融合为什么有时反而变慢？"}, {"id": "INF-034", "category": "INF", "topic": "解码与采样策略", "level": "L2", "title": "JSON Schema、正则或 CFG 约束生成如何实现，能否保证内容正确？", "tags": ["结构化生成", "JSON Schema", "CFG"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>约束解码维护当前输出对应的语法状态，确定哪些下一token的字节串仍能延伸成合法结果，将不允许token的logits屏蔽后再采样。正则可用有限状态机，嵌套JSON等结构通常需要CFG/栈式解析或等价引擎，Schema还可限制键、类型和枚举；必须基于token到字节串的真实映射，而非按单个字符简单处理。\u003c/p>\u003cp>它比生成后repair更直接保证已完成输出的语法，但实际保证取决于引擎支持的Schema子集、终止、长度和tokenizer规则。遇到空允许集合、截断或工具取消时仍需显式错误处理。合法JSON不保证字段事实正确、业务一致或工具执行安全，因此还应在应用层做类型、范围、权限和业务校验。grammar编译与每步mask有开销，可缓存固定schema和常见语法状态；约束越复杂越应实测延迟和准确率。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>p\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02260;\u003c/mo>\u003cmo>&#x02205;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把“格式合法”当成“事实正确且可直接执行”。\u003c/li>\u003cli>忽略一个token可能包含多个字符或部分UTF-8字节。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>no allowed token与达到max_new_tokens应该怎样向调用方报告？\u003c/li>\u003cli>约束解码会如何改变原模型采样分布？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "约束解码维护当前输出对应的语法状态，确定哪些下一token的字节串仍能延伸成合法结果，将不允许token的logits屏蔽后再采样。正则可用有限状态机，嵌套JSON等结构通常需要CFG/栈式解析或等价引擎，Schema还可限制键、类型和枚举；必须基于token到字节串的真实映射，而非按单个字符简单处理。\n\n它比生成后repair更直接保证已完成输出的语法，但实际保证取决于引擎支持的Schema子集、终止、长度和tokenizer规则。遇到空允许集合、截断或工具取消时仍需显式错误处理。合法JSON不保证字段事实正确、业务一致或工具执行安全，因此还应在应用层做类型、范围、权限和业务校验。grammar编译与每步mask有开销，可缓存固定schema和常见语法状态；约束越复杂越应实测延迟和准确率。\n把“格式合法”当成“事实正确且可直接执行”。\n忽略一个token可能包含多个字符或部分UTF-8字节。\nno allowed token与达到max_new_tokens应该怎样向调用方报告？\n约束解码会如何改变原模型采样分布？"}, {"id": "DST-001", "category": "DST", "topic": "并行策略与通信", "level": "L1", "title": "数据并行 DDP 每个 step 做了什么？", "tags": ["DDP", "数据并行"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DDP 让各进程持有模型副本并处理自己的数据，反向期间聚合梯度，随后各副本用相同结果执行优化器更新。训练程序负责向各 rank 提供不同数据子集，DDP 不自动分割数据集，也通常不切分模型状态。\u003c/p>\u003cp>正确训练需保持初始化、采样及 collective 顺序一致。广播 buffers 与梯度归约是不同机制，各卡仍通常持有完整参数，不能据此期待模型状态显存按卡数下降。\u003c/p>\u003cp>PyTorch DataParallel通常在一个进程内多线程scatter输入、复制模型、并行前向再gather输出，主卡更容易承担额外开销；DDP通常每GPU独立进程，通过梯度collective同步并让各rank本地更新，适合单机与多机扩展。参数服务器则让worker向中心或分片server推/拉参数或梯度，可同步或异步；与DDP的collective模式相比，其流量、瓶颈和陈旧梯度语义不同。不能把“数据并行”一概等同于某一个PyTorch API。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>DDP 不会让每张卡只持有一部分模型参数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么单卡可训练，多卡却可能 OOM？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DDP 让各进程持有模型副本并处理自己的数据，反向期间聚合梯度，随后各副本用相同结果执行优化器更新。训练程序负责向各 rank 提供不同数据子集，DDP 不自动分割数据集，也通常不切分模型状态。\n\n正确训练需保持初始化、采样及 collective 顺序一致。广播 buffers 与梯度归约是不同机制，各卡仍通常持有完整参数，不能据此期待模型状态显存按卡数下降。\n\nPyTorch DataParallel通常在一个进程内多线程scatter输入、复制模型、并行前向再gather输出，主卡更容易承担额外开销；DDP通常每GPU独立进程，通过梯度collective同步并让各rank本地更新，适合单机与多机扩展。参数服务器则让worker向中心或分片server推/拉参数或梯度，可同步或异步；与DDP的collective模式相比，其流量、瓶颈和陈旧梯度语义不同。不能把“数据并行”一概等同于某一个PyTorch API。\nDDP 不会让每张卡只持有一部分模型参数。\n为什么单卡可训练，多卡却可能 OOM？"}, {"id": "DST-002", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "DDP 梯度累积如何保持与大 batch 等价？", "tags": ["梯度累积", "Loss归一化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>等大小 microbatch 时，将损失按累积步数缩放，只在最后一次同步，可得到同一有效 batch 的平均梯度。DDP 的 \u003ccode>no_sync\u003c/code> 需同时包住前向和反向；每组累积结束后才裁剪梯度、执行 \u003ccode>step\u003c/code>、推进调度器并清梯度。\u003c/p>\u003cp>变长文本应按有效监督 token 总数加权，否则短序列被放大；若框架已做归一化，再除一次会使梯度过小。dropout、BatchNorm 和其他随机性，也可能使累积与整批计算不严格一致。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>框架若已归一化损失，再除一次会使梯度过小。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>各 rank 有效 token 数不同时如何得到全局均值？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "等大小 microbatch 时，将损失按累积步数缩放，只在最后一次同步，可得到同一有效 batch 的平均梯度。DDP 的 `no_sync` 需同时包住前向和反向；每组累积结束后才裁剪梯度、执行 `step`、推进调度器并清梯度。\n\n变长文本应按有效监督 token 总数加权，否则短序列被放大；若框架已做归一化，再除一次会使梯度过小。dropout、BatchNorm 和其他随机性，也可能使累积与整批计算不严格一致。\n框架若已归一化损失，再除一次会使梯度过小。\n各 rank 有效 token 数不同时如何得到全局均值？"}, {"id": "DST-003", "category": "DST", "topic": "训练显存与状态分片", "level": "L1", "title": "大模型训练显存怎样估算和优化？以 7B Adam 为例", "tags": ["显存估算", "Adam", "Microbatch", "GradientAccumulation", "ZeRO", "FlashAttention", "Streaming"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先把训练显存拆为权重、梯度、优化器/主权重、激活、工作区及通信临时状态。设参数量为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math>，若低精度权重和梯度各为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> bytes，FP32 主权重为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math>，Adam 一二阶状态合计 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>8\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math>，模型状态共 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> bytes。\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>7\u003c/mn>\u003cmo>&#x000D7;\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>9\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 时为十进制 112GB，约 104.3GiB；FP32 梯度、没有独立主权重或换优化器时须重算。峰值还包含激活、工作区、通信桶及临时聚合，\u003ccode>allocated\u003c/code>、\u003ccode>reserved\u003c/code> 和设备已用量也不是同一口径。\u003c/p>\u003cp>固定有效 batch 时，减小每卡 microbatch、增加累积步数，可通过逐次前后向释放计算图降低激活峰值；只增累积步数而不减 microbatch 不会自动省激活，也不减少权重或 Adam 状态。等大小样本时 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmi>A\u003c/mi>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 为累积步数、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 为数据并行度；变长样本按有效监督 token 加权，避免重复归一化。FSDP 的 \u003ccode>no_sync\u003c/code> 等设置可能保留完整梯度，须实测峰值。\u003c/p>\u003cp>按瓶颈选择优化：\u003c/p>\u003cul>\u003cli>模型状态：DDP 复制状态；TP 切单层矩阵与计算，PP 切不同层，ZeRO 在数据并行组中依次分片 optimizer/master、gradients、parameters。当前模块的参数 all-gather、通信桶和 PP 在途 microbatch 仍可能提高临时峰值。CPU/NVMe offload 用传输与主存/存储带宽换容量。\u003c/li>\u003cli>激活与注意力：checkpointing 用反向重算换保留激活；标准 FlashAttention 通过分块、在线 softmax 避免完整 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>S\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/math> 注意力矩阵驻留 HBM，仍是精确稠密注意力，浮点次序可不同，算术复杂度仍约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>S\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。稀疏注意力改变可见连接，需另测质量；LoRA 减少可训练状态，长序列激活仍可很大。\u003c/li>\u003cli>数据：streaming 按需读取数据，可减少整库下载、转换和主存驻留，需设置分片、shuffle buffer 与 worker；它不自动压缩模型参数、优化器或当前 batch 的激活。\u003c/li>\u003c/ul>\u003cp>先 profile OOM 出现在前向、反向还是优化器更新，再比较显存、有效 token 吞吐与任务质量。缩短序列、量化、冻结或稀疏化，都应说明目标或精度变化。\u003c/p>\u003cp>同一混合精度 Adam 账单下，全参微调模型状态约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math>。底座全部冻结时，浮点 LoRA 约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>16\u003c/mn>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，理想全量化 QLoRA 约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>16\u003c/mn>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">q\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> bytes；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 是实际新增的可训练 adapter 参数数，不是 rank 本身。未量化冻结层、额外解冻参数须单独重算，不能把已经计入底座的权重再重复加入 adapter 账单。这些都须再加激活、工作区与通信临时状态，且 master/gradient dtype、量化层范围和优化器实现不同会改写系数。14B 全参的这项模型状态账单约 224 GB、208.6 GiB，不能用推理的 28 GB FP16 权重直接估算训练卡数。若冻结视觉或语言模块但需向可训练前层传播梯度，也不能简单整段 no_grad；是否省激活取决于计算图中的可训练位置。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>仅加梯度累积就声称显存下降，或用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> 状态账单冒充所有实现的峰值显存。\u003c/li>\u003cli>把数据流式加载、TP/PP、ZeRO 和稀疏 attention 视为同一种省显存操作，忽略各自影响的对象及通信/质量成本。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>microbatch 已经是 1，而权重与 optimizer 仍放不下时，应优先尝试哪些状态优化？\u003c/li>\u003cli>怎么用 profiler 与峰值 \u003ccode>allocated\u003c/code>/\u003ccode>reserved\u003c/code> 区分激活、参数聚合和 \u003ccode>optimizer.step\u003c/code> 的 OOM？\u003c/li>\u003cli>怎样根据 adapter 的 target_modules 和实际 shape 计算 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，而不是套固定显存百分比？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先把训练显存拆为权重、梯度、优化器/主权重、激活、工作区及通信临时状态。设参数量为 $P$，若低精度权重和梯度各为 $2P$ bytes，FP32 主权重为 $4P$，Adam 一二阶状态合计 $8P$，模型状态共 $16P$ bytes。$P=7\\times10^9$ 时为十进制 112GB，约 104.3GiB；FP32 梯度、没有独立主权重或换优化器时须重算。峰值还包含激活、工作区、通信桶及临时聚合，`allocated`、`reserved` 和设备已用量也不是同一口径。\n\n固定有效 batch 时，减小每卡 microbatch、增加累积步数，可通过逐次前后向释放计算图降低激活峰值；只增累积步数而不减 microbatch 不会自动省激活，也不减少权重或 Adam 状态。等大小样本时 $B_{\\mathrm{eff}}=B_{\\mathrm{micro}}AD$，$A$ 为累积步数、$D$ 为数据并行度；变长样本按有效监督 token 加权，避免重复归一化。FSDP 的 `no_sync` 等设置可能保留完整梯度，须实测峰值。\n\n按瓶颈选择优化：\n\n- 模型状态：DDP 复制状态；TP 切单层矩阵与计算，PP 切不同层，ZeRO 在数据并行组中依次分片 optimizer/master、gradients、parameters。当前模块的参数 all-gather、通信桶和 PP 在途 microbatch 仍可能提高临时峰值。CPU/NVMe offload 用传输与主存/存储带宽换容量。\n- 激活与注意力：checkpointing 用反向重算换保留激活；标准 FlashAttention 通过分块、在线 softmax 避免完整 $S\\times S$ 注意力矩阵驻留 HBM，仍是精确稠密注意力，浮点次序可不同，算术复杂度仍约 $O(S^2)$。稀疏注意力改变可见连接，需另测质量；LoRA 减少可训练状态，长序列激活仍可很大。\n- 数据：streaming 按需读取数据，可减少整库下载、转换和主存驻留，需设置分片、shuffle buffer 与 worker；它不自动压缩模型参数、优化器或当前 batch 的激活。\n\n先 profile OOM 出现在前向、反向还是优化器更新，再比较显存、有效 token 吞吐与任务质量。缩短序列、量化、冻结或稀疏化，都应说明目标或精度变化。\n\n同一混合精度 Adam 账单下，全参微调模型状态约 $16P$。底座全部冻结时，浮点 LoRA 约为 $2P+16P_a$，理想全量化 QLoRA 约为 $P/2+16P_a+M_{\\mathrm{quant\\ metadata}}$ bytes；$P_a$ 是实际新增的可训练 adapter 参数数，不是 rank 本身。未量化冻结层、额外解冻参数须单独重算，不能把已经计入底座的权重再重复加入 adapter 账单。这些都须再加激活、工作区与通信临时状态，且 master/gradient dtype、量化层范围和优化器实现不同会改写系数。14B 全参的这项模型状态账单约 224 GB、208.6 GiB，不能用推理的 28 GB FP16 权重直接估算训练卡数。若冻结视觉或语言模块但需向可训练前层传播梯度，也不能简单整段 no_grad；是否省激活取决于计算图中的可训练位置。\n仅加梯度累积就声称显存下降，或用 $16P$ 状态账单冒充所有实现的峰值显存。\n把数据流式加载、TP/PP、ZeRO 和稀疏 attention 视为同一种省显存操作，忽略各自影响的对象及通信/质量成本。\nmicrobatch 已经是 1，而权重与 optimizer 仍放不下时，应优先尝试哪些状态优化？\n怎么用 profiler 与峰值 `allocated`/`reserved` 区分激活、参数聚合和 `optimizer.step` 的 OOM？\n怎样根据 adapter 的 target_modules 和实际 shape 计算 $P_a$，而不是套固定显存百分比？"}, {"id": "DST-004", "category": "DST", "topic": "训练显存与状态分片", "level": "L1", "title": "ZeRO-1/2/3 各切分什么？理想状态显存是多少？", "tags": ["ZeRO", "显存"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>ZeRO 在数据并行组内逐步消除模型状态冗余：Stage 1 切优化器及主权重，Stage 2 再切梯度，Stage 3 再切参数。在 DST-003 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> bytes 假设下，若分片数为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>，理想持久状态分别为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>12\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>14\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 和 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>收益取决于状态 dtype 和并行度，不能说每升一级都减半。以上不含激活、通信桶和未分片参数；Stage 3 还需临时收集当前计算模块的参数，因此不保证每个 rank 的峰值相同，也不保证更快。ZeRO 切状态冗余，与 TP 切单个矩阵计算不同。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>14\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>16\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>ZeRO 切状态冗余，与 TP 切单个矩阵计算不同。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 ZeRO-3 节省显存却可能更慢？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "ZeRO 在数据并行组内逐步消除模型状态冗余：Stage 1 切优化器及主权重，Stage 2 再切梯度，Stage 3 再切参数。在 DST-003 的 $16P$ bytes 假设下，若分片数为 $D$，理想持久状态分别为 $4P+12P/D$、$2P+14P/D$ 和 $16P/D$。\n\n收益取决于状态 dtype 和并行度，不能说每升一级都减半。以上不含激活、通信桶和未分片参数；Stage 3 还需临时收集当前计算模块的参数，因此不保证每个 rank 的峰值相同，也不保证更快。ZeRO 切状态冗余，与 TP 切单个矩阵计算不同。\nZeRO 切状态冗余，与 TP 切单个矩阵计算不同。\n为什么 ZeRO-3 节省显存却可能更慢？"}, {"id": "DST-005", "category": "DST", "topic": "训练显存与状态分片", "level": "L2", "title": "FSDP 与 ZeRO-3 有什么联系和区别？", "tags": ["FSDP", "ZeRO"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FSDP 与 ZeRO-3 都可分片参数、梯度和优化器状态，需要计算时收集参数，归约后保留局部梯度。主要差别在框架集成、分片表示、通信调度和配置接口，不能直接互换配置。\u003c/p>\u003cp>FSDP 应注明版本：FSDP2 的 \u003ccode>fully_shard\u003c/code> 与旧包装 API 不同，按参数用 DTensor 表示分片。模块分组影响参数收集粒度、峰值显存和通信重叠，reshard 策略则用驻留内存换重复收集成本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能认为 FSDP 与 DeepSpeed 配置可直接互换。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么只在根模块分片可能提高峰值显存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FSDP 与 ZeRO-3 都可分片参数、梯度和优化器状态，需要计算时收集参数，归约后保留局部梯度。主要差别在框架集成、分片表示、通信调度和配置接口，不能直接互换配置。\n\nFSDP 应注明版本：FSDP2 的 `fully_shard` 与旧包装 API 不同，按参数用 DTensor 表示分片。模块分组影响参数收集粒度、峰值显存和通信重叠，reshard 策略则用驻留内存换重复收集成本。\n不能认为 FSDP 与 DeepSpeed 配置可直接互换。\n为什么只在根模块分片可能提高峰值显存？"}, {"id": "DST-006", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "Megatron 的 MLP 张量并行为什么先列切再行切？", "tags": ["张量并行", "Megatron"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>X\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/math> 的矩阵乘法记号，MLP 第一层权重沿输出维度切分，每卡独立得到并逐元素激活自己的中间特征；第二层权重沿对应输入维度切分，每卡得到输出的部分和，再归约相加。这样可避免两次 GEMM 之间收集中间特征。\u003c/p>\u003cp>第二层输出须求和而非拼接，反向也存在对应通信，SP 等方案可调整 collective 布局。框架实际存储的权重可能转置，应先明确所谓行、列所指的维度。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x02026;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x0005B;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmo>&#x022EE;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo>&#x0005D;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>Y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmsub>\u003cmi>H\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>框架权重存储可能转置，必须明确所谓行和列。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>attention 中 QKV 与输出投影怎样对应切分？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "按 $XW$ 的矩阵乘法记号，MLP 第一层权重沿输出维度切分，每卡独立得到并逐元素激活自己的中间特征；第二层权重沿对应输入维度切分，每卡得到输出的部分和，再归约相加。这样可避免两次 GEMM 之间收集中间特征。\n\n第二层输出须求和而非拼接，反向也存在对应通信，SP 等方案可调整 collective 布局。框架实际存储的权重可能转置，应先明确所谓行、列所指的维度。\n框架权重存储可能转置，必须明确所谓行和列。\nattention 中 QKV 与输出投影怎样对应切分？"}, {"id": "DST-007", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "流水线并行的 bubble 从哪里来，怎样降低？", "tags": ["流水线并行", "Bubble"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>流水线并行将不同层分配到不同阶段，启动和排空时部分卡等待，形成 bubble。多个 microbatch、合理前后向调度、虚拟阶段和负载平衡可减少浪费，但也会带来通信与激活驻留成本。\u003c/p>\u003cp>GPipe 与 1F1B 的调度和激活驻留不同，阶段耗时还受层结构、输入长度和通信影响，不能只按层数平均切分。理想 fill-drain 中，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math> 个等时阶段处理 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math> 个 microbatch 时，bubble 比例约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，实际依调度与负载而变；增大 microbatch 个数也不等于增大每个 microbatch 的 batch size。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>增大 microbatch 个数不一定增大每个 microbatch 的 batch size。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>视觉编码器放在首阶段为何易失衡？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "流水线并行将不同层分配到不同阶段，启动和排空时部分卡等待，形成 bubble。多个 microbatch、合理前后向调度、虚拟阶段和负载平衡可减少浪费，但也会带来通信与激活驻留成本。\n\nGPipe 与 1F1B 的调度和激活驻留不同，阶段耗时还受层结构、输入长度和通信影响，不能只按层数平均切分。理想 fill-drain 中，$p$ 个等时阶段处理 $m$ 个 microbatch 时，bubble 比例约为 $(p-1)/(m+p-1)$，实际依调度与负载而变；增大 microbatch 个数也不等于增大每个 microbatch 的 batch size。\n增大 microbatch 个数不一定增大每个 microbatch 的 batch size。\n视觉编码器放在首阶段为何易失衡？"}, {"id": "DST-008", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "Megatron 的 Sequence Parallelism 与 TP 怎样配合？", "tags": ["序列并行", "SP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Megatron 的 Sequence Parallelism 将原本在 TP 各卡重复的 LayerNorm、Dropout 等逐 token 操作沿序列维切分，以减少激活驻留；进入需要全序列或张量切分的区域时，通常通过 all-gather/reduce-scatter 转换布局。\u003c/p>\u003cp>它通常与 TP 配合，重点是减少 TP 之外的重复操作，并不等于将所有长上下文 attention 任意分给各卡。回答时须说明框架语义，其他文献可能用同名描述不同方案；Megatron 中 SP 与 CP 的切分范围不同。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>SP 和 CP 名称相似，但在 Megatron 中切分范围不同。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>SP 为什么不需要切开一条序列的语义？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Megatron 的 Sequence Parallelism 将原本在 TP 各卡重复的 LayerNorm、Dropout 等逐 token 操作沿序列维切分，以减少激活驻留；进入需要全序列或张量切分的区域时，通常通过 all-gather/reduce-scatter 转换布局。\n\n它通常与 TP 配合，重点是减少 TP 之外的重复操作，并不等于将所有长上下文 attention 任意分给各卡。回答时须说明框架语义，其他文献可能用同名描述不同方案；Megatron 中 SP 与 CP 的切分范围不同。\nSP 和 CP 名称相似，但在 Megatron 中切分范围不同。\nSP 为什么不需要切开一条序列的语义？"}, {"id": "DST-009", "category": "DST", "topic": "并行策略与通信", "level": "L3", "title": "Context Parallelism 如何训练更长上下文？", "tags": ["上下文并行", "CP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Context Parallelism 将一条序列的 token 和各层激活分到多卡，每卡计算局部 query，同时交换或收集注意力需要的其他 key/value，降低每卡激活压力。跨分片仍须访问全局 mask 允许的 KV，不能把切出的片段独立做 attention 来替代。\u003c/p>\u003cp>正确性依赖全局因果 mask、位置与通信。因果场景可用交错分配改善不同位置的计算失衡；结合 packing 时还须维护样本边界，禁止跨样本注意力。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>将长文本切段分别前向不是等价 CP。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>CP 与重计算分别解决哪种显存占用？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Context Parallelism 将一条序列的 token 和各层激活分到多卡，每卡计算局部 query，同时交换或收集注意力需要的其他 key/value，降低每卡激活压力。跨分片仍须访问全局 mask 允许的 KV，不能把切出的片段独立做 attention 来替代。\n\n正确性依赖全局因果 mask、位置与通信。因果场景可用交错分配改善不同位置的计算失衡；结合 packing 时还须维护样本边界，禁止跨样本注意力。\n将长文本切段分别前向不是等价 CP。\nCP 与重计算分别解决哪种显存占用？"}, {"id": "DST-010", "category": "DST", "topic": "并行策略与通信", "level": "L3", "title": "MoE 的专家并行有哪些通信与负载问题？", "tags": ["专家并行", "MoE"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>专家并行将不同专家放到不同卡，router 按 token 选择专家后进行分发，计算完再汇集结果。主要瓶颈包括专家 token 分布不均、all-to-all 传输和小批 GEMM，可结合负载约束、分组计算与拓扑优化。\u003c/p>\u003cp>记录每专家的 token 分布及溢出/丢弃比例，在同一时间线观察通信和计算。共享专家与稠密部分还有独立并行布局，稀疏激活不代表免费扩展；EP 大小能否单独乘到总卡数上，取决于分组映射。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>EP 大小不总能独立乘到总卡数上，取决于分组映射。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>增加 top-k 为什么影响效果、显存和通信？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "专家并行将不同专家放到不同卡，router 按 token 选择专家后进行分发，计算完再汇集结果。主要瓶颈包括专家 token 分布不均、all-to-all 传输和小批 GEMM，可结合负载约束、分组计算与拓扑优化。\n\n记录每专家的 token 分布及溢出/丢弃比例，在同一时间线观察通信和计算。共享专家与稠密部分还有独立并行布局，稀疏激活不代表免费扩展；EP 大小能否单独乘到总卡数上，取决于分组映射。\nEP 大小不总能独立乘到总卡数上，取决于分组映射。\n增加 top-k 为什么影响效果、显存和通信？"}, {"id": "DST-011", "category": "DST", "topic": "并行策略与通信", "level": "L1", "title": "AllReduce、ReduceScatter、AllGather 怎样对应？", "tags": ["Collective", "Ring AllReduce"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>AllReduce 使各 rank 获得全量归约结果；ReduceScatter 先归约，每卡只保留一块；AllGather 再将各块收集到所有卡。先 ReduceScatter 再 AllGather 可实现 AllReduce，分片训练则可只保留局部归约结果，减少驻留。\u003c/p>\u003cp>参与 rank 须按相容顺序调用 collective，归约算子、shape 与 dtype 也要相容。理想 ring 中，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 卡对每卡大小为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/math> 的数据做 AllReduce，每卡发送量约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>，接收量相同，未计协议开销；NCCL 会依情况选择不同算法。AllGather 是拼接收集，并非求和。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>AllGather 是拼接收集，不是求和归约。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>小消息为什么可能更适合低延迟算法？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "AllReduce 使各 rank 获得全量归约结果；ReduceScatter 先归约，每卡只保留一块；AllGather 再将各块收集到所有卡。先 ReduceScatter 再 AllGather 可实现 AllReduce，分片训练则可只保留局部归约结果，减少驻留。\n\n参与 rank 须按相容顺序调用 collective，归约算子、shape 与 dtype 也要相容。理想 ring 中，$D$ 卡对每卡大小为 $S$ 的数据做 AllReduce，每卡发送量约 $2(D-1)S/D$，接收量相同，未计协议开销；NCCL 会依情况选择不同算法。AllGather 是拼接收集，并非求和。\nAllGather 是拼接收集，不是求和归约。\n小消息为什么可能更适合低延迟算法？"}, {"id": "DST-012", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "DDP 怎样重叠反向计算与梯度通信？", "tags": ["通信重叠", "DDP Bucket"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DDP 将梯度组织成 bucket，某个 bucket 的梯度全部就绪后即异步归约，让通信与后续反向计算重叠。autograd hook 标记梯度就绪，reducer 控制同步顺序，各 rank 的 collective 顺序须一致。\u003c/p>\u003cp>bucket 太小会增加启动开销，太大会推迟通信；效果还取决于参数顺序和网络，须看 profiler 时间线确认通信实际隐藏了多少。\u003ccode>find_unused_parameters\u003c/code> 增加图遍历开销，应按模型需要启用；异步 API 本身不保证实际并行。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>异步 API 并不保证通信与计算实际并行。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>动态图中未使用视觉分支会怎样影响同步？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DDP 将梯度组织成 bucket，某个 bucket 的梯度全部就绪后即异步归约，让通信与后续反向计算重叠。autograd hook 标记梯度就绪，reducer 控制同步顺序，各 rank 的 collective 顺序须一致。\n\nbucket 太小会增加启动开销，太大会推迟通信；效果还取决于参数顺序和网络，须看 profiler 时间线确认通信实际隐藏了多少。`find_unused_parameters` 增加图遍历开销，应按模型需要启用；异步 API 本身不保证实际并行。\n异步 API 并不保证通信与计算实际并行。\n动态图中未使用视觉分支会怎样影响同步？"}, {"id": "DST-013", "category": "DST", "topic": "精度与激活优化", "level": "L2", "title": "激活 checkpointing 为什么省显存，有哪些正确性条件？", "tags": ["激活重计算", "Checkpointing"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>激活 checkpointing 只保留部分边界张量，反向时重跑前向恢复中间值，用额外计算换显存。它减少保留激活，不直接切分参数或 Adam 状态；选择重算粒度需同时评估峰值显存和 step 时间。\u003c/p>\u003cp>重算须保证随机数、控制流和状态更新一致，否则可能改变梯度或重复副作用。保留 RNG 可维持 dropout 一致性，但有开销；PyTorch 可重入与非可重入版本行为不同，应显式选择，带缓存更新或全局状态依赖的函数不能盲目重算。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>带缓存更新或依赖全局状态的函数不能盲目重算。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>什么时候省显存反而能提升吞吐？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "激活 checkpointing 只保留部分边界张量，反向时重跑前向恢复中间值，用额外计算换显存。它减少保留激活，不直接切分参数或 Adam 状态；选择重算粒度需同时评估峰值显存和 step 时间。\n\n重算须保证随机数、控制流和状态更新一致，否则可能改变梯度或重复副作用。保留 RNG 可维持 dropout 一致性，但有开销；PyTorch 可重入与非可重入版本行为不同，应显式选择，带缓存更新或全局状态依赖的函数不能盲目重算。\n带缓存更新或依赖全局状态的函数不能盲目重算。\n什么时候省显存反而能提升吞吐？"}, {"id": "DST-014", "category": "DST", "topic": "精度与激活优化", "level": "L1", "title": "BF16 与 FP16 混合精度训练为什么表现不同？", "tags": ["BF16", "FP16", "AMP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BF16 和 FP16 都占两字节，但 BF16 指数位更宽、尾数更少，动态范围接近 FP32；FP16 更易梯度下溢，常需 loss scaling。BF16 范围更大并不代表每个数更精确，也不保证训练不会 NaN。\u003c/p>\u003cp>混合精度的 \u003ccode>autocast\u003c/code> 按算子选择执行精度，不是将所有运算强制为同一 dtype；归约、优化器状态也需单独核对。使用 \u003ccode>GradScaler\u003c/code> 时先缩放损失，更新前解除缩放，再裁剪梯度；异常仍要查输入、归一化和学习率。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>BF16 范围更大不等于每个数都比 FP16 更精确。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>loss scaling 与模型输出 logits 温度有何区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BF16 和 FP16 都占两字节，但 BF16 指数位更宽、尾数更少，动态范围接近 FP32；FP16 更易梯度下溢，常需 loss scaling。BF16 范围更大并不代表每个数更精确，也不保证训练不会 NaN。\n\n混合精度的 `autocast` 按算子选择执行精度，不是将所有运算强制为同一 dtype；归约、优化器状态也需单独核对。使用 `GradScaler` 时先缩放损失，更新前解除缩放，再裁剪梯度；异常仍要查输入、归一化和学习率。\nBF16 范围更大不等于每个数都比 FP16 更精确。\nloss scaling 与模型输出 logits 温度有何区别？"}, {"id": "DST-015", "category": "DST", "topic": "训练显存与状态分片", "level": "L2", "title": "CPU/NVMe Offload 适合哪些场景，为什么可能变慢？", "tags": ["Offload", "ZeRO"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CPU/NVMe offload 将部分参数、梯度或优化器状态迁出 GPU，利用主存和存储扩大可训练规模。数据搬运和 CPU 优化器可能增加关键路径，适合显存无法容纳的任务，需实测吞吐、主存占用和传输重叠。\u003c/p>\u003cp>参数与优化器 offload 的阶段支持不同。pinned memory 和预取可帮助传输，但占用主存；还要考虑 PCIe、存储带宽、线程数和缓存命中。状态能放下不代表当前模块的完整计算也能放下，省显存也不等于加速。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>状态可放下不代表当前模块的完整计算也能放下。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样判断瓶颈在 CPUAdam 还是传输？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CPU/NVMe offload 将部分参数、梯度或优化器状态迁出 GPU，利用主存和存储扩大可训练规模。数据搬运和 CPU 优化器可能增加关键路径，适合显存无法容纳的任务，需实测吞吐、主存占用和传输重叠。\n\n参数与优化器 offload 的阶段支持不同。pinned memory 和预取可帮助传输，但占用主存；还要考虑 PCIe、存储带宽、线程数和缓存命中。状态能放下不代表当前模块的完整计算也能放下，省显存也不等于加速。\n状态可放下不代表当前模块的完整计算也能放下。\n怎样判断瓶颈在 CPUAdam 还是传输？"}, {"id": "DST-016", "category": "DST", "topic": "训练故障与可靠性", "level": "L3", "title": "分布式训练怎样做到可靠断点续训？", "tags": ["Checkpoint", "恢复"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>可靠断点续训不仅恢复参数，还要恢复优化器、调度器、随机数、采样进度和训练计数；分片训练还需一致的分片元数据。各 rank 保存的状态应对应同一更新边界，并验证恢复后的下一步与连续训练一致。\u003c/p>\u003cp>保存模型和优化器 \u003ccode>state_dict\u003c/code>，记录框架及并行配置；异步保存需有完成标记，不能将未写完的 checkpoint 当作有效文件。world size 变化时须支持重分片并说明样本顺序语义，仅保存 rank0 权重不足以恢复全部训练进度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>能加载权重不代表优化器和数据进度已恢复。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何测试故障发生在保存过程中？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "可靠断点续训不仅恢复参数，还要恢复优化器、调度器、随机数、采样进度和训练计数；分片训练还需一致的分片元数据。各 rank 保存的状态应对应同一更新边界，并验证恢复后的下一步与连续训练一致。\n\n保存模型和优化器 `state_dict`，记录框架及并行配置；异步保存需有完成标记，不能将未写完的 checkpoint 当作有效文件。world size 变化时须支持重分片并说明样本顺序语义，仅保存 rank0 权重不足以恢复全部训练进度。\n能加载权重不代表优化器和数据进度已恢复。\n如何测试故障发生在保存过程中？"}, {"id": "DST-017", "category": "DST", "topic": "训练故障与可靠性", "level": "L2", "title": "DistributedSampler、set_epoch 和 drop_last 怎么用？", "tags": ["数据采样", "DDP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>DistributedSampler 为各数据并行 rank 分配样本，启用 shuffle 时每轮开始前调用 \u003ccode>set_epoch\u003c/code> 改变顺序，各 rank 使用一致的数据集大小和种子。数据不能整除时，补齐或丢尾会影响覆盖与重复。\u003c/p>\u003cp>Sampler 和 DataLoader 的 \u003ccode>drop_last\u003c/code> 含义不同。评估需按全局样本标识合并结果，清理补齐产生的重复；DDP 本身不会代替训练程序调用 \u003ccode>set_epoch\u003c/code> 或分割数据。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>DDP 本身不会替你调用 \u003ccode>set_epoch\u003c/code> 或切分数据。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>\u003ccode>IterableDataset\u003c/code> 如何避免 worker/rank 重复读取？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "DistributedSampler 为各数据并行 rank 分配样本，启用 shuffle 时每轮开始前调用 `set_epoch` 改变顺序，各 rank 使用一致的数据集大小和种子。数据不能整除时，补齐或丢尾会影响覆盖与重复。\n\nSampler 和 DataLoader 的 `drop_last` 含义不同。评估需按全局样本标识合并结果，清理补齐产生的重复；DDP 本身不会代替训练程序调用 `set_epoch` 或分割数据。\nDDP 本身不会替你调用 `set_epoch` 或切分数据。\n`IterableDataset` 如何避免 worker/rank 重复读取？"}, {"id": "DST-018", "category": "DST", "topic": "训练故障与可靠性", "level": "L3", "title": "训练挂在 NCCL collective 上，如何定位？", "tags": ["NCCL", "故障诊断"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先收集所有 rank 的日志和最早错误，确认有无某卡 OOM、异常退出或输入耗尽，再核对 collective 顺序、shape 和进程组。其他 rank 最后停在 NCCL 等待处，未必就是最早故障位置。\u003c/p>\u003cp>调试时记录 collective 序号，必要时用监测 barrier 定位缺席 rank。程序一致后，再做单机、多机最小通信测试，将程序问题与网络、拓扑、硬件和驱动分离；只增加 timeout 不能修复根因。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>其他 rank 的最后一个 NCCL 等待通常不一定是最早故障。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>动态视觉分支为何可能造成 collective 不一致？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先收集所有 rank 的日志和最早错误，确认有无某卡 OOM、异常退出或输入耗尽，再核对 collective 顺序、shape 和进程组。其他 rank 最后停在 NCCL 等待处，未必就是最早故障位置。\n\n调试时记录 collective 序号，必要时用监测 barrier 定位缺席 rank。程序一致后，再做单机、多机最小通信测试，将程序问题与网络、拓扑、硬件和驱动分离；只增加 timeout 不能修复根因。\n其他 rank 的最后一个 NCCL 等待通常不一定是最早故障。\n动态视觉分支为何可能造成 collective 不一致？"}, {"id": "DST-019", "category": "DST", "topic": "训练故障与可靠性", "level": "L2", "title": "MFU、HFU 与 GPU utilization 有什么区别？", "tags": ["MFU", "性能指标"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GPU utilization 只反映设备是否忙；HFU 可包含重计算等实际执行 FLOPs；MFU 则用完成训练所需的模型有效 FLOPs，除以 step 时间与集群理论峰值的乘积。MFU 分子不把激活重计算当作额外有效工作，因此 GPU 忙也可能来自低效算子或通信等待。\u003c/p>\u003cp>稠密 Transformer 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>6\u003c/mn>\u003cmi>N\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math> 近似忽略 attention 和额外模块，长序列时这些项不可忽略，MoE 也不能直接按总参数量套用。峰值须匹配 dtype、稠密/稀疏口径和实际 GPU 数，并结合 token 吞吐与训练精度解释。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>MFU\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>C\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmn>6\u003c/mn>\u003cmi>N\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>MoE 不能无条件按总参数量套 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>6\u003c/mn>\u003cmi>N\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/math>。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>长序列下为什么 attention 项不能忽略？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GPU utilization 只反映设备是否忙；HFU 可包含重计算等实际执行 FLOPs；MFU 则用完成训练所需的模型有效 FLOPs，除以 step 时间与集群理论峰值的乘积。MFU 分子不把激活重计算当作额外有效工作，因此 GPU 忙也可能来自低效算子或通信等待。\n\n稠密 Transformer 的 $6NT$ 近似忽略 attention 和额外模块，长序列时这些项不可忽略，MoE 也不能直接按总参数量套用。峰值须匹配 dtype、稠密/稀疏口径和实际 GPU 数，并结合 token 吞吐与训练精度解释。\nMoE 不能无条件按总参数量套 $6NT$。\n长序列下为什么 attention 项不能忽略？"}, {"id": "DST-020", "category": "DST", "topic": "训练故障与可靠性", "level": "L3", "title": "多模态训练吞吐波动，怎样做 profiling 与负载平衡？", "tags": ["多模态训练", "Profiling", "Packing"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>动态图像分辨率、视频帧数及答案长度使各 rank 的工作量不同，快卡会在同步点等待慢卡。先记录每卡视觉/文本 token、数据准备、算子和通信时间，用 profiler 分离解码、视觉编码、LLM 与通信，再按估计成本分桶或 packing。\u003c/p>\u003cp>仅平均样本张数不足以平衡，总 token 数相同也不保证视觉编码成本相同。packed 样本须保留边界 mask，避免跨样本注意力和标签串扰；优化后复查最大卡显存、有效监督 token 吞吐及任务配比。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>总 token 相同也不保证视觉编码开销相同。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>冻结视觉编码器时怎样判断预计算特征是否合适？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "动态图像分辨率、视频帧数及答案长度使各 rank 的工作量不同，快卡会在同步点等待慢卡。先记录每卡视觉/文本 token、数据准备、算子和通信时间，用 profiler 分离解码、视觉编码、LLM 与通信，再按估计成本分桶或 packing。\n\n仅平均样本张数不足以平衡，总 token 数相同也不保证视觉编码成本相同。packed 样本须保留边界 mask，避免跨样本注意力和标签串扰；优化后复查最大卡显存、有效监督 token 吞吐及任务配比。\n总 token 相同也不保证视觉编码开销相同。\n冻结视觉编码器时怎样判断预计算特征是否合适？"}, {"id": "DST-021", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "DP、TP、PP、SP/CP 与 EP 如何组合，为什么网络拓扑决定并行方案？", "tags": ["混合并行", "3D并行", "拓扑"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先用参数、optimizer和激活估算显存，再用profile确定计算、通信和数据供给瓶颈。DP复制模型分处理数据，TP分同层矩阵，PP分层，SP/CP分token或上下文，EP分专家；它们可以组合，但不同维度要建立对应通信组，不能把world_size分别除多次后重复计算同一组设备。基本DP×TP×PP mesh可写W=DTP，实际CP/EP与DP是否嵌套取决于框架。\u003c/p>\u003cp>TP每层通信频繁，常放在高带宽节点内；PP跨阶段传activation和gradient，适合相对慢的节点间链路；DP通信量依赖梯度/ZeRO阶段，EP有token all-to-all，长上下文还要考虑CP环通信。ZeRO节省状态显存却不替代TP算子切分或PP层分布，因此“有ZeRO就无需混合并行”不成立。选择DeepSpeed/Megatron/FSDP等框架要看所需并行、模型算子、checkpoint和运维支持，先做小规模稳定性/吞吐基线再扩展。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把张量并行度也乘进数据样本数量。\u003c/li>\u003cli>不考虑网络拓扑就把同一通信组跨慢链路拆散。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>TP通信与EP通信为什么可能争抢同一链路？\u003c/li>\u003cli>为什么低带宽多机ZeRO-3可能不如单机LoRA？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先用参数、optimizer和激活估算显存，再用profile确定计算、通信和数据供给瓶颈。DP复制模型分处理数据，TP分同层矩阵，PP分层，SP/CP分token或上下文，EP分专家；它们可以组合，但不同维度要建立对应通信组，不能把world_size分别除多次后重复计算同一组设备。基本DP×TP×PP mesh可写W=DTP，实际CP/EP与DP是否嵌套取决于框架。\n\nTP每层通信频繁，常放在高带宽节点内；PP跨阶段传activation和gradient，适合相对慢的节点间链路；DP通信量依赖梯度/ZeRO阶段，EP有token all-to-all，长上下文还要考虑CP环通信。ZeRO节省状态显存却不替代TP算子切分或PP层分布，因此“有ZeRO就无需混合并行”不成立。选择DeepSpeed/Megatron/FSDP等框架要看所需并行、模型算子、checkpoint和运维支持，先做小规模稳定性/吞吐基线再扩展。\n把张量并行度也乘进数据样本数量。\n不考虑网络拓扑就把同一通信组跨慢链路拆散。\nTP通信与EP通信为什么可能争抢同一链路？\n为什么低带宽多机ZeRO-3可能不如单机LoRA？"}, {"id": "DST-022", "category": "DST", "topic": "并行策略与通信", "level": "L3", "title": "自动并行怎样搜索或传播分片方案，GSPMD、FlexFlow 与 Alpa 有何区别？", "tags": ["自动并行", "GSPMD", "Alpa"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>自动并行需要把模型计算图、设备mesh、算子合法分片和通信成本结合，找满足显存约束的低时延执行计划。Mesh-TensorFlow让张量维度映射到mesh轴；GSPMD依据少量sharding标注传播分片并插入通信，不等于对所有硬件组合做穷举全局最优搜索。FlexFlow在sample/operator/attribute/parameter（SOAP）维度搜索并用模拟器估成本；Alpa把算子内并行与算子间/流水线规划分层求解。\u003c/p>\u003cp>划分改变时可能产生reshape/reshard通信，最小化单算子时间不一定最小化完整step。成本模型还受网络争用、kernel实现、dynamic shape与activation内存影响，模拟计划需实测校准。系统能降低手工设计负担，但不能保证任意图、拓扑和实际负载达到数学全局最优；支持的算子、编译耗时、计划稳定性和checkpoint可移植性同样重要。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>min\u003c/mo>\u003cmrow>\u003cmi>&#x003C0;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmtext>s.t.\u003c/mtext>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02264;\u003c/mo>\u003cmsubsup>\u003cmi>M\u003c/mi>\u003cmi>i\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msubsup>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmo>&#x02200;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把sharding传播与全局穷举最优搜索混为一谈。\u003c/li>\u003cli>忽略计划中的reshard通信与峰值显存。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么单算子最优分片不一定是全图最优？\u003c/li>\u003cli>动态shape如何影响自动规划的复用？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "自动并行需要把模型计算图、设备mesh、算子合法分片和通信成本结合，找满足显存约束的低时延执行计划。Mesh-TensorFlow让张量维度映射到mesh轴；GSPMD依据少量sharding标注传播分片并插入通信，不等于对所有硬件组合做穷举全局最优搜索
