、控制和评测。\u003c/p>\u003cp>选择时在同一任务上比较内容准确率、打断恢复和声学表达。流水线也可分块与并行，其延迟并非各阶段整段耗时的固定相加；多流建模可处理用户和模型同时说话的全双工情境。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>端到端不等于必须舍弃文字接口或工具调用。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>客服对话和情感陪伴的选择标准为何不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "ASR→LLM→TTS 流水线便于检查中间文本、接工具和替换组件，但转写可能丢失韵律，并累积延迟。端到端语音模型可保留更多声学信息、实现多流对话，但需要更复杂的数据、控制和评测。\n\n选择时在同一任务上比较内容准确率、打断恢复和声学表达。流水线也可分块与并行，其延迟并非各阶段整段耗时的固定相加；多流建模可处理用户和模型同时说话的全双工情境。\n端到端不等于必须舍弃文字接口或工具调用。\n客服对话和情感陪伴的选择标准为何不同？"}, {"id": "OMM-013", "category": "OMM", "topic": "语音生成与流式", "level": "L3", "title": "流式语音系统的端到端延迟应怎样拆解？", "tags": ["流式语音", "延迟"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>流式语音的可感知延迟包括采集分块、编码前视、识别或理解、模型生成、音频解码、传输及播放缓冲。需区分算法前视、实际推理耗时和网络/播放器缓冲，理论 codec 帧延迟只是其中一部分。\u003c/p>\u003cp>记录首包延迟、持续实时率和打断反应，再以流式重叠优化关键路径。低帧率减少 token 负担，却可能增大最小输出块时长；长对话还应检查尾延迟与设备负载，不能直接用论文理论延迟承诺用户端性能。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能用论文理论延迟直接承诺用户端端到端延迟。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>降低音频块大小为什么可能降低质量和吞吐？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "流式语音的可感知延迟包括采集分块、编码前视、识别或理解、模型生成、音频解码、传输及播放缓冲。需区分算法前视、实际推理耗时和网络/播放器缓冲，理论 codec 帧延迟只是其中一部分。\n\n记录首包延迟、持续实时率和打断反应，再以流式重叠优化关键路径。低帧率减少 token 负担，却可能增大最小输出块时长；长对话还应检查尾延迟与设备负载，不能直接用论文理论延迟承诺用户端性能。\n不能用论文理论延迟直接承诺用户端端到端延迟。\n降低音频块大小为什么可能降低质量和吞吐？"}, {"id": "OMM-014", "category": "OMM", "topic": "语音识别与编码", "level": "L2", "title": "为什么唇读等视觉信息可以帮助噪声下的 ASR？", "tags": ["AV-HuBERT", "音视频"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>嘴部运动提供与语音相关的视觉线索，在音频噪声或缺失时补充声学证据。AV-HuBERT 通过多模态掩码与聚类目标学习联合表示，但相似口型可对应不同声音，视觉不能区分所有语音，也不能完全替代可靠音频。\u003c/p>\u003cp>预处理需检查嘴部裁剪和音视频时钟同步。按噪声、遮挡、视角和说话人分组评估，并考虑侧脸、多说话人及音视频错位时的降级。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>相似口型可对应不同声音，唇读本身存在歧义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>音视频错位多少时应触发降级？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "嘴部运动提供与语音相关的视觉线索，在音频噪声或缺失时补充声学证据。AV-HuBERT 通过多模态掩码与聚类目标学习联合表示，但相似口型可对应不同声音，视觉不能区分所有语音，也不能完全替代可靠音频。\n\n预处理需检查嘴部裁剪和音视频时钟同步。按噪声、遮挡、视角和说话人分组评估，并考虑侧脸、多说话人及音视频错位时的降级。\n相似口型可对应不同声音，唇读本身存在歧义。\n音视频错位多少时应触发降级？"}, {"id": "OMM-015", "category": "OMM", "topic": "Omni 融合与评测", "level": "L3", "title": "Omni 模型怎样评估是否真的融合了声音与视觉？", "tags": ["OmniBench", "联合证据"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>设计必须联合声音和视觉才可解答的样本，再移除或替换音频、视觉，比较完整输入与单模态基线。单一模态就能猜中的题不能证明融合；OmniBench 强调视觉、声音、文字的联合识别和推理。\u003c/p>\u003cp>标注答案所依赖的时间片段与模态，分别评测同步、矛盾线索和模态缺失。除了答案正确率，还需衡量证据一致性和不确定性处理，防止强模态捷径主导结果。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>多模态输入可被某个强模态捷径主导。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>声音与画面相矛盾时应输出什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "设计必须联合声音和视觉才可解答的样本，再移除或替换音频、视觉，比较完整输入与单模态基线。单一模态就能猜中的题不能证明融合；OmniBench 强调视觉、声音、文字的联合识别和推理。\n\n标注答案所依赖的时间片段与模态，分别评测同步、矛盾线索和模态缺失。除了答案正确率，还需衡量证据一致性和不确定性处理，防止强模态捷径主导结果。\n多模态输入可被某个强模态捷径主导。\n声音与画面相矛盾时应输出什么？"}, {"id": "COD-001", "category": "COD", "topic": "模型算子与数值实现", "level": "L1", "title": "手写稳定 Softmax 与交叉熵，为什么要减最大值？", "tags": ["数值稳定", "log-sum-exp"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Softmax 对所有 logits 加同一常数不变，因为分子与分母中的公因子会抵消。令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，先减最大值再计算指数，可以避免大正数导致溢出。\u003c/p>\u003cp>交叉熵直接计算 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>logsumexp\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，比先求概率再取对数更稳定；对 logits 的梯度为预测概率减去目标的 one-hot 向量。实现需要测试大正负 logits、平移不变性和部分 \u003ccode>-inf\u003c/code> mask。全为 \u003ccode>-inf\u003c/code> 的行没有有效概率分布，必须显式处理。\u003c/p>\u003cp>减去任意共同常数的等价性来自 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmi>z\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmi>z\u003c/mi>\u003c/msup>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，归一化时公共因子抵消。它不能自动推广到任意函数：例如先 sigmoid 再归一化，一般有 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02260;\u003c/mo>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；ReLU 后归一化还可能出现全零分母。替换函数会改变权重、梯度甚至概率语义，数值稳定化必须按新公式推导，而不是照搬 softmax 的技巧。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>m\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>max\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">E\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/munder>\u003cmsup>\u003cmi>e\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>y\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只写 exp(z)/sum(exp(z))；或者用 log(softmax) 在极端值下得到 log(0)。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何实现 label smoothing 和 ignore_index？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Softmax 对所有 logits 加同一常数不变，因为分子与分母中的公因子会抵消。令 $m=\\max_i z_i$，先减最大值再计算指数，可以避免大正数导致溢出。\n\n交叉熵直接计算 $\\operatorname{logsumexp}(z)-z_y$，比先求概率再取对数更稳定；对 logits 的梯度为预测概率减去目标的 one-hot 向量。实现需要测试大正负 logits、平移不变性和部分 `-inf` mask。全为 `-inf` 的行没有有效概率分布，必须显式处理。\n\n减去任意共同常数的等价性来自 $e^{z-c}=e^ze^{-c}$，归一化时公共因子抵消。它不能自动推广到任意函数：例如先 sigmoid 再归一化，一般有 $\\sigma(z_i-c)/\\sum_j\\sigma(z_j-c)\\ne\\sigma(z_i)/\\sum_j\\sigma(z_j)$；ReLU 后归一化还可能出现全零分母。替换函数会改变权重、梯度甚至概率语义，数值稳定化必须按新公式推导，而不是照搬 softmax 的技巧。\n只写 exp(z)/sum(exp(z))；或者用 log(softmax) 在极端值下得到 log(0)。\n如何实现 label smoothing 和 ignore_index？"}, {"id": "COD-002", "category": "COD", "topic": "模型算子与数值实现", "level": "L1", "title": "手撕 Multi-Head Attention：形状、缩放与 mask 怎么写？", "tags": ["MHA", "shape", "mask"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>输入形状为 \u003ccode>[B,T,D]\u003c/code>，Q/K/V 投影后拆成 \u003ccode>[B,H,T,d]\u003c/code>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/math>。可以使用一个 \u003ccode>D→3D\u003c/code> 线性层一次生成三组投影，但它们仍有各自的参数。\u003c/p>\u003cp>计算缩放点积后，分数形状为 \u003ccode>[B,H,Tq,Tk]\u003c/code>。先加因果或 padding mask，再沿 \u003ccode>Tk\u003c/code> 轴做 softmax，与 V 相乘；各头输出拼接回 \u003ccode>[B,T,D]\u003c/code>，最后经过输出投影。用输出形状和“未来 token 改变不影响较早位置”的性质检查实现。教学代码可显式生成二次方大小的分数矩阵，生产 SDPA 通常用融合内核；训练与推理的 dropout 设置也要区分。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>Attention\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmi>d\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把布尔 mask 语义弄反；PyTorch 不同 API 的 True 可能表示允许或屏蔽。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>加入 GQA 后 Q 头数与 KV 头数如何对应？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "输入形状为 `[B,T,D]`，Q/K/V 投影后拆成 `[B,H,T,d]`，其中 $D=Hd$。可以使用一个 `D→3D` 线性层一次生成三组投影，但它们仍有各自的参数。\n\n计算缩放点积后，分数形状为 `[B,H,Tq,Tk]`。先加因果或 padding mask，再沿 `Tk` 轴做 softmax，与 V 相乘；各头输出拼接回 `[B,T,D]`，最后经过输出投影。用输出形状和“未来 token 改变不影响较早位置”的性质检查实现。教学代码可显式生成二次方大小的分数矩阵，生产 SDPA 通常用融合内核；训练与推理的 dropout 设置也要区分。\n把布尔 mask 语义弄反；PyTorch 不同 API 的 True 可能表示允许或屏蔽。\n加入 GQA 后 Q 头数与 KV 头数如何对应？"}, {"id": "COD-003", "category": "COD", "topic": "采样与缓存实现", "level": "L2", "title": "KV Cache 增量解码的因果 mask 为什么容易写错？", "tags": ["KV Cache", "causal mask", "offset"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>增量解码有缓存时，新 query 的绝对位置从 \u003ccode>past_len\u003c/code> 开始，第 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 个 query 只能访问满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">&#x0005F;\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 的 key。若 \u003ccode>Tq=1\u003c/code>、\u003ccode>Tk\u003c/code> 很长，直接套左上三角 mask 会错误地只保留第一个 key，因此要按绝对位置比较，或确认框架对非方阵因果 mask 的定义。\u003c/p>\u003cp>实现还需组合 padding mask，并保证缓存 K 的 RoPE 位置与新 query 的位置一致。在 \u003ccode>eval\u003c/code> 和相同精度下，对照整段 prefill 与逐 token decode 的同位置输出，应该在数值容差内一致。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>allowed\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmrow>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003c/mrow>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">&#x0005F;\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>认为 is_causal=True 对所有非方阵 attention 都自动等价于缓存解码。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>滑动窗口缓存淘汰后位置编号如何维护？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "增量解码有缓存时，新 query 的绝对位置从 `past_len` 开始，第 $i$ 个 query 只能访问满足 $j\\leq\\mathrm{past\\_len}+i$ 的 key。若 `Tq=1`、`Tk` 很长，直接套左上三角 mask 会错误地只保留第一个 key，因此要按绝对位置比较，或确认框架对非方阵因果 mask 的定义。\n\n实现还需组合 padding mask，并保证缓存 K 的 RoPE 位置与新 query 的位置一致。在 `eval` 和相同精度下，对照整段 prefill 与逐 token decode 的同位置输出，应该在数值容差内一致。\n认为 is_causal=True 对所有非方阵 attention 都自动等价于缓存解码。\n滑动窗口缓存淘汰后位置编号如何维护？"}, {"id": "COD-004", "category": "COD", "topic": "模型算子与数值实现", "level": "L2", "title": "手写 RoPE，并证明旋转保持范数与相对位置内积。", "tags": ["RoPE", "旋转", "相对位置"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RoPE 将偶数维向量按二维对旋转，每对使用不同频率。位置 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math> 对应的角度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmspace width=\"0.167em\" />\u003cmsup>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>i\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，一对分量 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 变为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi>a\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>旋转矩阵正交，因此保持向量范数；又因为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>，旋转后的 Q/K 内积通过旋转项依赖位置差。相邻维配对与 split-half 配对可以通过维度排列对应，但已有权重不能直接混用两种布局。实现应匹配模型的频率、配对方式和位置编号，并测试范数及相对位置内积。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmspace width=\"0.167em\" />\u003cmsup>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>i\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmo>&#x02016;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmo>&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02016;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmo>&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmi>q\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>k\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 RoPE 当作加到 embedding 的位置向量，或对 V 也默认旋转。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>频率缩放改变了哪个项？为什么公式可外推不代表效果必然可外推？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RoPE 将偶数维向量按二维对旋转，每对使用不同频率。位置 $m$ 对应的角度为 $\\phi_i=m\\,\\mathrm{base}^{-2i/d}$，一对分量 $(a,b)$ 变为 $(a\\cos\\phi_i-b\\sin\\phi_i,\\ a\\sin\\phi_i+b\\cos\\phi_i)$。\n\n旋转矩阵正交，因此保持向量范数；又因为 $R_m^\\top R_n=R_{n-m}$，旋转后的 Q/K 内积通过旋转项依赖位置差。相邻维配对与 split-half 配对可以通过维度排列对应，但已有权重不能直接混用两种布局。实现应匹配模型的频率、配对方式和位置编号，并测试范数及相对位置内积。\n把 RoPE 当作加到 embedding 的位置向量，或对 V 也默认旋转。\n频率缩放改变了哪个项？为什么公式可外推不代表效果必然可外推？"}, {"id": "COD-005", "category": "COD", "topic": "损失函数与训练代码", "level": "L2", "title": "手写 InfoNCE：正样本标签与 in-batch negatives 如何组织？", "tags": ["InfoNCE", "对比学习", "false negative"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把匹配的 query/key 排在相同 batch 索引，归一化后计算两两相似度并除以温度，得到 \u003ccode>[N,N]\u003c/code> logits；以 \u003ccode>arange(N)\u003c/code> 为标签，对每一行做交叉熵并取平均。正样本在对角线上，其他列为 in-batch negatives。\u003c/p>\u003cp>温度必须大于零；降低温度会让分布更尖，也会改变梯度与难负例的影响。双向图文训练可以平均两个方向的损失，但要注意重复样本形成假负例。分布式 all-gather 时，标签 offset 必须对应全局 batch 顺序，同时确认实现是否向被 gather 的特征回传梯度。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/munderover>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/msubsup>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把一批同类别的另一个正例也当负例；或打乱 keys 后仍用对角标签。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>当 N=1 时还有对比信号吗？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把匹配的 query/key 排在相同 batch 索引，归一化后计算两两相似度并除以温度，得到 `[N,N]` logits；以 `arange(N)` 为标签，对每一行做交叉熵并取平均。正样本在对角线上，其他列为 in-batch negatives。\n\n温度必须大于零；降低温度会让分布更尖，也会改变梯度与难负例的影响。双向图文训练可以平均两个方向的损失，但要注意重复样本形成假负例。分布式 all-gather 时，标签 offset 必须对应全局 batch 顺序，同时确认实现是否向被 gather 的特征回传梯度。\n把一批同类别的另一个正例也当负例；或打乱 keys 后仍用对角标签。\n当 N=1 时还有对比信号吗？"}, {"id": "COD-006", "category": "COD", "topic": "采样与缓存实现", "level": "L2", "title": "实现 top-k / top-p 采样，截断边界怎么处理？", "tags": ["top-p", "top-k", "sampling"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确定温度和过滤顺序。Top-k 保留固定数量的候选；top-p 则把概率降序排列，保留累计质量首次达到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003c/mrow>\u003c/math> 的最小前缀，包含跨过阈值的那个 token，再重新归一化采样。例如概率 \u003ccode>[0.6,0.3,0.1]\u003c/code>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0.7\u003c/mn>\u003c/mrow>\u003c/math> 时应保留前两项。\u003c/p>\u003cp>本仓库示例采用“temperature → top-k → 归一化 → top-p → 再归一化”，其他顺序可能产生不同分布。温度为零走独立贪心路径；排序并列值、极小温度和非法参数应有明确约定，测试使用固定随机数生成器便于复现。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>用 cumsum&lt;=p 直接过滤，误删达到阈值的 token，甚至删空。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>top-k 与 top-p 的组合为什么顺序可能改变候选集？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确定温度和过滤顺序。Top-k 保留固定数量的候选；top-p 则把概率降序排列，保留累计质量首次达到 $p$ 的最小前缀，包含跨过阈值的那个 token，再重新归一化采样。例如概率 `[0.6,0.3,0.1]`、$p=0.7$ 时应保留前两项。\n\n本仓库示例采用“temperature → top-k → 归一化 → top-p → 再归一化”，其他顺序可能产生不同分布。温度为零走独立贪心路径；排序并列值、极小温度和非法参数应有明确约定，测试使用固定随机数生成器便于复现。\n用 cumsum\u003c=p 直接过滤，误删达到阈值的 token，甚至删空。\ntop-k 与 top-p 的组合为什么顺序可能改变候选集？"}, {"id": "COD-007", "category": "COD", "topic": "模型算子与数值实现", "level": "L2", "title": "实现 LoRA Linear 并证明 merge 前后输出一致。", "tags": ["LoRA", "矩阵乘法", "merge"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>冻结基座权重 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/math>，增加低秩更新 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>。采用行 batch 输入时，前向为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmsup>\u003cmi>W\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>。矩阵形状分别为 \u003ccode>W[out,in]\u003c/code>、\u003ccode>A[r,in]\u003c/code>、\u003ccode>B[out,r]\u003c/code>，新增参数量为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003cmo>&#x0002B;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>常见初始化是 A 随机、B 为零，使初始输出与基座一致；首步 A 的梯度为零，B 仍可学习。当 dropout 关闭且权重精度一致时，把 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/math> 合并到 W 应与未合并前向在容差内一致。测试还应确认冻结参数没有梯度；量化基座的合并需要额外处理。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把低秩更新写成元素乘法，或 merge 后仍重复加 adapter。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>B 随机、A 零是否也能让初始更新为零？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "冻结基座权重 $W$，增加低秩更新 $\\Delta W=(\\alpha/r)BA$。采用行 batch 输入时，前向为 $xW^\\top+(\\alpha/r)(xA^\\top)B^\\top$。矩阵形状分别为 `W[out,in]`、`A[r,in]`、`B[out,r]`，新增参数量为 $r(\\mathrm{in}+\\mathrm{out})$。\n\n常见初始化是 A 随机、B 为零，使初始输出与基座一致；首步 A 的梯度为零，B 仍可学习。当 dropout 关闭且权重精度一致时，把 $\\Delta W$ 合并到 W 应与未合并前向在容差内一致。测试还应确认冻结参数没有梯度；量化基座的合并需要额外处理。\n把低秩更新写成元素乘法，或 merge 后仍重复加 adapter。\nB 随机、A 零是否也能让初始更新为零？"}, {"id": "COD-008", "category": "COD", "topic": "损失函数与训练代码", "level": "L2", "title": "实现 DPO loss，怎样避免符号和序列概率错误？", "tags": ["DPO", "logprob", "loss"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>对同一 prompt 的 chosen/rejected，计算回答 token 的序列 log probability；各自减去冻结 reference 的对应值，再取 chosen 相对 rejected 的差并乘 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math>，得到 margin \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>z\u003c/mi>\u003c/mrow>\u003c/math>。损失为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，用 \u003ccode>softplus(-z)\u003c/code> 或 \u003ccode>-logsigmoid(z)\u003c/code> 实现，避免先求 sigmoid 再取对数的数值问题。\u003c/p>\u003cp>标准 DPO 对回答 token 的 log probability 求和，prompt 与 padding 不进入求和，reference 不反传。按长度平均会改变目标，应明确说明。用正负 margin、极端数值及冻结参数梯度测试，可以发现符号和 mask 错误。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>z\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003c/msup>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003c/msup>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo>&#x02212;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003c/msup>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>y\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003c/msup>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">O\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softplus\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>&#x003C3;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>chosen margin 变好时 loss 却变大；或者漏掉 reference 项。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>reference 与 policy 初始相同，loss 是多少？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "对同一 prompt 的 chosen/rejected，计算回答 token 的序列 log probability；各自减去冻结 reference 的对应值，再取 chosen 相对 rejected 的差并乘 $\\beta$，得到 margin $z$。损失为 $-\\log\\sigma(z)$，用 `softplus(-z)` 或 `-logsigmoid(z)` 实现，避免先求 sigmoid 再取对数的数值问题。\n\n标准 DPO 对回答 token 的 log probability 求和，prompt 与 padding 不进入求和，reference 不反传。按长度平均会改变目标，应明确说明。用正负 margin、极端数值及冻结参数梯度测试，可以发现符号和 mask 错误。\nchosen margin 变好时 loss 却变大；或者漏掉 reference 项。\nreference 与 policy 初始相同，loss 是多少？"}, {"id": "COD-009", "category": "COD", "topic": "损失函数与训练代码", "level": "L2", "title": "实现 GRPO 组内优势，标准差为零时怎么办？", "tags": ["GRPO", "advantage", "std"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>对同一 prompt 的一组奖励减去组均值，再按明确约定的组内标准差归一化，并加入 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/math> 保持数值稳定。本示例采用总体标准差 \u003ccode>correction=0\u003c/code>，不同框架的配置可能不同。\u003c/p>\u003cp>当组内奖励全部相同，奖励优势为零，没有相对奖励梯度；KL 等独立损失项仍可能产生梯度。组大小为一也缺少组内对比信号。应记录零方差组的比例，检查采样多样性和奖励分辨率；是否去掉标准差归一化，要依据具体算法目标判断。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmover>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"true\">&#x000AF;\u003c/mo>\u003c/mover>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>G\u003c/mi>\u003c/mfrac>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>G\u003c/mi>\u003c/msubsup>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmover>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"true\">&#x000AF;\u003c/mo>\u003c/mover>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说“优势零但 PPO clip 仍必然压缩熵”；clip 不是独立的梯度来源。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>奖励缩放和不同难度 prompt 会怎样影响更新？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "对同一 prompt 的一组奖励减去组均值，再按明确约定的组内标准差归一化，并加入 $\\epsilon$ 保持数值稳定。本示例采用总体标准差 `correction=0`，不同框架的配置可能不同。\n\n当组内奖励全部相同，奖励优势为零，没有相对奖励梯度；KL 等独立损失项仍可能产生梯度。组大小为一也缺少组内对比信号。应记录零方差组的比例，检查采样多样性和奖励分辨率；是否去掉标准差归一化，要依据具体算法目标判断。\n说“优势零但 PPO clip 仍必然压缩熵”；clip 不是独立的梯度来源。\n奖励缩放和不同难度 prompt 会怎样影响更新？"}, {"id": "COD-010", "category": "COD", "topic": "通用算法与数据结构", "level": "L1", "title": "数组第 k 大：堆与 Quickselect 怎样取舍？", "tags": ["TopK", "heap", "Quickselect"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先明确“第 k 大”按元素计数，重复值不去重，并要求 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x02264;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>。维护大小为 k 的小根堆，堆顶是已读取元素的第 k 大；堆满后仅在新元素大于堆顶时替换。时间为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>log\u003c/mi>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>、空间为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，适合流式输入。\u003c/p>\u003cp>Quickselect 通常原地执行，平均时间为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，坏 pivot 可使最坏情况退化到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。可随机选择 pivot，并用三路 partition 处理大量相等值，不能把平均复杂度当成最坏保证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>混淆第 k 大与第 k 个不同的大值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果数据不能全部载入内存，如何改？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先明确“第 k 大”按元素计数，重复值不去重，并要求 $1\\leq k\\leq n$。维护大小为 k 的小根堆，堆顶是已读取元素的第 k 大；堆满后仅在新元素大于堆顶时替换。时间为 $O(n\\log k)$、空间为 $O(k)$，适合流式输入。\n\nQuickselect 通常原地执行，平均时间为 $O(n)$，坏 pivot 可使最坏情况退化到 $O(n^2)$。可随机选择 pivot，并用三路 partition 处理大量相等值，不能把平均复杂度当成最坏保证。\n混淆第 k 大与第 k 个不同的大值。\n如果数据不能全部载入内存，如何改？"}, {"id": "COD-011", "category": "COD", "topic": "通用算法与数据结构", "level": "L1", "title": "岛屿问题：DFS/BFS 的时间、空间与边界。", "tags": ["图遍历", "DFS", "BFS"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>扫描每个陆地格，对尚未访问的陆地做四邻域 DFS/BFS，每启动一次遍历就计一个连通块。入队或入栈时立即标记 visited，避免同一格重复进入待处理集合。\u003c/p>\u003cp>每格最多处理一次，时间为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；visited 与遍历队列/栈的最坏空间也是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。Python 可用迭代栈避免大岛引发递归深度溢出。先约定输入为整数还是字符、是否允许原地修改，再测试空矩阵、全海、全陆、对角接触和蛇形长岛。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>无意中把对角接触也视为连通，或遗漏边界检查。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若陆地不断增加，如何用并查集增量维护数量？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "扫描每个陆地格，对尚未访问的陆地做四邻域 DFS/BFS，每启动一次遍历就计一个连通块。入队或入栈时立即标记 visited，避免同一格重复进入待处理集合。\n\n每格最多处理一次，时间为 $O(RC)$；visited 与遍历队列/栈的最坏空间也是 $O(RC)$。Python 可用迭代栈避免大岛引发递归深度溢出。先约定输入为整数还是字符、是否允许原地修改，再测试空矩阵、全海、全陆、对角接触和蛇形长岛。\n无意中把对角接触也视为连通，或遗漏边界检查。\n若陆地不断增加，如何用并查集增量维护数量？"}, {"id": "COD-012", "category": "COD", "topic": "通用算法与数据结构", "level": "L1", "title": "手写编辑距离，并压缩到 O(min(m,n)) 空间。", "tags": ["DP", "编辑距离"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math> 表示两个字符串前缀的编辑距离，最后一步可能是删除、插入或替换，因此比较三种转移的最小值；字符相同时替换成本为零。空串边界初始化为另一前缀的长度。\u003c/p>\u003cp>每一行只依赖上一行和本行前一个位置，使用 \u003ccode>previous/current\u003c/code> 两行，并让第二维对应短字符串，空间可压缩到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，时间仍为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。如果还要恢复具体编辑路径，需要保留更多信息或使用分治方法。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi>d\u003c/mi>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmrow>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003c/mrow>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x02260;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x0007D;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把最长公共子序列的转移误套到允许替换的编辑距离。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>语音识别 WER 里的替换、插入、删除如何关联？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "令 $dp[i][j]$ 表示两个字符串前缀的编辑距离，最后一步可能是删除、插入或替换，因此比较三种转移的最小值；字符相同时替换成本为零。空串边界初始化为另一前缀的长度。\n\n每一行只依赖上一行和本行前一个位置，使用 `previous/current` 两行，并让第二维对应短字符串，空间可压缩到 $O(\\min(m,n))$，时间仍为 $O(mn)$。如果还要恢复具体编辑路径，需要保留更多信息或使用分治方法。\n把最长公共子序列的转移误套到允许替换的编辑距离。\n语音识别 WER 里的替换、插入、删除如何关联？"}, {"id": "COD-013", "category": "COD", "topic": "通用算法与数据结构", "level": "L1", "title": "实现 O(1) 的 LRU Cache，更新已有 key 怎么处理？", "tags": ["LRU", "链表", "哈希"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>哈希表负责定位节点，双向链表维护访问顺序：\u003ccode>get\u003c/code> 命中和 \u003ccode>put\u003c/code> 更新都把节点移到最近使用端，容量超限则淘汰另一端。已有 key 更新不增加元素数量，但必须刷新访问位置；Python 可用 \u003ccode>OrderedDict\u003c/code> 演示这些顺序语义。\u003c/p>\u003cp>典型 \u003ccode>get/put\u003c/code> 的平均复杂度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，哈希冲突和并发属于额外约束。测试应覆盖零容量、重复更新、以及读取改变后续淘汰顺序的情况。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只在插入时调整顺序，导致实现的是 FIFO。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>并发服务如何避免 cache stampede 与跨租户键碰撞？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "哈希表负责定位节点，双向链表维护访问顺序：`get` 命中和 `put` 更新都把节点移到最近使用端，容量超限则淘汰另一端。已有 key 更新不增加元素数量，但必须刷新访问位置；Python 可用 `OrderedDict` 演示这些顺序语义。\n\n典型 `get/put` 的平均复杂度为 $O(1)$，哈希冲突和并发属于额外约束。测试应覆盖零容量、重复更新、以及读取改变后续淘汰顺序的情况。\n只在插入时调整顺序，导致实现的是 FIFO。\n并发服务如何避免 cache stampede 与跨租户键碰撞？"}, {"id": "COD-014", "category": "COD", "topic": "采样与缓存实现", "level": "L2", "title": "手算并编码 MHA/GQA 的 KV Cache 显存。", "tags": ["显存", "GQA", "单位"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>KV Cache 存储字节数为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>T\u003c/mi>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/math>：2 对应 K/V，B 为 batch，L 为层数，T 为缓存长度，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 为 KV 头数，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 为头维，s 为每元素字节数。GQA 应代入 KV 头数，而非 query 头数。\u003c/p>\u003cp>例如 \u003ccode>B=1,T=4096,L=32,h_kv=8,d_h=128,s=2\u003c/code>，缓存占 512 MiB。紧凑布局的变长 batch 按各样本实际缓存长度求和；普通 dense/padded 缓存按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmo>max\u003c/mo>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 分配，分页缓存按已分配块数估算。这只计算缓存本体，不含权重、激活、页表、量化 scale、碎片与运行时工作区。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>bytes\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>B\u003c/mi>\u003cmi>L\u003c/mi>\u003cmi>T\u003c/mi>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>s\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>bytes\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>L\u003c/mi>\u003cmsub>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">k\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmi>s\u003c/mi>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>用 Q 头数计算 GQA，或把 GB 与 GiB 混用。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同样显存预算下，把上下文翻倍会如何影响并发？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "KV Cache 存储字节数为 $2BLT h_{\\mathrm{kv}}d_hs$：2 对应 K/V，B 为 batch，L 为层数，T 为缓存长度，$h_{\\mathrm{kv}}$ 为 KV 头数，$d_h$ 为头维，s 为每元素字节数。GQA 应代入 KV 头数，而非 query 头数。\n\n例如 `B=1,T=4096,L=32,h_kv=8,d_h=128,s=2`，缓存占 512 MiB。紧凑布局的变长 batch 按各样本实际缓存长度求和；普通 dense/padded 缓存按 $BT_{\\max}$ 分配，分页缓存按已分配块数估算。这只计算缓存本体，不含权重、激活、页表、量化 scale、碎片与运行时工作区。\n用 Q 头数计算 GQA，或把 GB 与 GiB 混用。\n同样显存预算下，把上下文翻倍会如何影响并发？"}, {"id": "COD-015", "category": "COD", "topic": "通用算法与数据结构", "level": "L2", "title": "手撕代码时怎样设计能揭露错误的测试？", "tags": ["property test", "测试", "边界"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认输入输出约定，再组合边界样例、独立朴素解和数学不变量。测试要检查算子的性质，而非复刻实现逻辑；算法题可以在小规模随机输入上与独立基线比较。\u003c/p>\u003cp>Attention 检查 shape、未来 token 不影响早期输出、cache decode 与 prefill 一致；RoPE 检查范数及相对内积，LoRA 检查 merge 等价，TopK 与排序基线对照。可训练算子还需测梯度。固定随机种子方便重现，GPU 完全确定性仍依赖设备、内核和版本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只有一个常规样例，或把同一个错误公式写进 expected。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>浮点比较为什么应采用相对/绝对容差？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认输入输出约定，再组合边界样例、独立朴素解和数学不变量。测试要检查算子的性质，而非复刻实现逻辑；算法题可以在小规模随机输入上与独立基线比较。\n\nAttention 检查 shape、未来 token 不影响早期输出、cache decode 与 prefill 一致；RoPE 检查范数及相对内积，LoRA 检查 merge 等价，TopK 与排序基线对照。可训练算子还需测梯度。固定随机种子方便重现，GPU 完全确定性仍依赖设备、内核和版本。\n只有一个常规样例，或把同一个错误公式写进 expected。\n浮点比较为什么应采用相对/绝对容差？"}, {"id": "SYS-001", "category": "SYS", "topic": "系统设计与资源预算", "level": "L2", "title": "设计企业文档问答系统，先明确哪些约束？", "tags": ["RAG", "系统设计", "SLO"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先定义用户、文档权限、更新时效、质量和延迟目标，再设计“入口鉴权 → 权限内召回 → 重排 → 带版本和引用的上下文 → 生成或拒答”的链路。\u003c/p>\u003cp>增量更新与文档删除应同步到检索存储和缓存，保留版本便于回放。先建立小规模基线，测召回、答案支持度、P95 延迟与成本，再依据瓶颈和失败案例决定是否增加图检索或多 Agent；离线质量和线上 SLO 都需要可测。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>还没确认目标与权限就先画很复杂的框架图。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>用户修改权限后旧缓存怎样失效？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先定义用户、文档权限、更新时效、质量和延迟目标，再设计“入口鉴权 → 权限内召回 → 重排 → 带版本和引用的上下文 → 生成或拒答”的链路。\n\n增量更新与文档删除应同步到检索存储和缓存，保留版本便于回放。先建立小规模基线，测召回、答案支持度、P95 延迟与成本，再依据瓶颈和失败案例决定是否增加图检索或多 Agent；离线质量和线上 SLO 都需要可测。\n还没确认目标与权限就先画很复杂的框架图。\n用户修改权限后旧缓存怎样失效？"}, {"id": "SYS-002", "category": "SYS", "topic": "性能、缓存与并发", "level": "L2", "title": "LLM 服务 P95 延迟突然升高，如何定位？", "tags": ["P95", "TTFT", "TPOT", "排队"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把端到端延迟拆成排队、检索、prefill、decode 和外部工具，用 trace 关联请求与模型指标，再按输入长度、输出长度、并发、租户和版本切片比较。\u003c/p>\u003cp>TTFT 包含首 token 前的等待，TPOT 衡量输出 token 间时间，不能合并成一个 tokens/s。检查到达率、活跃请求、KV 用量、缓存命中率、长请求比例和重试放大，找到变化环节后再选限流、调度或算子优化。用匹配长度与并发的回放确认根因，低负载微基准无法充分解释线上尾延迟。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只看平均延迟或 GPU 利用率，忽略队列和长尾。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为何吞吐上升时单请求体验可能变差？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把端到端延迟拆成排队、检索、prefill、decode 和外部工具，用 trace 关联请求与模型指标，再按输入长度、输出长度、并发、租户和版本切片比较。\n\nTTFT 包含首 token 前的等待，TPOT 衡量输出 token 间时间，不能合并成一个 tokens/s。检查到达率、活跃请求、KV 用量、缓存命中率、长请求比例和重试放大，找到变化环节后再选限流、调度或算子优化。用匹配长度与并发的回放确认根因，低负载微基准无法充分解释线上尾延迟。\n只看平均延迟或 GPU 利用率，忽略队列和长尾。\n为何吞吐上升时单请求体验可能变差？"}, {"id": "SYS-003", "category": "SYS", "topic": "性能、缓存与并发", "level": "L2", "title": "如何测吞吐、并发、TTFT、TPOT，并避免错误比较？", "tags": ["benchmark", "SLO", "分位数"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>固定模型、硬件、输入输出长度分布和采样设置，记录到达率、完成率、TTFT、TPOT 与端到端延迟。服务压测宜由到达率驱动，观察饱和点；有效吞吐需要同时满足质量和延迟目标。\u003c/p>\u003cp>requests/s 与 output tokens/s 各有价值，输出长度分布不同会改变比较结果。说明 warmup、失败或取消请求的计数方式，确认客户端没有成为瓶颈。P95/P99 应从请求样本或可聚合直方图估计，不能直接平均各实例的 P95。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只报峰值 tokens/s，没有输入分布和 SLO。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何防止闭环负载测试低估过载时排队？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "固定模型、硬件、输入输出长度分布和采样设置，记录到达率、完成率、TTFT、TPOT 与端到端延迟。服务压测宜由到达率驱动，观察饱和点；有效吞吐需要同时满足质量和延迟目标。\n\nrequests/s 与 output tokens/s 各有价值，输出长度分布不同会改变比较结果。说明 warmup、失败或取消请求的计数方式，确认客户端没有成为瓶颈。P95/P99 应从请求样本或可聚合直方图估计，不能直接平均各实例的 P95。\n只报峰值 tokens/s，没有输入分布和 SLO。\n如何防止闭环负载测试低估过载时排队？"}, {"id": "SYS-004", "category": "SYS", "topic": "系统设计与资源预算", "level": "L2", "title": "Agent 上下文溢出，怎样压缩而保持任务连续性？", "tags": ["context", "memory", "compression"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>保留目标、已确认事实、未完成事项、决策理由和关键工具结果，将长文与完整日志外置为可检索引用。区分不可丢的任务状态和可重新读取的材料，并保留来源及版本。\u003c/p>\u003cp>按任务选择摘要、选择性保留或结构化 state；工具返回使用边界明确的裁剪和分页，避免全量结果挤占上下文。压缩后检查证据与状态是否可恢复，并通过长任务回放比较成功率、遗漏率、延迟和 token 开销；摘要本身也可能产生幻觉。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>从最早消息开始机械删除，把用户约束和失败经验一起丢掉。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>哪些事实必须以结构化字段保存而不能只做摘要？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "保留目标、已确认事实、未完成事项、决策理由和关键工具结果，将长文与完整日志外置为可检索引用。区分不可丢的任务状态和可重新读取的材料，并保留来源及版本。\n\n按任务选择摘要、选择性保留或结构化 state；工具返回使用边界明确的裁剪和分页，避免全量结果挤占上下文。压缩后检查证据与状态是否可恢复，并通过长任务回放比较成功率、遗漏率、延迟和 token 开销；摘要本身也可能产生幻觉。\n从最早消息开始机械删除，把用户约束和失败经验一起丢掉。\n哪些事实必须以结构化字段保存而不能只做摘要？"}, {"id": "SYS-005", "category": "SYS", "topic": "权限、容错与可观测性", "level": "L2", "title": "工具调用失败后如何重试，怎样避免重复副作用？", "tags": ["idempotency", "retry", "timeout"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先区分瞬时失败、业务错误和结果未知的超时。写操作使用代表同一业务意图的幂等键，服务端校验重复键与参数一致性，并持久化执行结果；超时后先查询状态，再决定是否重试，因为超时不代表服务端未执行。\u003c/p>\u003cp>设置全局 deadline、有限次数和退避，避免多层重试放大负载。只读重试也消耗资源，需要预算、并发上限和熔断；支付或发消息等操作尤其要能查询既有结果。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>给所有异常无条件 retry，导致重复提交或重试风暴。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果客户端取消但服务端已提交，怎样反馈最终状态？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先区分瞬时失败、业务错误和结果未知的超时。写操作使用代表同一业务意图的幂等键，服务端校验重复键与参数一致性，并持久化执行结果；超时后先查询状态，再决定是否重试，因为超时不代表服务端未执行。\n\n设置全局 deadline、有限次数和退避，避免多层重试放大负载。只读重试也消耗资源，需要预算、并发上限和熔断；支付或发消息等操作尤其要能查询既有结果。\n给所有异常无条件 retry，导致重复提交或重试风暴。\n如果客户端取消但服务端已提交，怎样反馈最终状态？"}, {"id": "SYS-006", "category": "SYS", "topic": "权限、容错与可观测性", "level": "L2", "title": "设计 Agent 可观测性：日志里应该记录什么？", "tags": ["trace", "replay", "privacy"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>用 \u003ccode>run_id/trace_id\u003c/code> 关联整次运行，记录模型与 prompt 版本、检索结果版本、工具参数摘要、耗时、错误和终止原因。规划、模型与工具调用各作为 span；跨服务传播 trace context，异步子任务保留父子关系。\u003c/p>\u003cp>同时记录质量和资源指标，才能判断任务是否完成及成本所在。敏感内容做脱敏与采样；回放使用固定工具快照或 mock，说明外部状态变化，并避免重放写操作。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只有最后一个错误堆栈，没有中间状态和版本信息。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何定位模型生成错误与工具返回错误？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "用 `run_id/trace_id` 关联整次运行，记录模型与 prompt 版本、检索结果版本、工具参数摘要、耗时、错误和终止原因。规划、模型与工具调用各作为 span；跨服务传播 trace context，异步子任务保留父子关系。\n\n同时记录质量和资源指标，才能判断任务是否完成及成本所在。敏感内容做脱敏与采样；回放使用固定工具快照或 mock，说明外部状态变化，并避免重放写操作。\n只有最后一个错误堆栈，没有中间状态和版本信息。\n如何定位模型生成错误与工具返回错误？"}, {"id": "SYS-007", "category": "SYS", "topic": "权限、容错与可观测性", "level": "L3", "title": "多租户 RAG 如何保证权限隔离？", "tags": ["ACL", "tenant", "cache"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>在检索端用用户身份和文档 ACL 约束候选集合，必要时在返回前再次授权检查。过滤属性由可信服务端生成，不能直接相信用户传入的 \u003ccode>tenant_id\u003c/code>；prompt 中的保密指令无法替代服务端授权。\u003c/p>\u003cp>向量、关键词、重排、引用和缓存都携带租户与权限范围，缓存键包含权限范围或版本，权限变更触发失效。跨租户共享 prefix 或答案需评估泄漏渠道。测试撤权、删除、混合检索各分支和多轮对话里的旧引用。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>先全库检索再只隐藏链接，正文仍可能进模型上下文。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>权限过滤使召回下降时怎样重新测 Recall@K？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "在检索端用用户身份和文档 ACL 约束候选集合，必要时在返回前再次授权检查。过滤属性由可信服务端生成，不能直接相信用户传入的 `tenant_id`；prompt 中的保密指令无法替代服务端授权。\n\n向量、关键词、重排、引用和缓存都携带租户与权限范围，缓存键包含权限范围或版本，权限变更触发失效。跨租户共享 prefix 或答案需评估泄漏渠道。测试撤权、删除、混合检索各分支和多轮对话里的旧引用。\n先全库检索再只隐藏链接，正文仍可能进模型上下文。\n权限过滤使召回下降时怎样重新测 Recall@K？"}, {"id": "SYS-008", "category": "SYS", "topic": "质量诊断与版本治理", "level": "L3", "title": "如何不停服更新知识库与 Embedding 模型？", "tags": ["index version", "blue-green", "migration"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把文档版本、embedding 模型和索引 schema 绑定，后台构建新索引，验证覆盖率、权限与检索质量，双读或灰度后原子切换指向，并保留旧版供回滚。新旧 embedding 空间通常不能直接混合比较。\u003c/p>\u003cp>切换前检查文档数、失败队列和数据截止水位，让增量更新与删除都能追上。双写需要处理顺序与幂等，使用 tombstone 防止旧事件复活已删除文档；灰度按租户或请求分桶，缓存键携带索引版本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只替换 query encoder 却继续检索旧 encoder 生成的向量。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>全量重建期间新增文档怎样补到新索引？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把文档版本、embedding 模型和索引 schema 绑定，后台构建新索引，验证覆盖率、权限与检索质量，双读或灰度后原子切换指向，并保留旧版供回滚。新旧 embedding 空间通常不能直接混合比较。\n\n切换前检查文档数、失败队列和数据截止水位，让增量更新与删除都能追上。双写需要处理顺序与幂等，使用 tombstone 防止旧事件复活已删除文档；灰度按租户或请求分桶，缓存键携带索引版本。\n只替换 query encoder 却继续检索旧 encoder 生成的向量。\n全量重建期间新增文档怎样补到新索引？"}, {"id": "SYS-009", "category": "SYS", "topic": "质量诊断与版本治理", "level": "L2", "title": "RAG 回答错了，怎样区分检索错误与生成错误？", "tags": ["ablation", "oracle", "attribution"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>保留问题、真值、召回证据和回答，先确认正确证据是否存在，再用人工确定的 oracle 证据替换检索结果。若 oracle 下仍错，检查生成、模板或推理；若变对，检查召回与重排，再通过模块消融验证归因。\u003c/p>\u003cp>单独统计未召回、证据冲突、上下文裁剪、引用错配和不忠实生成。Oracle 对照保持相同上下文长度和提示规则，减少干扰；同时测 Recall@K 与最终答案正确率，单一端到端分数不足以定位全部错误。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把所有错误都叫幻觉，或只增大 K 不查噪声。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>多跳问题怎样定义“足够证据”？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "保留问题、真值、召回证据和回答，先确认正确证据是否存在，再用人工确定的 oracle 证据替换检索结果。若 oracle 下仍错，检查生成、模板或推理；若变对，检查召回与重排，再通过模块消融验证归因。\n\n单独统计未召回、证据冲突、上下文裁剪、引用错配和不忠实生成。Oracle 对照保持相同上下文长度和提示规则，减少干扰；同时测 Recall@K 与最终答案正确率，单一端到端分数不足以定位全部错误。\n把所有错误都叫幻觉，或只增大 K 不查噪声。\n多跳问题怎样定义“足够证据”？"}, {"id": "SYS-010", "category": "SYS", "topic": "性能、缓存与并发", "level": "L3", "title": "高并发 LLM 服务如何限流与降级？", "tags": ["admission control", "queue", "load shedding"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>按输入输出 token 预算和租户配额准入，限制队列长度与 deadline，饱和时主动拒绝或降级，优先保护已有请求和重要任务。QPS 不能单独代表长短请求成本，还需估计 token 和 KV 资源。\u003c/p>\u003cp>降级可减少候选、切换已验证的小模型或返回异步任务，但要单独评测质量并继续满足权限约束。明确 429/503、重试建议和取消传播，限制重试放大，并监控被主动丢弃的请求比例。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>过载时无限排队，最终所有请求超时。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何避免短请求被长 prefill 饥饿？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "按输入输出 token 预算和租户配额准入，限制队列长度与 deadline，饱和时主动拒绝或降级，优先保护已有请求和重要任务。QPS 不能单独代表长短请求成本，还需估计 token 和 KV 资源。\n\n降级可减少候选、切换已验证的小模型或返回异步任务，但要单独评测质量并继续满足权限约束。明确 429/503、重试建议和取消传播，限制重试放大，并监控被主动丢弃的请求比例。\n过载时无限排队，最终所有请求超时。\n如何避免短请求被长 prefill 饥饿？"}, {"id": "SYS-011", "category": "SYS", "topic": "性能、缓存与并发", "level": "L2", "title": "Prefix Cache 能提高多少性能，怎样设计缓存键？", "tags": ["prefix caching", "版本", "hit rate"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prefix Cache 复用相同前缀的 KV，主要减少 prefill 计算，收益取决于可复用前缀长度、命中率和调度；后续 decode 仍需执行。短 prompt 或重复率低时收益可能较小，命中 token 数通常比请求命中率更能解释收益。\u003c/p>\u003cp>缓存键覆盖 token 序列、模型与 adapter 配置，必要时隔离租户。视觉输入还要包含内容标识和预处理版本，不能只按文件名缓存。预算需考虑保留前缀缓存与活跃请求 KV 的资源竞争。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 prefix cache 当答案 cache，或忽视 adapter/图像变化导致错误复用。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>系统 prompt 很长但用户输入不同，哪些块能共享？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prefix Cache 复用相同前缀的 KV，主要减少 prefill 计算，收益取决于可复用前缀长度、命中率和调度；后续 decode 仍需执行。短 prompt 或重复率低时收益可能较小，命中 token 数通常比请求命中率更能解释收益。\n\n缓存键覆盖 token 序列、模型与 adapter 配置，必要时隔离租户。视觉输入还要包含内容标识和预处理版本，不能只按文件名缓存。预算需考虑保留前缀缓存与活跃请求 KV 的资源竞争。\n把 prefix cache 当答案 cache，或忽视 adapter/图像变化导致错误复用。\n系统 prompt 很长但用户输入不同，哪些块能共享？"}, {"id": "SYS-012", "category": "SYS", "topic": "质量诊断与版本治理", "level": "L3", "title": "微调上线后质量衰减，如何诊断数据漂移？", "tags": ["drift", "monitoring", "SFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认版本、模板与输入处理是否一致，再比较线上和训练/评测分布，按领域、语言、长度及用户类型切片。采样标注新错误，在旧模型上回放对照，区分分布漂移、接口退化和模型遗忘，再决定回滚或更新数据。\u003c/p>\u003cp>监控输入统计、拒答率、工具失败率及人评抽检，训练 loss 本身无法定位这些问题。评测采用符合线上场景的时间切分，避免数据泄漏；新数据微调需检查旧能力回归并灰度验证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>质量变差就直接增大训练步数，不先排查服务配置。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>无实时标签时可用哪些代理信号，局限是什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认版本、模板与输入处理是否一致，再比较线上和训练/评测分布，按领域、语言、长度及用户类型切片。采样标注新错误，在旧模型上回放对照，区分分布漂移、接口退化和模型遗忘，再决定回滚或更新数据。\n\n监控输入统计、拒答率、工具失败率及人评抽检，训练 loss 本身无法定位这些问题。评测采用符合线上场景的时间切分，避免数据泄漏；新数据微调需检查旧能力回归并灰度验证。\n质量变差就直接增大训练步数，不先排查服务配置。\n无实时标签时可用哪些代理信号，局限是什么？"}, {"id": "SYS-013", "category": "SYS", "topic": "系统设计与资源预算", "level": "L3", "title": "多模态服务图片/PDF 输入成本失控，怎么优化？", "tags": ["image tokens", "OCR", "budget"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先测解析、OCR、视觉编码和 LLM prefill 各环节成本，再按任务选择页面或区域，限制分辨率、页数和视觉 token 预算。可以组合 OCR 文本、图像区域与布局，但压缩方案需在细字、表格及跨页任务上验证质量损失。\u003c/p>\u003cp>预处理与视觉特征缓存携带文件内容 hash、模型和裁剪版本。长文档可以先检索相关页面再交给 VLM，同时检查是否漏掉跨页证据。比较每个成功任务的成本，图片数量不足以代表动态分辨率模型的实际消耗。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>一律缩成低分辨率，导致 OCR 和细粒度定位失效。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果主要问题是视觉 encoder 耗时而非 decode，量化 LLM 是否能解决？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先测解析、OCR、视觉编码和 LLM prefill 各环节成本，再按任务选择页面或区域，限制分辨率、页数和视觉 token 预算。可以组合 OCR 文本、图像区域与布局，但压缩方案需在细字、表格及跨页任务上验证质量损失。\n\n预处理与视觉特征缓存携带文件内容 hash、模型和裁剪版本。长文档可以先检索相关页面再交给 VLM，同时检查是否漏掉跨页证据。比较每个成功任务的成本，图片数量不足以代表动态分辨率模型的实际消耗。\n一律缩成低分辨率，导致 OCR 和细粒度定位失效。\n如果主要问题是视觉 encoder 耗时而非 decode，量化 LLM 是否能解决？"}, {"id": "SYS-014", "category": "SYS", "topic": "质量诊断与版本治理", "level": "L2", "title": "Prompt 优化“修好一类坏了另一类”，怎样控制回归？", "tags": ["prompt regression", "versioning", "test set"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把 prompt 作为版本化配置，维护按能力、业务和历史错误分层的固定回归集及新鲜验证集，比较各切片而非只看均值。为改动规定可接受的回归与收益，再用盲评和灰度确认。\u003c/p>\u003cp>记录完整模板、模型、工具 schema 与采样设置，避免多个因素同时变化。先归因失败，再选择修改通用指令还是局部路由或示例；锁定测试集，防止反复调到对固定题库过拟合。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>每次只拿新坏例验证，不跑历史回归。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何判断问题应该改 prompt、数据还是模型？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把 prompt 作为版本化配置，维护按能力、业务和历史错误分层的固定回归集及新鲜验证集，比较各切片而非只看均值。为改动规定可接受的回归与收益，再用盲评和灰度确认。\n\n记录完整模板、模型、工具 schema 与采样设置，避免多个因素同时变化。先归因失败，再选择修改通用指令还是局部路由或示例；锁定测试集，防止反复调到对固定题库过拟合。\n每次只拿新坏例验证，不跑历史回归。\n如何判断问题应该改 prompt、数据还是模型？"}, {"id": "SYS-015", "category": "SYS", "topic": "权限、容错与可观测性", "level": "L3", "title": "线上模型事故如何止损、回滚与复盘？", "tags": ["incident", "rollback", "postmortem"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先按用户影响止损，可切回已验证版本、限制问题路径或暂停写操作，再保存日志和配置快照。回滚范围包含权重、模板、索引、adapter 与工具 schema；发布前要规定触发指标与兼容性，确保旧版仍可读取状态。\u003c/p>\u003cp>用时间线、切片和回放定位触发条件，区分触发因素、根因及放大因素。把事故转为回归样例、监控信号和演练，通过验证确认措施能捕获同类问题，避免复盘停留在个人责任归因。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只回滚模型权重，漏掉同时更新的 tokenizer 或索引。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>新旧数据 schema 不兼容时怎样回滚？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先按用户影响止损，可切回已验证版本、限制问题路径或暂停写操作，再保存日志和配置快照。回滚范围包含权重、模板、索引、adapter 与工具 schema；发布前要规定触发指标与兼容性，确保旧版仍可读取状态。\n\n用时间线、切片和回放定位触发条件，区分触发因素、根因及放大因素。把事故转为回归样例、监控信号和演练，通过验证确认措施能捕获同类问题，避免复盘停留在个人责任归因。\n只回滚模型权重，漏掉同时更新的 tokenizer 或索引。\n新旧数据 schema 不兼容时怎样回滚？"}, {"id": "SYS-016", "category": "SYS", "topic": "性能、缓存与并发", "level": "L3", "title": "大规模 PDF 解析怎样组合多线程、多进程与 GPU 批处理？", "tags": ["PDF", "threading", "multiprocessing", "流水线"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先把流程分成下载/读取、PDF 解码与页面渲染、OCR/版面识别、清洗切块、embedding 和入库，分别测 CPU、I/O、GPU 与队列等待。一般用线程或异步重叠网络和文件 I/O，用进程并行 CPU 密集的 Python 处理，把 GPU OCR/embedding 集中到受控批处理服务。默认带 GIL 的 CPython 不能让纯 Python CPU 任务仅靠线程实现多核；释放 GIL 的库或 free-threaded 构建须另看条件。\u003c/p>\u003cp>库的线程安全优先于这条经验。PyMuPDF 官方不支持多线程调用，应由独立进程各自打开文档，传文件路径和页范围，不跨进程传 Document 对象或整页大图。结果携带文档 hash、页号、解析版本和状态，便于排序、重试和增量去重。\u003c/p>\u003cp>用有界队列施加背压，避免解析快而 OCR 慢时把内存堆满。限制进程内 BLAS/OCR 线程，避免进程数乘线程数过度争抢；控制 GPU 模型实例数量，批量推理与失败页隔离并行设计。优化目标是每秒成功处理页数及峰值资源，不是启动最多 worker。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>throughput\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02272;\u003c/mo>\u003cmsub>\u003cmo>min\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmo>capacity\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>PyMuPDF 的线程安全限制不能被“C 扩展可能释放 GIL”这个经验覆盖。\u003c/li>\u003cli>无限队列和每个 worker 都加载一份 GPU 模型会放大内存与显存峰值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样判断该按文档分片还是按页范围分片？\u003c/li>\u003cli>Windows spawn 模式下为什么入口保护、序列化和 worker 初始化重要？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先把流程分成下载/读取、PDF 解码与页面渲染、OCR/版面识别、清洗切块、embedding 和入库，分别测 CPU、I/O、GPU 与队列等待。一般用线程或异步重叠网络和文件 I/O，用进程并行 CPU 密集的 Python 处理，把 GPU OCR/embedding 集中到受控批处理服务。默认带 GIL 的 CPython 不能让纯 Python CPU 任务仅靠线程实现多核；释放 GIL 的库或 free-threaded 构建须另看条件。\n\n库的线程安全优先于这条经验。PyMuPDF 官方不支持多线程调用，应由独立进程各自打开文档，传文件路径和页范围，不跨进程传 Document 对象或整页大图。结果携带文档 hash、页号、解析版本和状态，便于排序、重试和增量去重。\n\n用有界队列施加背压，避免解析快而 OCR 慢时把内存堆满。限制进程内 BLAS/OCR 线程，避免进程数乘线程数过度争抢；控制 GPU 模型实例数量，批量推理与失败页隔离并行设计。优化目标是每秒成功处理页数及峰值资源，不是启动最多 worker。\nPyMuPDF 的线程安全限制不能被“C 扩展可能释放 GIL”这个经验覆盖。\n无限队列和每个 worker 都加载一份 GPU 模型会放大内存与显存峰值。\n怎样判断该按文档分片还是按页范围分片？\nWindows spawn 模式下为什么入口保护、序列化和 worker 初始化重要？"}, {"id": "SYS-017", "category": "SYS", "topic": "权限、容错与可观测性", "level": "L3", "title": "个人多模态记忆怎样存储、检索、更新并处理相互矛盾的信息？", "tags": ["Memory", "多模态", "时间", "用户隔离"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把短期会话状态与跨会话长期记忆分开。原图、音频或视频保存在对象存储；文本转写、摘要和视觉描述用于检索；结构化记录保存 user_id、来源、时间、图片区域或音视频片段坐标、内容 hash、置信度和版本。向量索引只负责相似召回，不能替代原证据或成为唯一事实数据库。\u003c/p>\u003cp>长期记忆区分稳定偏好、具体经历和任务状态。先按用户/权限、有效时间和类型过滤，再混合检索文本与模态向量，必要时重排；只把与当前任务有关的摘要和证据片段放入上下文。可以用相关性、时间与重要性的加权分数排序，但这些分数须在真实任务上校准。\u003c/p>\u003cp>写入时做去重和版本更新，记忆附证据；新的地址或偏好应终止旧记录的有效期，冲突不应随意取相似度最高者当真。用户纠正或删除时同步删除派生摘要、向量与缓存。评测覆盖跨会话召回、时间正确性、错误记忆写入和用户隔离，而不仅看检索命中率。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>视觉 embedding 相似只代表表示接近，不能证明图片里的事实或用户身份。\u003c/li>\u003cli>模型猜测写成稳定事实，或更新原记录却保留旧派生索引。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>用户说“我搬家了”时，事实的时间有效性和旧经历应怎样分别保留？\u003c/li>\u003cli>怎样区分检索不到正确记忆与正确记忆被模型忽略？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把短期会话状态与跨会话长期记忆分开。原图、音频或视频保存在对象存储；文本转写、摘要和视觉描述用于检索；结构化记录保存 user_id、来源、时间、图片区域或音视频片段坐标、内容 hash、置信度和版本。向量索引只负责相似召回，不能替代原证据或成为唯一事实数据库。\n\n长期记忆区分稳定偏好、具体经历和任务状态。先按用户/权限、有效时间和类型过滤，再混合检索文本与模态向量，必要时重排；只把与当前任务有关的摘要和证据片段放入上下文。可以用相关性、时间与重要性的加权分数排序，但这些分数须在真实任务上校准。\n\n写入时做去重和版本更新，记忆附证据；新的地址或偏好应终止旧记录的有效期，冲突不应随意取相似度最高者当真。用户纠正或删除时同步删除派生摘要、向量与缓存。评测覆盖跨会话召回、时间正确性、错误记忆写入和用户隔离，而不仅看检索命中率。\n视觉 embedding 相似只代表表示接近，不能证明图片里的事实或用户身份。\n模型猜测写成稳定事实，或更新原记录却保留旧派生索引。\n用户说“我搬家了”时，事实的时间有效性和旧经历应怎样分别保留？\n怎样区分检索不到正确记忆与正确记忆被模型忽略？"}, {"id": "SYS-018", "category": "SYS", "topic": "性能、缓存与并发", "level": "L2", "title": "FastAPI 与 vLLM 怎样分工，如何避免 worker 数量导致模型重复加载？", "tags": ["FastAPI", "vLLM", "服务化", "异步"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FastAPI 负责应用 HTTP 接口、鉴权、请求校验、业务路由和流式转发；vLLM engine 负责模型执行、KV 分配、批处理与生成调度。vLLM 已提供兼容 API 的 serving 入口，常见做法是让轻量应用网关异步调用独立模型服务，而不是在每个 Web worker 的请求函数里同步加载模型。\u003c/p>\u003cp>多个 ASGI worker 是多个进程，各自初始化模型会复制权重、上下文与缓存，可能一启动就 OOM。应明确模型进程/实例数、GPU 分配和并行组；网关扩容与模型副本扩容分开。流式接口及时处理客户端断连与取消，限制在途请求、输入/输出 token 和超时，避免已无人接收的生成继续占用容量。\u003c/p>\u003cp>做负载测试时把网关排队、网络、prefill 和 decode 分开记录，并验证聊天模板、stop、采样参数及错误码能正确透传。async 允许重叠等待，不会让单次 GPU 前向自行变快；吞吐最终受模型调度和资源约束。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>FastAPI 的 async 接口不自动解决同步阻塞模型调用或 GPU 显存复制。\u003c/li>\u003cli>盲目增加 Web worker 数量，却没有确定模型实例与 GPU 的关系。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>客户端中途断连时，怎样确认底层生成请求也被取消？\u003c/li>\u003cli>怎样分别扩容无状态网关和持有 KV 状态的模型服务？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FastAPI 负责应用 HTTP 接口、鉴权、请求校验、业务路由和流式转发；vLLM engine 负责模型执行、KV 分配、批处理与生成调度。vLLM 已提供兼容 API 的 serving 入口，常见做法是让轻量应用网关异步调用独立模型服务，而不是在每个 Web worker 的请求函数里同步加载模型。\n\n多个 ASGI worker 是多个进程，各自初始化模型会复制权重、上下文与缓存，可能一启动就 OOM。应明确模型进程/实例数、GPU 分配和并行组；网关扩容与模型副本扩容分开。流式接口及时处理客户端断连与取消，限制在途请求、输入/输出 token 和超时，避免已无人接收的生成继续占用容量。\n\n做负载测试时把网关排队、网络、prefill 和 decode 分开记录，并验证聊天模板、stop、采样参数及错误码能正确透传。async 允许重叠等待，不会让单次 GPU 前向自行变快；吞吐最终受模型调度和资源约束。\nFastAPI 的 async 接口不自动解决同步阻塞模型调用或 GPU 显存复制。\n盲目增加 Web worker 数量，却没有确定模型实例与 GPU 的关系。\n客户端中途断连时，怎样确认底层生成请求也被取消？\n怎样分别扩容无状态网关和持有 KV 状态的模型服务？"}, {"id": "PRJ-001", "category": "PRJ", "topic": "项目贡献与实验设计", "level": "L1", "title": "两分钟介绍 LLM/MLLM 项目，怎样讲清价值？", "tags": ["项目", "指标", "baseline"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>围绕问题与约束、基线、关键方案、个人贡献、验证结果和局限，组织两分钟叙述。先说明用户或业务目标及原方案瓶颈，再解释选择，用可复现实验和有意义的基线证明改动。\u003c/p>\u003cp>结果说明指标口径、样本量、成本和测试条件，没有上线经历就明确离线实验范围。结尾准备一个关键失败案例和下一步，方便继续深挖；模型名称本身不能代替解决问题的过程。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>报相对提升却不给基线数值或指标定义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>你只保留一个改动，会保留什么，为什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "围绕问题与约束、基线、关键方案、个人贡献、验证结果和局限，组织两分钟叙述。先说明用户或业务目标及原方案瓶颈，再解释选择，用可复现实验和有意义的基线证明改动。\n\n结果说明指标口径、样本量、成本和测试条件，没有上线经历就明确离线实验范围。结尾准备一个关键失败案例和下一步，方便继续深挖；模型名称本身不能代替解决问题的过程。\n报相对提升却不给基线数值或指标定义。\n你只保留一个改动，会保留什么，为什么？"}, {"id": "PRJ-002", "category": "PRJ", "topic": "项目贡献与实验设计", "level": "L1", "title": "面试官追问“哪部分是你做的”，怎样给出可核验回答？", "tags": ["ownership", "代码", "协作"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>明确团队分工和自己的模块，选一个从需求到实现、实验与故障修复的具体链路，讲清输入输出、设计决策和实现位置，能对应到代码、配置及实验记录。\u003c/p>\u003cp>区分开源已有能力、同事工作与个人贡献，准备一次独立发现问题、比较方案和验证结果的案例。对未参与环节说明了解程度；可以展示有权公开的脱敏材料，没有权限的公司资料则用结构和方法描述。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把调用框架已有功能包装为独立研发全部能力。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果让你从零重做该模块，你知道哪些隐藏依赖？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "明确团队分工和自己的模块，选一个从需求到实现、实验与故障修复的具体链路，讲清输入输出、设计决策和实现位置，能对应到代码、配置及实验记录。\n\n区分开源已有能力、同事工作与个人贡献，准备一次独立发现问题、比较方案和验证结果的案例。对未参与环节说明了解程度；可以展示有权公开的脱敏材料，没有权限的公司资料则用结构和方法描述。\n把调用框架已有功能包装为独立研发全部能力。\n如果让你从零重做该模块，你知道哪些隐藏依赖？"}, {"id": "PRJ-003", "category": "PRJ", "topic": "项目贡献与实验设计", "level": "L2", "title": "为什么选这个模型，而不是更大的模型？", "tags": ["选型", "cost-quality", "latency"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把质量、时延、显存、成本、数据和许可约束列为可比较指标，在相同数据及预算下评测候选，覆盖真实场景的语言、长度、视觉细节和工具调用。\u003c/p>\u003cp>大模型可能质量更高但部署代价更大，小模型配检索或针对性训练也可能更合适。记录单位成功任务成本和满足 SLO 的吞吐，依据本任务测量选择，并说明场景或预算怎样变化会使决策改变；参数量和通用榜单不能单独决定方案。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>比较不同 prompt、不同上下文或不同采样设置后直接归因模型大小。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果预算翻倍，你会优先换模型还是改数据？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把质量、时延、显存、成本、数据和许可约束列为可比较指标，在相同数据及预算下评测候选，覆盖真实场景的语言、长度、视觉细节和工具调用。\n\n大模型可能质量更高但部署代价更大，小模型配检索或针对性训练也可能更合适。记录单位成功任务成本和满足 SLO 的吞吐，依据本任务测量选择，并说明场景或预算怎样变化会使决策改变；参数量和通用榜单不能单独决定方案。\n比较不同 prompt、不同上下文或不同采样设置后直接归因模型大小。\n如果预算翻倍，你会优先换模型还是改数据？"}, {"id": "PRJ-004", "category": "PRJ", "topic": "项目贡献与实验设计", "level": "L2", "title": "如何证明项目提升来自你的改动，而不是数据/算力增加？", "tags": ["ablation", "控制变量", "统计"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>固定数据划分、训练预算和评测流程，逐模块消融，再测关键交互组合。事先明确假设与变动因素，记录失败实验；数据增加的版本补上同数据量对照，避免把数据或算力带来的增益归给结构。\u003c/p>\u003cp>同预算比较可以按 FLOPs、墙钟或数据量，但需说明公平性口径。重复不同种子或采用配对样本估计不确定性，同时报告成本、性能和切片退化；小样本下用置信区间辅助判断，不直接承诺显著提升。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>用“去掉模块后更差”证明机制成立，却不控制参数量与训练预算。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两个模块单独无效、合用有效时如何设计实验？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "固定数据划分、训练预算和评测流程，逐模块消融，再测关键交互组合。事先明确假设与变动因素，记录失败实验；数据增加的版本补上同数据量对照，避免把数据或算力带来的增益归给结构。\n\n同预算比较可以按 FLOPs、墙钟或数据量，但需说明公平性口径。重复不同种子或采用配对样本估计不确定性，同时报告成本、性能和切片退化；小样本下用置信区间辅助判断，不直接承诺显著提升。\n用“去掉模块后更差”证明机制成立，却不控制参数量与训练预算。\n两个模块单独无效、合用有效时如何设计实验？"}, {"id": "PRJ-005", "category": "PRJ", "topic": "调试、数据与复现", "level": "L2", "title": "项目最困难的 bug，怎样避免答成“调参故事”？", "tags": ["debug", "root cause", "实验"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>按可观察症状、可复现条件、候选根因、排除实验、修复和验证讲述。先给量化现象与出现时机，例如只在长序列或多卡出现，再构造最小复现，用断言检查 shape、数据、数值和同步。\u003c/p>\u003cp>用 padding mask 错位、标签 shift 等具体因果链解释现象；仅说学习率调小后变好，无法证明根因。验证修复及副作用，比较必要替代方案，并说明怎样加入监控和回归测试。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把偶然相关当根因，无法解释为何改动生效。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果 bug 无法稳定复现，你会保存哪些上下文？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "按可观察症状、可复现条件、候选根因、排除实验、修复和验证讲述。先给量化现象与出现时机，例如只在长序列或多卡出现，再构造最小复现，用断言检查 shape、数据、数值和同步。\n\n用 padding mask 错位、标签 shift 等具体因果链解释现象；仅说学习率调小后变好，无法证明根因。验证修复及副作用，比较必要替代方案，并说明怎样加入监控和回归测试。\n把偶然相关当根因，无法解释为何改动生效。\n如果 bug 无法稳定复现，你会保存哪些上下文？"}, {"id": "PRJ-006", "category": "PRJ", "topic": "论文、视野与工程习惯", "level": "L2", "title": "介绍一篇论文，面试官最可能在哪些地方深挖？", "tags": ["论文", "assumption", "limitations"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先说明问题、既有方法瓶颈、核心假设和目标函数，再介绍实现、关键对照实验与局限。准备推导一条关键公式、解释一个消融，以及更换假设后可能产生的影响。\u003c/p>\u003cp>评价 baseline 是否公平、数据是否污染、预算是否一致，区分作者报告的结果与自己的判断。没有复现就说明阅读范围，不编造实现经验或实验数字，也无需按论文段落逐一复述。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只记住模型架构图和榜单分数，答不出损失与消融。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>论文哪个假设在你的项目中不成立？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先说明问题、既有方法瓶颈、核心假设和目标函数，再介绍实现、关键对照实验与局限。准备推导一条关键公式、解释一个消融，以及更换假设后可能产生的影响。\n\n评价 baseline 是否公平、数据是否污染、预算是否一致，区分作者报告的结果与自己的判断。没有复现就说明阅读范围，不编造实现经验或实验数字，也无需按论文段落逐一复述。\n只记住模型架构图和榜单分数，答不出损失与消融。\n论文哪个假设在你的项目中不成立？"}, {"id": "PRJ-007", "category": "PRJ", "topic": "调试、数据与复现", "level": "L2", "title": "你会怎样把 badcase 转成下一轮训练数据？", "tags": ["data loop", "label", "split"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先分类错误来源，只有模型学习问题才直接进入训练候选；检索漏召回或工具故障优先修对应模块。为候选定义标签标准，去重并审核质量，覆盖正确回答和拒答场景，抽查标签一致性及类别平衡。\u003c/p>\u003cp>保留数据版本与来源，以时间或实体隔离避免相似问句泄漏到测试集。验证新错误是否修复，同时检查旧能力回归，防止只对少数 badcase 过拟合。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把测试题原样加入训练，然后报告同一测试集提高。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>错误样本稀少时，合成数据怎么验真？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先分类错误来源，只有模型学习问题才直接进入训练候选；检索漏召回或工具故障优先修对应模块。为候选定义标签标准，去重并审核质量，覆盖正确回答和拒答场景，抽查标签一致性及类别平衡。\n\n保留数据版本与来源，以时间或实体隔离避免相似问句泄漏到测试集。验证新错误是否修复，同时检查旧能力回归，防止只对少数 badcase 过拟合。\n把测试题原样加入训练，然后报告同一测试集提高。\n错误样本稀少时，合成数据怎么验真？"}, {"id": "PRJ-008", "category": "PRJ", "topic": "调试、数据与复现", "level": "L2", "title": "训练/评测实验怎样做到别人能复现？", "tags": ["reproducibility", "config", "checkpoint"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>保存代码 commit、依赖版本、模型和数据 hash、完整配置、随机种子、硬件、有效 batch 及日志，给出从处理数据到评测的最小执行路径。Tokenizer、chat template、混合数据比例和 packing/mask 规则也属于复现条件。\u003c/p>\u003cp>恢复训练的 checkpoint 还应包含优化器、调度器与数据进度。固定 seed 不能保证跨设备或内核逐位一致，应说明环境差异，以数值容差或分布意义定义可接受的重现。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只上传最终权重，没有数据处理脚本和评测命令。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>恢复训练后 loss 跳变，首先检查哪些状态？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "保存代码 commit、依赖版本、模型和数据 hash、完整配置、随机种子、硬件、有效 batch 及日志，给出从处理数据到评测的最小执行路径。Tokenizer、chat template、混合数据比例和 packing/mask 规则也属于复现条件。\n\n恢复训练的 checkpoint 还应包含优化器、调度器与数据进度。固定 seed 不能保证跨设备或内核逐位一致，应说明环境差异，以数值容差或分布意义定义可接受的重现。\n只上传最终权重，没有数据处理脚本和评测命令。\n恢复训练后 loss 跳变，首先检查哪些状态？"}, {"id": "PRJ-009", "category": "PRJ", "topic": "论文、视野与工程习惯", "level": "L1", "title": "遇到不会的模型或面试追问，怎样回答？", "tags": ["沟通", "边界", "推理"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认问题定义，说明确定的原理与不确定的版本细节，再给有条件的推理和验证方案。例如显存估算先区分训练与推理，列出权重、梯度、优化器状态、激活及缓存，再根据具体参数计算。\u003c/p>\u003cp>把条件写清，用数量级和守恒关系检查结果。被指出错误时修正推导，不把猜测包装成记忆事实，也不继续背与条件不符的结论。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>为显得熟悉而编造模型内部参数、论文结论或线上经历。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>你需要哪些最小信息才能给出可信估计？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认问题定义，说明确定的原理与不确定的版本细节，再给有条件的推理和验证方案。例如显存估算先区分训练与推理，列出权重、梯度、优化器状态、激活及缓存，再根据具体参数计算。\n\n把条件写清，用数量级和守恒关系检查结果。被指出错误时修正推导，不把猜测包装成记忆事实，也不继续背与条件不符的结论。\n为显得熟悉而编造模型内部参数、论文结论或线上经历。\n你需要哪些最小信息才能给出可信估计？"}, {"id": "PRJ-010", "category": "PRJ", "topic": "论文、视野与工程习惯", "level": "L1", "title": "技术方案有分歧时，如何推进决策？", "tags": ["协作", "tradeoff", "experiment"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先确认双方优化的是同一个目标，例如质量、开发周期或运行成本，再把分歧转为可检验的目标与约束，列出候选、主要风险和决策期限，用小规模试验或已有数据比较。\u003c/p>\u003cp>约定最低质量、SLO 和决策责任，记录最终取舍及未解决假设，按分工执行，避免试验无限延长。面试回答用真实经历交代冲突、行动和结果；复盘聚焦证据，不套虚构的 STAR 数字。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只说“听领导的”或“我说服了所有人”，没有证据与约束。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果两个方案差异在置信区间内，你如何选择？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先确认双方优化的是同一个目标，例如质量、开发周期或运行成本，再把分歧转为可检验的目标与约束，列出候选、主要风险和决策期限，用小规模试验或已有数据比较。\n\n约定最低质量、SLO 和决策责任，记录最终取舍及未解决假设，按分工执行，避免试验无限延长。面试回答用真实经历交代冲突、行动和结果；复盘聚焦证据，不套虚构的 STAR 数字。\n只说“听领导的”或“我说服了所有人”，没有证据与约束。\n如果两个方案差异在置信区间内，你如何选择？"}, {"id": "PRJ-011", "category": "PRJ", "topic": "论文、视野与工程习惯", "level": "L2", "title": "面试中怎样说明 vibe coding 的实际用法、贡献和验证？", "tags": ["AI coding", "验收", "代码审查", "项目"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>把它描述为用自然语言驱动快速实现、迭代和探索的工作方式，并讲清具体工具、任务和结果。可先给需求、边界、接口和验收样例，让编码 Agent 查仓库、形成小改动、执行验证，再由开发者理解并审查 diff。不能仅把“用了某工具”“页面能打开”当作交付质量或个人技术贡献。\u003c/p>\u003cp>验证应针对行为而非复述生成代码：关键正常/异常路径、权限与数据边界、回归测试、依赖与配置、实际部署环境的集成检查。遇到测试失败要确认是实现问题、环境问题还是测试假设错，不让模型只为通过测试修改断言。代码生成可能带来不存在的 API、不安全实现或额外依赖，应核对项目实际版本和变化范围。\u003c/p>\u003cp>回答个人贡献时给出自己负责的需求分解、方案取舍、关键修正与验收证据，最好展示一次失败后如何定位并修复。衡量节省的时间也应包含阅读、调试和回归成本；使用 Agent 不免除理解最终代码和承担维护责任。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 Agent 写出的代码行数当作自己的技术深度或项目收益。\u003c/li>\u003cli>只让同一个生成模型自评正确，省略独立运行和审查。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果 Agent 做出了超出需求的大重构，你怎样缩小改动并验收？\u003c/li>\u003cli>你能否不用工具解释最后交付的核心代码及其边界条件？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "把它描述为用自然语言驱动快速实现、迭代和探索的工作方式，并讲清具体工具、任务和结果。可先给需求、边界、接口和验收样例，让编码 Agent 查仓库、形成小改动、执行验证，再由开发者理解并审查 diff。不能仅把“用了某工具”“页面能打开”当作交付质量或个人技术贡献。\n\n验证应针对行为而非复述生成代码：关键正常/异常路径、权限与数据边界、回归测试、依赖与配置、实际部署环境的集成检查。遇到测试失败要确认是实现问题、环境问题还是测试假设错，不让模型只为通过测试修改断言。代码生成可能带来不存在的 API、不安全实现或额外依赖，应核对项目实际版本和变化范围。\n\n回答个人贡献时给出自己负责的需求分解、方案取舍、关键修正与验收证据，最好展示一次失败后如何定位并修复。衡量节省的时间也应包含阅读、调试和回归成本；使用 Agent 不免除理解最终代码和承担维护责任。\n把 Agent 写出的代码行数当作自己的技术深度或项目收益。\n只让同一个生成模型自评正确，省略独立运行和审查。\n如果 Agent 做出了超出需求的大重构，你怎样缩小改动并验收？\n你能否不用工具解释最后交付的核心代码及其边界条件？"}], "categories": {"BAS": ["01-fundamentals", "NLP、数学与深度学习基础"], "TFM": ["02-transformer", "Transformer、Attention 与位置编码"], "ARC": ["03-model-architectures", "模型架构、MoE 与模型家族"], "PRE": ["04-pretraining", "预训练、语料与优化"], "FT": ["05-finetuning", "SFT、PEFT、蒸馏与模型编辑"], "ALN": ["06-alignment", "强化学习、RLHF 与偏好优化"], "INF": ["07-inference", "推理、解码、量化与服务引擎"], "DST": ["08-distributed", "分布式训练、并行与显存"], "RAG": ["09-rag", "RAG、检索、重排与图检索"], "AGT": ["10-agents", "Agent、规划、工具与多智能体"], "EVA": ["11-evaluation", "评测、幻觉、安全与鲁棒性"], "VLM": ["12-vision-language", "视觉语言模型与图文多模态"], "OMM": ["13-video-audio-omni", "视频、语音与 Omni"], "COD": ["14-coding", "手撕代码与算法"], "SYS": ["15-system-design", "系统设计、性能与可靠性"], "PRJ": ["16-project", "项目、论文与工程实践"]}, "topics": {"BAS": ["分词与文本表示", "序列任务与经典 NLP", "数学、概率与统计", "深度学习与优化基础"], "TFM": ["注意力机制与掩码", "位置编码与长上下文", "归一化、FFN 与残差", "复杂度与实现机制"], "ARC": ["架构范式与参数", "预训练模型与家族对比", "MoE 路由、训练与压缩", "推理模型与 MLA"], "PRE": ["语言建模与规模规律", "语料清洗与数据配比", "训练精度与优化", "继续预训练与域适配"], "FT": ["指令数据与训练目标", "LoRA 与其他 PEFT", "训练技巧与排错", "知识蒸馏与模型编辑"], "ALN": ["强化学习基础", "RLHF 与 PPO", "DPO 与偏好数据", "GRPO 与在线优化", "奖励与对齐策略"], "INF": ["KV Cache 与服务调度", "解码与采样策略", "注意力与算子加速", "量化与稀疏推理"], "DST": ["训练显存与状态分片", "并行策略与通信", "精度与激活优化", "训练故障与可靠性"], "RAG": ["文档切分与索引", "召回、融合与重排", "查询优化与图检索", "评测、权限与多模态 RAG"], "AGT": ["提示、推理与规划", "工具调用与协议", "记忆与上下文", "多 Agent 协同与训练", "可靠性与评测"], "EVA": ["评测协议与基准", "指标与统计检验", "幻觉与可信度", "安全与鲁棒性"], "VLM": ["图文表示与预训练", "视觉连接器与训练", "动态分辨率与位置编码", "模型结构与版本对比", "感知、文档与视觉评测"], "OMM": ["视频采样与时序", "语音识别与编码", "语音生成与流式", "Omni 融合与评测"], "COD": ["模型算子与数值实现", "损失函数与训练代码", "采样与缓存实现", "通用算法与数据结构"], "SYS": ["系统设计与资源预算", "性能、缓存与并发", "质量诊断与版本治理", "权限、容错与可观测性"], "PRJ": ["项目贡献与实验设计", "调试、数据与复现", "论文、视野与工程习惯"]}}</script>
<script>
const bank=JSON.parse(document.getElementById('bank').textContent), $=id=>document.getElementById(id), pageSize=20;
let page=0, onlyFavorites=false, sample=null, saved=new Set();try{const value=JSON.parse(localStorage.getItem('llm-interview-stars')||'[]');if(Array.isArray(value))saved=new Set(value.filter(x=>typeof x==='string'))}catch{}
for(const [id,[slug,title]] of Object.entries(bank.categories))$('category').add(new Option(title,id));
function updateTopics(){const select=$('topic');select.options.length=0;select.add(new Option('全部主题',''));select.value='';select.disabled=!$('category').value;for(const topic of bank.topics[$('category').value]||[])if(bank.questions.some(q=>q.category===$('category').value&&q.topic===topic))select.add(new Option(topic,topic))}
updateTopics();
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){const terms=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);return bank.questions.filter(q=>(!$('category').value||q.category===$('category').value)&&(!$('level').value||q.level===$('level').value)&&(!$('topic').value||q.topic===$('topic').value)&&(!onlyFavorites||saved.has(q.id))&&terms.every(t=>[q.id,q.title,q.topic,...q.tags,q.search_text].join(' ').toLowerCase().includes(t)))}
function render(){const all=filtered(), rows=sample?all.filter(q=>sample.includes(q.id)):all, pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);$('status').textContent=`全库 ${bank.questions.length} 题 · 匹配 ${all.length} 题${sample?' · 当前抽题 '+rows.length+' 题':''}`;$('pageinfo').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
$('cards').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(q=>`<article class="card" id="${q.id}"><div class="meta"><span class="pill">${q.id}</span><span>${q.level}</span><span>${escapeHtml(bank.categories[q.category][1])}</span><span>${escapeHtml(q.topic)}</span><button class="star" data-star="${q.id}" aria-label="收藏 ${q.id}" aria-pressed="${saved.has(q.id)}">${saved.has(q.id)?'★':'☆'}</button></div><h2>${escapeHtml(q.title)}</h2>${$('quiz').checked?'<details><summary>查看答案</summary>'+q.answer_html+'</details>':q.answer_html}</article>`).join('')||'<div class="empty">没有匹配题目，请调整筛选条件。</div>'}
for(const id of ['search','category','topic','level'])$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='category')updateTopics();page=0;sample=null;render()});$('quiz').onchange=render;$('favorites').onclick=()=>{onlyFavorites=!onlyFavorites;$('favorites').setAttribute('aria-pressed',String(onlyFavorites));page=0;sample=null;render()};$('random').onclick=()=>{const pool=filtered().map(q=>q.id);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}sample=pool.slice(0,10);page=0;render()};$('reset').onclick=()=>{for(const id of ['search','category','topic','level'])$(id).value='';updateTopics();onlyFavorites=false;$('favorites').setAttribute('aria-pressed','false');sample=null;page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('cards').onclick=e=>{const b=e.target.closest('[data-star]');if(!b)return;const id=b.dataset.star;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('llm-interview-stars',JSON.stringify([...saved]))}catch{}render()};render();
</script></html>
