en 选择 top-k 专家并加权输出，以较少的激活计算提供较大的总参数容量。Dense 则通常每个 token 使用全部层参数。\n\n总参数、激活参数与真实成本要分别统计：激活参数包含共享模块和被选专家，不能简单用总参数乘 $k/E$。路由不均衡会形成热点、容量溢出或 token 丢弃，常需辅助损失等机制。专家并行还有 all-to-all 通信，小 batch、跨节点或低利用率场景可能抵消算术收益，甚至增加时延。\nMoE 总参数大就必然推理更慢，或激活参数少就必然更快。\n忽略共享模块、路由与通信成本。\n负载均衡会不会损害专家专门化？\n如何区分模型 FLOPs 与实际 GPU 成本？"}, {"id": "PRE-001", "category": "PRE", "topic": "语言建模与规模规律", "level": "L1", "title": "自回归预训练的 next-token loss 怎样计算？", "tags": ["CLM", "TeacherForcing", "Loss"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>自回归语言模型按概率链式法则分解 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmo>&#x0220F;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/msubsup>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，第一项以 BOS 或空历史为条件；完整可变长序列通常还需 EOS 或约定结束机制。这不表示 token 相互独立，有 prompt 时可同样写条件响应的分解。训练最大化对数似然，以有效目标平均 next-token 交叉熵为损失。\u003c/p>\u003cp>Teacher forcing 使用真实历史，已知整条序列后可一次前向计算各位置 logits，再用 causal mask 排除未来；位置间仍有依赖，只是矩阵运算可以并行。比如 \u003ccode>input_ids=[a,b,c]\u003c/code>，a/b 位置分别预测 b/c。常见模型在 loss 内部完成 shift，collator 不应重复移动标签；没有额外目标时最后 c 的 logits 不计损，有 EOS 时可监督结束。\u003c/p>\u003cp>Padding、无效跨样本边界及配方不监督的 prompt 目标通过 loss mask 忽略，并按有效目标数归一化；prompt 标签不计损不等于 prompt 在 attention 中不可见。生成通常先 prefill 再逐步 decode，下一输入由已生成 token 决定，无法预先知道完整历史。KV cache 复用旧 K/V，投机解码可批量验证候选改善吞吐，但仍保持自回归条件关系；真实历史与生成历史的差异也可能造成错误累积。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmi>:\u003c/mi>\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x0220F;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/munderover>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi mathvariant=\"script\">L\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/munder>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>在 collator 和模型内部各 shift 一次，或者忘记监督 EOS/有效 token 的具体约定。\u003c/li>\u003cli>把并行 teacher forcing 等同于生成所有 token 相互独立，或把 prompt loss mask 当成 attention mask。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>有 prompt-response 边界时，哪个位置的 logit 监督首个 response token？\u003c/li>\u003cli>为什么 KV cache 改善计算成本却不把标准逐 token 生成变成一次前向？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "自回归语言模型按概率链式法则分解 $p_\\theta(x_{1:T})=\\prod_{t=1}^T p_\\theta(x_t\\mid x_{\u003ct})$，第一项以 BOS 或空历史为条件；完整可变长序列通常还需 EOS 或约定结束机制。这不表示 token 相互独立，有 prompt 时可同样写条件响应的分解。训练最大化对数似然，以有效目标平均 next-token 交叉熵为损失。\n\nTeacher forcing 使用真实历史，已知整条序列后可一次前向计算各位置 logits，再用 causal mask 排除未来；位置间仍有依赖，只是矩阵运算可以并行。比如 `input_ids=[a,b,c]`，a/b 位置分别预测 b/c。常见模型在 loss 内部完成 shift，collator 不应重复移动标签；没有额外目标时最后 c 的 logits 不计损，有 EOS 时可监督结束。\n\nPadding、无效跨样本边界及配方不监督的 prompt 目标通过 loss mask 忽略，并按有效目标数归一化；prompt 标签不计损不等于 prompt 在 attention 中不可见。生成通常先 prefill 再逐步 decode，下一输入由已生成 token 决定，无法预先知道完整历史。KV cache 复用旧 K/V，投机解码可批量验证候选改善吞吐，但仍保持自回归条件关系；真实历史与生成历史的差异也可能造成错误累积。\n在 collator 和模型内部各 shift 一次，或者忘记监督 EOS/有效 token 的具体约定。\n把并行 teacher forcing 等同于生成所有 token 相互独立，或把 prompt loss mask 当成 attention mask。\n有 prompt-response 边界时，哪个位置的 logit 监督首个 response token？\n为什么 KV cache 改善计算成本却不把标准逐 token 生成变成一次前向？"}, {"id": "PRE-004", "category": "PRE", "topic": "语言建模与规模规律", "level": "L2", "title": "Scaling Law 描述的是什么，能直接预测下游能力吗？", "tags": ["ScalingLaw", "算力预算", "Loss"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Scaling Law 是模型损失随参数、训练数据与计算规模变化的经验规律，常以 held-out loss 为因变量，以参数量 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math>、训练 token 数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 和 FLOPs \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math> 为资源变量。它能帮助小实验外推和算力分配，但系数依赖实验范围、数据、架构与优化，并不保证全部下游指标或新能力服从同一曲线。\u003c/p>\u003cp>应在若干规模和训练长度上拟合，再保留额外规模验证预测，不能只报告拟合优度。数据质量、重复曝光、多语言配比和优化未收敛都可能改变曲线。预算还应包含推理成本，训练计算最优不一定是模型生命周期成本最优。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把经验幂律解释成任何规模都成立的理论定理。\u003c/li>\u003cli>把训练 loss 曲线直接换成准确率或安全性曲线。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么小模型拟合可能无法预测大模型行为？\u003c/li>\u003cli>训练预算固定时如何做 isoFLOP 实验？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Scaling Law 是模型损失随参数、训练数据与计算规模变化的经验规律，常以 held-out loss 为因变量，以参数量 $N$、训练 token 数 $D$ 和 FLOPs $C$ 为资源变量。它能帮助小实验外推和算力分配，但系数依赖实验范围、数据、架构与优化，并不保证全部下游指标或新能力服从同一曲线。\n\n应在若干规模和训练长度上拟合，再保留额外规模验证预测，不能只报告拟合优度。数据质量、重复曝光、多语言配比和优化未收敛都可能改变曲线。预算还应包含推理成本，训练计算最优不一定是模型生命周期成本最优。\n把经验幂律解释成任何规模都成立的理论定理。\n把训练 loss 曲线直接换成准确率或安全性曲线。\n为什么小模型拟合可能无法预测大模型行为？\n训练预算固定时如何做 isoFLOP 实验？"}, {"id": "PRE-005", "category": "PRE", "topic": "语言建模与规模规律", "level": "L2", "title": "Chinchilla 的结论是什么，tokens≈20×参数是硬规则吗？", "tags": ["Chinchilla", "ComputeOptimal", "预算"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Chinchilla 在其训练设置和预算范围内发现，计算最优的参数量与训练 token 数应近似同步增长；常说的每参数约 20 个 token 是该拟合下的量级参考，数据质量、目标与推理预算变化后需重新估计。\u003c/p>\u003cp>Dense Transformer 训练常以 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>&#x02248;\u003c/mo>\u003cmn>6\u003c/mn>\u003cmi>N\u003c/mi>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 粗估 FLOPs，长上下文注意力等计算应另加。在固定预算下扫描参数量并相应调整数据量，再比较训练末端的验证损失；更大的模型若数据不足，并不总优于较小且训练充分的模型。若上线调用量很大，训练小模型更久可能更划算，因此不能只优化一次训练成本。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>&#x02248;\u003c/mo>\u003cmn>6\u003c/mn>\u003cmi>N\u003c/mi>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 20 tokens/parameter 当成达到能力上限的通用阈值。\u003c/li>\u003cli>直接将 dense 估算套到总参数很大的稀疏 MoE。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>70B 与 7B 在相同训练预算下怎样比较？\u003c/li>\u003cli>什么时候会选择过度训练较小模型？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Chinchilla 在其训练设置和预算范围内发现，计算最优的参数量与训练 token 数应近似同步增长；常说的每参数约 20 个 token 是该拟合下的量级参考，数据质量、目标与推理预算变化后需重新估计。\n\nDense Transformer 训练常以 $C\\approx6ND$ 粗估 FLOPs，长上下文注意力等计算应另加。在固定预算下扫描参数量并相应调整数据量，再比较训练末端的验证损失；更大的模型若数据不足，并不总优于较小且训练充分的模型。若上线调用量很大，训练小模型更久可能更划算，因此不能只优化一次训练成本。\n把 20 tokens/parameter 当成达到能力上限的通用阈值。\n直接将 dense 估算套到总参数很大的稀疏 MoE。\n70B 与 7B 在相同训练预算下怎样比较？\n什么时候会选择过度训练较小模型？"}, {"id": "PRE-006", "category": "PRE", "topic": "语料清洗与数据配比", "level": "L2", "title": "大规模预训练语料应怎样清洗？", "tags": ["数据质量", "RefinedWeb", "清洗"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>预训练清洗先确定目标语料分布，再完成解析、语言识别、质量过滤、去重、评测污染与敏感信息处理，并保留数据血缘和抽样审计。HTML 正文提取应去除导航、乱码和模板，再做语言与文档级检查。\u003c/p>\u003cp>规则和模型打分可以互补，对高低评分及不同语言、领域都应抽检。去重后重新统计唯一 token、来源配比与重复曝光，记录规则版本；用保留率、领域覆盖、小模型实验和固定验证集衡量改动。过强过滤可能删除少数语言或专业内容，不能仅为降低训练 loss 调整清洗策略。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>高 perplexity 文本全是低质量，低 perplexity 文本全是高质量。\u003c/li>\u003cli>使用黑箱过滤器却无法追踪被删除的领域。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何量化清洗造成的分布偏移？\u003c/li>\u003cli>为什么代码或数学文本需要单独制定过滤规则？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "预训练清洗先确定目标语料分布，再完成解析、语言识别、质量过滤、去重、评测污染与敏感信息处理，并保留数据血缘和抽样审计。HTML 正文提取应去除导航、乱码和模板，再做语言与文档级检查。\n\n规则和模型打分可以互补，对高低评分及不同语言、领域都应抽检。去重后重新统计唯一 token、来源配比与重复曝光，记录规则版本；用保留率、领域覆盖、小模型实验和固定验证集衡量改动。过强过滤可能删除少数语言或专业内容，不能仅为降低训练 loss 调整清洗策略。\n高 perplexity 文本全是低质量，低 perplexity 文本全是高质量。\n使用黑箱过滤器却无法追踪被删除的领域。\n如何量化清洗造成的分布偏移？\n为什么代码或数学文本需要单独制定过滤规则？"}, {"id": "PRE-007", "category": "PRE", "topic": "语料清洗与数据配比", "level": "L2", "title": "精确去重与近似去重有哪些方法和边界？", "tags": ["Dedup", "MinHash", "数据"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>精确去重使用规范化文档或片段哈希找完全重复，成本较低，但难以发现只改标题或局部段落的副本。近似去重可用 shingles、MinHash 等生成相似候选，再做更细比较，需同时评估误报和漏报。\u003c/p>\u003cp>公共模板可在段落或子串层面去重，保留高质量代表并记录映射。去重顺序影响后续采样权重，先按质量挑代表能避免随机留下差版本。去重有助于减少重复曝光、记忆和评测重叠，但不能保证完全消除泄漏；阈值过严也会损失有价值的重复结构。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>同一文章的网址不同就视为独立数据。\u003c/li>\u003cli>把语义相似的不同事实问答全部删掉。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何在大规模语料上控制近似去重成本？\u003c/li>\u003cli>为什么 dedup 之后验证 loss 可能上升但可信度提高？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "精确去重使用规范化文档或片段哈希找完全重复，成本较低，但难以发现只改标题或局部段落的副本。近似去重可用 shingles、MinHash 等生成相似候选，再做更细比较，需同时评估误报和漏报。\n\n公共模板可在段落或子串层面去重，保留高质量代表并记录映射。去重顺序影响后续采样权重，先按质量挑代表能避免随机留下差版本。去重有助于减少重复曝光、记忆和评测重叠，但不能保证完全消除泄漏；阈值过严也会损失有价值的重复结构。\n同一文章的网址不同就视为独立数据。\n把语义相似的不同事实问答全部删掉。\n如何在大规模语料上控制近似去重成本？\n为什么 dedup 之后验证 loss 可能上升但可信度提高？"}, {"id": "PRE-008", "category": "PRE", "topic": "语料清洗与数据配比", "level": "L2", "title": "怎样检测与减少 benchmark contamination？", "tags": ["数据污染", "评测可信度", "Leakage"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Benchmark contamination 指训练集包含测试题、答案或高度相似信息，使评测分数无法可靠表示泛化。应建立题干与答案的可追踪清单，通过文档、片段和 n-gram 重叠检索发现候选，并人工复核翻译、改写、镜像站与题解，不能只删除完全相同字符串或原网址。\u003c/p>\u003cp>训练/测试切分尽量按来源、实体、时间或任务组隔离，再用受控新题验证。报告可检测污染比例与清洁子集分数；未检出只能说明检测方法没有发现，不能证明完全无污染。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把预训练见过某领域事实与见过完整测试题一概混称同一污染。\u003c/li>\u003cli>根据高分反推模型必然泄漏。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>闭源模型无法审计训练集时怎么补充评估？\u003c/li>\u003cli>污染检测为什么需要保留误报边界？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Benchmark contamination 指训练集包含测试题、答案或高度相似信息，使评测分数无法可靠表示泛化。应建立题干与答案的可追踪清单，通过文档、片段和 n-gram 重叠检索发现候选，并人工复核翻译、改写、镜像站与题解，不能只删除完全相同字符串或原网址。\n\n训练/测试切分尽量按来源、实体、时间或任务组隔离，再用受控新题验证。报告可检测污染比例与清洁子集分数；未检出只能说明检测方法没有发现，不能证明完全无污染。\n把预训练见过某领域事实与见过完整测试题一概混称同一污染。\n根据高分反推模型必然泄漏。\n闭源模型无法审计训练集时怎么补充评估？\n污染检测为什么需要保留误报边界？"}, {"id": "PRE-009", "category": "PRE", "topic": "语料清洗与数据配比", "level": "L2", "title": "代码、网页、多语言等预训练数据如何配比？", "tags": ["DataMixture", "DoReMi", "多语言"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>预训练配比应围绕目标能力和质量设计，而非按原始文件数量采样。先统一有效 token、唯一 token 与曝光轮次的统计，再通过小代理模型、领域验证 loss 和下游任务实验调整权重，并检验结论能否迁移到大模型。\u003c/p>\u003cp>提高某类数据比例会挤占其他能力的预算，过采样稀缺高质量数据也要监控重复与记忆。DoReMi 用代理模型优化域权重，说明配比可以学习，但迁移仍有条件。各主要领域应保留独立验证集，同时检查总体效果和弱势语言表现。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>高 loss 的领域永远应该加权更多，忽略噪声或任务难度。\u003c/li>\u003cli>把论文给出的配比直接用在不同数据和目标上。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何设计配比 ablation 避免算力不公平？\u003c/li>\u003cli>数据配比与课程学习有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "预训练配比应围绕目标能力和质量设计，而非按原始文件数量采样。先统一有效 token、唯一 token 与曝光轮次的统计，再通过小代理模型、领域验证 loss 和下游任务实验调整权重，并检验结论能否迁移到大模型。\n\n提高某类数据比例会挤占其他能力的预算，过采样稀缺高质量数据也要监控重复与记忆。DoReMi 用代理模型优化域权重，说明配比可以学习，但迁移仍有条件。各主要领域应保留独立验证集，同时检查总体效果和弱势语言表现。\n高 loss 的领域永远应该加权更多，忽略噪声或任务难度。\n把论文给出的配比直接用在不同数据和目标上。\n如何设计配比 ablation 避免算力不公平？\n数据配比与课程学习有什么区别？"}, {"id": "PRE-011", "category": "PRE", "topic": "继续预训练与域适配", "level": "L1", "title": "继续预训练与 SFT 的数据和目标有什么区别？", "tags": ["CPT", "DAPT", "SFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>继续预训练通常用领域原始文本延续语言建模目标，以适应术语、知识与语言分布；SFT 使用指令、对话或结构化输入输出，学习任务行为与格式。领域无标注数据充足且分布差异大时可考虑 DAPT，任务输出明确时可先尝试 SFT，也可以串联两者。\u003c/p>\u003cp>领域适应不保证指令能力，应分别记录领域 loss、任务正确率与通用回归，检查能力退化。CPT 可以使用 PEFT，SFT 也可更新全部参数，训练目标与参数更新方法是两个独立选择。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把继续预训练简单定义为全参数微调，SFT 简单定义为 LoRA。\u003c/li>\u003cli>认为任何新增知识都必须继续预训练。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>领域知识变化很快时为什么还会考虑 RAG？\u003c/li>\u003cli>CPT 之后 SFT 数据如何补足交互格式？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "继续预训练通常用领域原始文本延续语言建模目标，以适应术语、知识与语言分布；SFT 使用指令、对话或结构化输入输出，学习任务行为与格式。领域无标注数据充足且分布差异大时可考虑 DAPT，任务输出明确时可先尝试 SFT，也可以串联两者。\n\n领域适应不保证指令能力，应分别记录领域 loss、任务正确率与通用回归，检查能力退化。CPT 可以使用 PEFT，SFT 也可更新全部参数，训练目标与参数更新方法是两个独立选择。\n把继续预训练简单定义为全参数微调，SFT 简单定义为 LoRA。\n认为任何新增知识都必须继续预训练。\n领域知识变化很快时为什么还会考虑 RAG？\nCPT 之后 SFT 数据如何补足交互格式？"}, {"id": "PRE-012", "category": "PRE", "topic": "训练精度与优化", "level": "L2", "title": "AdamW 与 Adam 加 L2 正则为什么不等价？", "tags": ["AdamW", "WeightDecay", "优化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Adam 中的 L2 项作为 loss 梯度进入自适应一阶、二阶矩和预条件缩放；AdamW 的 weight decay 则直接作用于参数，与梯度更新解耦。因此二者通常不等价，不能因都使用 \u003ccode>weight_decay\u003c/code> 字段就当作同一算法。普通 SGD 在适当系数下的等价关系也不能直接迁移到 Adam。\u003c/p>\u003cp>训练时应明确参数组、衰减规则与学习率；bias 和 norm 是否衰减由配方决定。学习率影响每步衰减量，比较配置还需匹配训练步数与调度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说 AdamW 只是 Adam 的别名。\u003c/li>\u003cli>无依据断言所有 embedding、norm 必须采用同一种衰减配置。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么相同 \u003ccode>weight_decay\u003c/code> 在不同训练时长下效果不同？\u003c/li>\u003cli>LoRA 参数是否应该使用权重衰减？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Adam 中的 L2 项作为 loss 梯度进入自适应一阶、二阶矩和预条件缩放；AdamW 的 weight decay 则直接作用于参数，与梯度更新解耦。因此二者通常不等价，不能因都使用 `weight_decay` 字段就当作同一算法。普通 SGD 在适当系数下的等价关系也不能直接迁移到 Adam。\n\n训练时应明确参数组、衰减规则与学习率；bias 和 norm 是否衰减由配方决定。学习率影响每步衰减量，比较配置还需匹配训练步数与调度。\n说 AdamW 只是 Adam 的别名。\n无依据断言所有 embedding、norm 必须采用同一种衰减配置。\n为什么相同 `weight_decay` 在不同训练时长下效果不同？\nLoRA 参数是否应该使用权重衰减？"}, {"id": "PRE-013", "category": "PRE", "topic": "训练精度与优化", "level": "L1", "title": "FP16 与 BF16 的差异是什么，混合精度为何有用？", "tags": ["BF16", "FP16", "AMP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FP16 和 BF16 都是 16 bit：FP16 使用 1 位符号、5 位指数、10 位尾数，BF16 为 1、8、7。BF16 指数范围接近 FP32，FP16 尾数精度更细，却更容易发生梯度下溢和激活溢出。\u003c/p>\u003cp>混合精度让合适的算子使用低精度，敏感归约保持高精度；\u003ccode>autocast\u003c/code> 按算子选 dtype，并非把所有张量转成 half。FP16 常用 loss scaling 缓解梯度下溢，BF16 较少需要，但仍可能有数值问题。速度取决于硬件与内核，应持续检查 NaN、Inf 和梯度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>BF16 精度在所有数值范围都高于 FP16。\u003c/li>\u003cli>loss scaling 能修复前向激活溢出。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么部分 norm 或 softmax 使用 FP32？\u003c/li>\u003cli>FP16 的梯度裁剪前应做什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FP16 和 BF16 都是 16 bit：FP16 使用 1 位符号、5 位指数、10 位尾数，BF16 为 1、8、7。BF16 指数范围接近 FP32，FP16 尾数精度更细，却更容易发生梯度下溢和激活溢出。\n\n混合精度让合适的算子使用低精度，敏感归约保持高精度；`autocast` 按算子选 dtype，并非把所有张量转成 half。FP16 常用 loss scaling 缓解梯度下溢，BF16 较少需要，但仍可能有数值问题。速度取决于硬件与内核，应持续检查 NaN、Inf 和梯度。\nBF16 精度在所有数值范围都高于 FP16。\nloss scaling 能修复前向激活溢出。\n为什么部分 norm 或 softmax 使用 FP32？\nFP16 的梯度裁剪前应做什么？"}, {"id": "PRE-014", "category": "PRE", "topic": "训练精度与优化", "level": "L2", "title": "warmup、学习率衰减和梯度裁剪各解决什么问题？", "tags": ["Warmup", "LearningRate", "GradientClipping"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Warmup 缓慢增加训练初期的学习率，给优化器状态和激活尺度建立提供缓冲；需要多长取决于模型尺度、初始化、优化器与数据。原 Transformer 的 Noam 策略先线性增长，再按步数平方根倒数衰减：更新步 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>&#x02265;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>、模型维度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>、warmup 步 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>w\u003c/mi>\u003c/mrow>\u003c/math> 时，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B7;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmsup>\u003cmi>w\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。交点 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>w\u003c/mi>\u003c/mrow>\u003c/math> 的峰值为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmi>w\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math>；原实验 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>4000\u003c/mn>\u003c/mrow>\u003c/math>，现代配方也可用 cosine 或 linear，不能把历史设置当作通用规则。\u003c/p>\u003cp>Global norm clipping 将全部参数梯度的总范数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math> 限制在 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>C\u003c/mi>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>，对所有梯度统一乘 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 时保持零。这样保留方向，与逐元素 clamp 或各张量独立裁剪不同。\u003c/p>\u003cp>应在完整梯度累积之后、AMP unscale 之后裁剪，再做 \u003ccode>optimizer.step\u003c/code>；scheduler 按真实参数更新计步。分布式分片要检查全局范数聚合，非有限梯度须先检测和处理，裁剪不能修复 NaN/Inf。它限制当前梯度，却不保证 Adam 更新范数或后续 loss，动量、二阶矩和衰减仍会影响结果。持续触发时应记录裁剪前范数、比例、loss 与 AMP 跳步，再排查数据、学习率和数值。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>&#x003B7;\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmsup>\u003cmi>w\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>s\u003c/mi>\u003cmo>&#x02265;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>G\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmsubsup>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/msqrt>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>g\u003c/mi>\u003cmi>p\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>G\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi>G\u003c/mi>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>按每个参数各自 clip，却宣称等价于 global norm；在 AMP unscale 前套用原阈值。\u003c/li>\u003cli>把原始 Noam 配方写成所有 Transformer/LLM 固定规则，或使用 \u003ccode>step=0\u003c/code> 导致负幂未定义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若 warmup 步数翻 4 倍且其他因子不变，Noam 峰值怎样变化？\u003c/li>\u003cli>为何梯度范数已被裁到 C，Adam 的参数更新范数仍可能大于 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B7;\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003c/math>？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Warmup 缓慢增加训练初期的学习率，给优化器状态和激活尺度建立提供缓冲；需要多长取决于模型尺度、初始化、优化器与数据。原 Transformer 的 Noam 策略先线性增长，再按步数平方根倒数衰减：更新步 $s\\ge1$、模型维度 $D$、warmup 步 $w$ 时，$\\eta(s)=cD^{-1/2}\\min(s^{-1/2},sw^{-3/2})$。交点 $s=w$ 的峰值为 $c/\\sqrt{Dw}$；原实验 $w=4000$，现代配方也可用 cosine 或 linear，不能把历史设置当作通用规则。\n\nGlobal norm clipping 将全部参数梯度的总范数 $G=\\sqrt{\\sum_p\\|g_p\\|_2^2}$ 限制在 $C>0$，对所有梯度统一乘 $\\min(1,C/G)$；$G=0$ 时保持零。这样保留方向，与逐元素 clamp 或各张量独立裁剪不同。\n\n应在完整梯度累积之后、AMP unscale 之后裁剪，再做 `optimizer.step`；scheduler 按真实参数更新计步。分布式分片要检查全局范数聚合，非有限梯度须先检测和处理，裁剪不能修复 NaN/Inf。它限制当前梯度，却不保证 Adam 更新范数或后续 loss，动量、二阶矩和衰减仍会影响结果。持续触发时应记录裁剪前范数、比例、loss 与 AMP 跳步，再排查数据、学习率和数值。\n按每个参数各自 clip，却宣称等价于 global norm；在 AMP unscale 前套用原阈值。\n把原始 Noam 配方写成所有 Transformer/LLM 固定规则，或使用 `step=0` 导致负幂未定义。\n若 warmup 步数翻 4 倍且其他因子不变，Noam 峰值怎样变化？\n为何梯度范数已被裁到 C，Adam 的参数更新范数仍可能大于 $\\eta C$？"}, {"id": "PRE-015", "category": "PRE", "topic": "语言建模与规模规律", "level": "L1", "title": "perplexity 怎样计算才可公平比较？", "tags": ["PPL", "评测", "长文本"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>PPL 是有效 token 平均负对数似然的指数，测量文本预测分布，不直接等同于对话质量。公平比较要统一语料、tokenizer、上下文窗口与计损范围；不同 tokenizer 的 token-level PPL 不直接可比，可辅以 bits-per-byte 等统一口径。\u003c/p>\u003cp>固定窗口模型评估长文时，互不重叠切块会使块开头缺少历史，通常抬高 PPL。滑动窗口能补足上下文，但重叠部分应只作条件，避免目标重复计数，并考虑模型内部 label shift 后的有效数量。还需结合领域 loss、指令遵循、事实性与任务正确率判断能力。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>PPL\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">T\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmo>NLL\u003c/mo>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>先算各 batch PPL 再等权平均。\u003c/li>\u003cli>对 prompt、padding 和目标回答采用不一致的计损策略。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么更短的评测 stride 可能得到更低 PPL？\u003c/li>\u003cli>如何处理超长语料的首个 token？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "PPL 是有效 token 平均负对数似然的指数，测量文本预测分布，不直接等同于对话质量。公平比较要统一语料、tokenizer、上下文窗口与计损范围；不同 tokenizer 的 token-level PPL 不直接可比，可辅以 bits-per-byte 等统一口径。\n\n固定窗口模型评估长文时，互不重叠切块会使块开头缺少历史，通常抬高 PPL。滑动窗口能补足上下文，但重叠部分应只作条件，避免目标重复计数，并考虑模型内部 label shift 后的有效数量。还需结合领域 loss、指令遵循、事实性与任务正确率判断能力。\n先算各 batch PPL 再等权平均。\n对 prompt、padding 和目标回答采用不一致的计损策略。\n为什么更短的评测 stride 可能得到更低 PPL？\n如何处理超长语料的首个 token？"}, {"id": "PRE-016", "category": "PRE", "topic": "语言建模与规模规律", "level": "L2", "title": "预训练语料有限时能否重复多 epoch，如何识别收益递减与过拟合？", "tags": ["数据受限", "多epoch", "Scaling Law"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>重复数据能继续降低训练损失，也可能在有限语料下带来有效学习，但边际收益通常弱于新增多样且同质量的数据；多epoch并非必然立刻损害质量。数据受限的scaling研究在特定实验预算中观察到少量重复接近独特数据的loss，再多重复收益逐渐减小，这不能直接外推成所有模型通用的epoch阈值。\u003c/p>\u003cp>先比较独立验证集loss、下游任务、成员推断/记忆风险及训练—验证差距，再看固定算力下重复次数、模型规模与数据混合的消融。清除偶然重复文档不等同于禁止训练计划中的多次采样；高质量领域数据可有意上采样，但要记录有效独特token、总token和各源曝光次数。可用更广覆盖的数据、适当正则、不同mask/目标和混合回放降低退化，不能靠继续增加epoch保证知识获得。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>E\u003c/mi>\u003cmspace width=\"0.167em\" />\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">q\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02260;\u003c/mo>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmtext>in&#x000A0;general\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把重复token的数量当作同等数量的新信息。\u003c/li>\u003cli>断言第2个epoch以后所有大模型都会变差。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>去重和有意上采样为什么并不矛盾？\u003c/li>\u003cli>如何固定FLOPs比较增模型与重复数据？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "重复数据能继续降低训练损失，也可能在有限语料下带来有效学习，但边际收益通常弱于新增多样且同质量的数据；多epoch并非必然立刻损害质量。数据受限的scaling研究在特定实验预算中观察到少量重复接近独特数据的loss，再多重复收益逐渐减小，这不能直接外推成所有模型通用的epoch阈值。\n\n先比较独立验证集loss、下游任务、成员推断/记忆风险及训练—验证差距，再看固定算力下重复次数、模型规模与数据混合的消融。清除偶然重复文档不等同于禁止训练计划中的多次采样；高质量领域数据可有意上采样，但要记录有效独特token、总token和各源曝光次数。可用更广覆盖的数据、适当正则、不同mask/目标和混合回放降低退化，不能靠继续增加epoch保证知识获得。\n把重复token的数量当作同等数量的新信息。\n断言第2个epoch以后所有大模型都会变差。\n去重和有意上采样为什么并不矛盾？\n如何固定FLOPs比较增模型与重复数据？"}, {"id": "PRE-017", "category": "PRE", "topic": "语言建模与规模规律", "level": "L3", "title": "大模型的“涌现能力”怎样定义，指标突变是否证明机制相变？", "tags": ["涌现", "Grokking", "评估指标"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>规模研究中“涌现”常指某能力在小模型表现接近随机、扩大后明显出现，且难从小模型曲线外推；它不是“模型开始创造新内容”的泛称。观察到的跳变可能来自exact-match、全步骤正确等非线性指标：底层每步能力平滑增长，严格全对率仍可呈现显著门槛。\u003c/p>\u003cp>因此应同时报告连续分数、部分正确、序列概率或校准指标，增加规模采样点，并控制数据、训练预算、prompt和评估样本。指标效应能解释部分现象，不意味着已证明所有新能力都是幻觉；grokking是训练时间轴上延迟泛化的现象，与跨模型规模的能力曲线也不是同一定义。提出机制相变还需可重复干预、表示或计算过程证据，不能仅凭榜单折线。用于选型时直接验证任务质量和资源成本比争论标签更有价值。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmtext>all&#x000A0;\u003c/mtext>\u003cmi>m\u003c/mi>\u003cmtext>&#x000A0;steps&#x000A0;correct\u003c/mtext>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>p\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msup>\u003cmspace width=\"1em\" />\u003cmtext>under&#x000A0;an&#x000A0;independence&#x000A0;toy&#x000A0;assumption\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把一个离散指标的跳变当作内部算法突变的充分证据。\u003c/li>\u003cli>把grokking、规模涌现和生成创造性当作同一概念。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>换成部分正确评分为何可能使能力曲线更平滑？\u003c/li>\u003cli>如何验证观察不是prompt或数据混杂造成的？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "规模研究中“涌现”常指某能力在小模型表现接近随机、扩大后明显出现，且难从小模型曲线外推；它不是“模型开始创造新内容”的泛称。观察到的跳变可能来自exact-match、全步骤正确等非线性指标：底层每步能力平滑增长，严格全对率仍可呈现显著门槛。\n\n因此应同时报告连续分数、部分正确、序列概率或校准指标，增加规模采样点，并控制数据、训练预算、prompt和评估样本。指标效应能解释部分现象，不意味着已证明所有新能力都是幻觉；grokking是训练时间轴上延迟泛化的现象，与跨模型规模的能力曲线也不是同一定义。提出机制相变还需可重复干预、表示或计算过程证据，不能仅凭榜单折线。用于选型时直接验证任务质量和资源成本比争论标签更有价值。\n把一个离散指标的跳变当作内部算法突变的充分证据。\n把grokking、规模涌现和生成创造性当作同一概念。\n换成部分正确评分为何可能使能力曲线更平滑？\n如何验证观察不是prompt或数据混杂造成的？"}, {"id": "PRE-018", "category": "PRE", "topic": "语言建模与规模规律", "level": "L2", "title": "Fill-in-the-Middle 预训练怎样让 causal LM 根据前后文补全代码？", "tags": ["FIM", "代码补全", "预训练"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FIM把文档切成prefix、middle和suffix，使用特殊标记把前后文排到待补全middle之前，再用普通next-token目标训练。例如PSM布局为prefix标记+prefix+suffix标记+suffix+middle标记+middle；也可以混合SPM等布局。生成middle时前后文已在可见前缀中，因此causal mask仍足够，并不需要改成双向decoder。\u003c/p>\u003cp>数据需随机选择合法切点、保留特殊token和语言边界，控制FIM比例与常规左到右训练的混合。代码补全要检查AST/缩进、tokenizer和跨文件上下文，同时单独测续写与infilling，不能仅用普通PPL验收。Code Llama等checkpoint对FIM支持并不完全相同，必须核对对应版本和prompt标记。FIM学的是按转换序列条件化的生成，和BERT在原位置并行预测MASK、GLM的空白填充参数化都有差异。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x0220F;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/munderover>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmo>format\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>认为causal LM永远无法使用后缀文本作为条件。\u003c/li>\u003cli>对未学过FIM标记的模型直接拼标记并假设已获得infill能力。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>切点在token化之前还是之后有什么差别？\u003c/li>\u003cli>如何验证FIM训练没有破坏普通左到右续写？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "FIM把文档切成prefix、middle和suffix，使用特殊标记把前后文排到待补全middle之前，再用普通next-token目标训练。例如PSM布局为prefix标记+prefix+suffix标记+suffix+middle标记+middle；也可以混合SPM等布局。生成middle时前后文已在可见前缀中，因此causal mask仍足够，并不需要改成双向decoder。\n\n数据需随机选择合法切点、保留特殊token和语言边界，控制FIM比例与常规左到右训练的混合。代码补全要检查AST/缩进、tokenizer和跨文件上下文，同时单独测续写与infilling，不能仅用普通PPL验收。Code Llama等checkpoint对FIM支持并不完全相同，必须核对对应版本和prompt标记。FIM学的是按转换序列条件化的生成，和BERT在原位置并行预测MASK、GLM的空白填充参数化都有差异。\n认为causal LM永远无法使用后缀文本作为条件。\n对未学过FIM标记的模型直接拼标记并假设已获得infill能力。\n切点在token化之前还是之后有什么差别？\n如何验证FIM训练没有破坏普通左到右续写？"}, {"id": "FT-001", "category": "FT", "topic": "指令数据与训练目标", "level": "L1", "title": "预训练与 SFT 的 loss 有何差异，label shift 如何对齐？", "tags": ["SFT", "指令微调", "Loss", "LabelShift", "PromptMask", "有效Token"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>预训练与常规 SFT 都可使用 next-token 交叉熵，主要差异是数据分布与监督范围。序列 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x02026;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 的 logits 第 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/math> 行基于 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x02264;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>，预测 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>；可对齐 \u003ccode>logits[:,:-1]\u003c/code> 和 \u003ccode>labels[:,1:]\u003c/code>，或用尾部补 ignore 的等价实现，shift 只能由一处负责。\u003c/p>\u003cp>例如输入 \u003ccode>[P0,P1,A0,A1,EOS]\u003c/code>，未 shift 的标签为 \u003ccode>[-100,-100,A0,A1,EOS]\u003c/code>。末 prompt 的 P1 logits 监督首回答 A0，A0 监督 A1，A1 监督 EOS；P0 到 P1 的目标忽略，末 EOS logits 没有下一标签。若额外屏蔽 P1 logits，就会丢掉首回答监督。\u003c/p>\u003cp>预训练通常监督有效文本，排除 padding、无后续目标和配方指定边界；SFT 可以只监督回答、所有 assistant 回合、最后回合或全序列，由训练配方决定，也能学习知识和内容。Loss mask 决定目标贡献，attention mask 决定可读上下文；回答梯度仍可经 prompt 表示回传到共享参数。两种训练都需 causal 约束与正确 packing 隔离。\u003c/p>\u003cp>常规损失按有效 token 平均；若改为每样本等权或加入辅助项，目标也随之改变。比较效果时应核对模板、监督范围、数据和任务指标，不能直接用不同 mask 下的 loss 排名。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmi>&#x027F6;\u003c/mi>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi mathvariant=\"script\">L\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 SFT 写成另一种分类 loss，或断言 SFT 永远只能计回答 loss。\u003c/li>\u003cli>按预测 logits 所在位置屏蔽 prompt，错误丢掉 prompt→首 answer 的有效预测。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>多轮对话只监督最后一轮时，前几轮回答是否仍提供上下文？\u003c/li>\u003cli>预训练的全 token loss 和 SFT 的回答 loss 能直接比较吗？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "预训练与常规 SFT 都可使用 next-token 交叉熵，主要差异是数据分布与监督范围。序列 $x_0,\\ldots,x_{T-1}$ 的 logits 第 $t$ 行基于 $x_{\\le t}$，预测 $x_{t+1}$；可对齐 `logits[:,:-1]` 和 `labels[:,1:]`，或用尾部补 ignore 的等价实现，shift 只能由一处负责。\n\n例如输入 `[P0,P1,A0,A1,EOS]`，未 shift 的标签为 `[-100,-100,A0,A1,EOS]`。末 prompt 的 P1 logits 监督首回答 A0，A0 监督 A1，A1 监督 EOS；P0 到 P1 的目标忽略，末 EOS logits 没有下一标签。若额外屏蔽 P1 logits，就会丢掉首回答监督。\n\n预训练通常监督有效文本，排除 padding、无后续目标和配方指定边界；SFT 可以只监督回答、所有 assistant 回合、最后回合或全序列，由训练配方决定，也能学习知识和内容。Loss mask 决定目标贡献，attention mask 决定可读上下文；回答梯度仍可经 prompt 表示回传到共享参数。两种训练都需 causal 约束与正确 packing 隔离。\n\n常规损失按有效 token 平均；若改为每样本等权或加入辅助项，目标也随之改变。比较效果时应核对模板、监督范围、数据和任务指标，不能直接用不同 mask 下的 loss 排名。\n把 SFT 写成另一种分类 loss，或断言 SFT 永远只能计回答 loss。\n按预测 logits 所在位置屏蔽 prompt，错误丢掉 prompt→首 answer 的有效预测。\n多轮对话只监督最后一轮时，前几轮回答是否仍提供上下文？\n预训练的全 token loss 和 SFT 的回答 loss 能直接比较吗？"}, {"id": "FT-002", "category": "FT", "topic": "指令数据与训练目标", "level": "L1", "title": "SFT 怎样只对回答部分计算 loss？", "tags": ["LossMask", "LabelShift", "Padding"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>只监督回答时，在最终 token 序列中把 prompt、padding 和其他不监督位置的 labels 设为 \u003ccode>ignore_index\u003c/code>，例如 \u003ccode>-100\u003c/code>，回答标签保留真实 ID。应先应用模型 chat template 再标注，多轮可选择所有 assistant 回合或最后回合，并明确正文、角色结束及 EOS 的监督范围，避免混用字符和 token 边界。\u003c/p>\u003cp>若首 answer 在 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/math>，保留 \u003ccode>labels[j]=input_ids[j]\u003c/code>，prompt 的 \u003ccode>labels[:j]=-100\u003c/code>；shift 后 \u003ccode>logits[j-1]\u003c/code> 预测首回答。因此只忽略 prompt 目标，不删除末 prompt 的 logits，模型内部 shift 时 collator 仍保持标签与输入同位置。合法 prompt 的 attention mask 继续有效，回答 loss 的梯度也能经过它的上下文路径。\u003c/p>\u003cp>Padding 与真实 EOS 即使共用 ID，也必须按位置区分，不能按 EOS ID 全部忽略；EOS 可以是有效停止监督。独立 packing 段首目标不能由上一段末 logits 预测，还需块状可见性或后端段边界。最后用小序列逐项检查 logits 索引、目标、mask、有效数量和 loss。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x02264;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 prompt 的 \u003ccode>attention_mask\u003c/code> 设为 0，或把末 prompt logit 的首回答监督删掉。\u003c/li>\u003cli>collator 和模型内部各 shift 一次，或把 \u003ccode>pad=EOS\u003c/code> 当作所有 EOS 均为 padding。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何验证多轮 assistant-only mask 与 chat template 的 generation 区间？\u003c/li>\u003cli>没有任何有效回答目标的样本应怎样过滤或处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "只监督回答时，在最终 token 序列中把 prompt、padding 和其他不监督位置的 labels 设为 `ignore_index`，例如 `-100`，回答标签保留真实 ID。应先应用模型 chat template 再标注，多轮可选择所有 assistant 回合或最后回合，并明确正文、角色结束及 EOS 的监督范围，避免混用字符和 token 边界。\n\n若首 answer 在 $j$，保留 `labels[j]=input_ids[j]`，prompt 的 `labels[:j]=-100`；shift 后 `logits[j-1]` 预测首回答。因此只忽略 prompt 目标，不删除末 prompt 的 logits，模型内部 shift 时 collator 仍保持标签与输入同位置。合法 prompt 的 attention mask 继续有效，回答 loss 的梯度也能经过它的上下文路径。\n\nPadding 与真实 EOS 即使共用 ID，也必须按位置区分，不能按 EOS ID 全部忽略；EOS 可以是有效停止监督。独立 packing 段首目标不能由上一段末 logits 预测，还需块状可见性或后端段边界。最后用小序列逐项检查 logits 索引、目标、mask、有效数量和 loss。\n把 prompt 的 `attention_mask` 设为 0，或把末 prompt logit 的首回答监督删掉。\ncollator 和模型内部各 shift 一次，或把 `pad=EOS` 当作所有 EOS 均为 padding。\n如何验证多轮 assistant-only mask 与 chat template 的 generation 区间？\n没有任何有效回答目标的样本应怎样过滤或处理？"}, {"id": "FT-003", "category": "FT", "topic": "指令数据与训练目标", "level": "L2", "title": "chat template 错配会导致哪些问题？", "tags": ["ChatTemplate", "EOS", "Tokenizer"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Chat template 将角色与消息转成模型训练过的 token 序列，错配可能导致续写用户、角色混乱或无法停止。Tokenizer、\u003ccode>chat_template\u003c/code> 和特殊 token 配置应与模型、适配器一起版本化，训练和部署保持一致。\u003c/p>\u003cp>训练通常不额外添加新 assistant 回复的起始提示，生成时按模板需要添加 generation prompt；先渲染文本再编码时检查 \u003ccode>add_special_tokens\u003c/code>，避免重复 BOS/EOS。用短对话核对 token ID、角色边界、loss mask 与停止行为，再覆盖多轮对话。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只检查字符串外观，忽略底层 token ID。\u003c/li>\u003cli>把所有模型都换成同一套 ChatML 而无需训练。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么重复 EOS 可能损害生成？\u003c/li>\u003cli>模型已有模板时还需要 clone 新模板吗？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Chat template 将角色与消息转成模型训练过的 token 序列，错配可能导致续写用户、角色混乱或无法停止。Tokenizer、`chat_template` 和特殊 token 配置应与模型、适配器一起版本化，训练和部署保持一致。\n\n训练通常不额外添加新 assistant 回复的起始提示，生成时按模板需要添加 generation prompt；先渲染文本再编码时检查 `add_special_tokens`，避免重复 BOS/EOS。用短对话核对 token ID、角色边界、loss mask 与停止行为，再覆盖多轮对话。\n只检查字符串外观，忽略底层 token ID。\n把所有模型都换成同一套 ChatML 而无需训练。\n为什么重复 EOS 可能损害生成？\n模型已有模板时还需要 clone 新模板吗？"}, {"id": "FT-004", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L1", "title": "全参数微调、LoRA、Adapter 和 Prefix-Tuning 怎样选择？", "tags": ["PEFT", "FullFT", "选型"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>全参数微调更新自由度大，但梯度和优化器状态开销更高；PEFT 冻结大部分底座，训练少量增量，适合资源受限或多任务切换。选型要结合任务差异、数据量、显存与部署，PEFT 不保证总能达到全参数效果。\u003c/p>\u003cp>LoRA 给线性层加低秩更新，合适时可合并回权重；Adapter 加任务独立模块，但可能增加算子和时延；Prefix-Tuning 学习连续前缀，通常提供额外 attention 键值条件。冻结底座仍需前向和用于反传的激活，参数减少比例不能直接当作显存减少比例。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>训练参数减少 99% 就声称训练显存减少 99%。\u003c/li>\u003cli>仅看单次训练成本，忽略多适配器服务和合并成本。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>领域迁移很大时为什么全参数值得尝试？\u003c/li>\u003cli>多任务适配器如何与 prefix cache 协同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "全参数微调更新自由度大，但梯度和优化器状态开销更高；PEFT 冻结大部分底座，训练少量增量，适合资源受限或多任务切换。选型要结合任务差异、数据量、显存与部署，PEFT 不保证总能达到全参数效果。\n\nLoRA 给线性层加低秩更新，合适时可合并回权重；Adapter 加任务独立模块，但可能增加算子和时延；Prefix-Tuning 学习连续前缀，通常提供额外 attention 键值条件。冻结底座仍需前向和用于反传的激活，参数减少比例不能直接当作显存减少比例。\n训练参数减少 99% 就声称训练显存减少 99%。\n仅看单次训练成本，忽略多适配器服务和合并成本。\n领域迁移很大时为什么全参数值得尝试？\n多任务适配器如何与 prefix cache 协同？"}, {"id": "FT-005", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L1", "title": "LoRA 的低秩更新公式及可训练参数量是什么？", "tags": ["LoRA", "低秩", "公式"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LoRA 冻结 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，学习 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>。更新秩至多为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>，可训练参数为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，不要求底座或整个模型低秩。\u003c/p>\u003cp>前向为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>，梯度能经过冻结底座传播到需要训练的模块。标准浮点部署可合并增量，免去额外小投影；需要多适配器切换时则未必合并。LoRA 主要节省权重梯度与优化器状态，长序列激活仍可能主导显存。\u003c/p>\u003cp>合并要求底座与 adapter 的 checkpoint、目标层、缩放和 dtype 对齐，并在 eval 模式关闭 adapter dropout。浮点权重 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">g\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 免去额外低秩分支，通常减少内核调用；但不会把大模型权重变成“小 adapter 大小”。低精度舍入使结果未必逐 bit 相同，应比对 logits 与任务结果。保留未合并 adapter 有利于共享底座、多租户切换和回滚；merge_and_unload 后应保留独立原件。量化底座的合并受量化后端支持限制，不能把浮点增量直接加到整数码，必要时反量化合并并重新校准量化。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c
