。FlexFlow在sample/operator/attribute/parameter（SOAP）维度搜索并用模拟器估成本；Alpa把算子内并行与算子间/流水线规划分层求解。\n\n划分改变时可能产生reshape/reshard通信，最小化单算子时间不一定最小化完整step。成本模型还受网络争用、kernel实现、dynamic shape与activation内存影响，模拟计划需实测校准。系统能降低手工设计负担，但不能保证任意图、拓扑和实际负载达到数学全局最优；支持的算子、编译耗时、计划稳定性和checkpoint可移植性同样重要。\n把sharding传播与全局穷举最优搜索混为一谈。\n忽略计划中的reshard通信与峰值显存。\n为什么单算子最优分片不一定是全图最优？\n动态shape如何影响自动规划的复用？"}, {"id": "DST-023", "category": "DST", "topic": "并行策略与通信", "level": "L3", "title": "GPipe、同步 1F1B 与异步 PipeDream 的梯度语义和权重版本怎样区分？", "tags": ["GPipe", "1F1B", "PipeDream", "weight stashing"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>GPipe的典型调度先完成多个microbatch前向，再集中反向并累积梯度，最后同步更新；它保持一个batch使用同一权重，但保存较多在途activation。同步1F1B在warmup后交替前向/反向，仍在完整batch边界更新，因此可减少activation驻留，不必引入陈旧权重。1F1B描述调度顺序，不自动说明是否异步更新。\u003c/p>\u003cp>原始PipeDream允许流水线各stage异步推进更新，microbatch的前向和反向可能跨权重版本，weight stashing保存对应版本以保持该microbatch局部计算一致；即使局部版本匹配，仍存在跨stage/时间的陈旧梯度，不等价普通同步SGD。PipeDream-Flush等同步变体在边界flush以恢复同步语义，2BW降低保留版本的成本但也有自己的约束。比较应报告bubble、activation、权重版本内存、收敛和global batch，不能只凭调度图判断数值等价。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003B7;\u003c/mi>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmtext>(synchronous&#x000A0;accumulation)\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>认为所有1F1B都是异步或都存在同样的weight staleness。\u003c/li>\u003cli>认为保存前向权重版本就保证整体等价同步SGD。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>1F1B为何通常能降低activation峰值？\u003c/li>\u003cli>增加microbatch数时bubble与kernel效率如何权衡？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "GPipe的典型调度先完成多个microbatch前向，再集中反向并累积梯度，最后同步更新；它保持一个batch使用同一权重，但保存较多在途activation。同步1F1B在warmup后交替前向/反向，仍在完整batch边界更新，因此可减少activation驻留，不必引入陈旧权重。1F1B描述调度顺序，不自动说明是否异步更新。\n\n原始PipeDream允许流水线各stage异步推进更新，microbatch的前向和反向可能跨权重版本，weight stashing保存对应版本以保持该microbatch局部计算一致；即使局部版本匹配，仍存在跨stage/时间的陈旧梯度，不等价普通同步SGD。PipeDream-Flush等同步变体在边界flush以恢复同步语义，2BW降低保留版本的成本但也有自己的约束。比较应报告bubble、activation、权重版本内存、收敛和global batch，不能只凭调度图判断数值等价。\n认为所有1F1B都是异步或都存在同样的weight staleness。\n认为保存前向权重版本就保证整体等价同步SGD。\n1F1B为何通常能降低activation峰值？\n增加microbatch数时bubble与kernel效率如何权衡？"}, {"id": "DST-024", "category": "DST", "topic": "精度与激活优化", "level": "L2", "title": "TF32 与 FP32、FP16、BF16 有何区别，TF32 会把模型存成19位吗？", "tags": ["TF32", "混合精度", "Tensor Core"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>TF32是支持硬件上Tensor Core执行某些FP32矩阵乘/卷积时采用的计算精度模式，使用近似FP32指数范围和约10bit显式尾数输入精度，通常以FP32累加；FP32输入和输出tensor仍占32bit。把符号、指数与有效尾数加成19位是描述计算格式，不能据此估算PyTorch参数存储为19bit，也不能把它当作torch.float16那样常规存储dtype。\u003c/p>\u003cp>FP16尾数较细但指数范围较窄，BF16尾数较粗而指数范围接近FP32，二者可降低权重/activation存储和带宽。TF32主要加速受支持FP32运算，实际收益和误差依赖硬件、shape与后端开关；数学上乘单位矩阵也未必逐bit保持输入。数值敏感任务应比较收敛、输出误差和必要FP32路径，且查所用PyTorch版本的API，不把过去默认设置当永久规则。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>storage\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">F\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmn>32\u003c/mn>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.167em\" />\u003cmo>numel\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmtext>bytes&#x000A0;even&#x000A0;when&#x000A0;TF32&#x000A0;computation&#x000A0;is&#x000A0;enabled\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把TF32内部计算精度当作模型文件的存储位宽。\u003c/li>\u003cli>把某一版本框架的TF32默认值当作所有版本的固定行为。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>TF32为何可能改变X乘单位矩阵的结果？\u003c/li>\u003cli>低精度输入、累加精度和输出dtype为何要分别说明？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "TF32是支持硬件上Tensor Core执行某些FP32矩阵乘/卷积时采用的计算精度模式，使用近似FP32指数范围和约10bit显式尾数输入精度，通常以FP32累加；FP32输入和输出tensor仍占32bit。把符号、指数与有效尾数加成19位是描述计算格式，不能据此估算PyTorch参数存储为19bit，也不能把它当作torch.float16那样常规存储dtype。\n\nFP16尾数较细但指数范围较窄，BF16尾数较粗而指数范围接近FP32，二者可降低权重/activation存储和带宽。TF32主要加速受支持FP32运算，实际收益和误差依赖硬件、shape与后端开关；数学上乘单位矩阵也未必逐bit保持输入。数值敏感任务应比较收敛、输出误差和必要FP32路径，且查所用PyTorch版本的API，不把过去默认设置当永久规则。\n把TF32内部计算精度当作模型文件的存储位宽。\n把某一版本框架的TF32默认值当作所有版本的固定行为。\nTF32为何可能改变X乘单位矩阵的结果？\n低精度输入、累加精度和输出dtype为何要分别说明？"}, {"id": "DST-025", "category": "DST", "topic": "并行策略与通信", "level": "L2", "title": "怎样检查 GPU/NVLink/网络拓扑，区分算力不足和通信瓶颈？", "tags": ["NCCL", "网络", "拓扑", "profiling"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先核对GPU型号、数量、驱动/CUDA/NCCL及每个rank绑定，用nvidia-smi查看GPU状态、topo -m查看节点内互连，再确认NIC/NUMA亲和性和实际使用的网络接口。名义网卡速率不等于collective有效带宽，GPU utilization高也不证明有用矩阵计算或MFU高。\u003c/p>\u003cp>分别测节点内GPU点对点带宽、节点间RDMA带宽和nccl-tests的collective，扫描从小到大消息，比较all_reduce/all_gather等真实通信模式。algorithm bandwidth与bus bandwidth使用不同口径，不直接混比。再用训练timeline查看计算与通信重叠、长尾rank、数据加载及同步等待，配合MFU和step time判断瓶颈；Deepspeed环境报告可确认安装能力，不能代替实际链路测量。保留拓扑、并行组、消息大小和测试版本，避免通过盲目改NCCL环境变量掩盖根因。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把nvidia-smi的GPU utilization当成MFU。\u003c/li>\u003cli>只测一个消息尺寸就判断所有collective的性能。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>小消息与大消息分别更受延迟还是带宽限制？\u003c/li>\u003cli>NUMA/NIC亲和性为什么可能影响跨机吞吐？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先核对GPU型号、数量、驱动/CUDA/NCCL及每个rank绑定，用nvidia-smi查看GPU状态、topo -m查看节点内互连，再确认NIC/NUMA亲和性和实际使用的网络接口。名义网卡速率不等于collective有效带宽，GPU utilization高也不证明有用矩阵计算或MFU高。\n\n分别测节点内GPU点对点带宽、节点间RDMA带宽和nccl-tests的collective，扫描从小到大消息，比较all_reduce/all_gather等真实通信模式。algorithm bandwidth与bus bandwidth使用不同口径，不直接混比。再用训练timeline查看计算与通信重叠、长尾rank、数据加载及同步等待，配合MFU和step time判断瓶颈；Deepspeed环境报告可确认安装能力，不能代替实际链路测量。保留拓扑、并行组、消息大小和测试版本，避免通过盲目改NCCL环境变量掩盖根因。\n把nvidia-smi的GPU utilization当成MFU。\n只测一个消息尺寸就判断所有collective的性能。\n小消息与大消息分别更受延迟还是带宽限制？\nNUMA/NIC亲和性为什么可能影响跨机吞吐？"}, {"id": "DST-026", "category": "DST", "topic": "并行策略与通信", "level": "L3", "title": "2D、2.5D、3D 张量并行与 DP×TP×PP 的“3D 并行”有什么区别？", "tags": ["多维张量并行", "2.5D", "3D并行"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多维张量并行把同一矩阵乘及其操作数映射到多维设备网格，沿不同轴分块、广播或归约，以改变每卡存储和通信。2D常用q×q网格分布矩阵块；2.5D增加一个复制深度，用额外存储或设备复本换更少部分通信；3D沿三维网格安排输入、权重和输出的分布与通信。具体矩阵形状、网格和算法决定公式，不是“维度越高总越快”。\u003c/p>\u003cp>DP×TP×PP的3D混合并行则是三个不同策略组合：数据、同层算子、不同层。两处“3D”完全不同，2D TP也能作为混合并行里的TP维度。多维TP可能减少特定大矩阵的通信，却增加分片约束、拓扑要求和reshard开销，小规模或不匹配shape未必值得；框架版本对这些方案的支持也不同。回答应给实际sharding与collective路径，不只背1D/2D/3D名词。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmn>2.5\u003c/mn>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmi>c\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmn>3\u003c/mn>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmspace width=\"1em\" />\u003cmtext>for&#x000A0;common&#x000A0;square/cubic&#x000A0;meshes\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把3D tensor parallel等同DP×TP×PP。\u003c/li>\u003cli>把2.5D中的复制深度理解为半个物理维度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>额外复制为什么可以减少某些通信却增加内存？\u003c/li>\u003cli>矩阵shape与网格轴不整除时怎样处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多维张量并行把同一矩阵乘及其操作数映射到多维设备网格，沿不同轴分块、广播或归约，以改变每卡存储和通信。2D常用q×q网格分布矩阵块；2.5D增加一个复制深度，用额外存储或设备复本换更少部分通信；3D沿三维网格安排输入、权重和输出的分布与通信。具体矩阵形状、网格和算法决定公式，不是“维度越高总越快”。\n\nDP×TP×PP的3D混合并行则是三个不同策略组合：数据、同层算子、不同层。两处“3D”完全不同，2D TP也能作为混合并行里的TP维度。多维TP可能减少特定大矩阵的通信，却增加分片约束、拓扑要求和reshard开销，小规模或不匹配shape未必值得；框架版本对这些方案的支持也不同。回答应给实际sharding与collective路径，不只背1D/2D/3D名词。\n把3D tensor parallel等同DP×TP×PP。\n把2.5D中的复制深度理解为半个物理维度。\n额外复制为什么可以减少某些通信却增加内存？\n矩阵shape与网格轴不整除时怎样处理？"}, {"id": "RAG-001", "category": "RAG", "topic": "文档切分与索引", "level": "L1", "title": "一个可落地的 RAG 系统有哪些环节？", "tags": ["RAG", "pipeline"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RAG 的离线链路包括文档解析、清洗、切分和建立带元数据的索引；在线链路包括问题转换、召回、重排、证据上下文构造和生成。索引应保存文档 ID、页码、版本、权限与片段边界，以支持更新和可追溯引用。\u003c/p>\u003cp>生成输入需明确区分任务指令与外部资料，资料不足时允许澄清或拒答。检索、证据使用和生成应分别评测，因为端到端答错可能来自不同环节。现代 prompt RAG 可以不训练模型，原始 RAG 论文也研究了检索与生成的联合微调，因此训练与否不是定义边界。\u003c/p>\u003cp>搜索系统通常返回排序文档或片段，RAG在检索结果上生成综合答案；检索相关性和最终答案质量需分别评价。生成阶段不能把无证据的回答包装成来自搜索结果，也不能用答案正确掩盖来源错误。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把 RAG 定义为必须零训练，也不要把它等同向量数据库。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样定位是没检索到还是模型没用好证据？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RAG 的离线链路包括文档解析、清洗、切分和建立带元数据的索引；在线链路包括问题转换、召回、重排、证据上下文构造和生成。索引应保存文档 ID、页码、版本、权限与片段边界，以支持更新和可追溯引用。\n\n生成输入需明确区分任务指令与外部资料，资料不足时允许澄清或拒答。检索、证据使用和生成应分别评测，因为端到端答错可能来自不同环节。现代 prompt RAG 可以不训练模型，原始 RAG 论文也研究了检索与生成的联合微调，因此训练与否不是定义边界。\n\n搜索系统通常返回排序文档或片段，RAG在检索结果上生成综合答案；检索相关性和最终答案质量需分别评价。生成阶段不能把无证据的回答包装成来自搜索结果，也不能用答案正确掩盖来源错误。\n不要把 RAG 定义为必须零训练，也不要把它等同向量数据库。\n怎样定位是没检索到还是模型没用好证据？"}, {"id": "RAG-002", "category": "RAG", "topic": "文档切分与索引", "level": "L1", "title": "RAG、微调和 prompt engineering 如何选择？", "tags": ["RAG", "SFT", "选型"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prompt engineering 改变当次任务约束，RAG 在推理时提供外部证据，微调则改变模型的行为分布。知识更新频繁、需要权限控制或溯源时，可优先评估 RAG；稳定输出格式或专门能力可考虑微调。微调不能充当可靠数据库，事实未必能精确写入、更新或撤回。\u003c/p>\u003cp>三者可以组合，例如训练模型更好地读取证据或改善检索能力，但 RAG 仍依赖解析、召回与证据质量。应使用代表性业务样本，在同等预算下对 prompt、RAG、SFT 及其组合做消融，比较效果、时延、数据维护与成本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>“RAG 只学知识、微调只学能力”是粗略划分，不是严格理论。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>客服政策每天更新但答复格式严格，该怎么组合？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prompt engineering 改变当次任务约束，RAG 在推理时提供外部证据，微调则改变模型的行为分布。知识更新频繁、需要权限控制或溯源时，可优先评估 RAG；稳定输出格式或专门能力可考虑微调。微调不能充当可靠数据库，事实未必能精确写入、更新或撤回。\n\n三者可以组合，例如训练模型更好地读取证据或改善检索能力，但 RAG 仍依赖解析、召回与证据质量。应使用代表性业务样本，在同等预算下对 prompt、RAG、SFT 及其组合做消融，比较效果、时延、数据维护与成本。\n“RAG 只学知识、微调只学能力”是粗略划分，不是严格理论。\n客服政策每天更新但答复格式严格，该怎么组合？"}, {"id": "RAG-003", "category": "RAG", "topic": "文档切分与索引", "level": "L2", "title": "chunk 大小、overlap 与父子、链式、树式索引怎样设计？", "tags": ["chunk", "文档解析", "链式索引", "树式索引", "父子节点"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Chunk 应覆盖可回答的信息单元，并适配 embedding 模型和生成器的预算。优先按标题、段落、表格等结构切分，再比较多个大小与 overlap：重叠能保留边界上下文，也会增加存储和重复召回，没有固定最优参数。\u003c/p>\u003cp>表格应保留表头、单位与关联行，代码和公式尽量避免在语义中间断开。小片段检索、返回较大父段是一种兼顾定位和上下文完整性的方式。评测需联合观察证据召回、答案质量、重复率及 token 成本；字符数不能直接当作 token 数，中文与代码尤其需要实际统计。\u003c/p>\u003cp>切块后还可保留节点的顺序与层级：链式/列表索引按文档顺序组织节点，适合遍历汇总或命中后扩展相邻上下文；LlamaIndex 的 Summary Index（原 List Index）默认取全部节点，并非默认只取向量 top-k。树式索引把原始块作为叶节点、子节点摘要作为父节点，可从摘要逐层选择分支定位证据；摘要可能丢失细节，回答仍应保留到原文的定位。顺序、父子关系与向量索引可以组合，例如先向量召回小块，再补邻居或父段；要共同评估召回、摘要误差与上下文成本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>切分字符数不能自动等价为 token 数，中文与代码差异明显。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>大 chunk 提高答案质量但降低召回时，你怎样定位原因？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Chunk 应覆盖可回答的信息单元，并适配 embedding 模型和生成器的预算。优先按标题、段落、表格等结构切分，再比较多个大小与 overlap：重叠能保留边界上下文，也会增加存储和重复召回，没有固定最优参数。\n\n表格应保留表头、单位与关联行，代码和公式尽量避免在语义中间断开。小片段检索、返回较大父段是一种兼顾定位和上下文完整性的方式。评测需联合观察证据召回、答案质量、重复率及 token 成本；字符数不能直接当作 token 数，中文与代码尤其需要实际统计。\n\n切块后还可保留节点的顺序与层级：链式/列表索引按文档顺序组织节点，适合遍历汇总或命中后扩展相邻上下文；LlamaIndex 的 Summary Index（原 List Index）默认取全部节点，并非默认只取向量 top-k。树式索引把原始块作为叶节点、子节点摘要作为父节点，可从摘要逐层选择分支定位证据；摘要可能丢失细节，回答仍应保留到原文的定位。顺序、父子关系与向量索引可以组合，例如先向量召回小块，再补邻居或父段；要共同评估召回、摘要误差与上下文成本。\n切分字符数不能自动等价为 token 数，中文与代码差异明显。\n大 chunk 提高答案质量但降低召回时，你怎样定位原因？"}, {"id": "RAG-004", "category": "RAG", "topic": "召回、融合与重排", "level": "L2", "title": "embedding 模型与相似度应如何选？", "tags": ["embedding", "dual encoder"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>双塔分别编码 query 和文档，便于预计算文档表示与快速检索。模型选型应匹配语言、领域、文档长度以及 query/document 指令模板，并用业务检索标注集验证；专有实体、代码、跨语言和长段落的表现可能不同，通用榜单不能替代这些检查。\u003c/p>\u003cp>索引和查询必须处于兼容向量空间，向量归一化与距离度量也要一致。单位归一化后，余弦相似度与内积的排序一致；未归一化时未必如此。更换模型、模板或维度通常需要重编码或重建索引，并保留可回滚版本。\u003c/p>\u003cp>Embedding选型可用MTEB等公开任务筛候选，最终要在业务标注query/文档集测Recall@k、MRR与nDCG，区分语义相似、检索排名和事实支持。需要适应领域时可以对比训练并挖hard negatives，过滤假负例；更换编码器后索引与query向量必须同步版本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>向量距离小不是事实正确，也不能解释为跨模型通用置信度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何区分 embedding 失效与 ANN 索引漏召回？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "双塔分别编码 query 和文档，便于预计算文档表示与快速检索。模型选型应匹配语言、领域、文档长度以及 query/document 指令模板，并用业务检索标注集验证；专有实体、代码、跨语言和长段落的表现可能不同，通用榜单不能替代这些检查。\n\n索引和查询必须处于兼容向量空间，向量归一化与距离度量也要一致。单位归一化后，余弦相似度与内积的排序一致；未归一化时未必如此。更换模型、模板或维度通常需要重编码或重建索引，并保留可回滚版本。\n\nEmbedding选型可用MTEB等公开任务筛候选，最终要在业务标注query/文档集测Recall@k、MRR与nDCG，区分语义相似、检索排名和事实支持。需要适应领域时可以对比训练并挖hard negatives，过滤假负例；更换编码器后索引与query向量必须同步版本。\n向量距离小不是事实正确，也不能解释为跨模型通用置信度。\n如何区分 embedding 失效与 ANN 索引漏召回？"}, {"id": "RAG-005", "category": "RAG", "topic": "召回、融合与重排", "level": "L2", "title": "BM25 与向量检索各有什么优势？", "tags": ["BM25", "dense retrieval"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BM25 通过词项匹配、逆文档频率和词频饱和打分，适合型号、人名和精确术语；向量检索更擅长语义近似，但可能模糊关键数字或否定条件，两者通常可以混合使用。BM25 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math> 控制词频饱和，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>b\u003c/mi>\u003c/mrow>\u003c/math> 控制文档长度归一化，具体取值需业务验证。\u003c/p>\u003cp>稀有型号、错误码可使用 \u003ccode>exact\u003c/code>/\u003ccode>keyword\u003c/code> 字段，语义问题使用 dense 路径。中文分词、字段配置、同义词、大小写与中英混合都会影响召回，应先检查这些因素，再判断是否是模型能力问题。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>关键词检索不是必然落后，也不能用 BM25 分数当概率。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>涉及 SKU 与价格区间时如何组合结构过滤和语义召回？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BM25 通过词项匹配、逆文档频率和词频饱和打分，适合型号、人名和精确术语；向量检索更擅长语义近似，但可能模糊关键数字或否定条件，两者通常可以混合使用。BM25 的 $k_1$ 控制词频饱和，$b$ 控制文档长度归一化，具体取值需业务验证。\n\n稀有型号、错误码可使用 `exact`/`keyword` 字段，语义问题使用 dense 路径。中文分词、字段配置、同义词、大小写与中英混合都会影响召回，应先检查这些因素，再判断是否是模型能力问题。\n关键词检索不是必然落后，也不能用 BM25 分数当概率。\n涉及 SKU 与价格区间时如何组合结构过滤和语义召回？"}, {"id": "RAG-006", "category": "RAG", "topic": "召回、融合与重排", "level": "L2", "title": "混合检索的分数融合与 RRF 有什么区别？", "tags": ["hybrid search", "RRF"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BM25 与向量检索分数的范围和分布不同，直接相加容易让一路占主导。融合可先校准分数再加权，也可用 RRF 累加各检索路的倒数排名贡献 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmo>rank\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，避开原始分数之间的直接比较。\u003c/p>\u003cp>RRF 仍需验证排名常数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>、候选窗口与去重规则；未进入窗口的文档没有融合机会，重复文档应按稳定 ID 合并。评测按词项、语义和多跳 query 分层比较收益，同时监测 P95 延迟。RRF 分数不能视为余弦相似度或可靠性概率，也不能照搬原检索分数的阈值。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>RRF\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>j\u003c/mi>\u003cmi>:\u003c/mi>\u003cmspace width=\"0.167em\" />\u003cmi>d\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/munder>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmo>rank\u003c/mo>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>RRF 分数不等于余弦相似度或可靠性概率。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为何融合后的分数阈值不能照搬原来的 cosine 阈值？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BM25 与向量检索分数的范围和分布不同，直接相加容易让一路占主导。融合可先校准分数再加权，也可用 RRF 累加各检索路的倒数排名贡献 $1/(k+\\operatorname{rank}_j(d))$，避开原始分数之间的直接比较。\n\nRRF 仍需验证排名常数 $k$、候选窗口与去重规则；未进入窗口的文档没有融合机会，重复文档应按稳定 ID 合并。评测按词项、语义和多跳 query 分层比较收益，同时监测 P95 延迟。RRF 分数不能视为余弦相似度或可靠性概率，也不能照搬原检索分数的阈值。\nRRF 分数不等于余弦相似度或可靠性概率。\n为何融合后的分数阈值不能照搬原来的 cosine 阈值？"}, {"id": "RAG-007", "category": "RAG", "topic": "召回、融合与重排", "level": "L2", "title": "reranker 和 embedding 检索模型如何分工？", "tags": ["rerank", "cross encoder"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Embedding 检索用独立表示快速缩小候选范围；cross-encoder 将问题与候选联合输入，利用交互信息判断相关性并重排，通常更精细但成本更高。精排不能找回粗召回完全遗漏的证据，因此先保证 Top-N 候选覆盖，再用 Top-K 精排控制上下文质量与预算。\u003c/p>\u003cp>业务标注还应验证 reranker 的分数校准、多语言和长片段能力。批处理、候选去重、轻量排序与缓存可降低延迟；重排的收益最终仍需由端到端正确率确认，不能只看相关性分数。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把精排理解成一定手工加特征权重；模型类型与任务有关。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>rerank 提升相关性却降低端到端正确率时怎样排查？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Embedding 检索用独立表示快速缩小候选范围；cross-encoder 将问题与候选联合输入，利用交互信息判断相关性并重排，通常更精细但成本更高。精排不能找回粗召回完全遗漏的证据，因此先保证 Top-N 候选覆盖，再用 Top-K 精排控制上下文质量与预算。\n\n业务标注还应验证 reranker 的分数校准、多语言和长片段能力。批处理、候选去重、轻量排序与缓存可降低延迟；重排的收益最终仍需由端到端正确率确认，不能只看相关性分数。\n不能把精排理解成一定手工加特征权重；模型类型与任务有关。\nrerank 提升相关性却降低端到端正确率时怎样排查？"}, {"id": "RAG-008", "category": "RAG", "topic": "文档切分与索引", "level": "L2", "title": "HNSW 的 M、ef_construction 和 ef_search 怎样权衡？", "tags": ["ANN", "HNSW"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>HNSW 使用分层近邻图减少搜索量，以近似召回换取速度。\u003ccode>M\u003c/code> 影响图连接与内存，\u003ccode>ef_construction\u003c/code> 影响建图质量，\u003ccode>ef_search\u003c/code> 或实现中的查询 \u003ccode>ef\u003c/code> 影响搜索宽度与延迟。增大连接数或构建搜索宽度通常提高图质量，也增加内存或建库时间；增大查询宽度通常提高 ANN recall，同时增加耗时，且需满足实现对 \u003ccode>k\u003c/code> 的约束。\u003c/p>\u003cp>调参时先与暴力近邻结果比较索引 recall，再单独测文档的业务相关性，二者不能混为一谈。过滤条件、删除更新、距离函数和索引版本也会影响结果，需纳入验证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>ANN recall 高不代表找到业务所需证据；两种召回要分开。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>精确搜索命中、ANN 未命中时你会调什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "HNSW 使用分层近邻图减少搜索量，以近似召回换取速度。`M` 影响图连接与内存，`ef_construction` 影响建图质量，`ef_search` 或实现中的查询 `ef` 影响搜索宽度与延迟。增大连接数或构建搜索宽度通常提高图质量，也增加内存或建库时间；增大查询宽度通常提高 ANN recall，同时增加耗时，且需满足实现对 `k` 的约束。\n\n调参时先与暴力近邻结果比较索引 recall，再单独测文档的业务相关性，二者不能混为一谈。过滤条件、删除更新、距离函数和索引版本也会影响结果，需纳入验证。\nANN recall 高不代表找到业务所需证据；两种召回要分开。\n精确搜索命中、ANN 未命中时你会调什么？"}, {"id": "RAG-009", "category": "RAG", "topic": "查询优化与图检索", "level": "L2", "title": "query rewrite、multi-query 和 HyDE 何时有用？", "tags": ["query rewrite", "HyDE"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Query rewrite 可补全指代或检索术语，multi-query 通过多种表达增加语义覆盖；HyDE 先生成假设文档，再用其表示检索真实资料。这些方式适用于问题与文档表达差距较大的场景，但可能改变原意、增加噪声和延迟，应保留原问题并比较真实召回收益。\u003c/p>\u003cp>基于历史补全实体时需记录依据，不能丢失关键数值或否定条件。多路结果合并后应去重，避免近似改写耗尽候选预算。HyDE 的假设文本可能有错，只能帮助检索，不能直接作为最终答案的事实来源。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>改写不是必加环节，简单准确的 query 可能被越改越差。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样检测 rewrite 错把用户需求改成另一个问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Query rewrite 可补全指代或检索术语，multi-query 通过多种表达增加语义覆盖；HyDE 先生成假设文档，再用其表示检索真实资料。这些方式适用于问题与文档表达差距较大的场景，但可能改变原意、增加噪声和延迟，应保留原问题并比较真实召回收益。\n\n基于历史补全实体时需记录依据，不能丢失关键数值或否定条件。多路结果合并后应去重，避免近似改写耗尽候选预算。HyDE 的假设文本可能有错，只能帮助检索，不能直接作为最终答案的事实来源。\n改写不是必加环节，简单准确的 query 可能被越改越差。\n怎样检测 rewrite 错把用户需求改成另一个问题？"}, {"id": "RAG-010", "category": "RAG", "topic": "查询优化与图检索", "level": "L3", "title": "Self-RAG 和多跳检索怎样改善复杂问答？", "tags": ["Self-RAG", "multi-hop", "CRAG", "FLARE"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多跳问答可能先定位实体，再根据中间证据检索下一跳；可将问题拆成可验证子问题，记录每跳证据与实体关系，迭代补足缺口。Self-RAG 则是进一步训练 reflection tokens 来控制检索与评价的具体框架，加入一句“自我反思”不等于复现该方法。\u003c/p>\u003cp>迭代步骤只有提供有效证据才有价值，也会增加成本并传播中间错误。应设跳数、token 和重复查询预算及停止条件，避免缺少证据时无限检索；模型自评也不能替代事实核验。\u003c/p>\u003cp>自适应/迭代检索应明确触发机制：CRAG以检索质量评估触发纠正，FLARE依据前瞻生成内容及不确定性触发检索，Self-RAG学习专用reflection tokens。它们不是仅让模型“想一想再搜索”的同名方法；按需检索可能减少无效调用，也可能受不准的自评影响，需要固定预算与停止条件。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>模型自评不是事实裁判，错误中间实体会污染后续检索。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两跳答案正确时，怎样证明每跳证据真的被使用？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多跳问答可能先定位实体，再根据中间证据检索下一跳；可将问题拆成可验证子问题，记录每跳证据与实体关系，迭代补足缺口。Self-RAG 则是进一步训练 reflection tokens 来控制检索与评价的具体框架，加入一句“自我反思”不等于复现该方法。\n\n迭代步骤只有提供有效证据才有价值，也会增加成本并传播中间错误。应设跳数、token 和重复查询预算及停止条件，避免缺少证据时无限检索；模型自评也不能替代事实核验。\n\n自适应/迭代检索应明确触发机制：CRAG以检索质量评估触发纠正，FLARE依据前瞻生成内容及不确定性触发检索，Self-RAG学习专用reflection tokens。它们不是仅让模型“想一想再搜索”的同名方法；按需检索可能减少无效调用，也可能受不准的自评影响，需要固定预算与停止条件。\n模型自评不是事实裁判，错误中间实体会污染后续检索。\n两跳答案正确时，怎样证明每跳证据真的被使用？"}, {"id": "RAG-011", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L2", "title": "RAG 如何建立分层评测并定位 bad case？", "tags": ["RAG评测", "recall", "MRR", "MAP", "nDCG"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RAG 评测应依次检查检索是否覆盖证据、上下文是否相关，以及答案是否忠于证据、正确且完整。准备带证据位置的业务集，按失败环节归因，并联合报告成本、延迟和拒答；只看 BLEU 或单一总分会掩盖链路瓶颈。\u003c/p>\u003cp>检索可使用 Recall@K、MRR 与 nDCG，多段联合证据还需检查是否完整覆盖。用 oracle evidence 替换真实检索，可分析生成器读取证据的能力上限。自动 judge 与无参考指标均有误差，应通过人工样本校准，并记录模型、prompt、语料和指标版本。\u003c/p>\u003cp>对每个query，MRR取第一个相关结果的倒数排名再平均，未命中记0；AP在每个二值相关命中位置计算Precision并按相关文档总数R_q归一，MAP对query平均。nDCG用等级相关性g_i的gain与位置折扣，再除以同一截断k的理想排序IDCG；下面使用2的g_i次方减1，也有直接用g_i的约定，需固定。R_q=0或IDCG=0时须预先规定剔除或记0，避免除零；AP@k的分母同样应声明。缺失标注可能把真实相关结果算负例，检索相关性也不等于答案证据支持。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmrow>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003c/mrow>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>Q\u003c/mi>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>q\u003c/mi>\u003c/munder>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmsubsup>\u003cmo>rank\u003c/mo>\u003cmi>q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmtext>无命中记&#x000A0;\u003c/mtext>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmrow>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmrow>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>i\u003c/mi>\u003cmo>&#x000B7;\u003c/mo>\u003cmsub>\u003cmo>rel\u003c/mo>\u003cmrow>\u003cmi>q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmrow>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>Q\u003c/mi>\u003c/mfrac>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>q\u003c/mi>\u003c/munder>\u003cmrow>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/munderover>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmrow>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>log\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmrow>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">I\u003c/mi>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>judge 分数和自动 reference-free 指标都有误差，不是无成本真值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>召回提升但答案质量不变，应做哪些消融？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RAG 评测应依次检查检索是否覆盖证据、上下文是否相关，以及答案是否忠于证据、正确且完整。准备带证据位置的业务集，按失败环节归因，并联合报告成本、延迟和拒答；只看 BLEU 或单一总分会掩盖链路瓶颈。\n\n检索可使用 Recall@K、MRR 与 nDCG，多段联合证据还需检查是否完整覆盖。用 oracle evidence 替换真实检索，可分析生成器读取证据的能力上限。自动 judge 与无参考指标均有误差，应通过人工样本校准，并记录模型、prompt、语料和指标版本。\n\n对每个query，MRR取第一个相关结果的倒数排名再平均，未命中记0；AP在每个二值相关命中位置计算Precision并按相关文档总数R_q归一，MAP对query平均。nDCG用等级相关性g_i的gain与位置折扣，再除以同一截断k的理想排序IDCG；下面使用2的g_i次方减1，也有直接用g_i的约定，需固定。R_q=0或IDCG=0时须预先规定剔除或记0，避免除零；AP@k的分母同样应声明。缺失标注可能把真实相关结果算负例，检索相关性也不等于答案证据支持。\njudge 分数和自动 reference-free 指标都有误差，不是无成本真值。\n召回提升但答案质量不变，应做哪些消融？"}, {"id": "RAG-012", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L2", "title": "RAG 为什么仍会幻觉，怎样设计引用与拒答？", "tags": ["幻觉", "grounding"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RAG 仍可能检索错误、遗漏条件或让模型忽略证据，因此不能保证消除幻觉。应将回答拆为可核验事实，把关键陈述绑定真实片段，再检查该段落是否确实支持结论；链接存在本身不构成证据。\u003c/p>\u003cp>支持率需与答案覆盖度同时衡量，避免少说或空答获得虚高精度。保存资料的时间、版本、页码和检索结果，便于回查条件。文档冲突、过期或不足时应澄清、补检索或拒答，不能伪造出处；低 temperature 或“只依据资料”的提示也不提供正确性保证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>低 temperature 或“只依据资料”提示不能构成正确性保证。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两份文档政策冲突时如何选择并解释？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RAG 仍可能检索错误、遗漏条件或让模型忽略证据，因此不能保证消除幻觉。应将回答拆为可核验事实，把关键陈述绑定真实片段，再检查该段落是否确实支持结论；链接存在本身不构成证据。\n\n支持率需与答案覆盖度同时衡量，避免少说或空答获得虚高精度。保存资料的时间、版本、页码和检索结果，便于回查条件。文档冲突、过期或不足时应澄清、补检索或拒答，不能伪造出处；低 temperature 或“只依据资料”的提示也不提供正确性保证。\n低 temperature 或“只依据资料”提示不能构成正确性保证。\n两份文档政策冲突时如何选择并解释？"}, {"id": "RAG-013", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L3", "title": "企业 RAG 如何处理权限、更新与删除？", "tags": ["ACL", "版本", "企业RAG"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>企业 RAG 必须在检索与数据访问层执行权限控制，身份由服务端可信认证获得，检索前或检索中使用租户与 ACL 过滤。Chunk 应继承原文权限和版本，不能依赖生成后让模型过滤敏感信息，因为证据可能已经进入上下文。\u003c/p>\u003cp>更新需同步原文、索引、缓存与权限元数据，明确同步延迟和 SLA；删除或撤权时应清理残余片段与可见缓存，并验证用户边界。缓存键需考虑用户或租户、权限版本和文档版本，防止跨用户复用或继续命中旧权限结果。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>生成后再让模型过滤敏感片段太晚，证据可能已经进入上下文。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>文档撤权后，如何发现并阻断旧缓存仍被使用？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "企业 RAG 必须在检索与数据访问层执行权限控制，身份由服务端可信认证获得，检索前或检索中使用租户与 ACL 过滤。Chunk 应继承原文权限和版本，不能依赖生成后让模型过滤敏感信息，因为证据可能已经进入上下文。\n\n更新需同步原文、索引、缓存与权限元数据，明确同步延迟和 SLA；删除或撤权时应清理残余片段与可见缓存，并验证用户边界。缓存键需考虑用户或租户、权限版本和文档版本，防止跨用户复用或继续命中旧权限结果。\n生成后再让模型过滤敏感片段太晚，证据可能已经进入上下文。\n文档撤权后，如何发现并阻断旧缓存仍被使用？"}, {"id": "RAG-014", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L2", "title": "长上下文能否替代 RAG？", "tags": ["long context", "RAG"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>长上下文适合规模可控的完整材料阅读，RAG 适合大型、频繁更新且带权限的知识库按需取证，两者也可组合。选择应看实际证据覆盖、位置鲁棒性、时延与成本；窗口能容纳资料，不代表模型能同样可靠地利用所有位置。\u003c/p>\u003cp>使用单文档、多文档、多跳与长尾事实样本比较直接输入和检索，保持相同答案预算与采样设置，并分别计入索引、prefill 和生成成本。Lost in the Middle 是特定模型与任务的实验现象，当前系统仍需重新测量，不能据此断言某种方案总是更好或更便宜。\u003c/p>\u003cp>Lost in the Middle指某些实验中证据放在中段比首尾更难利用。测试时固定问题和证据内容，随机交换位置并控制干扰段长度，区分检索漏召回与生成漏利用；可尝试重排证据、去冗余、分层摘要或分段问答，但压缩也可能丢掉关键条件，需看位置分层指标。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要说长上下文必然淘汰 RAG，或 RAG 在一切场景永远更便宜。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若证据在正文中段，怎样验证模型是否漏读？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "长上下文适合规模可控的完整材料阅读，RAG 适合大型、频繁更新且带权限的知识库按需取证，两者也可组合。选择应看实际证据覆盖、位置鲁棒性、时延与成本；窗口能容纳资料，不代表模型能同样可靠地利用所有位置。\n\n使用单文档、多文档、多跳与长尾事实样本比较直接输入和检索，保持相同答案预算与采样设置，并分别计入索引、prefill 和生成成本。Lost in the Middle 是特定模型与任务的实验现象，当前系统仍需重新测量，不能据此断言某种方案总是更好或更便宜。\n\nLost in the Middle指某些实验中证据放在中段比首尾更难利用。测试时固定问题和证据内容，随机交换位置并控制干扰段长度，区分检索漏召回与生成漏利用；可尝试重排证据、去冗余、分层摘要或分段问答，但压缩也可能丢掉关键条件，需看位置分层指标。\n不要说长上下文必然淘汰 RAG，或 RAG 在一切场景永远更便宜。\n若证据在正文中段，怎样验证模型是否漏读？"}, {"id": "RAG-015", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L3", "title": "多模态 RAG 怎样检索图表、扫描 PDF 与视频？", "tags": ["multimodal RAG", "ColPali"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多模态 RAG 可使用 OCR 文本、图像描述或视觉多向量表示检索，并保留页码、区域和时间戳。ColPali 直接为文档页图建立多向量表示，通过 late interaction 匹配。选择路径时需按信息类型比较 OCR 误差、视觉编码成本与图文混合检索效果，不能仅以图像命中判断读表是否正确。\u003c/p>\u003cp>结果应回传原图、相关区域和表头等证据，让生成器核验单位与位置。视频需先定义片段与时间粒度，多帧证据应能支持时序问题，不能只找到相似画面。视觉检索也不意味着可以省去全部 OCR、文本索引或结构化抽取。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>视觉检索不意味着所有 OCR、文本索引与结构化抽取都能省略。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>一个检索正确但 VLM 读表错误的案例该怎么归因？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多模态 RAG 可使用 OCR 文本、图像描述或视觉多向量表示检索，并保留页码、区域和时间戳。ColPali 直接为文档页图建立多向量表示，通过 late interaction 匹配。选择路径时需按信息类型比较 OCR 误差、视觉编码成本与图文混合检索效果，不能仅以图像命中判断读表是否正确。\n\n结果应回传原图、相关区域和表头等证据，让生成器核验单位与位置。视频需先定义片段与时间粒度，多帧证据应能支持时序问题，不能只找到相似画面。视觉检索也不意味着可以省去全部 OCR、文本索引或结构化抽取。\n视觉检索不意味着所有 OCR、文本索引与结构化抽取都能省略。\n一个检索正确但 VLM 读表错误的案例该怎么归因？"}, {"id": "RAG-016", "category": "RAG", "topic": "查询优化与图检索", "level": "L2", "title": "知识图谱 RAG 与 GraphRAG 何时有用，和多 Agent 有什么关系？", "tags": ["GraphRAG", "知识图谱", "Local/Global Search"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>图增强检索适合关系密集、多跳或全局归纳的问题。知识图谱保存实体、关系与来源，可以沿结构关系寻找证据；向量检索擅长语义相似文本，二者可组合。LLM抽出的图可能遗漏、混淆实体或捏造关系，必须保留原文回链与权限/版本。\u003c/p>\u003cp>Microsoft GraphRAG先抽取图结构并生成社区报告。Local Search围绕与query相关的实体扩展邻居并结合原文，Global Search利用社区摘要回答语料整体主题类问题；不是所有GraphRAG都等于在图数据库里做几跳遍历，也不能把摘要当作天然无误的事实。\u003c/p>\u003cp>多Agent是决策/执行组织方式，GraphRAG是知识表示与检索方式；Agent可调用GraphRAG，也可以不用图，GraphRAG也不要求多Agent。比较方案应看关系问题的证据召回、事实支持、更新成本、实体链接质量与查询延迟，普通局部事实查询可能用baseline RAG更简单。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>Graph of Thoughts、Agent执行图和知识图谱分别表示计算结构、控制依赖与实体关系，不能混为同一种图。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>“公司所有子公司”与“整个行业的主要风险”分别适合哪种检索？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "图增强检索适合关系密集、多跳或全局归纳的问题。知识图谱保存实体、关系与来源，可以沿结构关系寻找证据；向量检索擅长语义相似文本，二者可组合。LLM抽出的图可能遗漏、混淆实体或捏造关系，必须保留原文回链与权限/版本。\n\nMicrosoft GraphRAG先抽取图结构并生成社区报告。Local Search围绕与query相关的实体扩展邻居并结合原文，Global Search利用社区摘要回答语料整体主题类问题；不是所有GraphRAG都等于在图数据库里做几跳遍历，也不能把摘要当作天然无误的事实。\n\n多Agent是决策/执行组织方式，GraphRAG是知识表示与检索方式；Agent可调用GraphRAG，也可以不用图，GraphRAG也不要求多Agent。比较方案应看关系问题的证据召回、事实支持、更新成本、实体链接质量与查询延迟，普通局部事实查询可能用baseline RAG更简单。\nGraph of Thoughts、Agent执行图和知识图谱分别表示计算结构、控制依赖与实体关系，不能混为同一种图。\n“公司所有子公司”与“整个行业的主要风险”分别适合哪种检索？"}, {"id": "RAG-017", "category": "RAG", "topic": "文档切分与索引", "level": "L2", "title": "IVF_FLAT、IVF_PQ 与 HNSW 如何检索，nlist/nprobe 和 PQ 有何权衡？", "tags": ["IVF_FLAT", "IVF_PQ", "HNSW", "nprobe", "PQ"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>IVF用粗量化器把向量划到nlist个簇，查询选择nprobe个簇，在对应倒排列表里寻找近邻。IVF_FLAT保存原始向量并在选中列表算精确距离，仍可能因为漏查其他簇错过全局近邻，所以不是整个索引的精确搜索。\u003c/p>\u003cp>PQ将向量拆成M个子空间，各自用有限码本编码，缩减存储并用距离查表近似计算；IVF_PQ常编码相对粗中心的残差。若每子空间用b位，编码约Mb/8字节，需另加ID、码本与索引开销。它同时存在粗筛漏召回和量化排序误差，可增大nprobe或使用原向量rerank，但成本会上升。\u003c/p>\u003cp>HNSW通过分层近邻图导航，通常无需先训练聚类码本，但图结构增加内存。选择取决于数据量、内存、召回/延迟目标、增删维护和是否有代表性训练数据。IVF的nlist过大可能使列表过小/训练不足，nprobe越大通常更准也更慢；应在相同业务集合上测实际曲线。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003cmi mathvariant=\"normal\">Q\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmi>N\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmi>b\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">y\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmo />\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>b\u003c/mi>\u003cmi>e\u003c/mi>\u003cmi>d\u003c/mi>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmi>f\u003c/mi>\u003cmi>r\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>c\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>列表大小常不均匀，nprobe/nlist只表示粗比例，不是严格耗时或召回公式。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>ANN召回差怎样区分粗量化漏簇、PQ误差与embedding本身不合适？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "IVF用粗量化器把向量划到nlist个簇，查询选择nprobe个簇，在对应倒排列表里寻找近邻。IVF_FLAT保存原始向量并在选中列表算精确距离，仍可能因为漏查其他簇错过全局近邻，所以不是整个索引的精确搜索。\n\nPQ将向量拆成M个子空间，各自用有限码本编码，缩减存储并用距离查表近似计算；IVF_PQ常编码相对粗中心的残差。若每子空间用b位，编码约Mb/8字节，需另加ID、码本与索引开销。它同时存在粗筛漏召回和量化排序误差，可增大nprobe或使用原向量rerank，但成本会上升。\n\nHNSW通过分层近邻图导航，通常无需先训练聚类码本，但图结构增加内存。选择取决于数据量、内存、召回/延迟目标、增删维护和是否有代表性训练数据。IVF的nlist过大可能使列表过小/训练不足，nprobe越大通常更准也更慢；应在相同业务集合上测实际曲线。\n列表大小常不均匀，nprobe/nlist只表示粗比例，不是严格耗时或召回公式。\nANN召回差怎样区分粗量化漏簇、PQ误差与embedding本身不合适？"}, {"id": "RAG-018", "category": "RAG", "topic": "评测、权限与多模态 RAG", "level": "L2", "title": "RAGFlow、Haystack、LlamaIndex 与 DSPy 怎样分工和选型？", "tags": ["RAGFlow", "Haystack", "LlamaIndex", "DSPy", "框架选型"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RAG框架选型先看文档解析、chunk/元数据、检索与权限、生成编排、评测和部署。RAGFlow提供知识库接入、解析和检索应用的整合体验；Haystack以组件和pipeline构建检索/Agent应用；LlamaIndex围绕数据/索引/检索提供组件，也支持workflow/Agent。功能会重叠，不宜把它们固定分成“平台不会定制、库不能可视化”。\u003c/p>\u003cp>DSPy强调用声明的程序/模块与指标优化提示、示例或模型权重，不是向量数据库，也不是装上就自动得到更好的RAG。优化必须用训练/开发集，留出独立测试集并计算优化调用成本，防止指标过拟合。\u003c/p>\u003cp>用真实PDF/表格/权限更新等困难样本比较解析质量、证据召回、引用正确性、吞吐与恢复能力，确认能否导出数据、固定版本、插入自定义检索/重排与替换模型。更少编码的原型体验和生产控制力可以分别评估，不应以安装教程长度代替技术选型。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>框架默认分块和官方示例不保证适合中文合同、扫描PDF或跨页表格。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样验证框架升级后chunk边界和检索效果没有回归？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RAG框架选型先看文档解析、chunk/元数据、检索与权限、生成编排、评测和部署。RAGFlow提供知识库接入、解析和检索应用的整合体验；Haystack以组件和pipeline构建检索/Agent应用；LlamaIndex围绕数据/索引/检索提供组件，也支持workflow/Agent。功能会重叠，不宜把它们固定分成“平台不会定制、库不能可视化”。\n\nDSPy强调用声明的程序/模块与指标优化提示、示例或模型权重，不是向量数据库，也不是装上就自动得到更好的RAG。优化必须用训练/开发集，留出独立测试集并计算优化调用成本，防止指标过拟合。\n\n用真实PDF/表格/权限更新等困难样本比较解析质量、证据召回、引用正确性、吞吐与恢复能力，确认能否导出数据、固定版本、插入自定义检索/重排与替换模型。更少编码的原型体验和生产控制力可以分别评估，不应以安装教程长度代替技术选型。\n框架默认分块和官方示例不保证适合中文合同、扫描PDF或跨页表格。\n怎样验证框架升级后chunk边界和检索效果没有回归？"}, {"id": "RAG-019", "category": "RAG", "topic": "召回、融合与重排", "level": "L3", "title": "怎样训练 embedding/retriever，hard negatives、ICT、SEED 与 REALM 分别解决什么？", "tags": ["Embedding训练", "Hard Negatives", "ANCE", "RocketQA", "ICT", "SEED", "REALM"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>双塔用query与正/负文档的相似度进行对比训练。in-batch negatives便宜，但常偏容易且可能包含假负例；BM25、当前模型ANN召回或交叉编码器筛选能构造更难负例。按问题来源/实体/文档版本划分评测，防止相同问题改写或答案段落泄漏。\u003c/p>\u003cp>ANCE使用来自动态ANN索引的困难负例，缓解训练样本与检索阶段候选的差异；RocketQA强调跨批次负样本与去噪等训练设计。困难不等于错误标签可靠，应处理多个同样正确文档、近重复段落与领域歧义，避免把相关答案推远。\u003c/p>\u003cp>弱监督预训练中，ICT用句子与其上下文构造检索任务；SEED-Encoder借助较弱decoder形成瓶颈，促使encoder学习有用的全局表示；REALM把潜在文档检索纳入语言模型预训练，按检索文档条件化目标。这些方法改变训练任务或检索/语言目标耦合，不是换一个向量数据库。更换encoder后需同步索引，迭代采负例时关注索引滞后。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/msub>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003c/msup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>业务未标注为正例的文档不一定是真负例；盲目增加hard negatives可能损害召回。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>检索模型只在旧索引上挖负例，为什么训练可能越来越不贴近线上？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "双塔用query与正/负文档的相似度进行对比训练。in-batch negatives便宜，但常偏容易且可能包含假负例；BM25、当前模型ANN召回或交叉编码器筛选能构造更难负例。按问题来源/实体/文档版本划分评测，防止相同问题改写或答案段落泄漏。\n\nANCE使用来自动态ANN索引的困难负例，缓解训练样本与检索阶段候选的差异；RocketQA强调跨批次负样本与去噪等训练设计。困难不等于错误标签可靠，应处理多个同样正确文档、近重复段落与领域歧义，避免把相关答案推远。\n\n弱监督预训练中，ICT用句子与其上下文构造检索任务；SEED-Encoder借助较弱decoder形成瓶颈，促使encoder学习有用的全局表示；REALM把潜在文档检索纳入语言模型预训练，按检索文档条件化目标。这些方法改变训练任务或检索/语言目标耦合，不是换一个向量数据库。更换encoder后需同步索引，迭代采负例时关注索引滞后。\n业务未标注为正例的文档不一定是真负例；盲目增加hard negatives可能损害召回。\n检索模型只在旧索引上挖负例，为什么训练可能越来越不贴近线上？"}, {"id": "AGT-001", "category": "AGT", "topic": "提示、推理与规划", "level": "L1", "title": "ReAct、固定工作流和 Agent 有什么区别？", "tags": ["ReAct", "workflow"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>固定工作流由代码定义分支和步骤，Agent 让模型根据观察动态决定行动；ReAct 通过推理与行动交错使用环境反馈，典型循环是决定下一步、工具执行、观察结果并更新任务状态。模型提出工具调用只是计划，宿主仍负责执行、权限控制与结果回传。\u003c/p>\u003cp>是否采用 Agent 取决于步骤的不确定性及收益。能够稳定通过固定流程完成的任务通常更容易评测和维护，也可将确定步骤与有限自主探索混合，明确失败和停止条件。展示自然语言思考不能证明决策正确，也不能据此声称复现了具体 ReAct 实验。\u003c/p>\u003cp>典型Agent包含模型决策、状态/记忆、规划与工具执行；宿主负责真实调用、权限与结果回传。多Agent中的GraphRAG只是一种可调用检索能力，既不自动产生多角色协同，也不决定Agent控制流。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>展示自然语言思考并不能证明决策正确或复现具体 ReAct 实验。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>客服退款查询何时需要规划，何时只要工作流？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "固定工作流由代码定义分支和步骤，Agent 让模型根据观察动态决定行动；ReAct 通过推理与行动交错使用环境反馈，典型循环是决定下一步、工具执行、观察结果并更新任务状态。模型提出工具调用只是计划，宿主仍负责执行、权限控制与结果回传。\n\n是否采用 Agent 取决于步骤的不确定性及收益。能够稳定通过固定流程完成的任务通常更容易评测和维护，也可将确定步骤与有限自主探索混合，明确失败和停止条件。展示自然语言思考不能证明决策正确，也不能据此声称复现了具体 ReAct 实验。\n\n典型Agent包含模型决策、状态/记忆、规划与工具执行；宿主负责真实调用、权限与结果回传。多Agent中的GraphRAG只是一种可调用检索能力，既不自动产生多角色协同，也不决定Agent控制流。\n展示自然语言思考并不能证明决策正确或复现具体 ReAct 实验。\n客服退款查询何时需要规划，何时只要工作流？"}, {"id": "AGT-002", "category": "AGT", "topic": "工具调用与协议", "level": "L2", "title": "如何让 function calling 更可靠？", "tags": ["function calling", "schema"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>可靠 function calling 需要明确工具用途、参数 schema 与错误语义，并在执行端验证类型、权限和业务约束。清晰的工具名与描述、具体字段、枚举和必要约束能减少歧义，但合法 JSON 只是第一步，账号、时间或金额等参数仍可能在业务上无效。\u003c/p>\u003cp>流式参数需完整接收后再验证，不能执行尚未完成的片段。工具应返回简洁结构结果、稳定 ID 与可行动的错误，使用分页和字段投影控制大结果。工具选择、参数正确、操作成功及目标完成应分别判断，再将真实结果交给模型继续决策。\u003c/p>\u003cp>Function calling流程是向模型提供工具schema，模型选择工具并生成结构化参数，宿主校验权限/参数后执行，tool结果作为下一轮条件回传。模型学习调用来自示范或交互训练，而schema约束主要保证结构，不能保证参数语义、对象存在或操作授权。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>schema 合法不代表账号、时间、金额或权限在业务上有效。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>工具显示成功后，怎样验证实体状态确实改变？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "可靠 function calling 需要明确工具用途、参数 schema 与错误语义，并在执行端验证类型、权限和业务约束。清晰的工具名与描述、具体字段、枚举和必要约束能减少歧义，但合法 JSON 只是第一步，账号、时间或金额等参数仍可能在业务上无效。\n\n流式参数需完整接收后再验证，不能执行尚未完成的片段。工具应返回简洁结构结果、稳定 ID 与可行动的错误，使用分页和字段投影控制大结果。工具选择、参数正确、操作成功及目标完成应分别判断，再将真实结果交给模型继续决策。\n\nFunction calling流程是向模型提供工具schema，模型选择工具并生成结构化参数，宿主校验权限/参数后执行，tool结果作为下一轮条件回传。模型学习调用来自示范或交互训练，而schema约束主要保证结构，不能保证参数语义、对象存在或操作授权。\nschema 合法不代表账号、时间、金额或权限在业务上有效。\n工具显示成功后，怎样验证实体状态确实改变？"}, {"id": "AGT-003", "category": "AGT", "topic": "可靠性与评测", "level": "L2", "title": "Agent 工具超时、重试与幂等怎么设计？", "tags": ["retry", "idempotency"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>超时表示结果未知，写操作可能已经成功，客户端取消等待也不等于远端操作取消。应区分可重试和确定失败，使用同一业务意图的幂等键，结合操作日志回查、有限重试、退避与总预算，避免重复副作用。\u003c/p>\u003cp>重试保持同一请求 ID，服务端保存参数和结果，并检测同 ID 的参数变更。不能仅按参数哈希认定意图相同，因为用户可能确实要创建两个内容相同的对象。执行、幂等记录和结果状态需可靠协调；未知状态可查询或交由人工处理，不能只依赖模型“不要重复”的承诺。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>取消客户端等待不等于远端操作已取消。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>支付工具响应丢失时，为什么不能换新幂等键再试？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "超时表示结果未知，写操作可能已经成功，客户端取消等待也不等于远端操作取消。应区分可重试和确定失败，使用同一业务意图的幂等键，结合操作日志回查、有限重试、退避与总预算，避免重复副作用。\n\n重试保持同一请求 ID，服务端保存参数和结果，并检测同 ID 的参数变更。不能仅按参数哈希认定意图相同，因为用户可能确实要创建两个内容相同的对象。执行、幂等记录和结果状态需可靠协调；未知状态可查询或交由人工处理，不能只依赖模型“不要重复”的承诺。\n取消客户端等待不等于远端操作已取消。\n支付工具响应丢失时，为什么不能换新幂等键再试？"}, {"id": "AGT-004", "category": "AGT", "topic": "记忆与上下文", "level": "L2", "title": "短期记忆、长期记忆与 checkpoint 分别是什么？", "tags": ["memory", "checkpoint"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>短期记忆保存当前会话的任务上下文，长期记忆跨会话保存事实或偏好，checkpoint 保存执行状态以继续或恢复。Checkpoint 需包含任务进度、工具调用状态与待处理动作，不能只保存消息文本；持久化本身也不提供外部副作用的 exactly-once 保证。\u003c/p>\u003cp>三者均需明确范围、版本、权限与删除策略。长期记忆按用户或租户隔离，记录来源、更新时间和置信度，按相关性及当前任务需要注入，防止过期偏好压过当前指令。向量数据库保存聊天记录只是存储环节，不能等同于完整记忆系统。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>存储持久化不自动提供外部副作用的 exactly-once 保证。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>用户更正旧事实时如何更新已有记忆及缓存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "短期记忆保存当前会话的任务上下文，长期记忆跨会话保存事实或偏好，checkpoint 保存执行状态以继续或恢复。Checkpoint 需包含任务进度、工具调用状态与待处理动作，不能只保存消息文本；持久化本身也不提供外部副作用的 exactly-once 保证。\n\n三者均需明确范围、版本、权限与删除策略。长期记忆按用户或租户隔离，记录来源、更新时间和置信度，按相关性及当前任务需要注入，防止过期偏好压过当前指令。向量数据库保存聊天记录只是存储环节，不能等同于完整记忆系统。\n存储持久化不自动提供外部副作用的 exactly-once 保证。\n用户更正旧事实时如何更新已有记忆及缓存？"}, {"id": "AGT-005", "category": "AGT", "topic": "多 Agent 协同与训练", "level": "L3", "title": "多 Agent 的通信与共享状态如何设计？", "tags": ["multi-agent", "状态共享"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多 Agent 应先按任务依赖划分角色，再约定消息契约、状态所有权和完成条件。可以由协调者编排、共享状态或消息传递，但额外调用只有带来质量或并行收益才值得，多个相似模型投票也可能强化共同错误。\u003c/p>\u003cp>消息应包含任务 ID、输入、结果、证据与失败状态，便于审计。共享文件或状态需明确写入责任、版本或合并规则，处理并发冲突。限制扇出、深度和总 token，检测循环等待与重复任务，并由明确节点汇总、独立验证结果。\u003c/p>\u003cp>出现策略冲突或子Agent证据不足时，汇总节点应核对源文档、版本和目标约束，以验收条件裁决，不能把多数Agent意见当事实。共享状态需单写入责任或版本合并，独立分支用隔离checkpoint；通信协议、编排框架与GraphRAG分别解决互操作、控制流程与知识检索。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>多个相似模型投票不保证独立错误，可能强化同一错误。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两个 Agent 互相等待时怎样检测与打破死锁？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多 Agent 应先按任务依赖划分角色，再约定消息契约、状态所有权和完成条件。可以由协调者编排、共享状态或消息传递，但额外调用只有带来质量或并行收益才值得，多个相似模型投票也可能强化共同错误。\n\n消息应包含任务 ID、输入、结果、证据与失败状态，便于审计。共享文件或状态需明确写入责任、版本或合并规则，处理并发冲突。限制扇出、深度和总 token，检测循环等待与重复任务，并由明确节点汇总、独立验证结果。\n\n出现策略冲突或子Agent证据不足时，汇总节点应核对源文档、版本和目标约束，以验收条件裁决，不能把多数Agent意见当事实。共享状态需单写入责任或版本合并，独立分支用隔离checkpoint；通信协议、编排框架与GraphRAG分别解决互操作、控制流程与知识检索。\n多个相似模型投票不保证独立错误，可能强化同一错误。\n两个 Agent 互相等待时怎样检测与打破死锁？"}, {"id": "AGT-006", "category": "AGT", "topic": "工具调用与协议", "level": "L2", "title": "MCP 与模型 function calling 是什么关系？", "tags": ["MCP", "protocol"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Function calling 是模型表达结构化工具意图的方式，MCP 是宿主、客户端与服务器交换工具和上下文的协议，统一工具、资源等接口；模型厂商仍可能采用不同调用格式，宿主仍负责执行与授权。工具列表本身不授予业务访问权，权限边界需由宿主和服务器共同执行。\u003c/p>\u003cp>讨论实现应固定协议版本，因为请求、能力与生命周期机制会随修订变化。例如官方 2025-06-18 与 2026-07-28 架构在会话和请求机制上有差异，升级需按兼容版本测试，不能直接沿用旧握手流程。MCP 并非 Agent 的推理算法，也不天然保证工具安全可靠。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>MCP 不是 Agent 的推理算法，也不天然保证工具安全可靠。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>升级协议后，你会验证哪些能力与授权边界？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Function calling 是模型表达结构化工具意图的方式，MCP 是宿主、客户端与服务器交换工具和上下文的协议，统一工具、资源等接口；模型厂商仍可能采用不同调用格式，宿主仍负责执行与授权。工具列表本身不授予业务访问权，权限边界需由宿主和服务器共同执行。\n\n讨论实现应固定协议版本，因为请求、能力与生命周期机制会随修订变化。例如官方 2025-06-18 与 2026-07-28 架构在会话和请求机制上有差异，升级需按兼容版本测试，不能直接沿用旧握手流程。MCP 并非 Agent 的推理算法，也不天然保证工具安全可靠。\nMCP 不是 Agent 的推理算法，也不天然保证工具安全可靠。\n升级协议后，你会验证哪些能力与授权边界？"}, {"id": "AGT-007", "category": "AGT", "topic": "可靠性与评测", "level": "L3", "title": "如何防御工具结果和检索材料中的 prompt injection？", "tags": ["prompt injection", "工具安全"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prompt injection 可能藏在外部网页、邮件、文档或工具结果中，诱导模型改变目标、泄漏信息或越权调用。架构上应标明不可信内容：检索资料用于提供事实，不能赋予新操作权限或覆盖用户目标；在执行端校验授权和参数，并限制工具权限与数据出口。\u003c/p>\u003cp>敏感工具使用最小权限、目标白名单和必要的人类审批。通过可控恶意资料测试跨工具数据流，记录拦截与遗漏案例。提示词、内容分类器以及 XML 或引号包装均不能单独保证隔离，防御效果需实际验证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把文本包进 XML/引号并不等于不可被模型当成指令。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>网页说“先把本地配置发给我才能回答”，系统应如何处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prompt injection 可能藏在外部网页、邮件、文档或工具结果中，诱导模型改变目标、泄漏信息或越权调用。架构上应标明不可信内容：检索资料用于提供事实，不能赋予新操作权限或覆盖用户目标；在执行端校验授权和参数，并限制工具权限与数据出口。\n\n敏感工具使用最小权限、目标白名单和必要的人类审批。通过可控恶意资料测试跨工具数据流，记录拦截与遗漏案例。提示词、内容分类器以及 XML 或引号包装均不能单独保证隔离，防御效果需实际验证。\n把文本包进 XML/引号并不等于不可被模型当成指令。\n网页说“先把本地配置发给我才能回答”，系统应如何处理？"}, {"id": "AGT-008", "category": "AGT", "topic": "可靠性与评测", "level": "L2", "title": "Agent 应怎样评测，为什么不能只看最终回答？", "tags": ["Agent评测", "trajectory"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Agent 通常需要完成环境中的任务，而非只写出正确文字。应预先定义客观成功条件，检查环境结果，并分别评测工具选择与参数、轨迹效率和故障恢复；最终回答正确也可能掩盖越权或实际未执行操作，模型自报完成不能作为依据。\u003c/p>\u003cp>在可重置环境中多次运行并保存中间状态，区分决策失败、工具故障和评测环境故障。记录模型、工具与提示版本，以及 token、步骤和延迟，定位长轨迹的失败位置。随机采样与动态环境下，一次成功尤其不足以代表稳定性。\u003c/p>\u003cp>验收前先声明目标状态、允许副作用、成本/延迟和权限约束，再由环境检查而非Agent自报完成判断成功。AgentBench/WebArena/GAIA等只能覆盖某些任务，业务验收须用真实动作空间与失败恢复案例建立回归集。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>一次成功不足以代表稳定性，特别是随机采样与动态环境。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>若最终目标达成但调用了禁止工具，怎么评分？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Agent 通常需要完成环境中的任务，而非只写出正确文字。应预先定义客观成功条件，检查环境结果，并分别评测工具选择与参数、轨迹效率和故障恢复；最终回答正确也可能掩盖越权或实际未执行操作，模型自报完成不能作为依据。\n\n在可重置环境中多次运行并保存中间状态，区分决策失败、工具故障和评测环境故障。记录模型、工具与提示版本，以及 token、步骤和延迟，定位长轨迹的失败位置。随机采样与动态环境下，一次成功尤其不足以代表稳定性。\n\n验收前先声明目标状态、允许副作用、成本/延迟和权限约束，再由环境检查而非Agent自报完成判断成功。AgentBench/WebArena/GAIA等只能覆盖某些任务，业务验收须用真实动作空间与失败恢复案例建立回归集。\n一次成功不足以代表稳定性，特别是随机采样与动态环境。\n若最终目标达成但调用了禁止工具，怎么评分？"}, {"id": "AGT-009", "category": "AGT", "topic": "可靠性与评测", "level": "L2", "title": "如何防止 Agent 死循环和无效规划？", "tags": ["planning", "budget"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>防止死循环应把目标拆成可验证里程碑，向决策器提供状态摘要、最近工具结果和未完成子目标，明确停止条件，并限制总步骤、token、时间及重试次数。每步应带来新的环境证据，规划文本不能代替真实进展。\u003c/p>\u003cp>检测重复状态和同参数调用时需结合时间与状态变化，因为异步轮询也会重复请求。持续失败或证据不足时，应澄清、切换有限方案或终止。只有互不依赖的任务适合并行，依赖步骤必须等待前置结果；增加反思轮次或 Agent 数量也可能只是放大成本。\u003c/p>\u003cp>A2A委派需要继承根任务和父任务路径，检测同一目标在Agent之间来回转发；轮询已有Task与创建新委派要区分。规定最大深度、总调用与收口负责人，并把失败/取消状态明确传播，避免一个失败子任务触发无限递归恢复。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>增加反思轮次或 Agent 数量可能放大成本，而非解决循环。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何区分合法等待和重复调用卡死？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "防止死循环应把目标拆成可验证里程碑，向决策器提供状态摘要、最近工具结果和未完成子目标，明确停止条件，并限制总步骤、token、时间及重试次数。每步应带来新的环境证据，规划文本不能代替真实进展。\n\n检测重复状态和同参数调用时需结合时间与状态变化，因为异步轮询也会重复请求。持续失败或证据不足时，应澄清、切换有限方案或终止。只有互不依赖的任务适合并行，依赖步骤必须等待前置结果；增加反思轮次或 Agent 数量也可能只是放大成本。\n\nA2A委派需要继承根任务和父任务路径，检测同一目标在Agent之间来回转发；轮询已有Task与创建新委派要区分。规定最大深度、总调用与收口负责人，并把失败/取消状态明确传播，避免一个失败子任务触发无限递归恢复。\n增加反思轮次或 Agent 数量可能放大成本，而非解决循环。\n如何区分合法等待和重复调用卡死？"}, {"id": "AGT-010", "category": "AGT", "topic": "记忆与上下文", "level": "L2", "title": "上下文工程怎样降低长任务成本而保持信息？", "tags": ["context engineering", "compaction"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>上下文工程决定每次模型看到的指令、状态、证据和工具信息。保留目标、约束、关键事实及未决事项，压缩冗余工具输出，按需加载文档或工具；大日志和文件可保存为可检索对象，只回传必要字段、摘要与稳定引用。\u003c/p>\u003cp>摘要须能追溯原始记录，并保留失败原因、操作状态及用户更正，避免将推测写成事实。拆分子任务可减少相互污染，汇总时仍需保留跨任务依赖和关键证据。用长任务评测验证是否丢失信息，token 更少并不保证质量更高，过度摘要可能遗漏后续关键条件。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>token 少不必然质量高；过度摘要会丢掉后续关键条件。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>压缩后忘记某个约束，怎样定位并修复摘要策略？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "上下文工程决定每次模型看到的指令、状态、证据和工具信息。保留目标、约束、关键事实及未决事项，压缩冗余工具输出，按需加载文档或工具；大日志和文件可保存为可检索对象，只回传必要字段、摘要与稳定引用。\n\n摘要须能追溯原始记录，并保留失败原因、操作状态及用户更正，避免将推测写成事实。拆分子任务可减少相互污染，汇总时仍需保留跨任务依赖和关键证据。用长任务评测验证是否丢失信息，token 更少并不保证质量更高，过度摘要可能遗漏后续关键条件。\ntoken 少不必然质量高；过度摘要会丢掉后续关键条件。\n压缩后忘记某个约束，怎样定位并修复摘要策略？"}, {"id": "AGT-011", "category": "AGT", "topic": "提示、推理与规划", "level": "L2", "title": "CoT、Self-Consistency、ToT、GoT 与计划执行分别怎样提高推理和规划？", "tags": ["CoT", "Self-Consistency", "ToT", "GoT", "Planning"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CoT让模型生成中间步骤，原始few-shot做法在prompt里提供推理示例；zero-shot的“逐步思考”属于另一个提示变体。它可把复杂计算分成步骤，但生成的理由不保证忠实或正确，也没有实际执行环境动作。\u003c/p>\u003cp>Self-Consistency采样多条推理路径，对规范化后的最终答案聚合投票；它增加推理算力，没有改模型权重，相同模型的错误也可能相关。ToT把部分思路视为节点，提出候选、评价、搜索与回溯；GoT允许分支合并和迭代，表达比树更一般的依赖结构。这里的图是计算/思路结构，不能混为GraphRAG的知识图谱。\u003c/p>\u003cp>Plan-and-Execute先产生任务分解，再由执行器完成步骤，并按观察更新计划；ReAct更强调逐步决策与行动反馈。真实Agent规划须用环境状态验证里程碑，限制分支、深度、token与时间。比较方法应给相同总预算，否则更高成功率可能主要来自更多调用。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover accent=\"true\">\u003cmi>a\u003c/mi>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>argmax\u003c/mo>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>K\u003c/mi>\u003c/munderover>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmo>normalize\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>a\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>多数票不是事实核验；模型自评节点也不能替代执行结果。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>没有唯一短答案的开放任务，Self-Consistency怎样设计聚合？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CoT让模型生成中间步骤，原始few-shot做法在prompt里提供推理示例；zero-shot的“逐步思考”属于另一个提示变体。它可把复杂计算分成步骤，但生成的理由不保证忠实或正确，也没有实际执行环境动作。\n\nSelf-Consistency采样多条推理路径，对规范化后的最终答案聚合投票；它增加推理算力，没有改模型权重，相同模型的错误也可能相关。ToT把部分思路视为节点，提出候选、评价、搜索与回溯；GoT允许分支合并和迭代，表达比树更一般的依赖结构。这里的图是计算/思路结构，不能混为GraphRAG的知识图谱。\n\nPlan-and-Execute先产生任务分解，再由执行器完成步骤，并按观察更新计划；ReAct更强调逐步决策与行动反馈。真实Agent规划须用环境状态验证里程碑，限制分支、深度、token与时间。比较方法应给相同总预算，否则更高成功率可能主要来自更多调用。\n多数票不是事实核验；模型自评节点也不能替代执行结果。\n没有唯一短答案的开放任务，Self-Consistency怎样设计聚合？"}, {"id": "AGT-012", "category": "AGT", "topic": "多 Agent 协同与训练", "level": "L2", "title": "LangChain/LangGraph、LlamaIndex 与多 Agent 框架怎样选型？", "tags": ["LangGraph", "LangChain", "LlamaIndex", "Multi-Agent", "框架选型"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先明确数据接入、状态管理、工具编排、持久化、人类介入与可观测性需求，再比较框架。LangChain提供模型/工具等组件与Agent入口，LangGraph强调有状态图、checkpoint和可控执行；LlamaIndex围绕数据/索引/检索构建应用，同时也有Agent和workflow，不能说它只支持RAG。\u003c/p>\u003cp>多Agent框架还需检查角色/消息契约、委派与handoff、并发控制、共享状态写入、终止条件和测试能力。集中协调者便于控制预算与汇总，handoff适合角色切换，广播讨论容易增加token并放大共同错误；框架不自动解决任务拆分与证据核验。\u003c/p>\u003cp>用同一业务任务实现最小基线，测客观成功率、调用/成本、P95延迟、工具故障恢复、checkpoint可重放性与集成成本。固定版本并验证关键能力，选择只用库、工作流引擎或平台应取决于部署控制和团队能力，而非笼统比较哪个“更智能”。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>框架支持某功能不等于你的业务流程已具备正确权限、幂等与终止策略。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>什么时候自己写几十行状态机，比引入多Agent框架更合适？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先明确数据接入、状态管理、工具编排、持久化、人类介入与可观测性需求，再比较框架。LangChain提供模型/工具等组件与Agent入口，LangGraph强调有状态图、checkpoint和可控执行；LlamaIndex围绕数据/索引/检索构建应用，同时也有Agent和workflow，不能说它只支持RAG。\n\n多Agent框架还需检查角色/消息契约、委派与handoff、并发控制、共享状态写入、终止条件和测试能力。集中协调者便于控制预算与汇总，handoff适合角色切换，广播讨论容易增加token并放大共同错误；框架不自动解决任务拆分与证据核验。\n\n用同一业务任务实现最小基线，测客观成功率、调用/成本、P95延迟、工具故障恢复、checkpoint可重放性与集成成本。固定版本并验证关键能力，选择只用库、工作流引擎或平台应取决于部署控制和团队能力，而非笼统比较哪个“更智能”。\n框架支持某功能不等于你的业务流程已具备正确权限、幂等与终止策略。\n什么时候自己写几十行状态机，比引入多Agent框架更合适？"}, {"id": "AGT-013", "category": "AGT", "topic": "工具调用与协议", "level": "L2", "title": "A2A 与 MCP 有什么区别，A2A 通信怎样避免 Agent 递归对话？", "tags": ["A2A", "MCP", "任务协议", "循环检测"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>A2A用于不同系统中的Agent互操作，主要抽象包括AgentCard发现能力、Message/Part传递内容、Task跟踪执行状态以及Artifact返回成果。远端Agent可以隐藏内部推理和工具实现。MCP主要标准化客户端访问工具、资源和提示等能力，两者可以组合；A2A不是替代Agent内部编排的“智能框架”。\u003c/p>\u003cp>一次委派应携带明确目标、输入、期望成果和完成条件，宿主管理task/context、超时、取消与结果验证。发现AgentCard不等于已授权执行，也不证明声明的能力真实；需要身份验证、访问范围和输入输出校验。\u003c/p>\u003cp>协议本身不保证无循环。应用应传播根任务/父任务/委派路径，设深度、总调用和token预算，去重重复请求，检测相同目标来回委派，规定每条任务只有一个收口负责者。异步状态更新和等待要区别于重复新建任务，任务终止后不应因通知再触发同一委派。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>A2A最新/dev接口与旧版SDK可能不同，应固定协议版本；JSON消息互发并不自动等于实现A2A。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>A委派B，B又以同一目标委派A，怎样在宿主端检测？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "A2A用于不同系统中的Agent互操作，主要抽象包括AgentCard发现能力、Message/Part传递内容、Task跟踪执行状态以及Artifact返回成果。远端Agent可以隐藏内部推理和工具实现。MCP主要标准化客户端访问工具、资源和提示等能力，两者可以组合；A2A不是替代Agent内部编排的“智能框架”。\n\n一次委派应携带明确目标、输入、期望成果和完成条件，宿主管理task/context、超时、取消与结果验证。发现AgentCard不等于已授权执行，也不证明声明的能力真实；需要身份验证、访问范围和输入输出校验。\n\n协议本身不保证无循环。应用应传播根任务/父任务/委派路径，设深度、总调用和token预算，去重重复请求，检测相同目标来回委派，规定每条任务只有一个收口负责者。异步状态更新和等待要区别于重复新建任务，任务终止后不应因通知再触发同一委派。\nA2A最新/dev接口与旧版SDK可能不同，应固定协议版本；JSON消息互发并不自动等于实现A2A。\nA委派B，B又以同一目标委派A，怎样在宿主端检测？"}, {"id": "AGT-014", "category": "AGT", "topic": "多 Agent 协同与训练", "level": "L2", "title": "具身 Agent、VLA 与软件工具 Agent 有什么区别？", "tags": ["Embodied Agent", "VLA", "SayCan", "RT-2"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>具身Agent要把语言目标映射到传感器观测与实际动作，考虑空间、动力学、反馈延迟和安全约束。软件Agent也可能部分可观测、结果随机、操作不可逆，因此两者区别是观测与控制条件的侧重，不能粗分为“软件确定且安全，机器人不确定且危险”。\u003c/p>\u003cp>高层可用LLM规划离散技能，低层控制器负责高频闭环；例如SayCan结合语言任务相关性与技能可执行性，避免语言上合理却物理上做不到的动作。VLA路线将视觉、语言与动作建模到一起，RT-2将动作离散为token并结合机器人数据训练，但输出合法token并不代表动作可安全执行。\u003c/p>\u003cp>评测要检查任务成功、碰撞/约束违例、反馈与恢复、分布外环境和sim-to-real差距。感知错误、规划错误与控制误差应分层定位，部署需要动作边界、实时监控和可靠停止机制；不能只根据文字计划打分。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>自然语言计划正确不等于可达、可抓取或满足动力学约束。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一个“拿起杯子”目标失败，怎样区分视觉定位、技能选择和控制执行问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "具身Agent要把语言目标映射到传感器观测与实际动作，考虑空间、动力学、反馈延迟和安全约束。软件Agent也可能部分可观测、结果随机、操作不可逆，因此两者区别是观测与控制条件的侧重，不能粗分为“软件确定且安全，机器人不确定且危险”。\n\n高层可用LLM规划离散技能，低层控制器负责高频闭环；例如SayCan结合语言任务相关性与技能可执行性，避免语言上合理却物理上做不到的动作。VLA路线将视觉、语言与动作建模到一起，RT-2将动作离散为token并结合机器人数据训练，但输出合法token并不代表动作可安全执行。\n\n评测要检查任务成功、碰撞/约束违例、反馈与恢复、分布外环境和sim-to-real差距。感知错误、规划错误与控制误差应分层定位，部署需要动作边界、实时监控和可靠停止机制；不能只根据文字计划打分。\n自然语言计划正确不等于可达、可抓取或满足动力学约束。\n同一个“拿起杯子”目标失败，怎样区分视觉定位、技能选择和控制执行问题？"}, {"id": "AGT-015", "category": "AGT", "topic": "多 Agent 协同与训练", "level": "L2", "title": "怎样训练 Agent 的工具使用能力，SFT、轨迹偏好与在线 RL 数据如何组织？", "tags": ["Agent训练", "轨迹SFT", "Tool Use", "在线RL"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Agent训练样本是带状态和环境反馈的决策轨迹，至少包括用户目标、工具schema、assistant调用及参数、tool返回、后续决策和终止结果。SFT学习示范调用与恢复，只对应该训练的assistant位置计算loss；工具返回是条件信息，不能当成模型生成目标混训。示范不必公开隐藏思维链，可用任务状态、简要决策与行动作为可审计记录。\u003c/p>\u003cp>偏好数据应在相同目标与环境条件下比较轨迹或回答，考虑成功、越权、成本和恢复。在线RL让当前策略在可重置环境探索，以状态验收/测试结果给奖励，WebGPT是浏览操作示范与人类偏好训练的一个例子；最终文字说“已完成”不能作环境成功证据。\u003c/p>\u003cp>保留失败和恢复轨迹，验证工具调用可执行性，过滤无效/危险行为，按任务和环境划分训练评测避免泄漏。只收集成功终点而缺失中间观察，模型可能学会终点叙述却不会行动；不同工具版本和schema也须一致或明确迁移。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>工具返回内容不能直接赋予新权限，轨迹奖励也不能跳过执行端权限校验。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>Agent在新版本API上频繁填错参数，应改数据、schema还是约束解码？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Agent训练样本是带状态和环境反馈的决策轨迹，至少包括用户目标、工具schema、assistant调用及参数、tool返回、后续决策和终止结果。SFT学习示范调用与恢复，只对应该训练的assistant位置计算loss；工具返回是条件信息，不能当成模型生成目标混训。示范不必公开隐藏思维链，可用任务状态、简要决策与行动作为可审计记录。\n\n偏好数据应在相同目标与环境条件下比较轨迹或回答，考虑成功、越权、成本和恢复。在线RL让当前策略在可重置环境探索，以状态验收/测试结果给奖励，WebGPT是浏览操作示范与人类偏好训练的一个例子；最终文字说“已完成”不能作环境成功证据。\n\n保留失败和恢复轨迹，验证工具调用可执行性，过滤无效/危险行为，按任务和环境划分训练评测避免泄漏。只收集成功终点而缺失中间观察，模型可能学会终点叙述却不会行动；不同工具版本和schema也须一致或明确迁移。\n工具返回内容不能直接赋予新权限，轨迹奖励也不能跳过执行端权限校验。\nAgent在新版本API上频繁填错参数，应改数据、schema还是约束解码？"}, {"id": "AGT-016", "category": "AGT", "topic": "可靠性与评测", "level": "L3", "title": "多 Agent 策略冲突或子 Agent 检索错误，怎样隔离、验证和恢复？", "tags": ["Multi-Agent", "冲突", "故障隔离", "证据核验"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多Agent协作应把结果当成带证据与状态的候选，而非上游必然正确的事实。明确每个子任务的输入、允许写入范围、输出schema、验收条件和负责人；只由授权节点修改共享状态，涉及同一资源时使用版本检查、事务或串行执行。\u003c/p>\u003cp>例如检索Agent返回“合同已过期”，执行Agent要退款，另一个Agent判定合同有效：协调者应核对合同版本、时间和原文证据，不能以Agent数量投票决定业务事实。检索错误需要标注证据不足/失败，切换有限查询或独立核验；不要让缺证据结果被当成成功继续传播。\u003c/p>\u003cp>为子任务设隔离的context/checkpoint、超时和预算，保留最后可信状态，失败时重试该分支或回到依赖节点。不可逆副作用需幂等键和执行授权，补偿策略不一定能完全恢复。比较多Agent与单Agent基线，确认并行收益大于通信、核验与相关错误成本。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>共享更多对话不一定提高可靠性，反而可能扩散一次检索错误或prompt injection。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一子任务被重试两次，怎样确保退款只执行一次？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多Agent协作应把结果当成带证据与状态的候选，而非上游必然正确的事实。明确每个子任务的输入、允许写入范围、输出schema、验收条件和负责人；只由授权节点修改共享状态，涉及同一资源时使用版本检查、事务或串行执行。\n\n例如检索Agent返回“合同已过期”，执行Agent要退款，另一个Agent判定合同有效：协调者应核对合同版本、时间和原文证据，不能以Agent数量投票决定业务事实。检索错误需要标注证据不足/失败，切换有限查询或独立核验；不要让缺证据结果被当成成功继续传播。\n\n为子任务设隔离的context/checkpoint、超时和预算，保留最后可信状态，失败时重试该分支或回到依赖节点。不可逆副作用需幂等键和执行授权，补偿策略不一定能完全恢复。比较多Agent与单Agent基线，确认并行收益大于通信、核验与相关错误成本。\n共享更多对话不一定提高可靠性，反而可能扩散一次检索错误或prompt injection。\n同一子任务被重试两次，怎样确保退款只执行一次？"}, {"id": "EVA-001", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "如何避免训练数据污染评测集？", "tags": ["data contamination", "leakage"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>训练与测试的题目或答案重叠会夸大泛化能力，近重复、翻译和模型改写也可能造成污染。应按来源、实体、用户或时间划分数据，结合精确和语义去重，保留新鲜私有测试与版本；仅做 n-gram 去重不足以发现语义改写或答案泄漏。\u003c/p>\u003cp>调参验证集与最终测试集需分开，防止反复查看测试结果选方案。合成数据的生成提示也可能包含公开题，应追踪源问题和教师输出。训练语料未知时需说明检测边界：未检出重叠不证明无污染，只改几个词也不能将公开题视为新基准。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>检测不到重叠不等于证明无污染；不能只改几个词就称新基准。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>项目数据量小，按用户拆分后类别不平衡怎么处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "训练与测试的题目或答案重叠会夸大泛化能力，近重复、翻译和模型改写也可能造成污染。应按来源、实体、用户或时间划分数据，结合精确和语义去重，保留新鲜私有测试与版本；仅做 n-gram 去重不足以发现语义改写或答案泄漏。\n\n调参验证集与最终测试集需分开，防止反复查看测试结果选方案。合成数据的生成提示也可能包含公开题，应追踪源问题和教师输出。训练语料未知时需说明检测边界：未检出重叠不证明无污染，只改几个词也不能将公开题视为新基准。\n检测不到重叠不等于证明无污染；不能只改几个词就称新基准。\n项目数据量小，按用户拆分后类别不平衡怎么处理？"}, {"id": "EVA-002", "category": "EVA", "topic": "指标与统计检验", "level": "L1", "title": "怎样评价文本生成质量？BLEU/ROUGE、PPL与人工评测如何组合？", "tags": ["metrics", "BLEU", "ROUGE", "PPL", "TeacherForcing", "自由生成", "BlindPairwise", "PromptStrata", "Memorization"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>文本生成评测先按任务选择指标，再在固定生成协议下比较输出，结合独立分层问题、事实或执行核验与盲评。BLEU/ROUGE 反映参考文本重合，teacher-forced PPL 反映真实历史下的预测概率，两者均不足以代表自由生成质量。\u003c/p>\u003cp>有明确参考答案的任务可使用 EM/token F1，但需固定规范化、中文分词和别名处理。BLEU 原用于翻译，ROUGE 常用于摘要；报告具体变体、tokenizer、corpus/sentence 聚合及多参考处理。多参考能覆盖部分合理改写，词面重合仍不保证事实、逻辑或指令遵循，不能将任务内适用性外推为通用 LLM 质量。\u003c/p>\u003cp>Teacher-forced PPL 是有效目标 token 平均负对数似然的指数，用评测文本的真实历史 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 预测 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>；自由生成会将自己的输出纳入后续历史，两者条件分布不同。比较 PPL 须统一 tokenizer、数据、模板、loss mask 和上下文窗口/stride，不能直接跨分词粒度排名。低 PPL 不保证回答有用、事实正确或能从多轮错误中恢复。\u003c/p>\u003cp>建立未用于调参的 held-out prompt 集，按任务、领域、语言、难度、长度和风险分层，报告各层及按目标流量加权的结果。检查训练或调参材料的重复、近似改写与模板泄漏，加入新写问题和表述变体；背诵参考能抬高词面分数，但单个高分或低 PPL 不能证明污染或泛化，训练数据未知时需明确核验边界。\u003c/p>\u003cp>自由生成须固定并记录模型/checkpoint、system prompt、chat template、检索与工具条件、\u003ccode>temperature\u003c/code>、\u003ccode>top-p\u003c/code>、\u003ccode>top-k\u003c/code>、最大输出长度和停止规则，明确资源预算。随机采样使用多次 trial 并记录 seed，但 seed 不保证跨后端逐 bit 重现；必要时比较多个预先声明的解码协议，避免将解码变化当作模型能力变化。\u003c/p>\u003cp>人工评测以带锚点的 rubric 分别评价准确性、材料忠实性、完整性、指令遵循和可读性，隐藏模型身份、随机 A/B 顺序，允许平局、无法判定及分歧复核。事实任务核查证据，代码执行测试，LLM judge 校准位置与冗长偏差；报告样本量、一致性及按 prompt 统计的不确定度，不能用单个平均词面分数代替全部结论。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>PPL\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>exp\u003c/mi>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi>&#x1D4B1;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmi>&#x1D4B1;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>将BLEU/ROUGE或teacher-forced PPL当作所有开放生成任务的统一质量，或只看训练loss验证泛化。\u003c/li>\u003cli>一边改变prompt、检索、解码或输出预算一边比较模型，或把未查证的训练污染当成高分的唯一解释。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>两个模型PPL相近，但盲评偏好明显不同，应怎样分层定位原因？\u003c/li>\u003cli>如何区分正确改写导致低ROUGE、事实错误导致高ROUGE，以及对参考答案的背诵？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "文本生成评测先按任务选择指标，再在固定生成协议下比较输出，结合独立分层问题、事实或执行核验与盲评。BLEU/ROUGE 反映参考文本重合，teacher-forced PPL 反映真实历史下的预测概率，两者均不足以代表自由生成质量。\n\n有明确参考答案的任务可使用 EM/token F1，但需固定规范化、中文分词和别名处理。BLEU 原用于翻译，ROUGE 常用于摘要；报告具体变体、tokenizer、corpus/sentence 聚合及多参考处理。多参考能覆盖部分合理改写，词面重合仍不保证事实、逻辑或指令遵循，不能将任务内适用性外推为通用 LLM 质量。\n\nTeacher-forced PPL 是有效目标 token 平均负对数似然的指数，用评测文本的真实历史 $x_{\u003ct}$ 预测 $x_t$；自由生成会将自己的输出纳入后续历史，两者条件分布不同。比较 PPL 须统一 tokenizer、数据、模板、loss mask 和上下文窗口/stride，不能直接跨分词粒度排名。低 PPL 不保证回答有用、事实正确或能从多轮错误中恢复。\n\n建立未用于调参的 held-out prompt 集，按任务、领域、语言、难度、长度和风险分层，报告各层及按目标流量加权的结果。检查训练或调参材料的重复、近似改写与模板泄漏，加入新写问题和表述变体；背诵参考能抬高词面分数，但单个高分或低 PPL 不能证明污染或泛化，训练数据未知时需明确核验边界。\n\n自由生成须固定并记录模型/checkpoint、system prompt、chat template、检索与工具条件、`temperature`、`top-p`、`top-k`、最大输出长度和停止规则，明确资源预算。随机采样使用多次 trial 并记录 seed，但 seed 不保证跨后端逐 bit 重现；必要时比较多个预先声明的解码协议，避免将解码变化当作模型能力变化。\n\n人工评测以带锚点的 rubric 分别评价准确性、材料忠实性、完整性、指令遵循和可读性，隐藏模型身份、随机 A/B 顺序，允许平局、无法判定及分歧复核。事实任务核查证据，代码执行测试，LLM judge 校准位置与冗长偏差；报告样本量、一致性及按 prompt 统计的不确定度，不能用单个平均词面分数代替全部结论。\n将BLEU/ROUGE或teacher-forced PPL当作所有开放生成任务的统一质量，或只看训练loss验证泛化。\n一边改变prompt、检索、解码或输出预算一边比较模型，或把未查证的训练污染当成高分的唯一解释。\n两个模型PPL相近，但盲评偏好明显不同，应怎样分层定位原因？\n如何区分正确改写导致低ROUGE、事实错误导致高ROUGE，以及对参考答案的背诵？"}, {"id": "EVA-003", "category": "EVA", "topic": "幻觉与可信度", "level": "L2", "title": "LLM-as-a-Judge 有哪些偏差，如何校准？", "tags": ["LLM-as-Judge", "bias"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LLM-as-a-Judge 能降低开放回答评测成本，但会受候选位置、长度、提示和领域能力影响。应使用盲测 rubric、可核验参考与人工金标准，固定裁判模型和提示版本，并记录评分理由与证据；数学和代码优先使用参考或执行验证。\u003c/p>\u003cp>随机候选顺序、交换顺序做双向比较可缓解位置偏差，冗长回答仍应按内容质量评分。通过人工分层样本估计 judge 的召回、误报和领域差异，报告不确定样本与系统性误判。原论文的 self-enhancement 实验不足以证明所有裁判都必然偏爱自身回答。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>原论文 self-enhancement 实验不足以下确定结论，不能笼统声称所有裁判必偏爱自己。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>裁判和被评模型是同一家时，你如何检验风格偏差？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LLM-as-a-Judge 能降低开放回答评测成本，但会受候选位置、长度、提示和领域能力影响。应使用盲测 rubric、可核验参考与人工金标准，固定裁判模型和提示版本，并记录评分理由与证据；数学和代码优先使用参考或执行验证。\n\n随机候选顺序、交换顺序做双向比较可缓解位置偏差，冗长回答仍应按内容质量评分。通过人工分层样本估计 judge 的召回、误报和领域差异，报告不确定样本与系统性误判。原论文的 self-enhancement 实验不足以证明所有裁判都必然偏爱自身回答。\n原论文 self-enhancement 实验不足以下确定结论，不能笼统声称所有裁判必偏爱自己。\n裁判和被评模型是同一家时，你如何检验风格偏差？"}, {"id": "EVA-004", "category": "EVA", "topic": "指标与统计检验", "level": "L2", "title": "两个模型只差一个百分点，怎样判断提升可靠？", "tags": ["statistics", "bootstrap"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>一个百分点的差异是否可靠，需结合样本量和逐题配对差异，报告分数差的置信区间，必要时做配对检验或 bootstrap。比较同一测试题上的两个模型时，应共同重采样它们的结果，而非只比较两个独立均值；区间是否重叠也不能替代正确的差值检验。\u003c/p>\u003cp>重复题、同用户或同文档样本往往相关，应按用户或任务进行 cluster 级抽样。多次调参、不同随机种子及反复挑选最佳 seed 也会影响结论。统计显著不等于业务收益，需同时报告成本、延迟和关键分组退化。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>区间是否重叠不能替代正确的差值检验，反复挑最好 seed 也会偏高。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果总分升但关键安全分组下降，你会怎样验收？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "一个百分点的差异是否可靠，需结合样本量和逐题配对差异，报告分数差的置信区间，必要时做配对检验或 bootstrap。比较同一测试题上的两个模型时，应共同重采样它们的结果，而非只比较两个独立均值；区间是否重叠也不能替代正确的差值检验。\n\n重复题、同用户或同文档样本往往相关，应按用户或任务进行 cluster 级抽样。多次调参、不同随机种子及反复挑选最佳 seed 也会影响结论。统计显著不等于业务收益，需同时报告成本、延迟和关键分组退化。\n区间是否重叠不能替代正确的差值检验，反复挑最好 seed 也会偏高。\n如果总分升但关键安全分组下降，你会怎样验收？"}, {"id": "EVA-005", "category": "EVA", "topic": "指标与统计检验", "level": "L2", "title": "如何设计人工评测，降低标注分歧？", "tags": ["human eval", "rubric"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>人工评测应为准确性、完整性、证据和可读性等维度制定 rubric 与锚点样例，隐藏模型身份并随机展示顺序。先小规模试标、修订含糊规则，再独立多标注与分歧仲裁；保留平局和无法判断，避免把个人偏好当作统一真值。\u003c/p>\u003cp>分层抽样应覆盖普通和困难案例，说明样本构成、抽样权重、一致性与不确定度。事实正确性需要可信材料支持，并与偏好评价分开。专家不足时限制领域结论；只挑成功或中等分样本会改变目标分布，不能只报告一个总胜率。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只挑中等分样本或成功案例会改变目标分布，须说明抽样与权重。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>专家与普通用户偏好相反时如何制定业务 rubric？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "人工评测应为准确性、完整性、证据和可读性等维度制定 rubric 与锚点样例，隐藏模型身份并随机展示顺序。先小规模试标、修订含糊规则，再独立多标注与分歧仲裁；保留平局和无法判断，避免把个人偏好当作统一真值。\n\n分层抽样应覆盖普通和困难案例，说明样本构成、抽样权重、一致性与不确定度。事实正确性需要可信材料支持，并与偏好评价分开。专家不足时限制领域结论；只挑成功或中等分样本会改变目标分布，不能只报告一个总胜率。\n只挑中等分样本或成功案例会改变目标分布，须说明抽样与权重。\n专家与普通用户偏好相反时如何制定业务 rubric？"}, {"id": "EVA-006", "category": "EVA", "topic": "幻觉与可信度", "level": "L2", "title": "如何区分事实幻觉与上下文不忠实，怎样检测和缓解？", "tags": ["hallucination", "faithfulness", "SelfCheckGPT", "事实核心采样"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>事实幻觉指陈述缺乏事实支持或错误，上下文不忠实指输出与给定材料矛盾或超出其依据。先明确证据范围，再分解实体、数字、关系和引用逐项核验：正确外部事实也可能超出任务限定材料，忠于错误材料的答案也未必真实。\u003c/p>\u003cp>区分 unsupported、contradicted、不可验证和过期等情况，避免粗略归为同一种错误。使用可靠来源复核真实业务案例，覆盖缺证据、误导前提和冲突文档，并用专门数据集做回归。幻觉识别能力不等于生成时从不幻觉，局部基准、低温或更大参数也不提供事实正确性保证。\u003c/p>\u003cp>SelfCheckGPT 对同一问题多次随机采样，再用语义相似度、问答、NLI 或模型判别比较待测句子与各样本的一致性，得到幻觉风险分数，适用于只有文本输出的黑盒模型。多次回答可能稳定重复同一个错误，因此一致性只是检测信号，不能替代外部事实核验；还需考虑采样次数、成本和不同采样设置。\u003c/p>\u003cp>事实核心采样（factual-nucleus sampling）是在生成一句话时逐步降低 top-p 阈值，设衰减下限，并在新句开始时重置，以减少句子后半段的随机性，平衡事实性、多样性与复读。它改变解码候选集合，不会查询事实或修复错误知识；论文中的收益需在目标任务上重新验证。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>常见基准只覆盖部分类型，低温或更大参数不保证事实正确。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何评价模型纠正了资料中的错误，但没有解释证据冲突？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "事实幻觉指陈述缺乏事实支持或错误，上下文不忠实指输出与给定材料矛盾或超出其依据。先明确证据范围，再分解实体、数字、关系和引用逐项核验：正确外部事实也可能超出任务限定材料，忠于错误材料的答案也未必真实。\n\n区分 unsupported、contradicted、不可验证和过期等情况，避免粗略归为同一种错误。使用可靠来源复核真实业务案例，覆盖缺证据、误导前提和冲突文档，并用专门数据集做回归。幻觉识别能力不等于生成时从不幻觉，局部基准、低温或更大参数也不提供事实正确性保证。\n\nSelfCheckGPT 对同一问题多次随机采样，再用语义相似度、问答、NLI 或模型判别比较待测句子与各样本的一致性，得到幻觉风险分数，适用于只有文本输出的黑盒模型。多次回答可能稳定重复同一个错误，因此一致性只是检测信号，不能替代外部事实核验；还需考虑采样次数、成本和不同采样设置。\n\n事实核心采样（factual-nucleus sampling）是在生成一句话时逐步降低 top-p 阈值，设衰减下限，并在新句开始时重置，以减少句子后半段的随机性，平衡事实性、多样性与复读。它改变解码候选集合，不会查询事实或修复错误知识；论文中的收益需在目标任务上重新验证。\n常见基准只覆盖部分类型，低温或更大参数不保证事实正确。\n如何评价模型纠正了资料中的错误，但没有解释证据冲突？"}, {"id": "EVA-007", "category": "EVA", "topic": "幻觉与可信度", "level": "L3", "title": "模型自报置信度可靠吗，怎样设计拒答阈值？", "tags": ["calibration", "abstention"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>模型声称“九成把握”不天然对应九成正确率，表达不确定也可能只是模板行为。Token 概率、答案语义置信和事实可信是不同对象，应明确置信信号，再结合验证集与正确性标签进行校准。\u003c/p>\u003cp>按风险选择拒答阈值，画覆盖率—错误率曲线，同时评估未答率、错答成本和正确率；拒答减少错误，也降低服务覆盖。检索证据、自检和多样采样可以提供信号，但有效性需实测。新领域或分布变化后重新验证，不能只看平均准确率。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>模型声称不确定也可能是模板行为，不代表具备准确的自我知识。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>对高风险和低风险问题为什么应使用不同阈值？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "模型声称“九成把握”不天然对应九成正确率，表达不确定也可能只是模板行为。Token 概率、答案语义置信和事实可信是不同对象，应明确置信信号，再结合验证集与正确性标签进行校准。\n\n按风险选择拒答阈值，画覆盖率—错误率曲线，同时评估未答率、错答成本和正确率；拒答减少错误，也降低服务覆盖。检索证据、自检和多样采样可以提供信号，但有效性需实测。新领域或分布变化后重新验证，不能只看平均准确率。\n模型声称不确定也可能是模板行为，不代表具备准确的自我知识。\n对高风险和低风险问题为什么应使用不同阈值？"}, {"id": "EVA-008", "category": "EVA", "topic": "安全与鲁棒性", "level": "L2", "title": "安全评测如何兼顾越狱成功率与过度拒答？", "tags": ["safety", "jailbreak", "over-refusal"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>安全评测既检查恶意请求及攻击改写下的违规，也检查语义相近的正常问题是否被误拒。使用恶意与合法边界相近的成对样本，区分语义判断和关键词拦截；按风险类别、语言、轮次和工具环境分层，固定攻击预算与判定标准，联合报告攻击成功率、误拒率和不确定样本。\u003c/p>\u003cp>成功需核验实际内容或行动，不能只统计敏感词。单轮文本测试不能覆盖多轮诱导、图像输入或工具副作用；零次成功也只代表当前测试集和预算下的结果，不能证明不存在漏洞。优化礼貌拒答模板还需验证实际泄露或违规是否下降。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>零次成功只是当前测试集与预算结果，不能证明不存在漏洞。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>拒绝表达更礼貌了，但泄露率没下降，如何判断改进？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "安全评测既检查恶意请求及攻击改写下的违规，也检查语义相近的正常问题是否被误拒。使用恶意与合法边界相近的成对样本，区分语义判断和关键词拦截；按风险类别、语言、轮次和工具环境分层，固定攻击预算与判定标准，联合报告攻击成功率、误拒率和不确定样本。\n\n成功需核验实际内容或行动，不能只统计敏感词。单轮文本测试不能覆盖多轮诱导、图像输入或工具副作用；零次成功也只代表当前测试集和预算下的结果，不能证明不存在漏洞。优化礼貌拒答模板还需验证实际泄露或违规是否下降。\n零次成功只是当前测试集与预算结果，不能证明不存在漏洞。\n拒绝表达更礼貌了，但泄露率没下降，如何判断改进？"}, {"id": "EVA-009", "category": "EVA", "topic": "安全与鲁棒性", "level": "L3", "title": "如何构建红队测试而不只刷固定攻击集？", "tags": ["red teaming", "coverage"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>红队先定义资产与威胁模型，再设计人工、规则及模型生成的多样攻击，明确成功条件并记录复现轨迹。覆盖直接请求、间接资料、跨轮组合和工具权限边界；模型可生成候选攻击，自动裁判仍需人工抽检，防止伪成功。\u003c/p>\u003cp>将新失败类别加入持续回归，同时留出未见攻击验证，避免系统只适应公开模板。相同目标下比较攻击预算、成功率、覆盖度与可复现性，并独立评估攻击和防御模型。发现问题不等于全面量化风险，应明确未测领域。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>红队发现问题不等于全面量化风险，未测领域要明确列出。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何避免同一失败模板大量重复导致覆盖率虚高？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "红队先定义资产与威胁模型，再设计人工、规则及模型生成的多样攻击，明确成功条件并记录复现轨迹。覆盖直接请求、间接资料、跨轮组合和工具权限边界；模型可生成候选攻击，自动裁判仍需人工抽检，防止伪成功。\n\n将新失败类别加入持续回归，同时留出未见攻击验证，避免系统只适应公开模板。相同目标下比较攻击预算、成功率、覆盖度与可复现性，并独立评估攻击和防御模型。发现问题不等于全面量化风险，应明确未测领域。\n红队发现问题不等于全面量化风险，未测领域要明确列出。\n如何避免同一失败模板大量重复导致覆盖率虚高？"}, {"id": "EVA-010", "category": "EVA", "topic": "安全与鲁棒性", "level": "L2", "title": "训练数据泄露与 RAG 越权泄露如何区分？", "tags": ["privacy", "memorization"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>训练数据泄露来自参数化记忆被查询诱导重现，RAG 越权泄露则来自检索、缓存或工具授权把无权访问的资料交给模型。前者需要数据最小化、去重和泄露测试等防护，后者必须在访问层隔离，不能用同一个拒答 prompt 解决。\u003c/p>\u003cp>归因需排查输入与工具路径；未接入某资料仍复现，可能来自记忆，也可能来自其他上游输入，输出个人信息不自动证明训练泄漏。测试使用可控 canary 和访问矩阵，避免扩散真实敏感信息。删除索引不等于删除参数记忆，两类生命周期应分别追踪。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>输出里有个人信息不自动证明来自训练语料，须排查输入和工具路径。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>企业要求撤回某用户数据时，哪些层需要分别处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "训练数据泄露来自参数化记忆被查询诱导重现，RAG 越权泄露则来自检索、缓存或工具授权把无权访问的资料交给模型。前者需要数据最小化、去重和泄露测试等防护，后者必须在访问层隔离，不能用同一个拒答 prompt 解决。\n\n归因需排查输入与工具路径；未接入某资料仍复现，可能来自记忆，也可能来自其他上游输入，输出个人信息不自动证明训练泄漏。测试使用可控 canary 和访问矩阵，避免扩散真实敏感信息。删除索引不等于删除参数记忆，两类生命周期应分别追踪。\n输出里有个人信息不自动证明来自训练语料，须排查输入和工具路径。\n企业要求撤回某用户数据时，哪些层需要分别处理？"}, {"id": "EVA-011", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "MLLM 评测如何区分感知、OCR 与推理错误？", "tags": ["multimodal eval", "MMMU"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>MLLM 答错可能源于 OCR、对象定位、图表感知、跨模态关系或推理。应按图像类型及能力拆分样本，分别报告 OCR、计数、空间关系、图表和专业多学科推理表现，并固定分辨率、图片数及答案解析规则。\u003c/p>\u003cp>通过原图、裁剪和人工文本转写等消融定位瓶颈；text-only 与真实图像输入的比较，可检查语言先验猜测。替换或打乱图像后答案不变，可能提示视觉依赖不足，但需排除多答案歧义。单一综合榜单不能覆盖视频、定位或高分辨率读图的全部能力。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>一个综合榜单不能代表视频、定位或高分辨率读图的全部能力。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>原图错、人工 OCR 文本对时，应优先改哪一环？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "MLLM 答错可能源于 OCR、对象定位、图表感知、跨模态关系或推理。应按图像类型及能力拆分样本，分别报告 OCR、计数、空间关系、图表和专业多学科推理表现，并固定分辨率、图片数及答案解析规则。\n\n通过原图、裁剪和人工文本转写等消融定位瓶颈；text-only 与真实图像输入的比较，可检查语言先验猜测。替换或打乱图像后答案不变，可能提示视觉依赖不足，但需排除多答案歧义。单一综合榜单不能覆盖视频、定位或高分辨率读图的全部能力。\n一个综合榜单不能代表视频、定位或高分辨率读图的全部能力。\n原图错、人工 OCR 文本对时，应优先改哪一环？"}, {"id": "EVA-012", "category": "EVA", "topic": "安全与鲁棒性", "level": "L2", "title": "怎样评估 prompt 扰动、多语言和分布外鲁棒性？", "tags": ["robustness", "OOD"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>鲁棒性评测应分别考察语言、领域、长度和输入表达变化，构造语义等价改写、拼写噪声与格式变化。等价扰动用于测一致性，事实改变的对照用于测模型是否随证据正确更新；真正更难或语义改变的任务需单列，不能当作纯扰动，并人工确认变换后的标签。\u003c/p>\u003cp>先统一同一任务的 prompt 和解码，再测试多模板敏感性，按组报告性能与成本。总体均值不能掩盖少数语言、长尾实体或长上下文退化，还需检查 parser、检索和安全策略是否引入了非模型问题。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>语义变了的样本不是纯鲁棒性测试，需人工确认变换标签。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>翻译后性能下降如何区分知识缺失、检索和 tokenizer 问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "鲁棒性评测应分别考察语言、领域、长度和输入表达变化，构造语义等价改写、拼写噪声与格式变化。等价扰动用于测一致性，事实改变的对照用于测模型是否随证据正确更新；真正更难或语义改变的任务需单列，不能当作纯扰动，并人工确认变换后的标签。\n\n先统一同一任务的 prompt 和解码，再测试多模板敏感性，按组报告性能与成本。总体均值不能掩盖少数语言、长尾实体或长上下文退化，还需检查 parser、检索和安全策略是否引入了非模型问题。\n语义变了的样本不是纯鲁棒性测试，需人工确认变换标签。\n翻译后性能下降如何区分知识缺失、检索和 tokenizer 问题？"}, {"id": "EVA-013", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "如何验证 prompt 优化确实有效？", "tags": ["prompt eval", "instruction following"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prompt 优化应作为有验证集的实验：定义可观察目标，固定模型和解码，每次改变明确因素，在留出样本上比较，不能凭单个演示变好断言泛化。格式、长度和关键词可规则检测，事实或语义质量需其他验证。\u003c/p>\u003cp>JSON 合法性、指定字段及字数等可执行约束使用稳定 parser；任务成功与单项指令遵循分别统计，多个约束全部满足才计为整题通过。版本化模板与 few-shot 样例，防止样例和测试内容重叠。更多约束可能相互冲突，降低 temperature 也不必然缩短输出。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>prompt 中加入更多约束可能互相冲突，temperature 降低不必缩短输出。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同 prompt 训练集涨分、留出集退化时如何处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prompt 优化应作为有验证集的实验：定义可观察目标，固定模型和解码，每次改变明确因素，在留出样本上比较，不能凭单个演示变好断言泛化。格式、长度和关键词可规则检测，事实或语义质量需其他验证。\n\nJSON 合法性、指定字段及字数等可执行约束使用稳定 parser；任务成功与单项指令遵循分别统计，多个约束全部满足才计为整题通过。版本化模板与 few-shot 样例，防止样例和测试内容重叠。更多约束可能相互冲突，降低 temperature 也不必然缩短输出。\nprompt 中加入更多约束可能互相冲突，temperature 降低不必缩短输出。\n同 prompt 训练集涨分、留出集退化时如何处理？"}, {"id": "EVA-014", "category": "EVA", "topic": "指标与统计检验", "level": "L3", "title": "代码生成的 pass@k 是什么，如何避免错误估计？", "tags": ["pass@k", "code eval"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Pass@k 衡量每题采样 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math> 个候选至少一个通过测试的概率，再对任务取平均。生成 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003
