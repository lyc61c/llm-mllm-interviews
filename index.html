cmi>n\u003c/mi>\u003cmo>&#x02265;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math> 个候选，其中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/math> 个通过时，可使用组合数估计；若 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>，估计值为 1，实际计算可用稳定乘积避免大组合数溢出。\u003c/p>\u003cp>标准无偏估计解释以每题固定生成分布、独立采样为前提，不能直接把经验 pass@1 代入 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math> 当作无偏估计。自适应搜索、去重或依赖先前测试结果生成候选时，需另行定义评测。\u003c/p>\u003cp>通过条件是可执行功能测试，BLEU 不能衡量等价代码的正确性。比较须固定采样与测试预算，并记录覆盖、超时、沙箱和依赖版本。Oracle pass@k 也不等于用户实际得到正确答案的概率，部署仍需选择或验证候选。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmover>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">@\u003c/mi>\u003c/mrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003cmo>&#x0005E;\u003c/mo>\u003c/mover>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;\u003c/mo>\u003cmfrac linethickness=\"0\">\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>c\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00028;\u003c/mo>\u003cmfrac linethickness=\"0\">\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo minsize=\"2.047em\" maxsize=\"2.047em\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>n\u003c/mi>\u003cmo>&#x02265;\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>oracle pass@k 不等于用户拿到正确答案的概率，部署仍需要选择/验证候选。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么提高温度可能提升 pass@100 却降低 pass@1？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Pass@k 衡量每题采样 $k$ 个候选至少一个通过测试的概率，再对任务取平均。生成 $n\\geq k$ 个候选，其中 $c$ 个通过时，可使用组合数估计；若 $n-c\u003ck$，估计值为 1，实际计算可用稳定乘积避免大组合数溢出。\n\n标准无偏估计解释以每题固定生成分布、独立采样为前提，不能直接把经验 pass@1 代入 $1-(1-p)^k$ 当作无偏估计。自适应搜索、去重或依赖先前测试结果生成候选时，需另行定义评测。\n\n通过条件是可执行功能测试，BLEU 不能衡量等价代码的正确性。比较须固定采样与测试预算，并记录覆盖、超时、沙箱和依赖版本。Oracle pass@k 也不等于用户实际得到正确答案的概率，部署仍需选择或验证候选。\noracle pass@k 不等于用户拿到正确答案的概率，部署仍需要选择/验证候选。\n为什么提高温度可能提升 pass@100 却降低 pass@1？"}, {"id": "EVA-015", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "线上如何监控、验收并回归 LLM/Agent 系统？", "tags": ["observability", "regression"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>离线通过后，线上仍需观测任务成功、拒答、工具错误、事实反馈、时延与成本。保存可复现版本和 trace，记录请求、检索、工具及结果；敏感字段应最小化记录并控制访问。点击率受曝光、用户群及界面变化影响，不能直接当作答案正确率。\u003c/p>\u003cp>按风险和流量分层抽检，将新失败案例加入回归，同时保留独立验收集。重复 trial 检查随机性，故障注入验证限流、断线和恢复。发布前后同口径比较能力、合规边界及效率，并设置退化回滚条件，避免平均分掩盖新增问题。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把线上点击率当答案正确率会受曝光、用户群与界面变化混杂。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>线上成本骤增但准确率没变，应怎样定位？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "离线通过后，线上仍需观测任务成功、拒答、工具错误、事实反馈、时延与成本。保存可复现版本和 trace，记录请求、检索、工具及结果；敏感字段应最小化记录并控制访问。点击率受曝光、用户群及界面变化影响，不能直接当作答案正确率。\n\n按风险和流量分层抽检，将新失败案例加入回归，同时保留独立验收集。重复 trial 检查随机性，故障注入验证限流、断线和恢复。发布前后同口径比较能力、合规边界及效率，并设置退化回滚条件，避免平均分掩盖新增问题。\n把线上点击率当答案正确率会受曝光、用户群与界面变化混杂。\n线上成本骤增但准确率没变，应怎样定位？"}, {"id": "EVA-016", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "MMLU、BIG-bench/BBH、GSM8K 与 HumanEval 分别测什么，怎样读榜单？", "tags": ["MMLU", "BBH", "GSM8K", "HumanEval", "Benchmark"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>基准反映特定数据和协议下的任务能力。MMLU是57学科的选择题，偏向知识与学科问题解决；BIG-bench覆盖多种任务，BBH是其中较困难的一组任务，不能把两者分数混作同一指标。GSM8K偏数学应用题，需按规则提取最终答案；HumanEval用函数编程题与测试评估代码功能，pass@k还依赖采样次数及解码设置。\u003c/p>\u003cp>选择题可比较选项log-likelihood，也可让模型生成答案，但prompt、选项顺序、few-shot例子和评分协议不同会改变结果。推理任务还应报告回答/测试时算力预算，不能把更长思考或更多采样的收益全归于参数规模。\u003c/p>\u003cp>榜单需要核对模型版本、模板、数据split、生成设置、污染与题目重复。综合平均会掩盖业务短板，高分也不意味着长上下文、事实拒答、工具执行或多语言都强。用这些基准定位候选，再以独立业务集和分层错误分析验收。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>排行榜同名基准不一定用了相同few-shot、CoT、答案解析与采样预算。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>选择题log-likelihood分高，生成式回答却经常不遵守格式，应如何评价？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "基准反映特定数据和协议下的任务能力。MMLU是57学科的选择题，偏向知识与学科问题解决；BIG-bench覆盖多种任务，BBH是其中较困难的一组任务，不能把两者分数混作同一指标。GSM8K偏数学应用题，需按规则提取最终答案；HumanEval用函数编程题与测试评估代码功能，pass@k还依赖采样次数及解码设置。\n\n选择题可比较选项log-likelihood，也可让模型生成答案，但prompt、选项顺序、few-shot例子和评分协议不同会改变结果。推理任务还应报告回答/测试时算力预算，不能把更长思考或更多采样的收益全归于参数规模。\n\n榜单需要核对模型版本、模板、数据split、生成设置、污染与题目重复。综合平均会掩盖业务短板，高分也不意味着长上下文、事实拒答、工具执行或多语言都强。用这些基准定位候选，再以独立业务集和分层错误分析验收。\n排行榜同名基准不一定用了相同few-shot、CoT、答案解析与采样预算。\n选择题log-likelihood分高，生成式回答却经常不遵守格式，应如何评价？"}, {"id": "EVA-017", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "AgentBench、WebArena、GAIA、SWE-bench 与 τ-bench 怎样评价 Agent？", "tags": ["AgentBench", "WebArena", "GAIA", "SWE-bench", "tau-bench", "Benchmark"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Agent基准提供任务、交互环境和验收规则，关注实际完成而非模型自报成功。AgentBench涵盖多个环境的推理决策；WebArena在可复现网站任务中检验网页操作与状态达成；GAIA的问题常需组合检索、文件/多模态和工具；SWE-bench让模型修复真实代码仓库问题并执行测试；τ-bench关注工具、模拟用户与领域政策的交互。\u003c/p>\u003cp>环境状态型验收、最终答案匹配和代码测试不是同一种评分。任务初态、网络/工具版本、权限与budget必须固定，动态网络或模拟用户随机性也需记录，不能说所有基准都完全离线或绝对确定。环境失败应与Agent决策失败分开。\u003c/p>\u003cp>报告任务成功率、重复运行稳定性、调用/成本、延迟、越权和恢复表现。代码测试通过可能不覆盖全部业务行为；单次成功可能来自幸运采样。对于真实产品，应选与你的动作空间和失败代价一致的任务，而非用一个榜单代表Agent通用水平。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>文档检索问答基准的答案正确率不能替代网页/代码Agent的环境状态验收。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一Agent多次运行时成功率差异大，怎样设计重复试验和置信区间？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Agent基准提供任务、交互环境和验收规则，关注实际完成而非模型自报成功。AgentBench涵盖多个环境的推理决策；WebArena在可复现网站任务中检验网页操作与状态达成；GAIA的问题常需组合检索、文件/多模态和工具；SWE-bench让模型修复真实代码仓库问题并执行测试；τ-bench关注工具、模拟用户与领域政策的交互。\n\n环境状态型验收、最终答案匹配和代码测试不是同一种评分。任务初态、网络/工具版本、权限与budget必须固定，动态网络或模拟用户随机性也需记录，不能说所有基准都完全离线或绝对确定。环境失败应与Agent决策失败分开。\n\n报告任务成功率、重复运行稳定性、调用/成本、延迟、越权和恢复表现。代码测试通过可能不覆盖全部业务行为；单次成功可能来自幸运采样。对于真实产品，应选与你的动作空间和失败代价一致的任务，而非用一个榜单代表Agent通用水平。\n文档检索问答基准的答案正确率不能替代网页/代码Agent的环境状态验收。\n同一Agent多次运行时成功率差异大，怎样设计重复试验和置信区间？"}, {"id": "EVA-018", "category": "EVA", "topic": "评测协议与基准", "level": "L2", "title": "怎样使用评测框架建立可复现的 LLM、RAG 与 Agent 验收？", "tags": ["Evaluation Harness", "可复现评测", "协议", "验收"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>评测框架负责加载任务、调用模型、解析输出与汇总指标，不替代任务定义。LM Evaluation Harness把标准任务与模型后端分离，适合控制few-shot、log-likelihood/生成协议和答案过滤；RAG/Agent还需要证据、工具轨迹及环境结果验证，不能仅复用文本匹配分数。\u003c/p>\u003cp>固定任务定义/数据版本、模型checkpoint、tokenizer/template、生成预算与停止规则，保存原始输出及评分中间结果。明确每个指标的分母、失败/超时处理与任务权重，按语言、难度、长度等分层；将实验开发集与最终验收集分开。\u003c/p>\u003cp>新增模型或prompt先跑小批次确认输入与答案解析，再运行冻结回归集。重跑随机任务以估计不确定度，并抽查评分器与人工结果的一致性。对RAG记录所用证据版本，对Agent重置初态并校验副作用；最后核对业务阈值、成本与延迟，而非只保存一个平均分。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>评测脚本运行成功不代表协议一致，模型输出解析错误可造成虚假零分或高分。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>框架升级后同一checkpoint分数改变，应优先比对哪些原始结果？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "评测框架负责加载任务、调用模型、解析输出与汇总指标，不替代任务定义。LM Evaluation Harness把标准任务与模型后端分离，适合控制few-shot、log-likelihood/生成协议和答案过滤；RAG/Agent还需要证据、工具轨迹及环境结果验证，不能仅复用文本匹配分数。\n\n固定任务定义/数据版本、模型checkpoint、tokenizer/template、生成预算与停止规则，保存原始输出及评分中间结果。明确每个指标的分母、失败/超时处理与任务权重，按语言、难度、长度等分层；将实验开发集与最终验收集分开。\n\n新增模型或prompt先跑小批次确认输入与答案解析，再运行冻结回归集。重跑随机任务以估计不确定度，并抽查评分器与人工结果的一致性。对RAG记录所用证据版本，对Agent重置初态并校验副作用；最后核对业务阈值、成本与延迟，而非只保存一个平均分。\n评测脚本运行成功不代表协议一致，模型输出解析错误可造成虚假零分或高分。\n框架升级后同一checkpoint分数改变，应优先比对哪些原始结果？"}, {"id": "VLM-001", "category": "VLM", "topic": "图文表示与预训练", "level": "L1", "title": "CLIP 的结构和双向对比损失是什么？", "tags": ["CLIP", "对比学习"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CLIP 使用图像、文本双编码器，将图文映射到同一表示空间，再用归一化特征的相似度区分匹配图文对。一个 batch 中，同一索引的图文对通常是正例，其他配对是负例；图到文和文到图分别做分类，两个交叉熵损失取平均。它学习跨模态匹配表征，并非直接训练文本生成器。\u003c/p>\u003cp>若图像、文本单位向量为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，相似度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmi>v\u003c/mi>\u003cmi>i\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003C4;\u003c/mi>\u003c/mrow>\u003c/math>。温度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003C4;\u003c/mi>\u003c/mrow>\u003c/math> 控制 softmax 的尖锐程度，原始实现使用可训练的对数尺度。实际图文数据可能含同义描述，此时 batch 内其他配对也可能相关，形成假负例。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsubsup>\u003cmi>v\u003c/mi>\u003cmi>i\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>&#x003C4;\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmo fence=\"false\" stretchy=\"false\">&#x02016;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">I\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">[\u003c/mo>\u003cmo>CE\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>diag\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>CE\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>s\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>diag\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">]\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把 CLIP 的文本编码器当作生成式 LLM。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>大 batch 为什么有帮助，又有什么代价？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CLIP 使用图像、文本双编码器，将图文映射到同一表示空间，再用归一化特征的相似度区分匹配图文对。一个 batch 中，同一索引的图文对通常是正例，其他配对是负例；图到文和文到图分别做分类，两个交叉熵损失取平均。它学习跨模态匹配表征，并非直接训练文本生成器。\n\n若图像、文本单位向量为 $v_i,t_j$，相似度为 $s_{ij}=v_i^\\top t_j/\\tau$。温度 $\\tau$ 控制 softmax 的尖锐程度，原始实现使用可训练的对数尺度。实际图文数据可能含同义描述，此时 batch 内其他配对也可能相关，形成假负例。\n不要把 CLIP 的文本编码器当作生成式 LLM。\n大 batch 为什么有帮助，又有什么代价？"}, {"id": "VLM-002", "category": "VLM", "topic": "图文表示与预训练", "level": "L1", "title": "CLIP 如何做零样本分类？提示模板有什么作用？", "tags": ["CLIP", "零样本"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>零样本分类将候选类别写成自然语言模板，经文本编码器得到类别向量，再与图像向量计算相似度并排序。比如将类别名嵌入描述照片的句子，比只输入孤立标签更能匹配图文预训练分布。\u003c/p>\u003cp>图像和文本特征归一化后计算点积；多模板可先聚合每个类别的特征，再统一归一化与打分。模板应通过验证集选择或集成，候选类别集合也会影响 softmax 结果，因此输出分数不天然等于校准后的置信度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>零样本不代表类别概念从未出现在预训练数据。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何评估跨域类别和相似类别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "零样本分类将候选类别写成自然语言模板，经文本编码器得到类别向量，再与图像向量计算相似度并排序。比如将类别名嵌入描述照片的句子，比只输入孤立标签更能匹配图文预训练分布。\n\n图像和文本特征归一化后计算点积；多模板可先聚合每个类别的特征，再统一归一化与打分。模板应通过验证集选择或集成，候选类别集合也会影响 softmax 结果，因此输出分数不天然等于校准后的置信度。\n零样本不代表类别概念从未出现在预训练数据。\n如何评估跨域类别和相似类别？"}, {"id": "VLM-003", "category": "VLM", "topic": "图文表示与预训练", "level": "L2", "title": "图文检索很好，为什么关系和计数题仍可能答错？", "tags": ["组合性", "计数"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>整体图文匹配得分高，不等于可靠理解主体、关系、顺序和数量。应构造只交换关系或属性的最小对照样本，检验模型能否区分，再分别检查视觉细节、局部表示、训练监督和语言先验。\u003c/p>\u003cp>Winoground 用同词不同组合的图文配对检验组合性。计数题还要区分遮挡、小目标、重复目标与语言猜测；整体检索和关系问答应分开评估，不能由一个平均分代表所有能力。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要由单例错误推断所有 VLM 都缺乏该能力。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样生成不引入答案泄漏的对照集？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "整体图文匹配得分高，不等于可靠理解主体、关系、顺序和数量。应构造只交换关系或属性的最小对照样本，检验模型能否区分，再分别检查视觉细节、局部表示、训练监督和语言先验。\n\nWinoground 用同词不同组合的图文配对检验组合性。计数题还要区分遮挡、小目标、重复目标与语言猜测；整体检索和关系问答应分开评估，不能由一个平均分代表所有能力。\n不要由单例错误推断所有 VLM 都缺乏该能力。\n怎样生成不引入答案泄漏的对照集？"}, {"id": "VLM-004", "category": "VLM", "topic": "图文表示与预训练", "level": "L2", "title": "SigLIP 与 CLIP 的损失主要区别是什么？", "tags": ["SigLIP", "对比学习"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CLIP 在 batch 内用 softmax 比较图文相似度；SigLIP 对每个配对分别做 sigmoid 二分类，让正对和负对各自贡献二分类损失，无需为损失归一化获取完整相似度分布。这改变了负样本和通信的组织方式，也便于分块计算，但仍需考虑负样本与计算预算。\u003c/p>\u003cp>不同 batch 大小下的效果取决于样本数、负正比例和训练设置。改变损失函数也不会让编码器自动获得生成或 grounding 能力。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能说 SigLIP 完全不需要负样本或跨卡通信。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>逐对损失如何实现分块计算？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CLIP 在 batch 内用 softmax 比较图文相似度；SigLIP 对每个配对分别做 sigmoid 二分类，让正对和负对各自贡献二分类损失，无需为损失归一化获取完整相似度分布。这改变了负样本和通信的组织方式，也便于分块计算，但仍需考虑负样本与计算预算。\n\n不同 batch 大小下的效果取决于样本数、负正比例和训练设置。改变损失函数也不会让编码器自动获得生成或 grounding 能力。\n不能说 SigLIP 完全不需要负样本或跨卡通信。\n逐对损失如何实现分块计算？"}, {"id": "VLM-005", "category": "VLM", "topic": "图文表示与预训练", "level": "L1", "title": "BLIP 的 ITC、ITM、LM 三个目标各做什么？", "tags": ["BLIP", "预训练目标"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BLIP 的三个目标分别负责整体匹配、细粒度对应和条件生成：ITC 分别编码图像与文本，做图文对比学习；ITM 通过跨模态交互判断一对图文是否匹配，可使用困难负例；LM 以图像为条件，在因果文本注意力下预测后续文本。\u003c/p>\u003cp>三者在编码交互和监督形式上不同，共同支持理解与生成任务。ITM 的配对二分类不能直接等同于 ITC 的对比 softmax。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>ITM 是配对匹配，不是对比 softmax 的另一个名字。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>三种目标的 attention mask 有何不同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BLIP 的三个目标分别负责整体匹配、细粒度对应和条件生成：ITC 分别编码图像与文本，做图文对比学习；ITM 通过跨模态交互判断一对图文是否匹配，可使用困难负例；LM 以图像为条件，在因果文本注意力下预测后续文本。\n\n三者在编码交互和监督形式上不同，共同支持理解与生成任务。ITM 的配对二分类不能直接等同于 ITC 的对比 softmax。\nITM 是配对匹配，不是对比 softmax 的另一个名字。\n三种目标的 attention mask 有何不同？"}, {"id": "VLM-006", "category": "VLM", "topic": "图文表示与预训练", "level": "L2", "title": "BLIP 的 CapFilt 为什么同时需要 captioner 和 filter？", "tags": ["BLIP", "数据清洗"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>网络图文对可能包含与图像无关的文字。CapFilt 中，captioner 根据图像补充描述，filter 判断原始描述和生成描述是否与图像匹配，并筛除错配，让生成与过滤共同改善训练信号。\u003c/p>\u003cp>合成描述也会出错，需配合独立过滤、人工抽检、去重和质量分层。提高描述精确性可能减少多样性或长尾覆盖，因此还要做域外抽检。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>过滤器与生成器同源时可能共享错误偏好。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何测量过滤后的长尾覆盖损失？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "网络图文对可能包含与图像无关的文字。CapFilt 中，captioner 根据图像补充描述，filter 判断原始描述和生成描述是否与图像匹配，并筛除错配，让生成与过滤共同改善训练信号。\n\n合成描述也会出错，需配合独立过滤、人工抽检、去重和质量分层。提高描述精确性可能减少多样性或长尾覆盖，因此还要做域外抽检。\n过滤器与生成器同源时可能共享错误偏好。\n如何测量过滤后的长尾覆盖损失？"}, {"id": "VLM-007", "category": "VLM", "topic": "视觉连接器与训练", "level": "L1", "title": "BLIP-2 的 Q-Former 为什么能连接冻结的视觉编码器和 LLM？", "tags": ["BLIP-2", "Q-Former", "可学习查询", "两阶段预训练"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Q-Former 是带可学习查询的 Transformer，用查询间的自注意力与读取视觉特征的交叉注意力，提取固定数量的表示，再投影成 LLM 的软提示。若视觉特征 shape 为 \u003ccode>N×d_v\u003c/code>，查询为 \u003ccode>M×d_q\u003c/code>，交叉注意力的 Q 来自查询，K/V 来自视觉特征，输出为 \u003ccode>M×d_q\u003c/code>，随后映射到 \u003ccode>M×d_LLM\u003c/code>；查询数量 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>M\u003c/mi>\u003c/mrow>\u003c/math> 不随 patch 数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math> 直接增长。原始 BLIP-2 使用 32 个查询，这只是其配置。\u003c/p>\u003cp>原始 Q-Former 从 BERT-base 初始化共享自注意力层，每隔一个 Transformer block 插入视觉 cross-attention。查询会相互交互，因此它并非对每个 patch 独立做投影。BLIP-2 用两阶段训练连接冻结的视觉骨干和 LLM：\u003c/p>\u003cul>\u003cli>第一阶段通过 ITC、ITM、ITG 学图文表示。ITC 隔离 query 和文本；ITM 允许两者双向交互；ITG 中 query 相互双向可见且不看文本，文本可看全部 query 和已生成文本，所以 query 子图并不是 causal。\u003c/li>\u003cli>第二阶段以 LLM 的生成目标更新 Q-Former 和投影层。冻结骨干指参数不更新，梯度仍须经过冻结的 LLM 回到连接器；将其前向整体放入 \u003ccode>no_grad\u003c/code> 会切断训练路径。\u003c/li>\u003c/ul>\u003cp>原始 BLIP-2 生成阶段的视觉查询不直接接收用户指令；InstructBLIP 才将指令送入 Q-Former，以提取指令相关特征。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>Z\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>QFormer\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>Z\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">j\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>可学习 query 是模型参数向量，不等于用户问题文本、检测框或 LLM 每步的 query。\u003c/li>\u003cli>32 是原始 BLIP-2 实验设置；更多查询会改变瓶颈与 LLM 成本，不能当成架构必须值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>ITC、ITM、ITG 的 query/text 可见关系为什么不同？\u003c/li>\u003cli>冻结 LLM 时，如何验证连接器仍有非零梯度？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Q-Former 是带可学习查询的 Transformer，用查询间的自注意力与读取视觉特征的交叉注意力，提取固定数量的表示，再投影成 LLM 的软提示。若视觉特征 shape 为 `N×d_v`，查询为 `M×d_q`，交叉注意力的 Q 来自查询，K/V 来自视觉特征，输出为 `M×d_q`，随后映射到 `M×d_LLM`；查询数量 $M$ 不随 patch 数 $N$ 直接增长。原始 BLIP-2 使用 32 个查询，这只是其配置。\n\n原始 Q-Former 从 BERT-base 初始化共享自注意力层，每隔一个 Transformer block 插入视觉 cross-attention。查询会相互交互，因此它并非对每个 patch 独立做投影。BLIP-2 用两阶段训练连接冻结的视觉骨干和 LLM：\n\n- 第一阶段通过 ITC、ITM、ITG 学图文表示。ITC 隔离 query 和文本；ITM 允许两者双向交互；ITG 中 query 相互双向可见且不看文本，文本可看全部 query 和已生成文本，所以 query 子图并不是 causal。\n- 第二阶段以 LLM 的生成目标更新 Q-Former 和投影层。冻结骨干指参数不更新，梯度仍须经过冻结的 LLM 回到连接器；将其前向整体放入 `no_grad` 会切断训练路径。\n\n原始 BLIP-2 生成阶段的视觉查询不直接接收用户指令；InstructBLIP 才将指令送入 Q-Former，以提取指令相关特征。\n可学习 query 是模型参数向量，不等于用户问题文本、检测框或 LLM 每步的 query。\n32 是原始 BLIP-2 实验设置；更多查询会改变瓶颈与 LLM 成本，不能当成架构必须值。\nITC、ITM、ITG 的 query/text 可见关系为什么不同？\n冻结 LLM 时，如何验证连接器仍有非零梯度？"}, {"id": "VLM-008", "category": "VLM", "topic": "视觉连接器与训练", "level": "L2", "title": "Q-Former 与两层 MLP 连接器怎样选，MLP 已普遍淘汰 Q-Former 吗？", "tags": ["连接器", "架构比较", "Q-Former", "MLP", "Resampler", "Token预算", "融合范式", "Flamingo"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>两层 MLP 逐 patch 做维度映射；Q-Former 则通过查询自注意力和视觉交叉注意力交互提取信息，并压缩成固定数量的查询表示。MLP 结构简单，通常保留 patch 粒度；Q-Former 增加连接器计算，却可减小 LLM 的序列长度、prefill 和 KV 预算。选择时要比较视觉编码、连接器和 LLM 的端到端成本。\u003c/p>\u003cp>以 LLaVA-1.5 为例，连接器为 \u003ccode>Linear→GELU→Linear\u003c/code>，输入的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math> 个视觉 token 映射后仍为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math> 个。连接器本身不新增跨 token 混合，但视觉编码器此前已可通过注意力融合上下文；保留 patch 粒度不等于像素信息无损。Q-Former 用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>M\u003c/mi>\u003c/mrow>\u003c/math> 个查询汇聚 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/math> 个视觉特征，固定 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>M\u003c/mi>\u003c/mrow>\u003c/math> 可能形成细节瓶颈。\u003c/p>\u003cp>需要小字识别、局部定位且 token 预算充足时，可先试逐 patch MLP；多图、视频或 LLM 输入预算紧张时，可试查询压缩。压缩是否损害 OCR 要在相同任务、分辨率、数据和冻结策略下消融，不能只比较整模型成绩。\u003c/p>\u003cp>MLP 是简洁有效的基线；BLIP-2 的两阶段表征学习服务于冻结骨干，InstructBLIP 使用指令感知 Q-Former，MiniCPM-V 4.5 使用 3D-Resampler 压缩图像和视频。不同设计并存，这些实例不足以证明商业部署占比或“业界普遍淘汰 Q-Former”。Resampler 的可学习查询、位置编码与 cross-attention，也不等于 BLIP-2 的 BERT 初始化、共享文本分支及 ITC/ITM/ITG 目标；不能把所有固定 token 压缩器统称 Q-Former。\u003c/p>\u003cp>比较完整融合范式时，CLIP双塔输出可比表示但不能直接完成生成对话；LLaVA/BLIP-2等把转换后的视觉token作为LLM条件输入；Flamingo使用Perceiver Resampler压缩视觉特征，再在冻结语言模型层间加入可训练的gated cross-attention。BLIP-2的cross-attention主要发生在Q-Former，不能等同于Flamingo在LLM内部插层；“连接器/跨注意力”也并非互斥，因为连接器本身就可使用cross-attention。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmtext>MLP:\u003c/mtext>\u003cmspace width=\"1em\" />\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003cmi>&#x027F6;\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmtext>Query&#x000A0;bridge:\u003c/mtext>\u003cmspace width=\"1em\" />\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003cmi>&#x027F6;\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003cmi>&#x027F6;\u003c/mi>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">M\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003cfigure>\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NjAiIGhlaWdodD0iNTMwIiB2aWV3Qm94PSIwIDAgOTYwIDUzMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIj48dGl0bGUgaWQ9InRpdGxlIj7op4bop4nov57mjqXlmajvvJrpgJAgVG9rZW4gTUxQIOS4jiBRdWVyeSDljovnvKk8L3RpdGxlPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCAwIEwxMCA1IEwwIDEwIFoiIGZpbGw9IiM1NjczOGIiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgcng9IjEyIiBmaWxsPSIjZmFmY2ZlIi8+PHRleHQgeD0iMzIiIHk9IjQwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtZmFtaWx5PSJNaWNyb3NvZnQgWWFIZWksTm90byBTYW5zIENKSyBTQyxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmb250LXdlaWdodD0iN 比或“业界普遍淘汰 Q-Former”。Resampler 的可学习查询、位置编码与 cross-attention，也不等于 BLIP-2 的 BERT 初始化、共享文本分支及 ITC/ITM/ITG 目标；不能把所有固定 token 压缩器统称 Q-Former。\n\n比较完整融合范式时，CLIP双塔输出可比表示但不能直接完成生成对话；LLaVA/BLIP-2等把转换后的视觉token作为LLM条件输入；Flamingo使用Perceiver Resampler压缩视觉特征，再在冻结语言模型层间加入可训练的gated cross-attention。BLIP-2的cross-attention主要发生在Q-Former，不能等同于Flamingo在LLM内部插层；“连接器/跨注意力”也并非互斥，因为连接器本身就可使用cross-attention。\n不同视觉骨干、数据和冻结策略的整模型成绩不能全部归因连接器，也不能外推成“MLP 一定更强”。\nMLP 本身通常不压 token；若系统另有 pooling/pixel shuffle，压缩应归于那些操作。\n同一视觉骨干下，怎样分别控制视觉 token 数与总 FLOPs 做比较？\n若查询压缩使 OCR 退化，你会调整查询数、切图、训练数据还是连接器？"}, {"id": "VLM-009", "category": "VLM", "topic": "视觉连接器与训练", "level": "L1", "title": "原始 LLaVA 的两阶段训练分别更新哪些模块？", "tags": ["LLaVA", "训练阶段", "MiniGPT-4"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 LLaVA 的第一阶段冻结视觉编码器和 LLM，只训练投影层，用图文描述数据将视觉特征接入语言嵌入空间；第二阶段继续冻结视觉编码器，更新投影层和 LLM，用对话、详细描述和推理指令学习回答格式与任务。\u003c/p>\u003cp>特征对齐和指令跟随是两个阶段的不同职责，指令能力不能只靠增大连接器获得。回答时应注明版本，后续 VLM 的视觉解冻策略和阶段划分可能不同，“端到端”也不代表所有模块都解冻。\u003c/p>\u003cp>MiniGPT-4复用带ViT与Q-Former的BLIP-2视觉部分，以可训练线性层接到Vicuna；其预训练视觉/语言部分冻结，先用图文数据学习投影，再以精选描述数据继续改善生成质量。原始LLaVA使用CLIP视觉特征与线性投影，指令阶段训练连接器和语言模型；两者都利用预训练模块，但连接路线、训练数据与更新模块并不相同，不能把MiniGPT-4简化成LLaVA-1.5两层MLP。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>原论文说 end-to-end 不代表所有模块都解冻。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>域内视觉分布变化时是否应解冻视觉骨干？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 LLaVA 的第一阶段冻结视觉编码器和 LLM，只训练投影层，用图文描述数据将视觉特征接入语言嵌入空间；第二阶段继续冻结视觉编码器，更新投影层和 LLM，用对话、详细描述和推理指令学习回答格式与任务。\n\n特征对齐和指令跟随是两个阶段的不同职责，指令能力不能只靠增大连接器获得。回答时应注明版本，后续 VLM 的视觉解冻策略和阶段划分可能不同，“端到端”也不代表所有模块都解冻。\n\nMiniGPT-4复用带ViT与Q-Former的BLIP-2视觉部分，以可训练线性层接到Vicuna；其预训练视觉/语言部分冻结，先用图文数据学习投影，再以精选描述数据继续改善生成质量。原始LLaVA使用CLIP视觉特征与线性投影，指令阶段训练连接器和语言模型；两者都利用预训练模块，但连接路线、训练数据与更新模块并不相同，不能把MiniGPT-4简化成LLaVA-1.5两层MLP。\n原论文说 end-to-end 不代表所有模块都解冻。\n域内视觉分布变化时是否应解冻视觉骨干？"}, {"id": "VLM-010", "category": "VLM", "topic": "视觉连接器与训练", "level": "L2", "title": "VLM 指令微调的 labels 应怎样掩码？", "tags": ["SFT", "Loss Mask"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>常见对话式 VLM 仅对 assistant 的文本答案及结束标记计算自回归损失，用户问题、系统提示、视觉占位和 padding 使用忽略标签。视觉 token 展开会改变序列位置，应先得到最终多模态序列，再核对 \u003ccode>labels\u003c/code> 与 token 位置、因果移位是否一致。\u003c/p>\u003cp>逐样本检查有效监督 token 数，防止答案全部被屏蔽。多轮历史是否监督遵循具体数据配方，不能直接照搬纯文本模板；attention mask 控制信息可见性，loss mask 控制哪些预测参与损失。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>attention mask 与 loss mask 控制不同事情。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何用单样本打印核对输入与目标？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "常见对话式 VLM 仅对 assistant 的文本答案及结束标记计算自回归损失，用户问题、系统提示、视觉占位和 padding 使用忽略标签。视觉 token 展开会改变序列位置，应先得到最终多模态序列，再核对 `labels` 与 token 位置、因果移位是否一致。\n\n逐样本检查有效监督 token 数，防止答案全部被屏蔽。多轮历史是否监督遵循具体数据配方，不能直接照搬纯文本模板；attention mask 控制信息可见性，loss mask 控制哪些预测参与损失。\nattention mask 与 loss mask 控制不同事情。\n如何用单样本打印核对输入与目标？"}, {"id": "VLM-011", "category": "VLM", "topic": "模型结构与版本对比", "level": "L1", "title": "LLaVA-1.5 相比原始 LLaVA 的关键改进是什么？", "tags": ["LLaVA-1.5", "数据"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LLaVA-1.5 在原始 LLaVA 基础上，将线性连接器改为两层 MLP，采用 336px 的 CLIP 视觉配置以提高可见细节，并加入覆盖 VQA、OCR、区域问答的任务数据。\u003c/p>\u003cp>数据配方中的简短答案格式约束可减少不同任务的输出冲突。应分别解释架构、分辨率、数据和监督的作用；性能改善不能仅归因于连接器，也不意味着视觉骨干整体解冻。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>性能进步不意味着原始模型视觉骨干整体解冻。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>格式提示为什么会影响开放问答表现？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LLaVA-1.5 在原始 LLaVA 基础上，将线性连接器改为两层 MLP，采用 336px 的 CLIP 视觉配置以提高可见细节，并加入覆盖 VQA、OCR、区域问答的任务数据。\n\n数据配方中的简短答案格式约束可减少不同任务的输出冲突。应分别解释架构、分辨率、数据和监督的作用；性能改善不能仅归因于连接器，也不意味着视觉骨干整体解冻。\n性能进步不意味着原始模型视觉骨干整体解冻。\n格式提示为什么会影响开放问答表现？"}, {"id": "VLM-012", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L2", "title": "Qwen2-VL 的动态分辨率解决了什么问题？", "tags": ["Qwen2-VL", "视觉token"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>固定尺寸缩放可能损失小字或扭曲长宽比，Qwen2-VL 的动态分辨率将不同输入尺寸映射为可变长度的视觉序列，ViT 用二维位置表达处理不同空间大小，再将邻近 \u003ccode>2×2\u003c/code> 视觉 token 合并以控制进入 LLM 的序列长度。\u003c/p>\u003cp>图像越大通常 token 越多，细节和成本的权衡仍存在。部署要设置像素与视觉 token 上限，并按任务评估；显存不能仅按图像张数估计，动态分辨率也并非无限分辨率或完全不缩放。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>动态分辨率不是无限分辨率，也不等于完全不缩放。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>OCR 与自然图片如何设置不同预算？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "固定尺寸缩放可能损失小字或扭曲长宽比，Qwen2-VL 的动态分辨率将不同输入尺寸映射为可变长度的视觉序列，ViT 用二维位置表达处理不同空间大小，再将邻近 `2×2` 视觉 token 合并以控制进入 LLM 的序列长度。\n\n图像越大通常 token 越多，细节和成本的权衡仍存在。部署要设置像素与视觉 token 上限，并按任务评估；显存不能仅按图像张数估计，动态分辨率也并非无限分辨率或完全不缩放。\n动态分辨率不是无限分辨率，也不等于完全不缩放。\nOCR 与自然图片如何设置不同预算？"}, {"id": "VLM-013", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L2", "title": "M-RoPE 如何统一文本、图像和视频位置？", "tags": ["M-RoPE", "位置编码"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen2-VL 的 M-RoPE 将旋转位置编码的通道维度分配给时间、高度、宽度，三组位置分别作用于对应子空间。文本三者使用相同位置索引；图像固定时间位置、区分空间位置；视频还引入帧的时间位置。\u003c/p>\u003cp>混合模态输入需连续安排位置编号并保持边界可解释。M-RoPE 提供坐标结构，不会自动解决图文对齐或任意长度外推；后续版本可能改变时间编码定义，不能混写 Qwen2-VL 的帧序号与 Qwen2.5-VL 的绝对时间。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>Qwen2-VL 帧序号与 Qwen2.5-VL 绝对时间不能混写。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>多图与视频的时间位置为何应区分？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen2-VL 的 M-RoPE 将旋转位置编码的通道维度分配给时间、高度、宽度，三组位置分别作用于对应子空间。文本三者使用相同位置索引；图像固定时间位置、区分空间位置；视频还引入帧的时间位置。\n\n混合模态输入需连续安排位置编号并保持边界可解释。M-RoPE 提供坐标结构，不会自动解决图文对齐或任意长度外推；后续版本可能改变时间编码定义，不能混写 Qwen2-VL 的帧序号与 Qwen2.5-VL 的绝对时间。\nQwen2-VL 帧序号与 Qwen2.5-VL 绝对时间不能混写。\n多图与视频的时间位置为何应区分？"}, {"id": "VLM-014", "category": "VLM", "topic": "模型结构与版本对比", "level": "L2", "title": "Qwen2.5-VL 的视觉编码器和时间建模有哪些变化？", "tags": ["Qwen2.5-VL", "窗口注意力"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen2.5-VL 的视觉编码器在多数层使用窗口注意力，在四层保留全局注意力；同时引入动态 FPS 采样，并将时间位置与绝对时间对齐，以改善时间表达。\u003c/p>\u003cp>固定窗口大小时，窗口层计算对 patch 数近似线性，但全局层仍有跨窗口信息交互和全局成本。合并后的视觉特征进入语言模型，LLM 的序列长度成本也须计入，因此不能把整个 ViT 或 VLM 的复杂度都写成 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把整个 ViT 或整个 VLM 的复杂度都写成 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>窗口大小与小目标识别如何权衡？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen2.5-VL 的视觉编码器在多数层使用窗口注意力，在四层保留全局注意力；同时引入动态 FPS 采样，并将时间位置与绝对时间对齐，以改善时间表达。\n\n固定窗口大小时，窗口层计算对 patch 数近似线性，但全局层仍有跨窗口信息交互和全局成本。合并后的视觉特征进入语言模型，LLM 的序列长度成本也须计入，因此不能把整个 ViT 或 VLM 的复杂度都写成 $O(n)$。\n不要把整个 ViT 或整个 VLM 的复杂度都写成 $O(n)$。\n窗口大小与小目标识别如何权衡？"}, {"id": "VLM-015", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L2", "title": "InternVL 的动态切图与全局缩略图各有什么作用？", "tags": ["InternVL", "动态切图"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>InternVL 动态切图先根据原图长宽比选择网格，再裁成多个固定大小的 tile，以保留高分辨率局部细节；全局缩略图补充整体布局，帮助理解局部块之间的关系。\u003c/p>\u003cp>计算和输入成本随 tile 数增加，\u003ccode>max_num\u003c/code> 控制切块预算，具体规则随版本而异。需维护同一原图的 tile 顺序、数量和归属，不能把 tile 当作独立原图；定位时还要将裁剪坐标映射回原图。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把每个 tile 误当作一张独立原图。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>表格跨 tile 边界时如何减少结构损失？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "InternVL 动态切图先根据原图长宽比选择网格，再裁成多个固定大小的 tile，以保留高分辨率局部细节；全局缩略图补充整体布局，帮助理解局部块之间的关系。\n\n计算和输入成本随 tile 数增加，`max_num` 控制切块预算，具体规则随版本而异。需维护同一原图的 tile 顺序、数量和归属，不能把 tile 当作独立原图；定位时还要将裁剪坐标映射回原图。\n不能把每个 tile 误当作一张独立原图。\n表格跨 tile 边界时如何减少结构损失？"}, {"id": "VLM-016", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "OCR/文档问答差，怎样判断是视觉瓶颈还是语言瓶颈？", "tags": ["OCR", "DocVQA"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先裁剪目标区域或提高分辨率，检查文字是否可辨，再输入可靠 OCR 文本及布局作为对照。若文本对照能答、图片不能，优先查视觉表示与接入链路；若两者都错，再查问题语义、布局关系、检索范围和监督。\u003c/p>\u003cp>分开报告文字识别、字段关联、推理准确率，并按大小字、旋转、扫描噪声和多列排版检查。还需核对预处理方向、归一化和裁剪是否损坏文本；外部 OCR 有误差，不能当作完美真值。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>外部 OCR 同样有误差，不能直接当完美真值。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>图表数值读对但单位读错如何构造评测？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先裁剪目标区域或提高分辨率，检查文字是否可辨，再输入可靠 OCR 文本及布局作为对照。若文本对照能答、图片不能，优先查视觉表示与接入链路；若两者都错，再查问题语义、布局关系、检索范围和监督。\n\n分开报告文字识别、字段关联、推理准确率，并按大小字、旋转、扫描噪声和多列排版检查。还需核对预处理方向、归一化和裁剪是否损坏文本；外部 OCR 有误差，不能当作完美真值。\n外部 OCR 同样有误差，不能直接当完美真值。\n图表数值读对但单位读错如何构造评测？"}, {"id": "VLM-017", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L3", "title": "单图 VLM 怎样扩展到多页文档问答？", "tags": ["多页文档", "检索"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多页文档问答需同时解决相关页定位和页面内读取，可先检索候选页，再结合页码、视觉与文本布局回答，长文档也可分层聚合。保留答案所在页的证据，分别评估检索召回和最终问答准确率。\u003c/p>\u003cp>直接拼接多页会增加 token、干扰页和位置混淆。页级检索后要检查细粒度读取是否截断跨页关系，训练样本应覆盖页标识、无答案页与跨页问题，尤其关注跨页表格。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>检索错页时不能靠生成答案掩盖错误。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样处理答案跨两页的表格？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多页文档问答需同时解决相关页定位和页面内读取，可先检索候选页，再结合页码、视觉与文本布局回答，长文档也可分层聚合。保留答案所在页的证据，分别评估检索召回和最终问答准确率。\n\n直接拼接多页会增加 token、干扰页和位置混淆。页级检索后要检查细粒度读取是否截断跨页关系，训练样本应覆盖页标识、无答案页与跨页问题，尤其关注跨页表格。\n检索错页时不能靠生成答案掩盖错误。\n怎样处理答案跨两页的表格？"}, {"id": "VLM-018", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "视觉幻觉怎样定义、评测和缓解？", "tags": ["视觉幻觉", "POPE"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>视觉幻觉指回答中的对象、属性或关系不受图像支持。可按这三类建立标注和失败切片；POPE 的对象存在性问答只衡量其中一部分，开放描述仍需逐项事实核对。\u003c/p>\u003cp>缓解需覆盖训练数据、视觉证据、训练与解码，并检查语言先验和数据共现偏差。评估同时关注错误肯定与过度否定，避免模型只会说不知道；更保守或更短的描述也可能降低指标却损失信息。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>POPE 分数不是所有视觉幻觉的完整度量。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>更短的描述为何可能降低幻觉指标却损失信息？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "视觉幻觉指回答中的对象、属性或关系不受图像支持。可按这三类建立标注和失败切片；POPE 的对象存在性问答只衡量其中一部分，开放描述仍需逐项事实核对。\n\n缓解需覆盖训练数据、视觉证据、训练与解码，并检查语言先验和数据共现偏差。评估同时关注错误肯定与过度否定，避免模型只会说不知道；更保守或更短的描述也可能降低指标却损失信息。\nPOPE 分数不是所有视觉幻觉的完整度量。\n更短的描述为何可能降低幻觉指标却损失信息？"}, {"id": "VLM-019", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L3", "title": "多模态模型看起来不看图，如何排查？", "tags": ["图像依赖", "消融"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>用同一问题替换、遮挡或打乱图像，观察答案是否对视觉证据敏感，再检查视觉输入是否真正进入模型、梯度是否到达连接器。先核对占位符、\u003ccode>pixel_values\u003c/code>、视觉 token 数和 mask，再比较仅文本、正确图像、错配图像的准确率。\u003c/p>\u003cp>链路正常后，继续检查连接器梯度、视觉特征变化、标签泄漏、文本捷径和数据偏差。只看注意力热图不足以证明因果依赖；错配图像不改变答案，也可能是该问题本来不依赖图像。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>错配图像不改变答案也可能是问题本来不依赖图像。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>视觉对比解码为何可能降低语言先验干扰？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "用同一问题替换、遮挡或打乱图像，观察答案是否对视觉证据敏感，再检查视觉输入是否真正进入模型、梯度是否到达连接器。先核对占位符、`pixel_values`、视觉 token 数和 mask，再比较仅文本、正确图像、错配图像的准确率。\n\n链路正常后，继续检查连接器梯度、视觉特征变化、标签泄漏、文本捷径和数据偏差。只看注意力热图不足以证明因果依赖；错配图像不改变答案，也可能是该问题本来不依赖图像。\n错配图像不改变答案也可能是问题本来不依赖图像。\n视觉对比解码为何可能降低语言先验干扰？"}, {"id": "VLM-020", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "VLM 能力如何评估，为什么不能只报一个榜单分数？", "tags": ["MMBench", "评估"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多模态能力包括感知、OCR、空间关系、推理和指令遵循，一个榜单均值会隐藏弱项。应固定模型版本、输入预算与评测协议，按任务切片报告误差类型、延迟、成本，并用人工抽检确认自动评分可靠性。\u003c/p>\u003cp>选择题适合标准化评测，开放问答需要细粒度事实标注；控制答案格式、随机性、分辨率和测试集污染。业务评估还应加入无答案、歧义图像与跨域样本，不同提示或图像预算下的成绩不宜直接横比。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不同提示或图像预算下的榜单分数不宜直接横比。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>模型裁判如何减少长度偏好与视觉遗漏？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多模态能力包括感知、OCR、空间关系、推理和指令遵循，一个榜单均值会隐藏弱项。应固定模型版本、输入预算与评测协议，按任务切片报告误差类型、延迟、成本，并用人工抽检确认自动评分可靠性。\n\n选择题适合标准化评测，开放问答需要细粒度事实标注；控制答案格式、随机性、分辨率和测试集污染。业务评估还应加入无答案、歧义图像与跨域样本，不同提示或图像预算下的成绩不宜直接横比。\n不同提示或图像预算下的榜单分数不宜直接横比。\n模型裁判如何减少长度偏好与视觉遗漏？"}, {"id": "VLM-021", "category": "VLM", "topic": "视觉连接器与训练", "level": "L3", "title": "微调 VLM 时，视觉骨干、连接器和 LLM 该怎样冻结？", "tags": ["微调", "冻结策略"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>先判断差距来自视觉域、跨模态对齐还是任务指令，再选择更新模块。仅训练连接器成本较低；LLM LoRA 可调整任务行为；视觉分布明显变化时可考虑解冻视觉骨干。\u003c/p>\u003cp>先验证连接器和格式，再扩大更新范围，并按参数组记录学习率、梯度和可训练参数数目，用消融验证收益。加入通用图文与纯文本回归集测遗忘，防止少量域数据破坏原有能力。冻结参数不等于切断向前层传递的梯度。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>冻结参数不等于禁止该模块向前层传递梯度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>新视觉骨干替换后能直接复用旧连接器吗？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "先判断差距来自视觉域、跨模态对齐还是任务指令，再选择更新模块。仅训练连接器成本较低；LLM LoRA 可调整任务行为；视觉分布明显变化时可考虑解冻视觉骨干。\n\n先验证连接器和格式，再扩大更新范围，并按参数组记录学习率、梯度和可训练参数数目，用消融验证收益。加入通用图文与纯文本回归集测遗忘，防止少量域数据破坏原有能力。冻结参数不等于切断向前层传递的梯度。\n冻结参数不等于禁止该模块向前层传递梯度。\n新视觉骨干替换后能直接复用旧连接器吗？"}, {"id": "VLM-022", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "交错图文和多图输入如何保持图像与指代关系？", "tags": ["多图", "Flamingo"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多图与交错图文输入应保留图像边界、顺序和指代标记，让文本对应到正确图像。页面或图片编号与原始数据保持一致，推理时核对占位符与视觉块一一对应，即使压缩 token 也要保存每张图的归属。\u003c/p>\u003cp>交错图文训练提供这种关联监督，还应覆盖比较、跨图关联和局部引用任务。训练与测试的图数分布会影响能力，按单图训练的模型不能自动可靠处理任意数量的图像。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>按一张图训练的模型不会自动可靠支持任意张图。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>交换两图顺序后正确答案应如何变化？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多图与交错图文输入应保留图像边界、顺序和指代标记，让文本对应到正确图像。页面或图片编号与原始数据保持一致，推理时核对占位符与视觉块一一对应，即使压缩 token 也要保存每张图的归属。\n\n交错图文训练提供这种关联监督，还应覆盖比较、跨图关联和局部引用任务。训练与测试的图数分布会影响能力，按单图训练的模型不能自动可靠处理任意数量的图像。\n按一张图训练的模型不会自动可靠支持任意张图。\n交换两图顺序后正确答案应如何变化？"}, {"id": "VLM-023", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "Grounding 与普通图像问答有什么区别？", "tags": ["Grounding", "坐标"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通图像问答输出文本，grounding 还要将语言中的实体或短语绑定到图像区域，例如输出边界框。它需要区域对应监督和明确的坐标协议：输出究竟是像素坐标、归一化数值，还是离散位置 token。\u003c/p>\u003cp>评测同时检查框的定位和语义，可用 IoU、召回及复杂空间关系切片，不能只检查格式。图像缩放、裁剪或切图后，须将预测坐标正确反变换回原图。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>合法坐标并不代表框对应了正确实体。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何处理多个相同物体的指代表达？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通图像问答输出文本，grounding 还要将语言中的实体或短语绑定到图像区域，例如输出边界框。它需要区域对应监督和明确的坐标协议：输出究竟是像素坐标、归一化数值，还是离散位置 token。\n\n评测同时检查框的定位和语义，可用 IoU、召回及复杂空间关系切片，不能只检查格式。图像缩放、裁剪或切图后，须将预测坐标正确反变换回原图。\n合法坐标并不代表框对应了正确实体。\n如何处理多个相同物体的指代表达？"}, {"id": "VLM-024", "category": "VLM", "topic": "视觉连接器与训练", "level": "L3", "title": "多模态预训练和 SFT 的数据配比怎样设计？", "tags": ["数据配比", "能力平衡"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多模态预训练与 SFT 配比应围绕目标能力和数据质量设计。自然图像、OCR、文档、区域问答及纯文本的 token 成本和难度不同，先建分任务评测，再通过受控采样与消融寻找能力和成本的平衡。\u003c/p>\u003cp>记录去重后样本数、视觉 token 数和有效答案 token 数，防止低质量海量描述压过稀缺的细粒度监督。持续检查纯文本回归、视觉细节和域外泛化，而非只按原始样本量混合。\u003c/p>\u003cp>已有 VLM 适应新领域时，增量预训练先明确新能力缺口，规范原图、区域、文本与时间的对应关系，做文档/用户/时间维度切分与去重，防止同源页面或视频片段跨入评测集。以领域图文和任务样本配合一定通用图文、纯文本回放，从较小学习率与受控更新范围开始；域差异明显才扩大解冻范围。预训练式生成目标和回答监督式 SFT 要按样本目的设置 mask，不能混用固定模板。按旧能力、新领域、长上下文和视觉依赖分别回归，出现遗忘时调整采样、训练步数和模块更新，不能只以训练 loss 下降判定增量学习成功。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不能把单篇论文的配比当跨模型最优配方。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何区分数据质量收益与训练步数收益？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多模态预训练与 SFT 配比应围绕目标能力和数据质量设计。自然图像、OCR、文档、区域问答及纯文本的 token 成本和难度不同，先建分任务评测，再通过受控采样与消融寻找能力和成本的平衡。\n\n记录去重后样本数、视觉 token 数和有效答案 token 数，防止低质量海量描述压过稀缺的细粒度监督。持续检查纯文本回归、视觉细节和域外泛化，而非只按原始样本量混合。\n\n已有 VLM 适应新领域时，增量预训练先明确新能力缺口，规范原图、区域、文本与时间的对应关系，做文档/用户/时间维度切分与去重，防止同源页面或视频片段跨入评测集。以领域图文和任务样本配合一定通用图文、纯文本回放，从较小学习率与受控更新范围开始；域差异明显才扩大解冻范围。预训练式生成目标和回答监督式 SFT 要按样本目的设置 mask，不能混用固定模板。按旧能力、新领域、长上下文和视觉依赖分别回归，出现遗忘时调整采样、训练步数和模块更新，不能只以训练 loss 下降判定增量学习成功。\n不能把单篇论文的配比当跨模型最优配方。\n如何区分数据质量收益与训练步数收益？"}, {"id": "VLM-025", "category": "VLM", "topic": "感知、文档与视觉评测", "level": "L2", "title": "多模态检索模型与生成式 VLM 问答怎样分工？", "tags": ["ColPali", "检索", "RAG"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多模态检索模型将问题和视觉文档映射成可评分表示，负责寻找证据；生成式 VLM 结合检索页和问题生成答案。单向量适合紧凑索引，多向量可保留页面局部信息并支持局部匹配，但索引与匹配成本更高。\u003c/p>\u003cp>保存页面原图、页码和区域信息供读取与定位，分别衡量检索召回、答案正确率和引用定位。无关页与跨页题可检验召回质量及证据是否充分。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>会生成图像描述不代表天然适合大规模向量检索。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>扫描文档为什么可能从视觉检索获益？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多模态检索模型将问题和视觉文档映射成可评分表示，负责寻找证据；生成式 VLM 结合检索页和问题生成答案。单向量适合紧凑索引，多向量可保留页面局部信息并支持局部匹配，但索引与匹配成本更高。\n\n保存页面原图、页码和区域信息供读取与定位，分别衡量检索召回、答案正确率和引用定位。无关页与跨页题可检验召回质量及证据是否充分。\n会生成图像描述不代表天然适合大规模向量检索。\n扫描文档为什么可能从视觉检索获益？"}, {"id": "VLM-026", "category": "VLM", "topic": "模型结构与版本对比", "level": "L2", "title": "以 LLaVA-1.5-7B 与 InternVL2.5-8B 为例，除骨干和训练之外有哪些差异？", "tags": ["LLaVA-1.5", "InternVL2.5", "动态切图", "PixelShuffle", "空间结构", "Token预算", "视频"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>以 LLaVA-1.5-7B 与 InternVL2.5-8B 为例，除了语言、视觉骨干和训练方式，输入组织、空间重排、视觉 token 预算及多图/视频接口也不同：\u003c/p>\u003cul>\u003cli>输入组织：LLaVA-1.5-7B 的此配置为 \u003ccode>image_aspect_ratio=pad\u003c/code>，单图补方后输入 336px 编码器，patch 大小 14px；InternVL2.5 示例按长宽比选择网格，切成 448px tile，\u003ccode>max_num=12\u003c/code> 限制局部块数，多块时再加全局 thumbnail，所以总块数可达 13。\u003c/li>\u003cli>连接器与空间结构：前者去 CLS 后保留 \u003ccode>24×24=576\u003c/code> 个 patch token，经两层 MLP 映射；后者去 CLS 后，将 \u003ccode>32×32\u003c/code> 网格按 \u003ccode>ratio=0.5\u003c/code> 重排为 \u003ccode>16×16\u003c/code>，相邻 \u003ccode>2×2\u003c/code> 特征进入通道，再经 LayerNorm 和两层 MLP，得到每块 256 个 token。tile 按网格行优先排列，thumbnail 追加在末尾；pixel shuffle 保留邻域分组，但 LLM 最终接收的仍是一维序列，跨 tile 的表格或对象关系还需要全局视图与训练支持。\u003c/li>\u003cli>输入预算：InternVL 视觉 token 数约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>256\u003c/mn>\u003c/mrow>\u003c/math> 乘实际块数，不含边界与文本 token；12 个局部块加缩略图为 3328 个，而非每张原图固定 256 个。切图增加细节，也增加视觉编码、LLM prefill 与 KV 成本，比较应固定任务及实际预算。\u003c/li>\u003cli>多图/视频：InternVL2.5 quickstart 用 \u003ccode>num_patches_list\u003c/code> 标记每张图或每帧的块数，并提供抽帧和 Frame 编号示例；LLaVA-1.5 基础版以单图为主。不能将 LLaVA-NeXT/OneVision 的高分辨率或视频能力归给 1.5，也不能将抽帧接口等同于专用时序编码。\u003c/li>\u003c/ul>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003cmtext>-\u003c/mtext>\u003cmn>1.5\u003c/mn>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>336\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>14\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>576\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">I\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>448\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>14\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsup>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmn>0.5\u003c/mn>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>256\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">I\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">V\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>256\u003c/mn>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmn mathvariant=\"bold\">1\u003c/mn>\u003cmrow>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmo>&#x02227;\u003c/mo>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>本题版本、checkpoint、预处理与 token 数要一起报；不能以两个系列名概括所有后续版本。\u003c/li>\u003cli>InternVL 函数名是 \u003ccode>pixel_shuffle\u003c/code>，但 \u003ccode>ratio=0.5\u003c/code> 实际做空间缩小、通道增大的重排，不是图像超分辨率上采样。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 thumbnail 不计入 \u003ccode>max_num=12\u003c/code>，却必须计入视觉 token 与显存？\u003c/li>\u003cli>给定相同 OCR 任务预算，怎样消融 tile 数、分辨率与空间压缩率？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "以 LLaVA-1.5-7B 与 InternVL2.5-8B 为例，除了语言、视觉骨干和训练方式，输入组织、空间重排、视觉 token 预算及多图/视频接口也不同：\n\n- 输入组织：LLaVA-1.5-7B 的此配置为 `image_aspect_ratio=pad`，单图补方后输入 336px 编码器，patch 大小 14px；InternVL2.5 示例按长宽比选择网格，切成 448px tile，`max_num=12` 限制局部块数，多块时再加全局 thumbnail，所以总块数可达 13。\n- 连接器与空间结构：前者去 CLS 后保留 `24×24=576` 个 patch token，经两层 MLP 映射；后者去 CLS 后，将 `32×32` 网格按 `ratio=0.5` 重排为 `16×16`，相邻 `2×2` 特征进入通道，再经 LayerNorm 和两层 MLP，得到每块 256 个 token。tile 按网格行优先排列，thumbnail 追加在末尾；pixel shuffle 保留邻域分组，但 LLM 最终接收的仍是一维序列，跨 tile 的表格或对象关系还需要全局视图与训练支持。\n- 输入预算：InternVL 视觉 token 数约为 $256$ 乘实际块数，不含边界与文本 token；12 个局部块加缩略图为 3328 个，而非每张原图固定 256 个。切图增加细节，也增加视觉编码、LLM prefill 与 KV 成本，比较应固定任务及实际预算。\n- 多图/视频：InternVL2.5 quickstart 用 `num_patches_list` 标记每张图或每帧的块数，并提供抽帧和 Frame 编号示例；LLaVA-1.5 基础版以单图为主。不能将 LLaVA-NeXT/OneVision 的高分辨率或视频能力归给 1.5，也不能将抽帧接口等同于专用时序编码。\n本题版本、checkpoint、预处理与 token 数要一起报；不能以两个系列名概括所有后续版本。\nInternVL 函数名是 `pixel_shuffle`，但 `ratio=0.5` 实际做空间缩小、通道增大的重排，不是图像超分辨率上采样。\n为什么 thumbnail 不计入 `max_num=12`，却必须计入视觉 token 与显存？\n给定相同 OCR 任务预算，怎样消融 tile 数、分辨率与空间压缩率？"}, {"id": "VLM-027", "category": "VLM", "topic": "模型结构与版本对比", "level": "L2", "title": "Qwen3-VL 的基本模块与相较 Qwen2.5-VL 的结构变化是什么？", "tags": ["Qwen3-VL", "视觉编码器", "DeepStack", "时间"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen3-VL 由视觉编码器、视觉语言 merger 和 Qwen3 语言骨干构成，同时有 Dense 与 MoE 配置。视觉编码器基于 SigLIP-2 架构继续适配动态分辨率，merger 将邻近 2×2 patch 特征合并并投影到语言隐藏维度；不能只比较两个 LLM 的参数量来推断整个 VLM 的成本。\u003c/p>\u003cp>与 Qwen2.5-VL 相比，三个应重点解释的变化是 Interleaved M-RoPE 平衡时空位置的频率分配，DeepStack 将不同深度的视觉特征注入较早的语言层，文本时间戳加强视频事件与真实时间的对应。它们分别补足位置、细节通路和时间表示。更好的数据与训练同样影响最终能力，结构变化不能单独保证任意 OCR、长视频或 grounding 任务提升。\u003c/p>\u003cp>部署要一起核对 processor、patch 大小、视觉 token 预算、模型配置及模板；输入预处理错配可能比换推理 dtype 对结果的影响更大。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>Qwen3-VL 的架构事实不能从文本 Qwen3 的配置直接推断。\u003c/li>\u003cli>动态分辨率不代表无限像素输入或固定的单图 token 数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>DeepStack 增加的是序列长度还是跨层特征通路？\u003c/li>\u003cli>如何消融结构、数据和训练预算带来的收益？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen3-VL 由视觉编码器、视觉语言 merger 和 Qwen3 语言骨干构成，同时有 Dense 与 MoE 配置。视觉编码器基于 SigLIP-2 架构继续适配动态分辨率，merger 将邻近 2×2 patch 特征合并并投影到语言隐藏维度；不能只比较两个 LLM 的参数量来推断整个 VLM 的成本。\n\n与 Qwen2.5-VL 相比，三个应重点解释的变化是 Interleaved M-RoPE 平衡时空位置的频率分配，DeepStack 将不同深度的视觉特征注入较早的语言层，文本时间戳加强视频事件与真实时间的对应。它们分别补足位置、细节通路和时间表示。更好的数据与训练同样影响最终能力，结构变化不能单独保证任意 OCR、长视频或 grounding 任务提升。\n\n部署要一起核对 processor、patch 大小、视觉 token 预算、模型配置及模板；输入预处理错配可能比换推理 dtype 对结果的影响更大。\nQwen3-VL 的架构事实不能从文本 Qwen3 的配置直接推断。\n动态分辨率不代表无限像素输入或固定的单图 token 数。\nDeepStack 增加的是序列长度还是跨层特征通路？\n如何消融结构、数据和训练预算带来的收益？"}, {"id": "VLM-028", "category": "VLM", "topic": "视觉连接器与训练", "level": "L3", "title": "Qwen3-VL 四阶段预训练分别训练什么模块、数据和目标？", "tags": ["Qwen3-VL", "训练阶段", "Merger", "长上下文"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>报告中的“四阶段”特指 S0～S3 预训练，不能把它和后训练阶段混算：\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>可训练模块\u003c/th>\u003cth>数据重点\u003c/th>\u003cth>长度与 token 预算\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S0 对齐\u003c/td>\u003ctd>仅 MLP merger；冻结视觉编码器和 LLM\u003c/td>\u003ctd>图文描述、视觉知识、OCR\u003c/td>\u003ctd>8,192；约 67B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S1 多模态预训练\u003c/td>\u003ctd>全部模块\u003c/td>\u003ctd>图文、交错文档、grounding、VQA、STEM、少量视频，加纯文本\u003c/td>\u003ctd>8,192；约 1T\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S2 长上下文预训练\u003c/td>\u003ctd>全部模块\u003c/td>\u003ctd>增加长文本、视频和 Agent 相关数据\u003c/td>\u003ctd>32,768；约 1T\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S3 超长上下文适配\u003c/td>\u003ctd>全部模块\u003c/td>\u003ctd>长视频与长文档，加纯文本\u003c/td>\u003ctd>262,144；约 100B\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>共同使用生成建模建立和扩展能力，阶段差异主要是更新范围、数据组成与长度课程。S0 先让新连接器对齐已有骨干，随后联合训练，再逐步承担长序列成本。表中预算是训练 token 数，不是样本数，也不是每阶段单步 batch。\u003c/p>\u003cp>预训练之后，报告另有 SFT、强到弱蒸馏、RL 的后训练流程，其中 SFT 又逐步扩展上下文。复现时应对齐具体阶段的数据格式、监督 mask 和参数冻结，不把所有数据统一套成 assistant-only SFT。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>S0 冻结视觉与 LLM；不能回答成全参训练。\u003c/li>\u003cli>四阶段预训练与三个主要后训练环节不是同一个计数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么不从第一步就全部使用 256K 序列？\u003c/li>\u003cli>如何验证长上下文扩展没有损害纯文本与短图文能力？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "报告中的“四阶段”特指 S0～S3 预训练，不能把它和后训练阶段混算：\n\n| 阶段 | 可训练模块 | 数据重点 | 长度与 token 预算 |\n|---|---|---|---|\n| S0 对齐 | 仅 MLP merger；冻结视觉编码器和 LLM | 图文描述、视觉知识、OCR | 8,192；约 67B |\n| S1 多模态预训练 | 全部模块 | 图文、交错文档、grounding、VQA、STEM、少量视频，加纯文本 | 8,192；约 1T |\n| S2 长上下文预训练 | 全部模块 | 增加长文本、视频和 Agent 相关数据 | 32,768；约 1T |\n| S3 超长上下文适配 | 全部模块 | 长视频与长文档，加纯文本 | 262,144；约 100B |\n\n共同使用生成建模建立和扩展能力，阶段差异主要是更新范围、数据组成与长度课程。S0 先让新连接器对齐已有骨干，随后联合训练，再逐步承担长序列成本。表中预算是训练 token 数，不是样本数，也不是每阶段单步 batch。\n\n预训练之后，报告另有 SFT、强到弱蒸馏、RL 的后训练流程，其中 SFT 又逐步扩展上下文。复现时应对齐具体阶段的数据格式、监督 mask 和参数冻结，不把所有数据统一套成 assistant-only SFT。\nS0 冻结视觉与 LLM；不能回答成全参训练。\n四阶段预训练与三个主要后训练环节不是同一个计数。\n为什么不从第一步就全部使用 256K 序列？\n如何验证长上下文扩展没有损害纯文本与短图文能力？"}, {"id": "VLM-029", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L2", "title": "不同版本 Qwen-VL 的视觉压缩比例和连接器层数如何确认？", "tags": ["Qwen-VL", "Qwen2-VL", "Qwen3-VL", "Merger"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>必须区分版本。原始 Qwen-VL 使用带位置处理的单层 cross-attention adapter，以 256 个可学习 query 压缩视觉特征，最终长度固定为 256。这里的“单层”不是后来两层 MLP，也不等于 BLIP-2 的完整 Q-Former。\u003c/p>\u003cp>Qwen2-VL、Qwen2.5-VL 的常用配置将相邻 2×2 patch 特征并到通道，再通过两层 MLP merger 映射到 LLM，空间 token 数缩为原来的 1/4。Qwen3-VL 延续 2×2 merger，固定版本代码可看到 Linear → GELU → Linear，并有用于 DeepStack 的额外 merger；统计连接器时不要漏掉后者。\u003c/p>\u003cp>patch 大小与 merge 大小是两件事：常见 Qwen2/2.5-VL patch 为 14，空间有效步长为 28；Qwen3-VL patch 为 16，对应 32。经过 processor 对齐的 H×W 图像，合并后空间 token 约为 HW/(ps)²，p 为 patch 大小，s 为 merge 边长；视频还要计时间 patch 和帧数。实际预算以 checkpoint 配置、resize 结果及 image/video grid 为准。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>H\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>s\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 2×2 合并写成 token 数只减少一半，或把所有 Qwen-VL 都写为固定 256 token。\u003c/li>\u003cli>把 patch14、空间合并2和视频时间合并2写成同一个压缩维度。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>给定 resize 后的图像尺寸，如何从 processor 输出复核视觉 token 数？\u003c/li>\u003cli>为什么相同像素预算下还需要比较 OCR 质量，而非仅看 token 更少？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "必须区分版本。原始 Qwen-VL 使用带位置处理的单层 cross-attention adapter，以 256 个可学习 query 压缩视觉特征，最终长度固定为 256。这里的“单层”不是后来两层 MLP，也不等于 BLIP-2 的完整 Q-Former。\n\nQwen2-VL、Qwen2.5-VL 的常用配置将相邻 2×2 patch 特征并到通道，再通过两层 MLP merger 映射到 LLM，空间 token 数缩为原来的 1/4。Qwen3-VL 延续 2×2 merger，固定版本代码可看到 Linear → GELU → Linear，并有用于 DeepStack 的额外 merger；统计连接器时不要漏掉后者。\n\npatch 大小与 merge 大小是两件事：常见 Qwen2/2.5-VL patch 为 14，空间有效步长为 28；Qwen3-VL patch 为 16，对应 32。经过 processor 对齐的 H×W 图像，合并后空间 token 约为 HW/(ps)²，p 为 patch 大小，s 为 merge 边长；视频还要计时间 patch 和帧数。实际预算以 checkpoint 配置、resize 结果及 image/video grid 为准。\n把 2×2 合并写成 token 数只减少一半，或把所有 Qwen-VL 都写为固定 256 token。\n把 patch14、空间合并2和视频时间合并2写成同一个压缩维度。\n给定 resize 后的图像尺寸，如何从 processor 输出复核视觉 token 数？\n为什么相同像素预算下还需要比较 OCR 质量，而非仅看 token 更少？"}, {"id": "VLM-030", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L3", "title": "Interleaved M-RoPE 怎样改善频率分配？与文本 Qwen3 的 RoPE 有何区别？", "tags": ["Interleaved M-RoPE", "Qwen3-VL", "位置编码"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通文本 RoPE 为 token 的一维位置选择旋转角度。多模态 M-RoPE 对视觉 token 使用时间、行、列位置 t/h/w，把不同维度的旋转角度取自相应坐标；文本位置可以在三个轴上取相同值。\u003c/p>\u003cp>早期连续分段的维度分配使某些轴集中在特定频率区间。Qwen3-VL 改为在旋转频率对之间交错分配 t/h/w，让各轴都覆盖较宽的高低频范围，从而减少单个轴的频谱偏置。它交错的是位置轴对应的旋转频率，并不是把图像与文字轮流排列这种“交错图文”数据格式。具体频率数与排列依配置和实现，不必宣称所有维度都严格按 t/h/w 等数循环。\u003c/p>\u003cp>该方法仍需正确的视觉网格、position_ids 和增量 cache 位置；它不会直接减少 KV 元素数。文本 Qwen3 的原始配置采用一维 RoPE，不能因 Qwen3-VL 使用 Qwen3 骨干就把这项多模态改造归给纯文本模型。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02208;\u003c/mo>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmover>\u003cmi>q\u003c/mi>\u003cmo>&#x0007E;\u003c/mo>\u003c/mover>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003D5;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>交错频率分配与交错图文训练是不同概念。\u003c/li>\u003cli>不看模型版本与 position_ids 就声称文本 Qwen3 已使用三维视觉位置。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>当文本 token 的三个位置轴相同时，公式怎样退化为一维 RoPE？\u003c/li>\u003cli>为什么改变频率轴分配需要配套训练，而不能任意替换已有 checkpoint？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通文本 RoPE 为 token 的一维位置选择旋转角度。多模态 M-RoPE 对视觉 token 使用时间、行、列位置 t/h/w，把不同维度的旋转角度取自相应坐标；文本位置可以在三个轴上取相同值。\n\n早期连续分段的维度分配使某些轴集中在特定频率区间。Qwen3-VL 改为在旋转频率对之间交错分配 t/h/w，让各轴都覆盖较宽的高低频范围，从而减少单个轴的频谱偏置。它交错的是位置轴对应的旋转频率，并不是把图像与文字轮流排列这种“交错图文”数据格式。具体频率数与排列依配置和实现，不必宣称所有维度都严格按 t/h/w 等数循环。\n\n该方法仍需正确的视觉网格、position_ids 和增量 cache 位置；它不会直接减少 KV 元素数。文本 Qwen3 的原始配置采用一维 RoPE，不能因 Qwen3-VL 使用 Qwen3 骨干就把这项多模态改造归给纯文本模型。\n交错频率分配与交错图文训练是不同概念。\n不看模型版本与 position_ids 就声称文本 Qwen3 已使用三维视觉位置。\n当文本 token 的三个位置轴相同时，公式怎样退化为一维 RoPE？\n为什么改变频率轴分配需要配套训练，而不能任意替换已有 checkpoint？"}, {"id": "VLM-031", "category": "VLM", "topic": "模型结构与版本对比", "level": "L3", "title": "Qwen3-VL 的 DeepStack 如何注入多层视觉特征，是否把视觉 token 翻倍？", "tags": ["DeepStack", "跨层融合", "Qwen3-VL"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen3-VL 的 DeepStack 从视觉编码器的不同深度取特征，各自经过专用 merger 映射到语言隐藏维度，再加到较早语言层的对应视觉位置。报告方案使用三个视觉层级注入前三个 LLM 层；具体取层索引以 checkpoint 配置为准。基础图像 embedding 仍形成语言输入，额外分支提供较浅纹理与较深语义的补充路径。\u003c/p>\u003cp>这主要改变跨层信息通路，并非把三组特征全都追加成更长的 token 序列。因而不能把语言 KV 长度简单乘三，但额外 merger、保存的中间视觉特征和训练反向仍有计算与显存成本。模型代码用视觉位置 mask 对齐注入；多图拼接时，特征顺序错配会把另一张图的信息加到错误位置。\u003c/p>\u003cp>解释收益时应做有无 DeepStack 的相同数据、预算消融，并分别观察 OCR、文档、空间和纯文本任务，避免只拿最终模型总分证明这条通路的作用。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>&#x02113;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x02190;\u003c/mo>\u003cmsubsup>\u003cmi>h\u003c/mi>\u003cmrow>\u003cmi>&#x02113;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmo>Merger\u003c/mo>\u003cmrow>\u003cmi>&#x02113;\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>&#x02113;\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>DeepStack 不等于把多层 ViT 输出全部拼到序列末尾。\u003c/li>\u003cli>额外视觉分支不会凭空消除 OCR 分辨率限制。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>多图输入怎样保证 visual_pos_masks 与各图特征顺序一致？\u003c/li>\u003cli>冻结视觉骨干时，中间特征分支需要怎样设置计算图？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen3-VL 的 DeepStack 从视觉编码器的不同深度取特征，各自经过专用 merger 映射到语言隐藏维度，再加到较早语言层的对应视觉位置。报告方案使用三个视觉层级注入前三个 LLM 层；具体取层索引以 checkpoint 配置为准。基础图像 embedding 仍形成语言输入，额外分支提供较浅纹理与较深语义的补充路径。\n\n这主要改变跨层信息通路，并非把三组特征全都追加成更长的 token 序列。因而不能把语言 KV 长度简单乘三，但额外 merger、保存的中间视觉特征和训练反向仍有计算与显存成本。模型代码用视觉位置 mask 对齐注入；多图拼接时，特征顺序错配会把另一张图的信息加到错误位置。\n\n解释收益时应做有无 DeepStack 的相同数据、预算消融，并分别观察 OCR、文档、空间和纯文本任务，避免只拿最终模型总分证明这条通路的作用。\nDeepStack 不等于把多层 ViT 输出全部拼到序列末尾。\n额外视觉分支不会凭空消除 OCR 分辨率限制。\n多图输入怎样保证 visual_pos_masks 与各图特征顺序一致？\n冻结视觉骨干时，中间特征分支需要怎样设置计算图？"}, {"id": "VLM-032", "category": "VLM", "topic": "动态分辨率与位置编码", "level": "L2", "title": "Qwen3-VL 为什么用文本时间戳表示视频时间，采样后怎样保证对齐？", "tags": ["视频", "时间戳", "Qwen3-VL", "FPS"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen3-VL 在视频时间 patch 前加入可读的时间戳文本，使真实时间直接进入语言序列，更方便回答“何时发生”与事件定位。时间戳依原视频元数据和所选帧索引计算，而不是把抽样后帧的序号直接当秒数；同时仍保留视觉空间位置处理，所以不能说文本时间戳替代了全部视觉位置编码。\u003c/p>\u003cp>固定 FPS 原视频中，第 i 帧的时间约为 i/fps；若一个时间 patch 合并多个帧，所读固定版本 processor 用合并组首尾时间的平均值表示该 patch。可变帧率视频则应优先依据解码器给出的真实时间信息，不能机械套一个平均 FPS。重复采样、裁剪或拼接也要保持源时间和目标序列的映射。\u003c/p>\u003cp>文本时间戳会占少量上下文，细粒度定位仍受抽帧密度和视觉 token 预算限制。评测应同时看事件内容是否正确、时间误差和区间 IoU，并检查视频预处理与训练约定一致。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>采样帧号不等于真实秒数，尤其不能忽略源 FPS 与变帧率。\u003c/li>\u003cli>时间戳很精确不代表模型看过时间段内未采样的瞬时事件。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>视频裁剪之后，输出时间应使用源视频时间还是片段相对时间？\u003c/li>\u003cli>减少 FPS 对动作识别和瞬时事件定位有什么不同影响？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen3-VL 在视频时间 patch 前加入可读的时间戳文本，使真实时间直接进入语言序列，更方便回答“何时发生”与事件定位。时间戳依原视频元数据和所选帧索引计算，而不是把抽样后帧的序号直接当秒数；同时仍保留视觉空间位置处理，所以不能说文本时间戳替代了全部视觉位置编码。\n\n固定 FPS 原视频中，第 i 帧的时间约为 i/fps；若一个时间 patch 合并多个帧，所读固定版本 processor 用合并组首尾时间的平均值表示该 patch。可变帧率视频则应优先依据解码器给出的真实时间信息，不能机械套一个平均 FPS。重复采样、裁剪或拼接也要保持源时间和目标序列的映射。\n\n文本时间戳会占少量上下文，细粒度定位仍受抽帧密度和视觉 token 预算限制。评测应同时看事件内容是否正确、时间误差和区间 IoU，并检查视频预处理与训练约定一致。\n采样帧号不等于真实秒数，尤其不能忽略源 FPS 与变帧率。\n时间戳很精确不代表模型看过时间段内未采样的瞬时事件。\n视频裁剪之后，输出时间应使用源视频时间还是片段相对时间？\n减少 FPS 对动作识别和瞬时事件定位有什么不同影响？"}, {"id": "OMM-001", "category": "OMM", "topic": "视频采样与时序", "level": "L2", "title": "视频 VLM 为什么不能简单无限堆叠视频帧？", "tags": ["视频", "抽帧"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>增加视频帧会增加视觉 token 和语言上下文开销，而相邻帧常含大量重复信息。抽帧要兼顾事件覆盖与细节，可按任务比较均匀采样、变化采样或分段检索，并保留时间戳；盲目增帧可能更慢，也仍会遗漏短事件。\u003c/p>\u003cp>按帧数、每帧 token 和文本长度估计总序列。均匀抽帧覆盖时间范围，关键帧策略可能偏向视觉变化；图像视频联合训练还需统一表示和输入协议。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>抽帧序号不能代替真实时间，尤其对可变帧率视频。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>一分钟短视频和两小时视频如何设不同预算？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "增加视频帧会增加视觉 token 和语言上下文开销，而相邻帧常含大量重复信息。抽帧要兼顾事件覆盖与细节，可按任务比较均匀采样、变化采样或分段检索，并保留时间戳；盲目增帧可能更慢，也仍会遗漏短事件。\n\n按帧数、每帧 token 和文本长度估计总序列。均匀抽帧覆盖时间范围，关键帧策略可能偏向视觉变化；图像视频联合训练还需统一表示和输入协议。\n抽帧序号不能代替真实时间，尤其对可变帧率视频。\n一分钟短视频和两小时视频如何设不同预算？"}, {"id": "OMM-002", "category": "OMM", "topic": "视频采样与时序", "level": "L2", "title": "视频时间位置编码为什么要考虑真实时间与 FPS？", "tags": ["视频", "时间戳"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>同一帧序号在不同采样率下对应不同真实时刻，仅用帧号会混淆速度和事件间隔。Qwen2.5-VL 将时间位置关联到绝对时间，并用动态 FPS 采样呈现不同采样密度的数据。\u003c/p>\u003cp>输入需记录该帧在原视频中的时刻，统一时间单位，而非只记取出的第几帧。时间表达仍需定位任务训练，评测要检查预测范围、误差和短事件召回。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>时间编码改进不能保证模型自动精确定位所有事件。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>视频被倍速播放时哪些标签需要调整？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "同一帧序号在不同采样率下对应不同真实时刻，仅用帧号会混淆速度和事件间隔。Qwen2.5-VL 将时间位置关联到绝对时间，并用动态 FPS 采样呈现不同采样密度的数据。\n\n输入需记录该帧在原视频中的时刻，统一时间单位，而非只记取出的第几帧。时间表达仍需定位任务训练，评测要检查预测范围、误差和短事件召回。\n时间编码改进不能保证模型自动精确定位所有事件。\n视频被倍速播放时哪些标签需要调整？"}, {"id": "OMM-003", "category": "OMM", "topic": "视频采样与时序", "level": "L3", "title": "长视频理解怎样压缩视觉 token，又有什么代价？", "tags": ["视频压缩", "时空建模"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>长视频可通过空间池化、时空连接器、分段摘要或检索压缩视觉 token。VideoLLaMA 2 的时空连接器强调联合建模空间与时间；分段处理应携带时间边界，避免用摘要覆盖原始证据。\u003c/p>\u003cp>压缩降低成本，也可能抹掉短事件、局部细节和事件顺序。要按任务保留证据，比较压缩前后的定位与问答效果；细粒度动作题通常需要比主题总结更高的保真预算，不能只看最终文本是否流畅。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>平均所有帧特征会丢失部分顺序信息。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样设计时间顺序交换的消融测试？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "长视频可通过空间池化、时空连接器、分段摘要或检索压缩视觉 token。VideoLLaMA 2 的时空连接器强调联合建模空间与时间；分段处理应携带时间边界，避免用摘要覆盖原始证据。\n\n压缩降低成本，也可能抹掉短事件、局部细节和事件顺序。要按任务保留证据，比较压缩前后的定位与问答效果；细粒度动作题通常需要比主题总结更高的保真预算，不能只看最终文本是否流畅。\n平均所有帧特征会丢失部分顺序信息。\n怎样设计时间顺序交换的消融测试？"}, {"id": "OMM-004", "category": "OMM", "topic": "视频采样与时序", "level": "L2", "title": "视频 moment retrieval 与视频问答如何评估？", "tags": ["视频定位", "tIoU"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>视频问答通常评估答案，moment retrieval 还需输出与语言查询对应的起止时刻。Moment-DETR 将片段坐标与显著性作为不同目标，评测可用时间区间交并比 tIoU 和阈值召回衡量定位，并与显著性评分分开报告。\u003c/p>\u003cp>设预测和真实区间分别为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>，交集长度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math>，tIoU 是交集长度除以并集长度，适用于两个非零时长区间。按短片段、重复动作和多个正确片段分别检查；答案正确不代表定位正确。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>I\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>max\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>tIoU\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把时间 IoU 当作逐帧分类准确率。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>有多个有效片段时怎样定义召回？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "视频问答通常评估答案，moment retrieval 还需输出与语言查询对应的起止时刻。Moment-DETR 将片段坐标与显著性作为不同目标，评测可用时间区间交并比 tIoU 和阈值召回衡量定位，并与显著性评分分开报告。\n\n设预测和真实区间分别为 $[s_p,e_p]$ 与 $[s_g,e_g]$，交集长度为 $I$，tIoU 是交集长度除以并集长度，适用于两个非零时长区间。按短片段、重复动作和多个正确片段分别检查；答案正确不代表定位正确。\n不要把时间 IoU 当作逐帧分类准确率。\n有多个有效片段时怎样定义召回？"}, {"id": "OMM-005", "category": "OMM", "topic": "语音识别与编码", "level": "L1", "title": "Whisper 的输入、架构和多任务接口是什么？", "tags": ["Whisper", "ASR"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Whisper 先将音频转换为 log-Mel 频谱，由编码器提取表示，再通过自回归文本解码器生成识别、翻译或时间戳等 token，任务和语言由特殊 token 指定。\u003c/p>\u003cp>原始模型以 30 秒音频段训练，长音频需分窗和时间对齐，并处理跨窗口的重复、遗漏与上下文传播。它不能直接视为无延迟流式识别器，静音、音乐和噪声样本还需单独评估错误转写。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>转写保留源语言，翻译与转写并非同一任务。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>分窗边界落在词中间时怎样处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Whisper 先将音频转换为 log-Mel 频谱，由编码器提取表示，再通过自回归文本解码器生成识别、翻译或时间戳等 token，任务和语言由特殊 token 指定。\n\n原始模型以 30 秒音频段训练，长音频需分窗和时间对齐，并处理跨窗口的重复、遗漏与上下文传播。它不能直接视为无延迟流式识别器，静音、音乐和噪声样本还需单独评估错误转写。\n转写保留源语言，翻译与转写并非同一任务。\n分窗边界落在词中间时怎样处理？"}, {"id": "OMM-006", "category": "OMM", "topic": "语音识别与编码", "level": "L1", "title": "WER 怎样计算？为什么中文 ASR 常同时报 CER？", "tags": ["WER", "CER", "ASR评估"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>WER 在词级对齐预测与参考，将替换 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/math>、删除 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math>、插入 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/math> 的总数除以参考词数 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>；参考词数等于正确、替换和删除的数量之和。CER 则在字符级对齐并使用参考字符数。\u003c/p>\u003cp>中文分词规则影响 WER，CER 更便于比较，但仍须统一标点、数字和大小写规范。corpus WER 应先汇总错误数和参考词数再相除；插入可使 WER 超过 100%，空参考需明确协议。业务上还应报告关键实体错误率。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>WER\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>S\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要无条件平均每句 WER，短句会被过度加权。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>数字格式不同但含义相同如何归一化？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "WER 在词级对齐预测与参考，将替换 $S$、删除 $D$、插入 $I$ 的总数除以参考词数 $N_{\\mathrm{ref}}$；参考词数等于正确、替换和删除的数量之和。CER 则在字符级对齐并使用参考字符数。\n\n中文分词规则影响 WER，CER 更便于比较，但仍须统一标点、数字和大小写规范。corpus WER 应先汇总错误数和参考词数再相除；插入可使 WER 超过 100%，空参考需明确协议。业务上还应报告关键实体错误率。\n不要无条件平均每句 WER，短句会被过度加权。\n数字格式不同但含义相同如何归一化？"}, {"id": "OMM-007", "category": "OMM", "topic": "语音识别与编码", "level": "L2", "title": "CTC 与自回归语音解码有什么区别？", "tags": ["CTC", "ASR"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>CTC 对所有能折叠成目标文本的单调对齐路径求和，用 blank 连接音频帧与文本。折叠映射 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math> 合并重复并移除 blank；输入时间步通常要足够覆盖目标和重复符号。它不显式逐步条件于已生成文本，但可配合外部语言模型解码，不能说完全没有语言信息。\u003c/p>\u003cp>自回归解码逐 token 依赖历史输出，适合多任务接口，却有串行解码成本。两者在并行性、语言建模和对齐假设上各有取舍。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmi mathvariant=\"normal\">T\u003c/mi>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>:\u003c/mi>\u003cmspace width=\"0.167em\" />\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003C0;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>y\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmunder>\u003cmo>&#x0220F;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/munder>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003C0;\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>相邻重复标签折叠与 blank 的处理顺序要明确。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么重复字符会增加 CTC 的最小输入长度？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "CTC 对所有能折叠成目标文本的单调对齐路径求和，用 blank 连接音频帧与文本。折叠映射 $B$ 合并重复并移除 blank；输入时间步通常要足够覆盖目标和重复符号。它不显式逐步条件于已生成文本，但可配合外部语言模型解码，不能说完全没有语言信息。\n\n自回归解码逐 token 依赖历史输出，适合多任务接口，却有串行解码成本。两者在并行性、语言建模和对齐假设上各有取舍。\n相邻重复标签折叠与 blank 的处理顺序要明确。\n为什么重复字符会增加 CTC 的最小输入长度？"}, {"id": "OMM-008", "category": "OMM", "topic": "语音识别与编码", "level": "L2", "title": "音频连续特征与离散 codec token 分别适合什么？", "tags": ["EnCodec", "音频表示"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>连续音频特征常用于理解与跨模态对齐，强调语义和任务信息；离散 codec token 将波形压缩成可生成的符号序列，强调重建质量，适合语音语言模型。\u003c/p>\u003cp>残差向量量化逐层编码剩余误差，形成多个码本。增加码本可改善重建细节，也增加生成预测负担；比较表示时需同时看帧率、码本数量、时延、可懂度、音色、失真与 token 预算。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>离散音频 token 不是字符 token，也不天然只保留语义。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么低比特率 codec 可能损害细节理解？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "连续音频特征常用于理解与跨模态对齐，强调语义和任务信息；离散 codec token 将波形压缩成可生成的符号序列，强调重建质量，适合语音语言模型。\n\n残差向量量化逐层编码剩余误差，形成多个码本。增加码本可改善重建细节，也增加生成预测负担；比较表示时需同时看帧率、码本数量、时延、可懂度、音色、失真与 token 预算。\n离散音频 token 不是字符 token，也不天然只保留语义。\n为什么低比特率 codec 可能损害细节理解？"}, {"id": "OMM-009", "category": "OMM", "topic": "语音生成与流式", "level": "L2", "title": "VALL-E 式零样本 TTS 为什么能利用短语音提示？", "tags": ["VALL-E", "TTS"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>VALL-E 将文本到语音建模为声学 codec token 生成。文本约束内容，短参考语音提供说话人特征和声学条件，因此可不为该说话人单独微调就合成语音。\u003c/p>\u003cp>多个 codec 层的生成安排要权衡质量与时延。效果仍受参考质量、语言覆盖和模型数据分布影响，评测需分别检查可懂度、说话人相似度及鲁棒性。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>零样本不表示训练集中不存在类似声学条件。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>嘈杂提示会如何影响合成输出？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "VALL-E 将文本到语音建模为声学 codec token 生成。文本约束内容，短参考语音提供说话人特征和声学条件，因此可不为该说话人单独微调就合成语音。\n\n多个 codec 层的生成安排要权衡质量与时延。效果仍受参考质量、语言覆盖和模型数据分布影响，评测需分别检查可懂度、说话人相似度及鲁棒性。\n零样本不表示训练集中不存在类似声学条件。\n嘈杂提示会如何影响合成输出？"}, {"id": "OMM-010", "category": "OMM", "topic": "语音识别与编码", "level": "L2", "title": "Qwen2-Audio 这类音频理解模型为什么不等于 ASR？", "tags": ["Qwen2-Audio", "音频理解"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>ASR 主要将语音转为文字，音频理解还包括声音事件、音乐、说话风格及依赖声学证据的问答。音频编码器接入 LLM 后，需有覆盖这些目标的训练和评估；只把转写文本交给 LLM 会丢失部分非语言信息。\u003c/p>\u003cp>分别评估语音内容、环境声音和声学属性，区分文本提示与直接语音指令的交互方式。通过去除语音、替换背景声等对照，检查答案是否真正依赖音频。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把转写准确率当所有音频理解任务的上限。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>同一句话不同语气如何构造评测？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "ASR 主要将语音转为文字，音频理解还包括声音事件、音乐、说话风格及依赖声学证据的问答。音频编码器接入 LLM 后，需有覆盖这些目标的训练和评估；只把转写文本交给 LLM 会丢失部分非语言信息。\n\n分别评估语音内容、环境声音和声学属性，区分文本提示与直接语音指令的交互方式。通过去除语音、替换背景声等对照，检查答案是否真正依赖音频。\n不要把转写准确率当所有音频理解任务的上限。\n同一句话不同语气如何构造评测？"}, {"id": "OMM-011", "category": "OMM", "topic": "Omni 融合与评测", "level": "L2", "title": "Qwen2.5-Omni 的 Thinker-Talker 如何协作？", "tags": ["Omni", "Thinker-Talker"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Qwen2.5-Omni 的 Thinker 用音频和图像编码器接入文本解码主干，处理多模态输入并生成文本及高层表示；Talker 接收连续表示与离散文本 token，兼顾语义和发音，生成流式语音 token。\u003c/p>\u003cp>两者支持联合训练，音视频输入通过时间对齐的位置表达关联。该方式不同于先生成完整文本，再调用独立 TTS；流式音频解码还需控制感受野、分块和首包延迟。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不要把 Omni 模型的全部输入或输出都说成离散 token。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>TMRoPE 对同步音视频输入有什么帮助？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Qwen2.5-Omni 的 Thinker 用音频和图像编码器接入文本解码主干，处理多模态输入并生成文本及高层表示；Talker 接收连续表示与离散文本 token，兼顾语义和发音，生成流式语音 token。\n\n两者支持联合训练，音视频输入通过时间对齐的位置表达关联。该方式不同于先生成完整文本，再调用独立 TTS；流式音频解码还需控制感受野、分块和首包延迟。\n不要把 Omni 模型的全部输入或输出都说成离散 token。\nTMRoPE 对同步音视频输入有什么帮助？"}, {"id": "OMM-012", "category": "OMM", "topic": "语音生成与流式", "level": "L3", "title": "ASR→LLM→TTS 流水线与端到端语音对话怎样选？", "tags": ["语音对话", "端到端"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>ASR→LLM→TTS 流水线便于检查中间文本、接工具和替换组件，但转写可能丢失韵律，并累积延迟。端到端语音模型可保留更多声学信息、实现多流对话，但需要更复杂的数据
