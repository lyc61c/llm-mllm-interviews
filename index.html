2Zz4K\" alt=\"LoRA 冻结主权重与低秩增量分支\">\u003cfigcaption>常用初始化使增量起始为零；图中采用列向量约定。\u003c/figcaption>\u003c/figure>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 LoRA 说成对原模型权重做截断 SVD。\u003c/li>\u003cli>漏掉不同目标模块的数量，误报总训练参数量。\u003c/li>\u003cli>“LoRA 无额外推理延迟”依赖合并或有效融合实现；未合并分支并非天然零开销。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何估算同时对 Q/K/V/O 与 FFN 加 LoRA 的参数量？\u003c/li>\u003cli>量化底座合并 LoRA 有什么精度风险？\u003c/li>\u003cli>多租户共享一个底座时，为什么离线合并每个 adapter 可能增加总权重内存？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LoRA 冻结 $W_0\\in\\mathbb R^{d_{\\rm out}\\times d_{\\rm in}}$，学习 $\\Delta W=(\\alpha/r)BA$，其中 $A\\in\\mathbb R^{r\\times d_{\\rm in}}$、$B\\in\\mathbb R^{d_{\\rm out}\\times r}$。更新秩至多为 $r$，可训练参数为 $r(d_{\\rm in}+d_{\\rm out})$，不要求底座或整个模型低秩。\n\n前向为 $W_0x+(\\alpha/r)BAx$，梯度能经过冻结底座传播到需要训练的模块。标准浮点部署可合并增量，免去额外小投影；需要多适配器切换时则未必合并。LoRA 主要节省权重梯度与优化器状态，长序列激活仍可能主导显存。\n\n合并要求底座与 adapter 的 checkpoint、目标层、缩放和 dtype 对齐，并在 eval 模式关闭 adapter dropout。浮点权重 $W_{\\mathrm{merged}}=W_0+sBA$ 免去额外低秩分支，通常减少内核调用；但不会把大模型权重变成“小 adapter 大小”。低精度舍入使结果未必逐 bit 相同，应比对 logits 与任务结果。保留未合并 adapter 有利于共享底座、多租户切换和回滚；merge_and_unload 后应保留独立原件。量化底座的合并受量化后端支持限制，不能把浮点增量直接加到整数码，必要时反量化合并并重新校准量化。\n把 LoRA 说成对原模型权重做截断 SVD。\n漏掉不同目标模块的数量，误报总训练参数量。\n“LoRA 无额外推理延迟”依赖合并或有效融合实现；未合并分支并非天然零开销。\n如何估算同时对 Q/K/V/O 与 FFN 加 LoRA 的参数量？\n量化底座合并 LoRA 有什么精度风险？\n多租户共享一个底座时，为什么离线合并每个 adapter 可能增加总权重内存？"}, {"id": "FT-006", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "LoRA 怎样初始化，r、alpha 与 dropout 各控制什么？", "tags": ["LoRA", "初始化", "梯度", "Dropout", "PEFTDefaults", "rsLoRA"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>原始 LoRA 使用随机高斯 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math>、零 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/math>，使初始 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>。PEFT 普通 Linear 默认采用 Kaiming-uniform A、零 B，Gaussian 选项也使用零 B；Embedding 等模块可能有不同约定，其他初始化则应按方法确认。\u003c/p>\u003cp>令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/math>，有 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>G\u003c/mi>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>G\u003c/mi>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>。初始 B 为零时，纯低秩分支的 A 梯度为零，B 通常先更新，随后 A 获得梯度；A/B 同时为零则纯 BA 路径无法启动，零 A 加随机 B 是可启动但轨迹不同的方案。PiSSA、EVA、LoftQ 等使用权重、激活或量化信息，要核对是否改动底座及是否保持初始函数；\u003ccode>init_lora_weights=False\u003c/code> 通常随机初始化 A/B，不再是 no-op。\u003c/p>\u003cp>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 控制秩上界与参数量，标准 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 控制分支尺度，rsLoRA 使用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmi>r\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>。固定 alpha 改 rank 同时改变容量和缩放，alpha 也不等于学习率。普通 Linear 的 dropout 施加在低秩分支输入，训练时正则、eval 时关闭，底座分支保留。应联合消融 rank、alpha、dropout、目标模块与学习率，没有通用最佳 rank 或 alpha:rank 比例。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02264;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmi>r\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>G\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>G\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>G\u003c/mi>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把原论文高斯初始化、PEFT Linear 默认和所有新初始化变体说成完全相同。\u003c/li>\u003cli>双零 A/B、默认 no-op 与训练阶段梯度为零混为一谈，或把 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003c/mrow>\u003c/math> 当作优化器学习率。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何检查添加 adapter 前后初始输出一致，以及第一步 A/B 的梯度？\u003c/li>\u003cli>增大 r 时怎样控制缩放和优化超参数以比较容量收益？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "原始 LoRA 使用随机高斯 $A$、零 $B$，使初始 $\\Delta W=sBA=0$。PEFT 普通 Linear 默认采用 Kaiming-uniform A、零 B，Gaussian 选项也使用零 B；Embedding 等模块可能有不同约定，其他初始化则应按方法确认。\n\n令 $G=\\partial L/\\partial\\Delta W$，有 $\\partial L/\\partial A=sB^\\top G$、$\\partial L/\\partial B=sGA^\\top$。初始 B 为零时，纯低秩分支的 A 梯度为零，B 通常先更新，随后 A 获得梯度；A/B 同时为零则纯 BA 路径无法启动，零 A 加随机 B 是可启动但轨迹不同的方案。PiSSA、EVA、LoftQ 等使用权重、激活或量化信息，要核对是否改动底座及是否保持初始函数；`init_lora_weights=False` 通常随机初始化 A/B，不再是 no-op。\n\n$r$ 控制秩上界与参数量，标准 $s=\\alpha/r$ 控制分支尺度，rsLoRA 使用 $\\alpha/\\sqrt r$。固定 alpha 改 rank 同时改变容量和缩放，alpha 也不等于学习率。普通 Linear 的 dropout 施加在低秩分支输入，训练时正则、eval 时关闭，底座分支保留。应联合消融 rank、alpha、dropout、目标模块与学习率，没有通用最佳 rank 或 alpha:rank 比例。\n把原论文高斯初始化、PEFT Linear 默认和所有新初始化变体说成完全相同。\n双零 A/B、默认 no-op 与训练阶段梯度为零混为一谈，或把 $\\alpha$ 当作优化器学习率。\n如何检查添加 adapter 前后初始输出一致，以及第一步 A/B 的梯度？\n增大 r 时怎样控制缩放和优化超参数以比较容量收益？"}, {"id": "FT-007", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "LoRA 的 rank、alpha、dropout 和 target_modules 应怎么调？", "tags": ["LoRA", "超参数", "Ablation", "Dropout", "rsLoRA"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LoRA 调参需要一起考虑更新容量、分支尺度、正则与适配位置。Rank 的参数预算线性增长，更新秩仅满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02264;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>，实际容量收益可能饱和或过拟合；比较时控制数据、有效 token、目标模块和学习率，并看验证指标、参数量与吞吐。\u003c/p>\u003cp>标准缩放为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>，\u003ccode>use_rslora=True\u003c/code> 为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmi>r\u003c/mi>\u003c/msqrt>\u003c/mrow>\u003c/math>。固定 alpha 增大 rank 会减小标准分支尺度，固定 alpha/r 也不能保证优化轨迹相同，因此可在同一缩放家族内分别消融容量与尺度。普通 Linear 分支是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，它不删除底座权重，eval 时关闭；小数据可检查正则收益，过大 dropout 也会欠拟合，且它与全模型 attention/hidden dropout 配置不同。\u003c/p>\u003cp>\u003ccode>target_modules\u003c/code> 决定更新位置，可比较 attention 投影、MLP 或 \u003ccode>all-linear\u003c/code>，并核对输出层排除、embedding/LM head 保存及额外 trainable bias。常见 Q/V 实验不意味着 LoRA 只支持 Q/V。记录 PEFT 版本、初始化、缩放变体、优化器和成本；库默认不是数据相关实验中的最优值。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>h\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>Dropout\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>s\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">R\u003c/mi>\u003cmi mathvariant=\"normal\">A\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmi>r\u003c/mi>\u003c/msqrt>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>给所有模型套 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 等万能值，或声称 dropout 在推理时继续增强多样性。\u003c/li>\u003cli>改变 rank/模块/缩放后仍把消融结果归因于单个因素。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>扩展 \u003ccode>target_modules\u003c/code> 和增大 r，怎样在相同训练参数预算下比较？\u003c/li>\u003cli>为什么相同 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B1;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math> 仍不能保证两个 rank 的有效更新相同？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LoRA 调参需要一起考虑更新容量、分支尺度、正则与适配位置。Rank 的参数预算线性增长，更新秩仅满足 $\\operatorname{rank}(\\Delta W)\\le r$，实际容量收益可能饱和或过拟合；比较时控制数据、有效 token、目标模块和学习率，并看验证指标、参数量与吞吐。\n\n标准缩放为 $s=\\alpha/r$，`use_rslora=True` 为 $\\alpha/\\sqrt r$。固定 alpha 增大 rank 会减小标准分支尺度，固定 alpha/r 也不能保证优化轨迹相同，因此可在同一缩放家族内分别消融容量与尺度。普通 Linear 分支是 $sBA\\operatorname{Dropout}(x)$，它不删除底座权重，eval 时关闭；小数据可检查正则收益，过大 dropout 也会欠拟合，且它与全模型 attention/hidden dropout 配置不同。\n\n`target_modules` 决定更新位置，可比较 attention 投影、MLP 或 `all-linear`，并核对输出层排除、embedding/LM head 保存及额外 trainable bias。常见 Q/V 实验不意味着 LoRA 只支持 Q/V。记录 PEFT 版本、初始化、缩放变体、优化器和成本；库默认不是数据相关实验中的最优值。\n给所有模型套 $r=8$、$\\alpha=2r$ 等万能值，或声称 dropout 在推理时继续增强多样性。\n改变 rank/模块/缩放后仍把消融结果归因于单个因素。\n扩展 `target_modules` 和增大 r，怎样在相同训练参数预算下比较？\n为什么相同 $\\alpha/r$ 仍不能保证两个 rank 的有效更新相同？"}, {"id": "FT-008", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "LoRA 与 QLoRA 有何区别，NF4、双重量化与分页优化器做什么？", "tags": ["QLoRA", "NF4", "量化训练", "LoRAComparison", "StorageVsCompute"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LoRA 本身不要求量化，通常在 FP16/BF16 底座上训练低秩分支；QLoRA 将冻结底座以 4-bit 形式存储，计算时按块反量化到较高精度，再与可训练 adapter 组合。梯度通过底座计算传到 adapter，但不更新量化底座；权重存储位宽与 GEMM 的 compute dtype 必须区分。\u003c/p>\u003cp>NF4 为近似正态权重设计非均匀码本和块 scale，是有损量化，不等同于线性 INT4。Double Quantization 压缩第一层量化的 scale 等常数，不是再次量化同一权重以提高精度；加载 4-bit 权重也不自动意味着复现完整 QLoRA 配方。\u003c/p>\u003cp>Paged optimizer 借助分页或统一内存管理优化器状态峰值，缓解瞬时显存压力，也可能产生 CPU/GPU 迁移开销；它不压缩激活。长序列的 attention 激活、反量化工作区、adapter 梯度和状态、batch 与 checkpoint 策略仍可决定是否 OOM。\u003c/p>\u003cp>QLoRA 主要改善底座存储和训练可行性，速度与精度要按硬件、内核、权重分布和任务实测。合并部署可先反量化底座、加 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 再量化，但会引入新误差，不能直接把浮点增量加到整数码；应比较未合并、合并与重新量化的输出。\u003c/p>\u003cp>例如 NF4 存储配 BF16 compute 是“4-bit 冻结权重 + 较高精度算子”，并非全部运算采用 4 bit；BF16 指数范围较宽，FP16 要注意溢出与 loss scaling，选择取决于 GPU 和内核支持。LoRA 底座仍约占 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> bytes；QLoRA 的理想权重码约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math> bytes，另外有 scale、未量化层和反量化工作区。两者的 adapter 参数量 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 相同：若按低精度参数/梯度、FP32 master 和两个 Adam 状态估算，可训练状态约 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>16\u003c/mn>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> bytes，但实际 dtype 与优化器应逐项核对。冻结底座不会删除为训练 adapter 所需的中间激活，所以不能仅凭 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math> 判断训练显存。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>Dequantize\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>s\u003c/mi>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>QLoRA 训练全部 INT4 权重，或把 4-bit 权重容量当作训练总显存。\u003c/li>\u003cli>LoRA 与 QLoRA 是互斥算法，或 QLoRA 在所有任务都与浮点 LoRA 等精度且更快。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>LoRA/QLoRA 的公平比较要统一哪些模块、数据、初始化及评测条件？\u003c/li>\u003cli>为什么长上下文训练的显存瓶颈可能从权重转移到激活？\u003c/li>\u003cli>长序列时，为什么 QLoRA 相对浮点 LoRA 的节省比例可能变小？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LoRA 本身不要求量化，通常在 FP16/BF16 底座上训练低秩分支；QLoRA 将冻结底座以 4-bit 形式存储，计算时按块反量化到较高精度，再与可训练 adapter 组合。梯度通过底座计算传到 adapter，但不更新量化底座；权重存储位宽与 GEMM 的 compute dtype 必须区分。\n\nNF4 为近似正态权重设计非均匀码本和块 scale，是有损量化，不等同于线性 INT4。Double Quantization 压缩第一层量化的 scale 等常数，不是再次量化同一权重以提高精度；加载 4-bit 权重也不自动意味着复现完整 QLoRA 配方。\n\nPaged optimizer 借助分页或统一内存管理优化器状态峰值，缓解瞬时显存压力，也可能产生 CPU/GPU 迁移开销；它不压缩激活。长序列的 attention 激活、反量化工作区、adapter 梯度和状态、batch 与 checkpoint 策略仍可决定是否 OOM。\n\nQLoRA 主要改善底座存储和训练可行性，速度与精度要按硬件、内核、权重分布和任务实测。合并部署可先反量化底座、加 $sBA$ 再量化，但会引入新误差，不能直接把浮点增量加到整数码；应比较未合并、合并与重新量化的输出。\n\n例如 NF4 存储配 BF16 compute 是“4-bit 冻结权重 + 较高精度算子”，并非全部运算采用 4 bit；BF16 指数范围较宽，FP16 要注意溢出与 loss scaling，选择取决于 GPU 和内核支持。LoRA 底座仍约占 $2P$ bytes；QLoRA 的理想权重码约 $P/2$ bytes，另外有 scale、未量化层和反量化工作区。两者的 adapter 参数量 $P_a$ 相同：若按低精度参数/梯度、FP32 master 和两个 Adam 状态估算，可训练状态约 $16P_a$ bytes，但实际 dtype 与优化器应逐项核对。冻结底座不会删除为训练 adapter 所需的中间激活，所以不能仅凭 $P/2$ 判断训练显存。\nQLoRA 训练全部 INT4 权重，或把 4-bit 权重容量当作训练总显存。\nLoRA 与 QLoRA 是互斥算法，或 QLoRA 在所有任务都与浮点 LoRA 等精度且更快。\nLoRA/QLoRA 的公平比较要统一哪些模块、数据、初始化及评测条件？\n为什么长上下文训练的显存瓶颈可能从权重转移到激活？\n长序列时，为什么 QLoRA 相对浮点 LoRA 的节省比例可能变小？"}, {"id": "FT-009", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "Adapter、Prompt-Tuning 与 Prefix-Tuning 有何差别？", "tags": ["Adapter", "PromptTuning", "PrefixTuning"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Adapter 在网络中增加可训练模块，常由降维、非线性、升维和残差组成，参数量由瓶颈维度决定。Prompt-Tuning 学习输入层软提示，虚拟 token 不必对应可读词，也不等同于手写文本 prompt。Prefix-Tuning 给 attention 增加连续前缀，可经重参数化产生多层 K/V，具体实现依架构而异。\u003c/p>\u003cp>这些方法都可冻结底座，但插入位置、容量与开销不同：软前缀占序列或 KV 预算，Adapter 的额外算子可能影响时延与内核融合。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把所有 soft prompt 方法都叫输入 embedding 调参。\u003c/li>\u003cli>说 Prefix-Tuning 完全没有服务时开销。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>参数量相同时哪些实验能比较表达能力？\u003c/li>\u003cli>离散 prompt 与软提示怎样保存和部署？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Adapter 在网络中增加可训练模块，常由降维、非线性、升维和残差组成，参数量由瓶颈维度决定。Prompt-Tuning 学习输入层软提示，虚拟 token 不必对应可读词，也不等同于手写文本 prompt。Prefix-Tuning 给 attention 增加连续前缀，可经重参数化产生多层 K/V，具体实现依架构而异。\n\n这些方法都可冻结底座，但插入位置、容量与开销不同：软前缀占序列或 KV 预算，Adapter 的额外算子可能影响时延与内核融合。\n把所有 soft prompt 方法都叫输入 embedding 调参。\n说 Prefix-Tuning 完全没有服务时开销。\n参数量相同时哪些实验能比较表达能力？\n离散 prompt 与软提示怎样保存和部署？"}, {"id": "FT-010", "category": "FT", "topic": "指令数据与训练目标", "level": "L2", "title": "SFT 数据量越大越好吗，怎样构建高质量指令集？", "tags": ["数据质量", "SFT", "LIMA"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>SFT 数据是否有效取决于答案正确性、任务覆盖与真实请求分布，增加数量不一定改善效果。可先用高质量种子构建任务、难度、语言、格式和拒答边界矩阵，再按实际分布补齐，清理重复和冲突；少样本论文结果不能推广为所有场景都只需少量数据。\u003c/p>\u003cp>可验证任务用规则或执行器核验，开放回答用明确标准和抽审。按来源、模板或任务组切分，避免近重复跨训练与验证；在固定 token 预算下比较质量和配比，同时记录通用回归及边缘案例。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>LIMA 使用少量优质数据，就断言规模不重要。\u003c/li>\u003cli>单纯把相同模板扩写数万条当成丰富覆盖。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何区分模型底座能力不足与 SFT 覆盖不足？\u003c/li>\u003cli>同一 prompt 多个冲突答案怎么处理？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "SFT 数据是否有效取决于答案正确性、任务覆盖与真实请求分布，增加数量不一定改善效果。可先用高质量种子构建任务、难度、语言、格式和拒答边界矩阵，再按实际分布补齐，清理重复和冲突；少样本论文结果不能推广为所有场景都只需少量数据。\n\n可验证任务用规则或执行器核验，开放回答用明确标准和抽审。按来源、模板或任务组切分，避免近重复跨训练与验证；在固定 token 预算下比较质量和配比，同时记录通用回归及边缘案例。\nLIMA 使用少量优质数据，就断言规模不重要。\n单纯把相同模板扩写数万条当成丰富覆盖。\n如何区分模型底座能力不足与 SFT 覆盖不足？\n同一 prompt 多个冲突答案怎么处理？"}, {"id": "FT-011", "category": "FT", "topic": "指令数据与训练目标", "level": "L2", "title": "用模型生成 SFT 数据怎样避免错误与同质化？", "tags": ["SyntheticData", "SelfInstruct", "数据验证"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>模型合成 SFT 数据能降低标注成本，也会把教师的错误、风格偏差和有限覆盖传给学生。应先确定能力缺口，再生成多样候选、验证正确性与去重，保留真实或人工数据对照；模型自评高分不能当作事实正确的证据。\u003c/p>\u003cp>Self-Instruct 以种子任务生成指令和回答后过滤无效、相似样本。代码、数学和结构化任务优先用执行器、测试或确定性规则，多提示、来源与难度组合还需统计模板和语义重复。用独立真实验证集比较真实/合成配比，并追踪教师的系统性错误。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>只用同一个模型生成并自评分，认为已独立验证。\u003c/li>\u003cli>把生成条数当作有效独立样本数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>教师强于学生时怎样控制任务难度？\u003c/li>\u003cli>蒸馏风格和蒸馏能力有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "模型合成 SFT 数据能降低标注成本，也会把教师的错误、风格偏差和有限覆盖传给学生。应先确定能力缺口，再生成多样候选、验证正确性与去重，保留真实或人工数据对照；模型自评高分不能当作事实正确的证据。\n\nSelf-Instruct 以种子任务生成指令和回答后过滤无效、相似样本。代码、数学和结构化任务优先用执行器、测试或确定性规则，多提示、来源与难度组合还需统计模板和语义重复。用独立真实验证集比较真实/合成配比，并追踪教师的系统性错误。\n只用同一个模型生成并自评分，认为已独立验证。\n把生成条数当作有效独立样本数。\n教师强于学生时怎样控制任务难度？\n蒸馏风格和蒸馏能力有什么区别？"}, {"id": "FT-012", "category": "FT", "topic": "训练技巧与排错", "level": "L2", "title": "微调后的灾难性遗忘怎样发现和缓解？", "tags": ["CatastrophicForgetting", "ContinualLearning", "回归"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>灾难性遗忘表现为新任务改善、旧能力明显退化。用固定通用与领域评测分别检查新旧任务、指令格式和边界行为，先排除模板错配等实现问题，再考虑混入代表性旧样本、降低学习率和更新范围、早停或正则约束。\u003c/p>\u003cp>Replay 的配比会影响领域收益，参数重要性正则等持续学习方法也需按任务和成本验证。PEFT 可以减少部分风险，但冻结底座不保证带适配器的输出不退化。保留底座和适配器版本可回滚，仍应完成上线前回归。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>LoRA 不修改底座，因此部署输出永远不可能遗忘。\u003c/li>\u003cli>只用新的 validation set 做早停。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>混入通用数据为何可能削弱领域适配？\u003c/li>\u003cli>怎样区分真实遗忘与生成参数变化？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "灾难性遗忘表现为新任务改善、旧能力明显退化。用固定通用与领域评测分别检查新旧任务、指令格式和边界行为，先排除模板错配等实现问题，再考虑混入代表性旧样本、降低学习率和更新范围、早停或正则约束。\n\nReplay 的配比会影响领域收益，参数重要性正则等持续学习方法也需按任务和成本验证。PEFT 可以减少部分风险，但冻结底座不保证带适配器的输出不退化。保留底座和适配器版本可回滚，仍应完成上线前回归。\nLoRA 不修改底座，因此部署输出永远不可能遗忘。\n只用新的 validation set 做早停。\n混入通用数据为何可能削弱领域适配？\n怎样区分真实遗忘与生成参数变化？"}, {"id": "FT-013", "category": "FT", "topic": "训练技巧与排错", "level": "L2", "title": "梯度累积等价于大 batch 吗？变长样本怎么归一化？", "tags": ["GradientAccumulation", "TokenNormalization", "DDP"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>梯度累积汇总多个 micro-batch 后再更新，减少单次激活显存；有效 batch 约为 micro-batch、累积次数和数据并行数的乘积，最后不足的窗口要单独处理。正确归一化时可近似大 batch，dropout 与浮点累加顺序等仍会造成差异。\u003c/p>\u003cp>对 token 平均目标，应累加窗口内有效 token 的 NLL，再除以整个窗口的有效 token 总数，不能等权平均长度不同的 micro-batch 的 token 平均 loss。DDP 的梯度平均和框架自动缩放会影响系数，不能重复除世界大小。Optimizer 和 scheduler 按真实更新推进，累积中可用 \u003ccode>no_sync\u003c/code> 减少通信。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">f\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">v\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">D\u003c/mi>\u003cmi mathvariant=\"normal\">P\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">T\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmo>NLL\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>K\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">u\u003c/mi>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msubsup>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">T\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>每个 batch loss 除累积次数，就认为变长序列始终等价。\u003c/li>\u003cli>累积时忘记清零梯度或每个 micro-step 都更新 scheduler。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何验证累积与一次大 batch 的梯度接近？\u003c/li>\u003cli>为什么梯度累积降低显存却可能降低吞吐？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "梯度累积汇总多个 micro-batch 后再更新，减少单次激活显存；有效 batch 约为 micro-batch、累积次数和数据并行数的乘积，最后不足的窗口要单独处理。正确归一化时可近似大 batch，dropout 与浮点累加顺序等仍会造成差异。\n\n对 token 平均目标，应累加窗口内有效 token 的 NLL，再除以整个窗口的有效 token 总数，不能等权平均长度不同的 micro-batch 的 token 平均 loss。DDP 的梯度平均和框架自动缩放会影响系数，不能重复除世界大小。Optimizer 和 scheduler 按真实更新推进，累积中可用 `no_sync` 减少通信。\n每个 batch loss 除累积次数，就认为变长序列始终等价。\n累积时忘记清零梯度或每个 micro-step 都更新 scheduler。\n如何验证累积与一次大 batch 的梯度接近？\n为什么梯度累积降低显存却可能降低吞吐？"}, {"id": "FT-014", "category": "FT", "topic": "训练技巧与排错", "level": "L2", "title": "gradient checkpointing 节省什么，为何会变慢？", "tags": ["ActivationCheckpointing", "显存", "反向传播"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Gradient checkpointing 只保留若干边界激活，在反向需要时重算内部前向片段，以额外计算换激活显存。节省程度取决于切分粒度，它不减少参数或优化器状态，主要用于需要反向的训练；冻结底座的 LoRA 也需传播到适配器，长序列场景同样可能受益。\u003c/p>\u003cp>重算要与原前向一致，随机 dropout、状态修改、分支和设备迁移都应遵守框架约束。应确认当前版本的 reentrant/non-reentrant 行为，并比较峰值显存与有效 token/s，不能默认所有函数的重算天然等价。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 gradient checkpointing 当作保存 checkpoint 文件。\u003c/li>\u003cli>无反向的常规推理用它来节省 KV cache。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 LoRA 的输入梯度配置会影响 checkpointing？\u003c/li>\u003cli>如何选择重算粒度与激活卸载？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Gradient checkpointing 只保留若干边界激活，在反向需要时重算内部前向片段，以额外计算换激活显存。节省程度取决于切分粒度，它不减少参数或优化器状态，主要用于需要反向的训练；冻结底座的 LoRA 也需传播到适配器，长序列场景同样可能受益。\n\n重算要与原前向一致，随机 dropout、状态修改、分支和设备迁移都应遵守框架约束。应确认当前版本的 reentrant/non-reentrant 行为，并比较峰值显存与有效 token/s，不能默认所有函数的重算天然等价。\n把 gradient checkpointing 当作保存 checkpoint 文件。\n无反向的常规推理用它来节省 KV cache。\n为什么 LoRA 的输入梯度配置会影响 checkpointing？\n如何选择重算粒度与激活卸载？"}, {"id": "FT-015", "category": "FT", "topic": "训练技巧与排错", "level": "L2", "title": "SFT loss 下降但任务效果变差，应该怎样排查？", "tags": ["Debugging", "Overfit", "SFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>SFT loss 降低只表示更贴合训练目标，不能证明事实性或真实任务改善。先抽查完整样本的最终 token、监督区间、截断和 EOS，排除模板、mask、样本失效或验证泄漏，再固定生成配置比较 train/validation loss 与任务指标。\u003c/p>\u003cp>按长度、领域和格式分析失败案例，检查高重复、错误答案、教师风格偏差及训练/部署 prompt 差异。确认过拟合或分布错配后，再以单变量实验尝试降低学习率、早停、减 rank、正则或调整配比。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>一看到效果差就继续加 epoch。\u003c/li>\u003cli>只观察总体 loss，不看大量被 mask 或截断的样本。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>训练 loss 接近 0 是否一定是好事？\u003c/li>\u003cli>如何区分过拟合与生成参数造成的差异？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "SFT loss 降低只表示更贴合训练目标，不能证明事实性或真实任务改善。先抽查完整样本的最终 token、监督区间、截断和 EOS，排除模板、mask、样本失效或验证泄漏，再固定生成配置比较 train/validation loss 与任务指标。\n\n按长度、领域和格式分析失败案例，检查高重复、错误答案、教师风格偏差及训练/部署 prompt 差异。确认过拟合或分布错配后，再以单变量实验尝试降低学习率、早停、减 rank、正则或调整配比。\n一看到效果差就继续加 epoch。\n只观察总体 loss，不看大量被 mask 或截断的样本。\n训练 loss 接近 0 是否一定是好事？\n如何区分过拟合与生成参数造成的差异？"}, {"id": "FT-016", "category": "FT", "topic": "指令数据与训练目标", "level": "L2", "title": "领域 SFT 应从 Base 还是 Instruct/Chat 模型开始？", "tags": ["Base", "Instruct", "领域微调"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Base模型主要学语言建模，适合希望完全控制指令、格式和领域行为、且有足够高质量SFT数据的情况；Instruct/Chat已有对话和工具等行为，数据或算力较少时常能更快适配。但继续微调可能覆盖原有安全、格式与能力，不能假设Chat版本永远优于Base，也不能认为SFT只是在已有知识上换说话方式。\u003c/p>\u003cp>选型先固定目标任务、评测集、成本和数据，再用小规模相同配方比较；检查许可证、chat template、special tokens、上下文窗口与底座是否适合语言/领域。训练Chat模型要沿用其消息格式、assistant标签与EOS规则，Base则需一致定义并教会该协议。密集领域文本可用继续预训练获得语言与知识分布，指令SFT教任务接口，两者都可能注入或改变知识，知识更新/权限查询也可用RAG。上线前检查领域收益和通用能力回归。\u003c/p>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把Base/Chat选择当作无需任务验证的固定规则。\u003c/li>\u003cli>给Chat模型更换模板却未同步训练和推理。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>数据很少时怎样比较PEFT与直接prompt的收益？\u003c/li>\u003cli>如何防止领域SFT损坏原先工具调用格式？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Base模型主要学语言建模，适合希望完全控制指令、格式和领域行为、且有足够高质量SFT数据的情况；Instruct/Chat已有对话和工具等行为，数据或算力较少时常能更快适配。但继续微调可能覆盖原有安全、格式与能力，不能假设Chat版本永远优于Base，也不能认为SFT只是在已有知识上换说话方式。\n\n选型先固定目标任务、评测集、成本和数据，再用小规模相同配方比较；检查许可证、chat template、special tokens、上下文窗口与底座是否适合语言/领域。训练Chat模型要沿用其消息格式、assistant标签与EOS规则，Base则需一致定义并教会该协议。密集领域文本可用继续预训练获得语言与知识分布，指令SFT教任务接口，两者都可能注入或改变知识，知识更新/权限查询也可用RAG。上线前检查领域收益和通用能力回归。\n把Base/Chat选择当作无需任务验证的固定规则。\n给Chat模型更换模板却未同步训练和推理。\n数据很少时怎样比较PEFT与直接prompt的收益？\n如何防止领域SFT损坏原先工具调用格式？"}, {"id": "FT-017", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "BitFit 为什么只调 bias，适用条件和局限是什么？", "tags": ["BitFit", "bias tuning", "PEFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>BitFit冻结大部分预训练权重，仅训练模型中的bias项或其子集，通常再训练任务输出头。线性层Wx+b中的bias改变神经元偏移和激活阈值，用很少参数重新激活或组合已有特征；它不等于低秩更新，也不会增加一个adapter分支。原论文主要研究BERT类masked LM在小到中等任务数据上的效果，不应把结论无条件推广到任意LLM生成任务。\u003c/p>\u003cp>参数和optimizer状态小、存储与切任务成本低，但表达能力受可调bias的位置和数量限制。很多现代decoder使用无bias线性层和RMSNorm，没有对应bias就几乎无可调参数，此时BitFit不能凭方法名直接套用。实践应打印requires_grad参数列表，确认没有误解冻整层，比较任务表现、遗忘和训练显存；冻结权重仍可能需要反向经过它们来计算bias梯度。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsub>\u003cmo>min\u003c/mo>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>b\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmtext>fixed\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>对bias-free模型宣称与BERT一样能直接BitFit。\u003c/li>\u003cli>认为可训练参数少就意味着全部激活都不需要反向保存。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>哪些bias最可能改变attention或FFN行为？\u003c/li>\u003cli>训练输出头应不应该计入可训练参数比例？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "BitFit冻结大部分预训练权重，仅训练模型中的bias项或其子集，通常再训练任务输出头。线性层Wx+b中的bias改变神经元偏移和激活阈值，用很少参数重新激活或组合已有特征；它不等于低秩更新，也不会增加一个adapter分支。原论文主要研究BERT类masked LM在小到中等任务数据上的效果，不应把结论无条件推广到任意LLM生成任务。\n\n参数和optimizer状态小、存储与切任务成本低，但表达能力受可调bias的位置和数量限制。很多现代decoder使用无bias线性层和RMSNorm，没有对应bias就几乎无可调参数，此时BitFit不能凭方法名直接套用。实践应打印requires_grad参数列表，确认没有误解冻整层，比较任务表现、遗忘和训练显存；冻结权重仍可能需要反向经过它们来计算bias梯度。\n对bias-free模型宣称与BERT一样能直接BitFit。\n认为可训练参数少就意味着全部激活都不需要反向保存。\n哪些bias最可能改变attention或FFN行为？\n训练输出头应不应该计入可训练参数比例？"}, {"id": "FT-018", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "P-Tuning v1、P-Tuning v2 与 Prompt/Prefix Tuning 怎样区分？", "tags": ["P-Tuning", "deep prompt", "PEFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Prompt Tuning通常只学习输入端连续virtual token；Prefix Tuning把可学习前缀注入各层的attention表示，常实现为前缀K/V。P-Tuning v1在模板中插入连续提示，并常用prompt encoder（如BiLSTM/MLP）重参数化，与离散提示共同用于NLU；原方法既有冻结也有联合微调设置，不能只凭名称推断底座一定冻结。\u003c/p>\u003cp>P-Tuning v2将连续提示放到多个层，适配不同规模和序列标注等任务，可视为经过优化的deep prompt tuning，与Prefix Tuning有密切联系。两者究竟增加输入token还是K/V、是否用重参数化网络、任务head是否训练，要看具体实现。冻结底座只减少权重和optimizer更新，前缀到loss的梯度仍穿过网络；更长prompt会增加有效上下文或KV成本。选型需固定可训练参数预算、长度和任务，不能把v2的经验效果解读为所有场景都等价全参微调。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>&#x003B8;\u003c/mi>\u003cmo>&#x0002A;\u003c/mo>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>argmin\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">(\u003c/mo>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo minsize=\"1.2em\" maxsize=\"1.2em\">)\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmtext>&#x000A0;\u003c/mtext>\u003cmtext>fixed&#x000A0;in&#x000A0;the&#x000A0;frozen&#x000A0;setting\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把所有方法的virtual token都理解为普通文本可解码词。\u003c/li>\u003cli>把P-Tuningv2说成只是v1换了更大的MLP。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>层级前缀为什么比只放输入端有更短的梯度作用路径？\u003c/li>\u003cli>deep prompt对KV cache和上下文预算有哪些影响？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Prompt Tuning通常只学习输入端连续virtual token；Prefix Tuning把可学习前缀注入各层的attention表示，常实现为前缀K/V。P-Tuning v1在模板中插入连续提示，并常用prompt encoder（如BiLSTM/MLP）重参数化，与离散提示共同用于NLU；原方法既有冻结也有联合微调设置，不能只凭名称推断底座一定冻结。\n\nP-Tuning v2将连续提示放到多个层，适配不同规模和序列标注等任务，可视为经过优化的deep prompt tuning，与Prefix Tuning有密切联系。两者究竟增加输入token还是K/V、是否用重参数化网络、任务head是否训练，要看具体实现。冻结底座只减少权重和optimizer更新，前缀到loss的梯度仍穿过网络；更长prompt会增加有效上下文或KV成本。选型需固定可训练参数预算、长度和任务，不能把v2的经验效果解读为所有场景都等价全参微调。\n把所有方法的virtual token都理解为普通文本可解码词。\n把P-Tuningv2说成只是v1换了更大的MLP。\n层级前缀为什么比只放输入端有更短的梯度作用路径？\ndeep prompt对KV cache和上下文预算有哪些影响？"}, {"id": "FT-019", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "AdaLoRA 如何自适应分配低秩预算，与固定 rank LoRA 有何区别？", "tags": ["AdaLoRA", "动态rank", "PEFT"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>固定LoRA为选中的矩阵指定rank，可能把同样容量分配给重要程度不同的层。AdaLoRA以类似SVD的增量参数化ΔW=PΛQ，跟踪奇异三元组的敏感性/重要性，在全局预算下逐步裁剪不重要的方向，把有效rank留给更需要的矩阵；Λ是可学习的对角尺度，不是每步对完整大矩阵精确做SVD。\u003c/p>\u003cp>训练常从较大预算开始，逐渐降到目标预算，配合正交正则让方向更可辨识。动态重要性依赖当前任务、梯度与训练阶段，不能只根据某层权重范数决定rank。它需要预算调度和更多状态管理，未必比简单LoRA更稳定或更快；比较时保持总参数预算、target modules和数据相同。最终可像低秩增量一样合并到同形状全精度权重，但若底座量化，合并和再量化要单独验证。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>&#x0039B;\u003c/mi>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02016;\u003c/mo>\u003cmsup>\u003cmi>P\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>P\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>I\u003c/mi>\u003cmsubsup>\u003cmo>&#x02016;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmo>&#x02016;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>Q\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x02212;\u003c/mo>\u003cmi>I\u003c/mi>\u003cmsubsup>\u003cmo>&#x02016;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把SVD式参数化说成每step分解完整基座权重。\u003c/li>\u003cli>忽略rank预算调度而直接比较不同参数量的结果。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>何时裁剪方向会造成不可逆的容量损失？\u003c/li>\u003cli>正交约束为何有助于比较不同奇异方向的重要性？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "固定LoRA为选中的矩阵指定rank，可能把同样容量分配给重要程度不同的层。AdaLoRA以类似SVD的增量参数化ΔW=PΛQ，跟踪奇异三元组的敏感性/重要性，在全局预算下逐步裁剪不重要的方向，把有效rank留给更需要的矩阵；Λ是可学习的对角尺度，不是每步对完整大矩阵精确做SVD。\n\n训练常从较大预算开始，逐渐降到目标预算，配合正交正则让方向更可辨识。动态重要性依赖当前任务、梯度与训练阶段，不能只根据某层权重范数决定rank。它需要预算调度和更多状态管理，未必比简单LoRA更稳定或更快；比较时保持总参数预算、target modules和数据相同。最终可像低秩增量一样合并到同形状全精度权重，但若底座量化，合并和再量化要单独验证。\n把SVD式参数化说成每step分解完整基座权重。\n忽略rank预算调度而直接比较不同参数量的结果。\n何时裁剪方向会造成不可逆的容量损失？\n正交约束为何有助于比较不同奇异方向的重要性？"}, {"id": "FT-020", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "AdapterFusion 和 AdapterDrop 如何组合知识或降低 adapter 开销？", "tags": ["AdapterFusion", "AdapterDrop", "多任务"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>普通adapter是在主干中加入较小可训练模块，任务通常保存单独adapter。AdapterFusion先分别训练多个任务adapter并冻结，再训练融合模块，让当前token表示选择性地组合各adapter的输出；把知识提取与组合分成两阶段，有助于复用已有任务知识。它不是直接平均checkpoint，也不等于把全部任务重新做一次共享全参训练。\u003c/p>\u003cp>AdapterDrop根据策略跳过部分层的adapter，训练时让模型适应不同保留范围，推理可减少adapter执行开销；应区分跳过adapter分支和删除整个Transformer层。融合多个adapter会额外增加前向成本和存储，Drop则可能牺牲精度。多任务服务要评价任务切换、并发batch、融合数量与延迟，确认减少adapter分支后实际瓶颈是否改善；对深度与任务敏感的能力不能只凭“下层较不重要”固定删除。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/munderover>\u003cmsub>\u003cmi>&#x003B1;\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"0.167em\" />\u003cmsub>\u003cmo>Adapter\u003c/mo>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>a\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>&#x003B1;\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把多个adapter融合误称为权重平均。\u003c/li>\u003cli>把AdapterDrop说成删除Transformer主体层。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>冻结多个adapter后融合层需要哪些训练数据？\u003c/li>\u003cli>多个任务adapter在一个batch内如何调度？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "普通adapter是在主干中加入较小可训练模块，任务通常保存单独adapter。AdapterFusion先分别训练多个任务adapter并冻结，再训练融合模块，让当前token表示选择性地组合各adapter的输出；把知识提取与组合分成两阶段，有助于复用已有任务知识。它不是直接平均checkpoint，也不等于把全部任务重新做一次共享全参训练。\n\nAdapterDrop根据策略跳过部分层的adapter，训练时让模型适应不同保留范围，推理可减少adapter执行开销；应区分跳过adapter分支和删除整个Transformer层。融合多个adapter会额外增加前向成本和存储，Drop则可能牺牲精度。多任务服务要评价任务切换、并发batch、融合数量与延迟，确认减少adapter分支后实际瓶颈是否改善；对深度与任务敏感的能力不能只凭“下层较不重要”固定删除。\n把多个adapter融合误称为权重平均。\n把AdapterDrop说成删除Transformer主体层。\n冻结多个adapter后融合层需要哪些训练数据？\n多个任务adapter在一个batch内如何调度？"}, {"id": "FT-021", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "MAM Adapter、UniPELT 等组合 PEFT 方法为什么要混合不同模块？", "tags": ["MAM Adapter", "UniPELT", "PEFT组合"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>PEFT方法可按修改的位置、形式与组合方式统一理解：adapter增加hidden变换，prefix改变attention可见信息，LoRA更新线性投影。不同分支对模型行为的作用和容量不同，因此同一小参数预算下组合互补模块可能有效。MAM Adapter（Mix-And-Match）把attention侧prefix与FFN侧并行adapter组合；UniPELT把adapter、prefix和LoRA等模块放入统一框架，并用门控调整各分支参与程度。\u003c/p>\u003cp>它们不是同一个算法，也不意味着把所有PEFT叠上去总会更好。模块叠加可能增加前向算子、上下文、KV和超参数，门控还可能塌缩到少数分支。比较需控制总可训练参数、推理成本与训练预算，做逐模块消融；保存时明确每个分支配置和底座版本，若某种分支可merge，其他需要执行的prefix/adapter并不会因此自动消失。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmi mathvariant=\"script\">M\u003c/mi>\u003c/mrow>\u003c/munder>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmspace width=\"0.167em\" />\u003cmsub>\u003cmi>&#x00394;\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把UniPELT门控混合与MAM固定搭配说成同一方法。\u003c/li>\u003cli>认为LoRA可merge就意味着所有组合PEFT模块都无推理开销。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何设计消融证明组合收益不是单纯参数更多？\u003c/li>\u003cli>输入相关门控与任务固定门控有什么区别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "PEFT方法可按修改的位置、形式与组合方式统一理解：adapter增加hidden变换，prefix改变attention可见信息，LoRA更新线性投影。不同分支对模型行为的作用和容量不同，因此同一小参数预算下组合互补模块可能有效。MAM Adapter（Mix-And-Match）把attention侧prefix与FFN侧并行adapter组合；UniPELT把adapter、prefix和LoRA等模块放入统一框架，并用门控调整各分支参与程度。\n\n它们不是同一个算法，也不意味着把所有PEFT叠上去总会更好。模块叠加可能增加前向算子、上下文、KV和超参数，门控还可能塌缩到少数分支。比较需控制总可训练参数、推理成本与训练预算，做逐模块消融；保存时明确每个分支配置和底座版本，若某种分支可merge，其他需要执行的prefix/adapter并不会因此自动消失。\n把UniPELT门控混合与MAM固定搭配说成同一方法。\n认为LoRA可merge就意味着所有组合PEFT模块都无推理开销。\n如何设计消融证明组合收益不是单纯参数更多？\n输入相关门控与任务固定门控有什么区别？"}, {"id": "FT-022", "category": "FT", "topic": "知识蒸馏与模型编辑", "level": "L2", "title": "知识蒸馏中的 logits、隐藏层和生成答案监督各有什么作用？", "tags": ["蒸馏", "KD", "soft targets"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>logits蒸馏让学生拟合教师的软概率分布，温度提高时能显露非最大类之间的关系；常用KL或soft-target交叉熵，加T²使大温度下的梯度尺度更可比。对语言模型逐token做logits蒸馏，需要同一位置的上下文和可对齐词表；不同tokenizer不能直接按词表下标对KL。生成答案蒸馏把教师采样或搜索的回复作为学生SFT数据，兼容不同tokenizer，但丢掉完整分布，并继承教师错误、风格与覆盖偏差。\u003c/p>\u003cp>隐藏层/attention蒸馏用层映射和投影对齐中间表示，PKD、TinyBERT在BERT压缩中采用此类信号，不能简单要求不同深度学生逐层等形状相等。实际还需混合真实标签、过滤教师答案、覆盖学生可能访问的前缀，并独立评测质量/幻觉与成本。蒸馏不保证学生超过教师，也不保证所有知识能在更小容量中保留。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>z\u003c/mi>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>T\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi mathvariant=\"script\">L\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">K\u003c/mi>\u003cmi mathvariant=\"normal\">L\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003cmi>&#x02016;\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>S\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi mathvariant=\"script\">L\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>&#x02113;\u003c/mi>\u003c/munder>\u003cmo>&#x02016;\u003c/mo>\u003cmsubsup>\u003cmi>H\u003c/mi>\u003cmi>S\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x02113;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi>&#x02113;\u003c/mi>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsubsup>\u003cmi>H\u003c/mi>\u003cmi>T\u003c/mi>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x02113;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/msubsup>\u003cmsubsup>\u003cmo>&#x02016;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>不同tokenizer的词表下标未经对齐就直接算KL。\u003c/li>\u003cli>把教师生成数据无条件当作正确标签。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么学生自己生成的前缀可能需要教师再标注？\u003c/li>\u003cli>温度变大时T²补偿的近似前提是什么？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "logits蒸馏让学生拟合教师的软概率分布，温度提高时能显露非最大类之间的关系；常用KL或soft-target交叉熵，加T²使大温度下的梯度尺度更可比。对语言模型逐token做logits蒸馏，需要同一位置的上下文和可对齐词表；不同tokenizer不能直接按词表下标对KL。生成答案蒸馏把教师采样或搜索的回复作为学生SFT数据，兼容不同tokenizer，但丢掉完整分布，并继承教师错误、风格与覆盖偏差。\n\n隐藏层/attention蒸馏用层映射和投影对齐中间表示，PKD、TinyBERT在BERT压缩中采用此类信号，不能简单要求不同深度学生逐层等形状相等。实际还需混合真实标签、过滤教师答案、覆盖学生可能访问的前缀，并独立评测质量/幻觉与成本。蒸馏不保证学生超过教师，也不保证所有知识能在更小容量中保留。\n不同tokenizer的词表下标未经对齐就直接算KL。\n把教师生成数据无条件当作正确标签。\n为什么学生自己生成的前缀可能需要教师再标注？\n温度变大时T²补偿的近似前提是什么？"}, {"id": "FT-023", "category": "FT", "topic": "LoRA 与其他 PEFT", "level": "L2", "title": "Prompt learning 中 template、verbalizer 与连续提示分别是什么？", "tags": ["Template", "Verbalizer", "prompt learning"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Template把任务输入改造成模型熟悉的填空或生成格式，例如情感分类提示“这段评论的情感是MASK”；verbalizer把模型预测的标签词映射回类别，例如“好/差”对应正/负。分类结果会受模板措辞、标签词语义、词频和分词长度影响，模型原生概率不自动成为校准类别概率。\u003c/p>\u003cp>离散prompt可人工设计、搜索或由模型生成；连续prompt直接优化可学习向量，不要求能解释为人类可读词。多标签词verbalizer需定义聚合与归一化，生成式模型对多token标签常算序列概率，还要防止长度偏差；在MLM里多MASK和多token标签的处理也须明确。用验证集选模板和标签词，测试集保持独立，比较多seed、样本顺序和格式扰动。Prompt engineering无需更新权重，prompt tuning则需要训练可学习提示，不能把两者混称“写几句话”。\u003c/p>\u003cp>自动提示搜索可用输入梯度提出离散 trigger 候选，再在验证目标上筛选，例如 AutoPrompt；它不等同于直接优化连续 prompt embedding。KPT 借助外部知识扩展 verbalizer 的标签词，再用语言模型筛选和校准；虚拟标签词还可用可学习向量表示类别。PPT 则先预训练软提示以改善少样本初始化。模板搜索、标签空间设计与提示参数初始化是三个不同优化对象，均需防止在测试集上反复选择。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">V\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmo>template\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmsup>\u003cmi>c\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"script\">V\u003c/mi>\u003cmrow>\u003cmsup>\u003cmi>c\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>w\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmo>template\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把prompt engineering与训练soft prompt混为一谈。\u003c/li>\u003cli>类别标签长短不同却直接比较未经处理的序列分数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>verbalizer校准怎样减小标签词频偏差？\u003c/li>\u003cli>连续提示需要怎样保存并与底座配套加载？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Template把任务输入改造成模型熟悉的填空或生成格式，例如情感分类提示“这段评论的情感是MASK”；verbalizer把模型预测的标签词映射回类别，例如“好/差”对应正/负。分类结果会受模板措辞、标签词语义、词频和分词长度影响，模型原生概率不自动成为校准类别概率。\n\n离散prompt可人工设计、搜索或由模型生成；连续prompt直接优化可学习向量，不要求能解释为人类可读词。多标签词verbalizer需定义聚合与归一化，生成式模型对多token标签常算序列概率，还要防止长度偏差；在MLM里多MASK和多token标签的处理也须明确。用验证集选模板和标签词，测试集保持独立，比较多seed、样本顺序和格式扰动。Prompt engineering无需更新权重，prompt tuning则需要训练可学习提示，不能把两者混称“写几句话”。\n\n自动提示搜索可用输入梯度提出离散 trigger 候选，再在验证目标上筛选，例如 AutoPrompt；它不等同于直接优化连续 prompt embedding。KPT 借助外部知识扩展 verbalizer 的标签词，再用语言模型筛选和校准；虚拟标签词还可用可学习向量表示类别。PPT 则先预训练软提示以改善少样本初始化。模板搜索、标签空间设计与提示参数初始化是三个不同优化对象，均需防止在测试集上反复选择。\n把prompt engineering与训练soft prompt混为一谈。\n类别标签长短不同却直接比较未经处理的序列分数。\nverbalizer校准怎样减小标签词频偏差？\n连续提示需要怎样保存并与底座配套加载？"}, {"id": "FT-024", "category": "FT", "topic": "知识蒸馏与模型编辑", "level": "L2", "title": "模型编辑与继续训练、RAG 有何区别？ROME、MEMIT 与 MEND 如何修改知识？", "tags": ["模型编辑", "ROME", "MEMIT", "MEND"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>模型编辑希望用少量事实更正定向改变模型行为，同时保留无关能力。继续训练通常面向更广的数据分布和目标；RAG 在推理时提供外部证据，无需修改底座权重。编辑方法主要改变参数或加入可检索编辑记忆，不能保证一次更新就让所有表述、推理链和关联事实都同步正确。\u003c/p>\u003cp>ROME 把特定 MLP 的事实关联视为 key—value 映射，用带保留约束的秩一更新写入目标关联；MEMIT 将批量编辑分配到多个 MLP 层；MEND 学习小型编辑网络，转换局部微调梯度以生成可控参数更新。它们的低秩对象、训练需求与适用层不同，不能因出现低秩矩阵就等同于 LoRA。\u003c/p>\u003cp>评估至少看目标事实的编辑成功率、同义改写泛化、无关邻近事实的 locality，以及连续/批量编辑后的累计退化；需要跨实体、反向关系和多跳问题测试。先保存可回滚权重，对比单纯微调和 RAG，再验证困惑度与通用任务。模型编辑是定向纠错工具，不是已证明能无副作用维护完整知识库的保证。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>u\u003c/mi>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmrow>\u003cmo>&#x022A4;\u003c/mo>\u003c/mrow>\u003c/msup>\u003cmspace width=\"1em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmtext>rank-one&#x000A0;update\u003c/mtext>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"2em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>W\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x00394;\u003c/mi>\u003cmi>W\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmo>&#x0002A;\u003c/mo>\u003c/msub>\u003cmo>&#x02248;\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmo>&#x0002A;\u003c/mo>\u003c/msub>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把一个提示上更正成功等同于事实在所有上下文和推理中都已一致更新。\u003c/li>\u003cli>把 ROME 的秩一编辑、MEND 的梯度分解与 LoRA 的训练参数化混为一谈。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>怎样构造 locality 测试而不只测编辑样例？\u003c/li>\u003cli>为什么批量编辑需要关注累计遗忘和更新顺序？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "模型编辑希望用少量事实更正定向改变模型行为，同时保留无关能力。继续训练通常面向更广的数据分布和目标；RAG 在推理时提供外部证据，无需修改底座权重。编辑方法主要改变参数或加入可检索编辑记忆，不能保证一次更新就让所有表述、推理链和关联事实都同步正确。\n\nROME 把特定 MLP 的事实关联视为 key—value 映射，用带保留约束的秩一更新写入目标关联；MEMIT 将批量编辑分配到多个 MLP 层；MEND 学习小型编辑网络，转换局部微调梯度以生成可控参数更新。它们的低秩对象、训练需求与适用层不同，不能因出现低秩矩阵就等同于 LoRA。\n\n评估至少看目标事实的编辑成功率、同义改写泛化、无关邻近事实的 locality，以及连续/批量编辑后的累计退化；需要跨实体、反向关系和多跳问题测试。先保存可回滚权重，对比单纯微调和 RAG，再验证困惑度与通用任务。模型编辑是定向纠错工具，不是已证明能无副作用维护完整知识库的保证。\n把一个提示上更正成功等同于事实在所有上下文和推理中都已一致更新。\n把 ROME 的秩一编辑、MEND 的梯度分解与 LoRA 的训练参数化混为一谈。\n怎样构造 locality 测试而不只测编辑样例？\n为什么批量编辑需要关注累计遗忘和更新顺序？"}, {"id": "PRE-010", "category": "FT", "topic": "指令数据与训练目标", "level": "L2", "title": "SFT 数据 packing 怎样提高效率并保持跨样本隔离？", "tags": ["Packing", "Mask", "数据管线", "SFT", "BlockDiagonal", "BoundaryLabels"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Packing 把多个短样本装入一条训练行，减少 padding。先应用 chat template、分词并标记回答监督区间，再连同 \u003ccode>input_ids\u003c/code>、\u003ccode>labels\u003c/code>、样本编号和边界一起装箱。BFD 等策略可减少空位；截断或拆分会改变保留内容，应统计丢弃的回答 token，而不只报告吞吐。\u003c/p>\u003cp>独立 SFT 样本的可见性必须同时满足同一样本与因果条件 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math>，并排除 padding。可以用块对角 causal mask，或给支持变长 attention 的后端显式段边界。EOS 和把 \u003ccode>position_ids\u003c/code> 归零都不会自动隔离通用 attention。\u003c/p>\u003cp>普通全行 label shift 会让前一段末 logits 预测下一段首 token。独立样本目标应把后一段首 label 设为 \u003ccode>ignore_index\u003c/code>，或逐段 shift 并在段尾补 ignore；BOS/EOS 是否监督要按段定义，不能粗暴删除全部 EOS loss。Prompt labels 忽略而首 answer label 保留，末 prompt logits 才能预测首回答；合法 prompt 仍需作为上下文。\u003c/p>\u003cp>连续语料 concatenate-then-split 可有意允许跨文档上下文，这与独立 SFT 目标不同。可对比未 packing 的逐段有效 NLL 与梯度，并扰动另一段检查当前段 logits 是否改变；比较时要控制内核、dropout 和浮点次序，再评估显存与吞吐收益。\u003c/p>\u003cp>式中 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 是样本编号，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 标记有效 key，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 选择监督目标，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi mathvariant=\"script\">H\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 是同一样本的有效历史。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable
