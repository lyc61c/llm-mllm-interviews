03cmi>I\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003c/math>。用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>log\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math> 时单位是 bit，自然对数时是 nat，零概率项按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>0\u003c/mn>\u003cmi>log\u003c/mi>\u003cmn>0\u003c/mn>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math> 的极限处理。固定 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 类时，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>0\u003c/mn>\u003cmo>&#x02264;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>，确定分布取零，均匀分布达到上界；二元熵 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>log\u003c/mi>\u003cmi>a\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>log\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x02212;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 在 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math> 最大。熵由完整分布决定，不能只凭最大 token 概率比较。\u003c/p>\u003cp>条件熵为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmo>&#x02211;\u003c/mo>\u003cmi>y\u003c/mi>\u003c/msub>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，满足链式法则 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。条件信息在平均意义上降低不确定性，但某个特定上下文的条件分布不一定比无条件分布熵更低；序列熵可按此链式展开。\u003c/p>\u003cp>真实数据熵 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>、模型输出熵 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 与训练交叉熵 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>&#x003B8;\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 要区分。模型可能对错误答案非常自信，交叉熵还含分布失配的 KL，所以降低输出熵不保证拟合正确。日志应明确过滤前后、mask、token 分布与上下文平均范围。连续变量的微分熵可以为负并随尺度变化，不能照搬离散熵的界。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x02212;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/munder>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmi>log\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmunder>\u003cmo>&#x02211;\u003c/mo>\u003cmi>y\u003c/mi>\u003c/munder>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>H\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo>&#x02223;\u003c/mo>\u003cmi>Y\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>低熵就是准确，高熵就是幻觉，或把数据熵与模型预测熵混同。\u003c/li>\u003cli>把平均条件熵下降说成所有特定条件都降低不确定性。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>高置信度错误输出为何可以有低熵？\u003c/li>\u003cli>为什么连续均匀分布的微分熵会随区间长度变成负值？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "离散熵是自信息的期望：事件自信息为 $I(x)=-\\log p(x)$，熵为 $H(X)=\\mathbb E[I(X)]$。用 $\\log_2$ 时单位是 bit，自然对数时是 nat，零概率项按 $0\\log0=0$ 的极限处理。固定 $V$ 类时，$0\\le H\\le\\log V$，确定分布取零，均匀分布达到上界；二元熵 $-a\\log a-(1-a)\\log(1-a)$ 在 $a=1/2$ 最大。熵由完整分布决定，不能只凭最大 token 概率比较。\n\n条件熵为 $H(X\\mid Y)=\\sum_y p(y)H(p(X\\mid y))$，满足链式法则 $H(X,Y)=H(Y)+H(X\\mid Y)$。条件信息在平均意义上降低不确定性，但某个特定上下文的条件分布不一定比无条件分布熵更低；序列熵可按此链式展开。\n\n真实数据熵 $H(p)$、模型输出熵 $H(q_\\theta)$ 与训练交叉熵 $H(p,q_\\theta)$ 要区分。模型可能对错误答案非常自信，交叉熵还含分布失配的 KL，所以降低输出熵不保证拟合正确。日志应明确过滤前后、mask、token 分布与上下文平均范围。连续变量的微分熵可以为负并随尺度变化，不能照搬离散熵的界。\n低熵就是准确，高熵就是幻觉，或把数据熵与模型预测熵混同。\n把平均条件熵下降说成所有特定条件都降低不确定性。\n高置信度错误输出为何可以有低熵？\n为什么连续均匀分布的微分熵会随区间长度变成负值？"}, {"id": "TFM-018", "category": "BAS", "topic": "数学、概率与统计", "level": "L2", "title": "矩阵的秩与特征值如何计算，和奇异值有什么关系？", "tags": ["Rank", "Eigenvalues", "SVD", "LoRA", "线性代数"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>矩阵的秩是行空间或列空间的维数，可由消元主元数或非零奇异值数求得。对 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，有 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>dim\u003c/mi>\u003cmi>ker\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mrow>\u003c/math>。LoRA 的低秩分解满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02264;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>rank\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmo>rank\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02264;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/math>，不要求底座 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math> 低秩。\u003c/p>\u003cp>方阵特征值可以为复数，满足 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>v\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo>&#x02260;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>，手算可先解 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo movablelimits=\"true\">det\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mrow>\u003c/math>，再解特征向量。例 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x00028;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd>\u003cmn>2\u003c/mn>\u003c/mtd>\u003cmtd>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmn>0\u003c/mn>\u003c/mtd>\u003cmtd>\u003cmn>3\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo>&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 的特征值为 2、3，对应向量可取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>，秩为 2。一般矩形矩阵没有这种标准特征值定义；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 的谱用于求奇异值，不能称为矩形 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 自身的特征值。\u003c/p>\u003cp>大矩阵通常不显式展开特征多项式：数值库可经 Hessenberg 化和 QR 等过程求 Schur 分解，复 Schur 对角给特征值，实 Schur 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>&#x000D7;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/math> 块需另解。对称/Hermitian 矩阵可选专用求解器。\u003c/p>\u003cp>若 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>&#x0039B;\u003c/mi>\u003cmsup>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math> 可对角化，秩等于按重数计的非零特征值个数；一般方阵不能这样数。例如 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x00028;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd>\u003cmn>0\u003c/mn>\u003c/mtd>\u003cmtd>\u003cmn>1\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmn>0\u003c/mn>\u003c/mtd>\u003cmtd>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo>&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 的特征值全零，秩却为 1，且不可对角化。任意方阵仍满足行列式非零、全部特征值非零与满秩的等价关系。\u003c/p>\u003cp>将奇异值和 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 的特征值分别按降序排列，令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。SVD 写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>&#x003A3;\u003c/mi>\u003cmsup>\u003cmi>V\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003c/math>，非零奇异值的平方构成 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 的非零谱，其余位置补零；实对称矩阵的奇异值为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003cmsub>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x0007C;\u003c/mo>\u003c/mrow>\u003c/math>。浮点数值秩按 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>&#x003C3;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0003E;\u003c/mo>\u003cmo>max\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003cmo>&#x0002C;\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003cmspace width=\"0.167em\" />\u003cmsub>\u003cmi>&#x003C3;\u003c/mi>\u003cmrow>\u003cmo>max\u003c/mo>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 判断，阈值取决于 dtype、规模与噪声，近零不能等同于精确零。\u003c/p>\u003cp>截断SVD保留最大r个奇异值，得到秩至多r的近似A_r=U_rΣ_rV_rᵀ；在谱范数或Frobenius范数下它是最佳秩r近似，误差分别由第r+1个奇异值或尾部奇异值平方和确定。它压缩已经存在的矩阵，而LoRA训练一个低秩增量，二者目标不同；对权重做低秩分解的最优矩阵误差也不保证下游任务损失最小。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo movablelimits=\"true\">det\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>v\u003c/mi>\u003cmo>&#x02260;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x00023;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmi>:\u003c/mi>\u003cmsub>\u003cmi>&#x003C3;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003E;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003C3;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmn>1\u003c/mn>\u003cmo>&#x02264;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>min\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmi>p\u003c/mi>\u003cmo>&#x0003C;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>n\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>&#x0039B;\u003c/mi>\u003cmsup>\u003cmi>P\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmi>&#x027F9;\u003c/mi>\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>&#x00023;\u003c/mi>\u003cmo stretchy=\"false\">&#x0007B;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmi>:\u003c/mi>\u003cmsub>\u003cmi>&#x003BB;\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x02260;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x0007D;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>rank\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>B\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02264;\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>所有矩阵的秩都等于非零特征值个数，或给非方阵直接定义标准特征值。\u003c/li>\u003cli>把奇异值与一般特征值逐项等同，或把训练配置 r 当作已学更新的实际秩。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>A\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/math> 理论上可求奇异值，但数值计算可能放大条件数问题？\u003c/li>\u003cli>低秩近似、数值秩与 LoRA 的秩上界分别回答什么问题？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "矩阵的秩是行空间或列空间的维数，可由消元主元数或非零奇异值数求得。对 $A\\in\\mathbb R^{m\\times n}$，有 $\\operatorname{rank}(A)+\\dim\\ker A=n$。LoRA 的低秩分解满足 $\\operatorname{rank}(BA)\\le\\min(\\operatorname{rank}A,\\operatorname{rank}B)\\le r$，不要求底座 $W_0$ 低秩。\n\n方阵特征值可以为复数，满足 $Av=\\lambda v,v\\ne0$，手算可先解 $\\det(\\lambda I-A)=0$，再解特征向量。例 $A=\\begin{pmatrix}2&1\\\\0&3\\end{pmatrix}$ 的特征值为 2、3，对应向量可取 $(1,0)^\\top$、$(1,1)^\\top$，秩为 2。一般矩形矩阵没有这种标准特征值定义；$A^\\top A$ 的谱用于求奇异值，不能称为矩形 $A$ 自身的特征值。\n\n大矩阵通常不显式展开特征多项式：数值库可经 Hessenberg 化和 QR 等过程求 Schur 分解，复 Schur 对角给特征值，实 Schur 的 $2\\times2$ 块需另解。对称/Hermitian 矩阵可选专用求解器。\n\n若 $A=P\\Lambda P^{-1}$ 可对角化，秩等于按重数计的非零特征值个数；一般方阵不能这样数。例如 $\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$ 的特征值全零，秩却为 1，且不可对角化。任意方阵仍满足行列式非零、全部特征值非零与满秩的等价关系。\n\n将奇异值和 $A^\\top A$ 的特征值分别按降序排列，令 $p=\\min(m,n)$。SVD 写为 $A=U\\Sigma V^\\top$，非零奇异值的平方构成 $A^\\top A$ 的非零谱，其余位置补零；实对称矩阵的奇异值为 $|\\lambda_i|$。浮点数值秩按 $\\sigma_i>\\max(\\mathrm{atol},\\mathrm{rtol}\\,\\sigma_{\\max})$ 判断，阈值取决于 dtype、规模与噪声，近零不能等同于精确零。\n\n截断SVD保留最大r个奇异值，得到秩至多r的近似A_r=U_rΣ_rV_rᵀ；在谱范数或Frobenius范数下它是最佳秩r近似，误差分别由第r+1个奇异值或尾部奇异值平方和确定。它压缩已经存在的矩阵，而LoRA训练一个低秩增量，二者目标不同；对权重做低秩分解的最优矩阵误差也不保证下游任务损失最小。\n所有矩阵的秩都等于非零特征值个数，或给非方阵直接定义标准特征值。\n把奇异值与一般特征值逐项等同，或把训练配置 r 当作已学更新的实际秩。\n为什么 $A^\\top A$ 理论上可求奇异值，但数值计算可能放大条件数问题？\n低秩近似、数值秩与 LoRA 的秩上界分别回答什么问题？"}, {"id": "TFM-001", "category": "TFM", "topic": "注意力机制与掩码", "level": "L1", "title": "缩放点积注意力如何计算，为什么除以 √d_k？", "tags": ["Attention", "公式", "数值稳定"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>缩放点积注意力先用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/math> 的匹配分数，在 key 轴做 softmax，再加权汇聚 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>。设 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，则 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>S\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmo>&#x0002F;\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>S\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，输出 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>A\u003c/mi>\u003cmi>V\u003c/mi>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>。Self-attention 常取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，cross-attention 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>K\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 可来自不同序列。\u003c/p>\u003cp>缩放的尺度分析假设各分量零均值、单位方差，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 独立，且不同维的乘积互不相关：此时 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x000B7;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，除以 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/math> 后方差为 1。实际训练后的相关性和方差未必满足这些假设。分数差过大会使分布过于尖锐，softmax 的 Jacobian \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>&#x0002F;\u003c/mo>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003B4;\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 部分元素变小；这不表示所有后续梯度必然消失，softmax 与交叉熵合并时 logits 梯度仍为预测概率减目标概率。\u003c/p>\u003cp>允许的连接加 0，禁止连接加 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmo>&#x0221E;\u003c/mo>\u003c/mrow>\u003c/math>，再做 softmax。实现常先减去每行最大有限分数以避免指数溢出；全屏蔽行须单独处理，并检查 dtype、广播和内核的 mask 约定。有限且未屏蔽的 logits 在精确计算下得到严格为正、和为 1 的权重，所以 softmax 本身没有硬稀疏；数值下溢和 mask 产生的零是另外的机制。权重适合描述加权汇聚，但不能直接当作因果重要性。\u003c/p>\u003cp>除了固定除以根号维度，也可对 Q/K 做适当归一化并设置温度、学习 logit scale，或使用加性注意力的评分网络。它们改变评分分布及参数化，并不是把原模型的分母随意删掉的等价替换。改变温度只控制分布尖锐度，不替代所有输入范数与训练稳定性问题；应重新分析方差并配套训练。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Attention\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>V\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x000B7;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmfrac>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmo>&#x02202;\u003c/mo>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>&#x003B4;\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把缩放分母写成 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">m\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">l\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 或 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，或省略独立/方差假设后把 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>Var\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>&#x000B7;\u003c/mo>\u003cmi>k\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 当普遍定律。\u003c/li>\u003cli>把 mask 加到已归一化权重后不重归一化，或把 softmax 说成自动只选少量 token。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如果 Q/K 做 L2 归一化，点积分布与温度参数该怎样重新分析？\u003c/li>\u003cli>cross-attention 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003cmo>&#x02260;\u003c/mo>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 时，各中间矩阵与输出是什么形状？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "缩放点积注意力先用 $Q$ 与 $K$ 的匹配分数，在 key 轴做 softmax，再加权汇聚 $V$。设 $Q\\in\\mathbb R^{L_q\\times d_k}$、$K\\in\\mathbb R^{L_k\\times d_k}$、$V\\in\\mathbb R^{L_k\\times d_v}$，则 $S=QK^\\top/\\sqrt{d_k}+M$、$A=\\operatorname{softmax}(S)$，输出 $AV\\in\\mathbb R^{L_q\\times d_v}$。Self-attention 常取 $Q=XW_Q$、$K=XW_K$、$V=XW_V$，cross-attention 的 $Q$ 与 $K/V$ 可来自不同序列。\n\n缩放的尺度分析假设各分量零均值、单位方差，$q_i$ 与 $k_i$ 独立，且不同维的乘积互不相关：此时 $\\operatorname{Var}(q_i k_i)=1$，$\\operatorname{Var}(q\\cdot k)=d_k$，除以 $\\sqrt{d_k}$ 后方差为 1。实际训练后的相关性和方差未必满足这些假设。分数差过大会使分布过于尖锐，softmax 的 Jacobian $\\partial A_i/\\partial S_j=A_i(\\delta_{ij}-A_j)$ 部分元素变小；这不表示所有后续梯度必然消失，softmax 与交叉熵合并时 logits 梯度仍为预测概率减目标概率。\n\n允许的连接加 0，禁止连接加 $-\\infty$，再做 softmax。实现常先减去每行最大有限分数以避免指数溢出；全屏蔽行须单独处理，并检查 dtype、广播和内核的 mask 约定。有限且未屏蔽的 logits 在精确计算下得到严格为正、和为 1 的权重，所以 softmax 本身没有硬稀疏；数值下溢和 mask 产生的零是另外的机制。权重适合描述加权汇聚，但不能直接当作因果重要性。\n\n除了固定除以根号维度，也可对 Q/K 做适当归一化并设置温度、学习 logit scale，或使用加性注意力的评分网络。它们改变评分分布及参数化，并不是把原模型的分母随意删掉的等价替换。改变温度只控制分布尖锐度，不替代所有输入范数与训练稳定性问题；应重新分析方差并配套训练。\n把缩放分母写成 $d_{\\rm model}$ 或 $d_k$，或省略独立/方差假设后把 $\\operatorname{Var}(q\\cdot k)=d_k$ 当普遍定律。\n把 mask 加到已归一化权重后不重归一化，或把 softmax 说成自动只选少量 token。\n如果 Q/K 做 L2 归一化，点积分布与温度参数该怎样重新分析？\ncross-attention 的 $L_q\\ne L_k$ 时，各中间矩阵与输出是什么形状？"}, {"id": "TFM-002", "category": "TFM", "topic": "注意力机制与掩码", "level": "L1", "title": "多头注意力与单头注意力有什么区别？", "tags": ["MHA", "表示能力", "参数量"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>多头注意力用多组分别学习的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>K\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math> 投影，在不同子空间并行计算注意力，拼接各头输出，再经 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 混合回模型维度。以输入 \u003ccode>X:[B,T,D]\u003c/code> 为例，第 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 头的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003cmo>&#x0002C;\u003c/mo>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003cmo>&#x02208;\u003c/mo>\u003cmsup>\u003cmi mathvariant=\"double-struck\">R\u003c/mi>\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x000D7;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，输出 \u003ccode>head_i:[B,T,d_v]\u003c/code>。原始 base 模型取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>512\u003c/mn>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>64\u003c/mn>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>工程上把各头堆为 \u003ccode>Q/K:[B,h,T,d_k]\u003c/code>、\u003ccode>V:[B,h,T,d_v]\u003c/code>，分数为 \u003ccode>[B,h,T,T]\u003c/code>。输出从 \u003ccode>[B,h,T,d_v]\u003c/code> 转置并拼接为 \u003ccode>[B,T,h*d_v]\u003c/code>，乘 \u003ccode>W_O:[h*d_v,D]\u003c/code> 得到 \u003ccode>[B,T,D]\u003c/code>；拼接增加的是特征维度。Cross-attention 的权重形状为 \u003ccode>[B,h,L_q,L_k]\u003c/code>，输出长度仍为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>q\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。一次大线性层后 reshape 与逐头投影等价，并不表示各头共用相同权重。\u003c/p>\u003cp>当 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>h\u003c/mi>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 时，忽略 bias，标准 MHA 的 Q/K/V/O 总权重约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>4\u003c/mn>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math>；固定 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 增加头数只会缩小每头维度，参数量不随头数成倍增长。不过注意力矩阵元素数随 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>h\u003c/mi>\u003cmsup>\u003cmi>T\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 变化，显存与内核效率仍需比较。各头可以学习不同匹配模式，也可能冗余，不能预设每头必定负责语法或实体等固定任务。MQA/GQA 改变了 K/V 共享方式，其参数与 KV cache 要另外估算。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>head\u003c/mo>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>Q\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>K\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003cmi>X\u003c/mi>\u003cmsubsup>\u003cmi>W\u003c/mi>\u003cmi>V\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msubsup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>MHA\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>X\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>Concat\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmo>head\u003c/mo>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x02026;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmsub>\u003cmo>head\u003c/mo>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>将单头维度 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 与总隐藏维度 D 混用，漏写转置/拼接或 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 导致 shape 不闭合。\u003c/li>\u003cli>把实现里的 fused QKV 层误认为不同 head 使用完全相同的投影参数。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>固定 D 和 h 时，GQA 的参数量与 KV cache 怎样变化？\u003c/li>\u003cli>为什么 concatenation 后还需要 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>O\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，而不是直接相加各头输出？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "多头注意力用多组分别学习的 $Q/K/V$ 投影，在不同子空间并行计算注意力，拼接各头输出，再经 $W_O$ 混合回模型维度。以输入 `X:[B,T,D]` 为例，第 $i$ 头的 $W_Q^i,W_K^i\\in\\mathbb R^{D\\times d_k}$、$W_V^i\\in\\mathbb R^{D\\times d_v}$，输出 `head_i:[B,T,d_v]`。原始 base 模型取 $D=512$、$h=8$、$d_k=d_v=64$。\n\n工程上把各头堆为 `Q/K:[B,h,T,d_k]`、`V:[B,h,T,d_v]`，分数为 `[B,h,T,T]`。输出从 `[B,h,T,d_v]` 转置并拼接为 `[B,T,h*d_v]`，乘 `W_O:[h*d_v,D]` 得到 `[B,T,D]`；拼接增加的是特征维度。Cross-attention 的权重形状为 `[B,h,L_q,L_k]`，输出长度仍为 $L_q$。一次大线性层后 reshape 与逐头投影等价，并不表示各头共用相同权重。\n\n当 $hd_k=hd_v=D$ 时，忽略 bias，标准 MHA 的 Q/K/V/O 总权重约为 $4D^2$；固定 $D$ 增加头数只会缩小每头维度，参数量不随头数成倍增长。不过注意力矩阵元素数随 $hT^2$ 变化，显存与内核效率仍需比较。各头可以学习不同匹配模式，也可能冗余，不能预设每头必定负责语法或实体等固定任务。MQA/GQA 改变了 K/V 共享方式，其参数与 KV cache 要另外估算。\n将单头维度 $d_k$ 与总隐藏维度 D 混用，漏写转置/拼接或 $W_O$ 导致 shape 不闭合。\n把实现里的 fused QKV 层误认为不同 head 使用完全相同的投影参数。\n固定 D 和 h 时，GQA 的参数量与 KV cache 怎样变化？\n为什么 concatenation 后还需要 $W_O$，而不是直接相加各头输出？"}, {"id": "TFM-003", "category": "TFM", "topic": "注意力机制与掩码", "level": "L1", "title": "掩码注意力如何实现？causal、padding 与 loss mask 有何区别？", "tags": ["Mask", "自回归", "实现", "AttentionMask", "KVCache"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Attention mask 在 softmax 前排除不可见的 key：允许连接加 0，禁止连接加 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmo>&#x0221E;\u003c/mo>\u003c/mrow>\u003c/math>。将禁止位置的分数乘 0 无法屏蔽，因为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>exp\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 仍会得到概率；全屏蔽行在朴素 softmax 中可能产生 NaN，须核对后端处理。\u003c/p>\u003cp>因果掩码从 0 编号时允许 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math>，包括自身。位置 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 的 logits 预测 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math>，所以看到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math> 不会泄漏下一词；只加 loss mask 而没有 causal mask，仍会泄漏未来信息。Padding mask 通常排除无效 key，pad query 的输出在后续计算或损失中忽略。Loss mask 只决定哪些目标计损：prompt 的 \u003ccode>labels=-100\u003c/code> 时，合法 prompt 仍应保持可见，否则回答无法读取问题。独立 packed 样本还要要求 query/key 属于同一样本。\u003c/p>\u003cp>已有 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003c/mrow>\u003c/math> 个历史 token，一次处理 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math> 个新 token 时，query 长度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>、key 长度为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math>，第 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math> 个新 query 可看 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/math>。不能直接套用左上对齐的矩形下三角；须检查内核的因果偏置、真实缓存位置、左 padding 和静态缓存中未填的槽位。\u003c/p>\u003cp>框架的 bool mask 与加性 mask 含义不同：PyTorch 2.14 SDPA 的 \u003ccode>attn_mask=True\u003c/code> 表示允许关注，\u003ccode>MultiheadAttention.key_padding_mask=True\u003c/code> 表示屏蔽。广播应覆盖 \u003ccode>[B,H,L_q,L_k]\u003c/code>，可用小输入验证可见性。普通 batch 可按本批最长序列 padding，长度分桶能减少浪费；位置编号须与真实 token 和模型方案一致。Padding mask 通常不自动省去 pad 的算术计算，变长内核或 packing 还需显式段边界。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>A\u003c/mi>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>softmax\u003c/mo>\u003cmspace width=\"negativethinmathspace\" />\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmsup>\u003cmi>K\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>M\u003c/mi>\u003cmo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>M\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmrow>\u003cmo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmn>0\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmo>allowed\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"left\">\u003cmo>&#x02212;\u003c/mo>\u003cmo>&#x0221E;\u003c/mo>\u003cmo>&#x0002C;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmtext>otherwise\u003c/mtext>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmo>allowed\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">c\u003c/mi>\u003cmi mathvariant=\"normal\">h\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003cmi mathvariant=\"normal\">d\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmi>&#x027FA;\u003c/mi>\u003cmi>j\u003c/mi>\u003cmo>&#x02264;\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 prompt loss mask、EOS 边界或重置 \u003ccode>position_ids\u003c/code> 当成 attention 隔离。\u003c/li>\u003cli>不检查矩形 causal 对齐和 bool 含义，导致缓存只能关注最前面的 key 或泄漏未来。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>如何用扰动另一个 packed 样本的测试证明没有跨样本信息泄漏？\u003c/li>\u003cli>只有一个新 query 且所有 key 均为有效历史时，还需要显式三角 mask 吗？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Attention mask 在 softmax 前排除不可见的 key：允许连接加 0，禁止连接加 $-\\infty$。将禁止位置的分数乘 0 无法屏蔽，因为 $\\exp(0)$ 仍会得到概率；全屏蔽行在朴素 softmax 中可能产生 NaN，须核对后端处理。\n\n因果掩码从 0 编号时允许 $j\\le i$，包括自身。位置 $i$ 的 logits 预测 $x_{i+1}$，所以看到 $x_i$ 不会泄漏下一词；只加 loss mask 而没有 causal mask，仍会泄漏未来信息。Padding mask 通常排除无效 key，pad query 的输出在后续计算或损失中忽略。Loss mask 只决定哪些目标计损：prompt 的 `labels=-100` 时，合法 prompt 仍应保持可见，否则回答无法读取问题。独立 packed 样本还要要求 query/key 属于同一样本。\n\n已有 $P$ 个历史 token，一次处理 $L$ 个新 token 时，query 长度为 $L$、key 长度为 $P+L$，第 $i$ 个新 query 可看 $j\\le P+i$。不能直接套用左上对齐的矩形下三角；须检查内核的因果偏置、真实缓存位置、左 padding 和静态缓存中未填的槽位。\n\n框架的 bool mask 与加性 mask 含义不同：PyTorch 2.14 SDPA 的 `attn_mask=True` 表示允许关注，`MultiheadAttention.key_padding_mask=True` 表示屏蔽。广播应覆盖 `[B,H,L_q,L_k]`，可用小输入验证可见性。普通 batch 可按本批最长序列 padding，长度分桶能减少浪费；位置编号须与真实 token 和模型方案一致。Padding mask 通常不自动省去 pad 的算术计算，变长内核或 packing 还需显式段边界。\n把 prompt loss mask、EOS 边界或重置 `position_ids` 当成 attention 隔离。\n不检查矩形 causal 对齐和 bool 含义，导致缓存只能关注最前面的 key 或泄漏未来。\n如何用扰动另一个 packed 样本的测试证明没有跨样本信息泄漏？\n只有一个新 query 且所有 key 均为有效历史时，还需要显式三角 mask 吗？"}, {"id": "TFM-005", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L1", "title": "Transformer 为什么常用 LayerNorm，而不是 BatchNorm？", "tags": ["LayerNorm", "BatchNorm", "归一化"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>LayerNorm 对每个 token 的 hidden 维计算均值与方差，再用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/math> 和可学习的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B3;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math> 做标准化与仿射变换。对 \u003ccode>X:[B,T,D]\u003c/code>、\u003ccode>normalized_shape=D\u003c/code>，均值和方差形状为 \u003ccode>[B,T,1]\u003c/code>，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B3;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math> 为 \u003ccode>[D]\u003c/code>。方差使用分母 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 的总体形式；\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/math> 加在方差内，避免分母为零并影响小方差时的尺度。\u003c/p>\u003cp>归一化只覆盖指定的特征轴；若 \u003ccode>normalized_shape\u003c/code> 包含多个轴，统计范围也随之扩大。仿射或 bias 可由具体架构关闭。同一层各 token 共享这组参数，但不同层通常分别学习。LN 在训练与推理时都依据当前 token 重算统计，不依赖 batch size 或运行均值，适合变长、在线和自回归解码。\u003c/p>\u003cp>BatchNorm 通常按通道聚合 batch 与其他指定轴，训练时用批统计，常规推理用估计的总体或运行统计。小 batch、分布变化、序列位置差异和 padding 混入会影响估计；变长序列也能使用 BN，但须明确统计轴和有效位置处理。LN 有助于稳定激活与优化，训练是否稳定还依赖残差、Pre/PostNorm、初始化和学习率，不能只由 LN 推出梯度永不爆炸或消失。\u003c/p>\u003cp>以NCHW图像张量为例，BN对每个channel跨N/H/W统计，IN对每个样本每个channel跨H/W统计，GN对每个样本在一个channel组内跨组channel/H/W统计；GN不依赖batch大小。Transformer常见LN是每个token在hidden轴统计，而不是把整个序列当一条归一化轴。所谓“选择哪种Norm”先指定张量布局和normalized_shape，不能只背名称。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003BC;\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>D\u003c/mi>\u003c/munderover>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>&#x003C3;\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>D\u003c/mi>\u003c/mfrac>\u003cmunderover>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>D\u003c/mi>\u003c/munderover>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003BC;\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>LN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>&#x003B3;\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmo>&#x02212;\u003c/mo>\u003cmsub>\u003cmi>&#x003BC;\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsubsup>\u003cmi>&#x003C3;\u003c/mi>\u003cmrow>\u003cmi>b\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>&#x003B2;\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>对 \u003ccode>[B,T,D]\u003c/code> 在 T 轴归一化，或把每 token 均值误写成跨 batch 均值。\u003c/li>\u003cli>省略 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003B3;\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>&#x003B2;\u003c/mi>\u003c/mrow>\u003c/math>、混用 D 与 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/math>，或宣称 BN 一定不能处理任何变长输入。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>\u003ccode>LN(D)\u003c/code> 与 \u003ccode>LN((T,D))\u003c/code> 的输出相同吗，为什么？\u003c/li>\u003cli>RMSNorm 去掉了哪些计算，是否仍把每个 token 的均值归零？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "LayerNorm 对每个 token 的 hidden 维计算均值与方差，再用 $\\epsilon$ 和可学习的 $\\gamma,\\beta$ 做标准化与仿射变换。对 `X:[B,T,D]`、`normalized_shape=D`，均值和方差形状为 `[B,T,1]`，$\\gamma,\\beta$ 为 `[D]`。方差使用分母 $D$ 的总体形式；$\\epsilon$ 加在方差内，避免分母为零并影响小方差时的尺度。\n\n归一化只覆盖指定的特征轴；若 `normalized_shape` 包含多个轴，统计范围也随之扩大。仿射或 bias 可由具体架构关闭。同一层各 token 共享这组参数，但不同层通常分别学习。LN 在训练与推理时都依据当前 token 重算统计，不依赖 batch size 或运行均值，适合变长、在线和自回归解码。\n\nBatchNorm 通常按通道聚合 batch 与其他指定轴，训练时用批统计，常规推理用估计的总体或运行统计。小 batch、分布变化、序列位置差异和 padding 混入会影响估计；变长序列也能使用 BN，但须明确统计轴和有效位置处理。LN 有助于稳定激活与优化，训练是否稳定还依赖残差、Pre/PostNorm、初始化和学习率，不能只由 LN 推出梯度永不爆炸或消失。\n\n以NCHW图像张量为例，BN对每个channel跨N/H/W统计，IN对每个样本每个channel跨H/W统计，GN对每个样本在一个channel组内跨组channel/H/W统计；GN不依赖batch大小。Transformer常见LN是每个token在hidden轴统计，而不是把整个序列当一条归一化轴。所谓“选择哪种Norm”先指定张量布局和normalized_shape，不能只背名称。\n对 `[B,T,D]` 在 T 轴归一化，或把每 token 均值误写成跨 batch 均值。\n省略 $\\epsilon/\\gamma/\\beta$、混用 D 与 $D-1$，或宣称 BN 一定不能处理任何变长输入。\n`LN(D)` 与 `LN((T,D))` 的输出相同吗，为什么？\nRMSNorm 去掉了哪些计算，是否仍把每个 token 的均值归零？"}, {"id": "TFM-006", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L2", "title": "RMSNorm 与 LayerNorm 的公式和性质有什么区别？", "tags": ["RMSNorm", "归一化", "数值稳定"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RMSNorm 按输入的均方根缩放，省去 LayerNorm 的减均值步骤，通常在根号内加入 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/math>，再乘可学习的逐通道权重 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>&#x003B3;\u003c/mi>\u003c/mrow>\u003c/math>。LN 使用中心化方差，RMSNorm 使用未经中心化的二阶矩。\u003c/p>\u003cp>两者都有对整体尺度的归一化作用，但平移性质不同：输入统一加常数时，LN 的归一化部分基本不变，RMSNorm 通常会变化。RMSNorm 的计算较简单，归约常用更高精度以减少溢出和舍入误差；实际速度与质量仍取决于模型、dtype 和融合内核，不能直接套用论文中的收益比例。\u003c/p>\u003cp>pRMSNorm使用部分特征估计均方根以降低归一化开销，核心仍不做均值中心化；是否采用取决于采样误差、kernel和模型验证，不能把标准RMSNorm的公式直接标作pRMSNorm。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmo>RMSNorm\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>&#x003B3;\u003c/mi>\u003cmo>&#x02299;\u003c/mo>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmsubsup>\u003cmo>&#x02211;\u003c/mo>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmi>D\u003c/mi>\u003c/msubsup>\u003cmsubsup>\u003cmi>x\u003c/mi>\u003cmi>i\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>&#x003F5;\u003c/mi>\u003c/mrow>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 RMSNorm 说成标准化到零均值。\u003c/li>\u003cli>说去均值在任何模型中都完全无用。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么 RMSNorm 常在 FP32 中计算归约？\u003c/li>\u003cli>RMSNorm 与 L2 normalization 有何尺度差别？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RMSNorm 按输入的均方根缩放，省去 LayerNorm 的减均值步骤，通常在根号内加入 $\\epsilon$，再乘可学习的逐通道权重 $\\gamma$。LN 使用中心化方差，RMSNorm 使用未经中心化的二阶矩。\n\n两者都有对整体尺度的归一化作用，但平移性质不同：输入统一加常数时，LN 的归一化部分基本不变，RMSNorm 通常会变化。RMSNorm 的计算较简单，归约常用更高精度以减少溢出和舍入误差；实际速度与质量仍取决于模型、dtype 和融合内核，不能直接套用论文中的收益比例。\n\npRMSNorm使用部分特征估计均方根以降低归一化开销，核心仍不做均值中心化；是否采用取决于采样误差、kernel和模型验证，不能把标准RMSNorm的公式直接标作pRMSNorm。\n把 RMSNorm 说成标准化到零均值。\n说去均值在任何模型中都完全无用。\n为什么 RMSNorm 常在 FP32 中计算归约？\nRMSNorm 与 L2 normalization 有何尺度差别？"}, {"id": "TFM-007", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L2", "title": "Pre-Norm 与 Post-Norm 如何影响训练稳定性？", "tags": ["PreNorm", "PostNorm", "梯度"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>Pre-Norm 的结构是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>Norm\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，Post-Norm 是 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>Norm\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。Pre-Norm 的残差主路径保留恒等连接，给梯度提供直接通道，深层训练通常更稳定，模型末端一般还会添加最终归一化。\u003c/p>\u003cp>Post-Norm 的初始化分析显示部分层梯度可能较大，可解释其对 warmup 的敏感性，但该结论依赖分析条件。实际是否需要 warmup，还受深度、初始化与优化器影响；比较两者应匹配训练预算并分别调参，不能只用同一学习率下的 loss 判定优劣。\u003c/p>\u003cp>DeepNorm在Post-LN风格中引入与深度相关的残差放大及初始化缩放，例如LN(αx+F(x))，并配套特定网络深度/架构的参数初始化规则。它不是把Pre-Norm挪回Post-Norm即可获得相同稳定性；α/β依赖encoder/decoder设置，公式需按论文配方核对。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">r\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>Norm\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>y\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">p\u003c/mi>\u003cmi mathvariant=\"normal\">o\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">t\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>Norm\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>F\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>说 Pre-Norm 必然不需要 warmup。\u003c/li>\u003cli>把更稳定训练直接等同于所有任务更好的最终效果。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>为什么很多 Pre-Norm 模型还有 final norm？\u003c/li>\u003cli>残差随深度增长如何控制？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "Pre-Norm 的结构是 $y=x+F(\\operatorname{Norm}(x))$，Post-Norm 是 $y=\\operatorname{Norm}(x+F(x))$。Pre-Norm 的残差主路径保留恒等连接，给梯度提供直接通道，深层训练通常更稳定，模型末端一般还会添加最终归一化。\n\nPost-Norm 的初始化分析显示部分层梯度可能较大，可解释其对 warmup 的敏感性，但该结论依赖分析条件。实际是否需要 warmup，还受深度、初始化与优化器影响；比较两者应匹配训练预算并分别调参，不能只用同一学习率下的 loss 判定优劣。\n\nDeepNorm在Post-LN风格中引入与深度相关的残差放大及初始化缩放，例如LN(αx+F(x))，并配套特定网络深度/架构的参数初始化规则。它不是把Pre-Norm挪回Post-Norm即可获得相同稳定性；α/β依赖encoder/decoder设置，公式需按论文配方核对。\n说 Pre-Norm 必然不需要 warmup。\n把更稳定训练直接等同于所有任务更好的最终效果。\n为什么很多 Pre-Norm 模型还有 final norm？\n残差随深度增长如何控制？"}, {"id": "TFM-008", "category": "TFM", "topic": "位置编码与长上下文", "level": "L2", "title": "RoPE 如何表达相对位置，怎样与 KV cache 正确配合？", "tags": ["RoPE", "位置编码", "公式", "CachePosition", "PositionIDs"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>RoPE 按位置旋转 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmi>K\u003c/mi>\u003c/mrow>\u003c/math> 的成对分量，使点积显式出现相对位置差，并保持向量范数；通常不旋转 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/math>。旋转子空间为偶数维 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，第 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/math> 对频率 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/math>，位置 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math> 使用二维旋转 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>。不同频率覆盖不同距离尺度，部分模型只旋转 head 的部分维度。\u003c/p>\u003cp>令 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>、\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，由 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsubsup>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003c/math> 可得 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>。这是位置依赖呈相对差，内容向量仍受上下文影响。单对分量 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math> 变为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>a\u003c/mi>\u003cmi>sin\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003cmo>&#x0002B;\u003c/mo>\u003cmi>b\u003c/mi>\u003cmi>cos\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>；相邻维配对与前半/后半配对可通过置换关联，已有 checkpoint 却不能未经权重转换便替换配对约定。\u003c/p>\u003cp>Transformers v4.57.1 的 \u003ccode>LlamaAttention\u003c/code> 先旋转当前 Q/K，再写入缓存，因此历史已旋转 K 不应再次旋转。新 token 须使用正确逻辑位置的 cos/sin，分块 decode、左 padding 与 packed 样本都要核对 \u003ccode>position_ids\u003c/code>。\u003ccode>cache_position\u003c/code> 管缓存槽位，RoPE 的 \u003ccode>position_ids\u003c/code> 管相位，两者接口含义不同。滑动窗口移除旧缓存不代表逻辑时间归零；若改变频率或位置缩放策略，必须核验历史 K 的一致性，并重算或使用明确支持该变化的缓存实现。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>&#x003B8;\u003c/mi>\u003cmi>j\u003c/mi>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi mathvariant=\"normal\">b\u003c/mi>\u003cmi mathvariant=\"normal\">a\u003c/mi>\u003cmi mathvariant=\"normal\">s\u003c/mi>\u003cmi mathvariant=\"normal\">e\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>&#x02212;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>j\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/msup>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmi>R\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>&#x003D5;\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>&#x00028;\u003c/mo>\u003cmtable>\u003cmtr>\u003cmtd>\u003cmi>cos\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/mtd>\u003cmtd>\u003cmo>&#x02212;\u003c/mo>\u003cmi>sin\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmi>sin\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/mtd>\u003cmtd>\u003cmi>cos\u003c/mi>\u003cmi>&#x003D5;\u003c/mi>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cmo>&#x00029;\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmo>&#x0003D;\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003cmsup>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x022A4;\u003c/mo>\u003c/msup>\u003cmsubsup>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msubsup>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmsubsup>\u003cmi>q\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo>&#x022A4;\u003c/mo>\u003c/msubsup>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>&#x02212;\u003c/mo>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/msub>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>n\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>直接把位置向量加到 embedding 来描述 RoPE，或对缓存 K 重复应用旋转。\u003c/li>\u003cli>把 RoPE 的相对点积性质当成任意距离单调衰减、任意长度可靠外推的保证。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>用整段 prefill 与逐 token cache decode 比较 logits 时，哪些位置和数值条件必须一致？\u003c/li>\u003cli>RoPE 的 base、旋转维度、缩放方案改变后，现有 KV cache 能否复用？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "RoPE 按位置旋转 $Q/K$ 的成对分量，使点积显式出现相对位置差，并保持向量范数；通常不旋转 $V$。旋转子空间为偶数维 $d_r$，第 $j$ 对频率 $\\theta_j=\\mathrm{base}^{-2j/d_r}$，位置 $m$ 使用二维旋转 $R(m\\theta_j)$。不同频率覆盖不同距离尺度，部分模型只旋转 head 的部分维度。\n\n令 $q'_m=R_mq_m$、$k'_n=R_nk_n$，由 $R_m^\\top R_n=R_{n-m}$ 可得 $(q'_m)^\\top k'_n=q_m^\\top R_{n-m}k_n$。这是位置依赖呈相对差，内容向量仍受上下文影响。单对分量 $(a,b)$ 变为 $(a\\cos\\phi-b\\sin\\phi,a\\sin\\phi+b\\cos\\phi)$；相邻维配对与前半/后半配对可通过置换关联，已有 checkpoint 却不能未经权重转换便替换配对约定。\n\nTransformers v4.57.1 的 `LlamaAttention` 先旋转当前 Q/K，再写入缓存，因此历史已旋转 K 不应再次旋转。新 token 须使用正确逻辑位置的 cos/sin，分块 decode、左 padding 与 packed 样本都要核对 `position_ids`。`cache_position` 管缓存槽位，RoPE 的 `position_ids` 管相位，两者接口含义不同。滑动窗口移除旧缓存不代表逻辑时间归零；若改变频率或位置缩放策略，必须核验历史 K 的一致性，并重算或使用明确支持该变化的缓存实现。\n直接把位置向量加到 embedding 来描述 RoPE，或对缓存 K 重复应用旋转。\n把 RoPE 的相对点积性质当成任意距离单调衰减、任意长度可靠外推的保证。\n用整段 prefill 与逐 token cache decode 比较 logits 时，哪些位置和数值条件必须一致？\nRoPE 的 base、旋转维度、缩放方案改变后，现有 KV cache 能否复用？"}, {"id": "TFM-009", "category": "TFM", "topic": "位置编码与长上下文", "level": "L2", "title": "为什么不能只把 max_position_embeddings 改大来扩展上下文？", "tags": ["长上下文", "RoPE", "PositionInterpolation"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>增大 \u003ccode>max_position_embeddings\u003c/code> 只放宽输入长度配置，不能保证模型处理训练范围外的位置和长距离依赖。若从 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/math> 扩到 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math>，线性位置插值用 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmsup>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>L\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/math> 将位置压回训练区间，通常需继续训练。\u003c/p>\u003cp>压缩位置也会降低局部位置分辨率，倍率越大越要检查短距离性能。位置方案调整与长样本训练解决的问题不同；评测应覆盖多种长度和证据位置，并同时报告短文本表现、长检索正确率、KV 占用与 TTFT。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmsup>\u003cmi>m\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003cmo>&#x0003D;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>L\u003c/mi>\u003cmi>&#x02032;\u003c/mi>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/math>\u003c/div>\u003ch3>易错点\u003c/h3>\u003cul>\u003cli>把 RoPE 的数学可计算性当作可靠外推保证。\u003c/li>\u003cli>只测一个 needle case 就声称长上下文全面有效。\u003c/li>\u003c/ul>\u003ch3>追问\u003c/h3>\u003cul>\u003cli>位置插值会怎样影响近邻 token？\u003c/li>\u003cli>如何排除模型只依赖文档开头或结尾？\u003c/li>\u003c/ul>\u003c/div>", "search_text": "增大 `max_position_embeddings` 只放宽输入长度配置，不能保证模型处理训练范围外的位置和长距离依赖。若从 $L$ 扩到 $L'$，线性位置插值用 $m'=mL/L'$ 将位置压回训练区间，通常需继续训练。\n\n压缩位置也会降低局部位置分辨率，倍率越大越要检查短距离性能。位置方案调整与长样本训练解决的问题不同；评测应覆盖多种长度和证据位置，并同时报告短文本表现、长检索正确率、KV 占用与 TTFT。\n把 RoPE 的数学可计算性当作可靠外推保证。\n只测一个 needle case 就声称长上下文全面有效。\n位置插值会怎样影响近邻 token？\n如何排除模型只依赖文档开头或结尾？"}, {"id": "TFM-010", "category": "TFM", "topic": "归一化、FFN 与残差", "level": "L2", "title": "FFN 提供什么作用？SwiGLU 为什么常调整中间维度？", "tags": ["FFN", "SwiGLU", "参数量"], "answer_html": "\u003cdiv class=\"answer-body\">\u003cp>FFN 对每个 token 独立做通道变换：原始 Transformer 用升维线性层、ReLU 和降维线性层。按行向量约定，\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo>FFN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0003D;\u003c/mo>\u003cmo>ReLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/math>，\u003ccode>x:[D]\u003c/code>、\u003ccode>W_1:[D,m]\u003c/code>、\u003ccode>W_2:[m,D]\u003c/code>；对 \u003ccode>X:[B,T,D]\u003c/code> 沿最后一轴执行，输出形状不变。原始 base 模型取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>D\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>512\u003c/mn>\u003cmo>&#x0002C;\u003c/mo>\u003cmi>m\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>2048\u003c/mn>\u003c/mrow>\u003c/math>。\u003c/p>\u003cp>Position-wise 表示同一层各 token 使用相同参数，不直接混合不同 token；不同层通常各有参数。跨 token 信息由 attention 等模块汇聚，FFN 增加各位置的非线性组合与容量。若去掉非线性，两层仿射可合并为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x0002B;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mrow>\u003c/math>，单纯增加中间宽度没有同样的表达收益。\u003c/p>\u003cp>现代 SwiGLU 常写为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>SiLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02299;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>u\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/math>，包含 gate/up/down 三个矩阵，bias 由模型决定；它增加逐元素门控，并非只替换激活名称。忽略 bias，原 FFN 参数约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>D\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math>，SwiGLU 约为 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>3\u003c/mn>\u003cmi>D\u003c/mi>\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/math>；若匹配原来 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>&#x0003D;\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>D\u003c/mi>\u003c/mrow>\u003c/math> 的 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>8\u003c/mn>\u003cmsup>\u003cmi>D\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/math> 预算，SwiGLU 中间宽度约取 \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\">\u003cmrow>\u003cmn>8\u003c/mn>\u003cmi>D\u003c/mi>\u003cmo>&#x0002F;\u003c/mo>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/math>，再按硬件对齐。宽度、激活与融合内核都影响容量、激活显存和吞吐。\u003c/p>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmrow>\u003cmtable displaystyle=\"true\" columnspacing=\"0em\" rowspacing=\"3pt\">\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>FFN\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo>ReLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>&#x0002B;\u003c/mo>\u003cmsub>\u003cmi>b\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmo>SwiGLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x0003D;\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmo>SiLU\u003c/mo>\u003cmo stretchy=\"false\">&#x00028;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmo>&#x02299;\u003c/mo>\u003cmi>x\u003c/mi>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>u\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">&#x00029;\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd columnalign=\"right\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">F\u003c/mi>\u003cmi mathvariant=\"normal\">F\u003c/mi>\u003cmi mathvariant=\"normal\">N\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mtd>\u003cmtd columnalign=\"left\">\u003cmi />\u003cmo>&#x02248;\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>D\u003c/mi>\u003cmi>m\u003c/mi>\u003cmo>&#x0002C;\u003c/mo>\u003cmspace width=\"1em\" />\u003cmsub>\u003cmi>N\u003c/mi>\u003cmrow>\u003cmi mathvariant=\"normal\">S\u003c/mi>\u003cmi mathvariant=\"normal\">w\u003c/mi>\u003cmi mathvariant=\"normal\">i\u003c/mi>\u003cmi mathvariant=\"normal\">G\u003c/
